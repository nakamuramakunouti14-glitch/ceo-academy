id: case-cross-02
kind: cross
field: operations
order: 2
title: 定食を 200 円値上げしたら、利益はどう動く？
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  魚の仕入れの値段が上がりました。昼の焼き魚定食（980 円、食材 330 円）の原価率は、34％ に近づいています。昼は 1 日 120 人が来ます。
  1,180 円に上げる案が出ています。値上げすると、1 日 110 人に減ると見込みます。人件費と家賃は、客数が少し減っても変わりません。
facts:
  - { label: "いまの値段", value: "980 円" }
  - { label: "値上げ案", value: "1,180 円" }
  - { label: "1日の客数", value: "120 → 110 人" }
  - { label: "食材費（1食）", value: "330 円" }
question: あなたが店主なら、どうしますか？
options:
  - id: a
    label: 値段はそのままにして、客数を守る
    detail: 原価が上がった分はがまんする
  - id: b
    label: 1,180 円に上げる
    detail: その朝とれた魚の良さを伝えて上げる
  - id: c
    label: 量を減らして、980 円のまま
    detail: 魚を小さくして原価を下げる
perspectives:
  - field: marketing
    heading: 値上げの理由より、良さを伝える
    body: |
      お客様が離れるのは、高くなったからというより、「高くなったのに、何が良くなったかわからない」ときです。
      港でその朝とれた魚であること、お店で焼き方を工夫していることを、メニューと店員の一言で伝えます。量を減らす案（c）は、気づかれたときに信用をなくしやすいです。
  - field: operations
    heading: 客数が何人まで減っても大丈夫か
    body: |
      値上げ前の「売上 − 食材費」は、(980 − 330) × 120 人 × 30 日 ＝ 1か月 234 万円です。
      1,180 円なら、1 人あたり 850 円残ります。234 万円を保つのに必要な客数は、234 万円 ÷ (850 円 × 30 日) ≒ 1 日 92 人です。110 人なら、十分に上回ります。
      原価率は、330 ÷ 980 ≒ 34％ から、330 ÷ 1,180 ≒ 28％ に下がります。
  - field: hr
    heading: 店員が理由を説明できるようにする
    body: |
      常連のお客様に「高くなったね」と言われたとき、店員がこまらないようにします。伝え方を、先にそろえておきましょう。
      説明を任された店員は、自分のお店の良さを言葉にすることで、接客にも自信がつきます。
  - field: accounting
    heading: 1 年分を 3 つの表で確かめる
    body: |
      最後に、値上げを 1 年続けたときの PL・BS・CF の変化を、数字で確かめます。下の問題に答えてから、増減表を開きましょう。
checks:
  - id: case-cross-02/q-monthly
    prompt: 値上げしたあと、1 か月（30 日）の「売上 − 食材費」はいくら増えますか。（前：(980 − 330) × 120 × 30、後：(1,180 − 330) × 110 × 30）
    choices:
      - { id: a, label: "36.6 万円" }
      - { id: b, label: "9.9 万円" }
      - { id: c, label: "46.5 万円" }
      - { id: d, label: "0 円" }
    answer: c
    explanation: 前は 234.0 万円、後は 280.5 万円で、差は 46.5 万円の増加です。36.6 万円は売上だけの増加で、食材費が減った分を見ていません。
  - id: case-cross-02/q-breakeven
    prompt: 1,180 円にしたとき、「売上 − 食材費」が値上げ前（1か月 234 万円）と同じになる 1 日の客数は、およそ何人ですか。
    choices:
      - { id: a, label: "約 120 人" }
      - { id: b, label: "約 92 人" }
      - { id: c, label: "約 80 人" }
      - { id: d, label: "約 110 人" }
    answer: b
    explanation: 234 万円 ÷ (850 円 × 30 日) ≒ 91.8 人です。約 92 人までなら、値上げ前より減りません。
  - id: case-cross-02/q-net
    prompt: 1 年の営業利益の増加が 540 万円で、法人税等が 30％ のとき、当期純利益はいくら増えますか。
    choices:
      - { id: a, label: "540 万円" }
      - { id: b, label: "162 万円" }
      - { id: c, label: "702 万円" }
      - { id: d, label: "378 万円" }
    answer: d
    explanation: 540 − 540 × 30％ ＝ 540 − 162 ＝ 378 万円です。
effects:
  unit: 万円
  period: 値上げ後の 1 年間（値上げしなかった場合との差）
  pl:
    - { item: 売上高の増加, delta: 439.2 }
    - { item: 食材費の減少, delta: 118.8 }
    - { item: メニュー表の作り直し, delta: -18 }
    - { item: 営業利益, delta: 540, total: true }
    - { item: 法人税等の増加, delta: -162 }
    - { item: 当期純利益, delta: 378, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: 378, cash: true }
    - { item: 利益剰余金, side: equity, delta: 378, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: 378 }
    - { item: 設備の購入（なし）, section: investing, delta: 0 }
    - { item: 借入・返済（なし）, section: financing, delta: 0 }
  assumptions:
    - 金額は消費税を除いた額とします
    - 客数は 1 日 120 人から 110 人に減ります。営業は1か月 30 日、12 か月とします
    - メニュー表と店内の案内の作り直しに、18 万円かかります（1 回だけ）
    - 売上の増加は (1,180 × 110 − 980 × 120) × 30 × 12 ＝ 439.2 万円、食材費の減少は 330 × 10 人 × 30 × 12 ＝ 118.8 万円です
    - 人件費・家賃・光熱費は、客数が少し減っても変わらないとします
    - 法人税等は増えた利益の 30％ で、その年のうちに払います。売上はすべて現金で、売掛金や在庫の増減はないとします
modelAnswer: |
  数字の上では、値上げ（b）がいちばん強いです。客数が約 8％ 減っても、1 年で営業利益は 540 万円増えます。手元の現金も、税金を払ったあとで 378 万円増えます。客数が 1 日 92 人より少なくならないかぎり、値上げ前より悪くなりません。

  - そのまま（a）は、仕入れの値段がもっと上がると、原価率が上がり続けて、利益をけずります
  - 量を減らす（c）は、原価率は下がります。でも、気づかれたときに常連さんの信用をなくします。数字に出にくい損が大きいです

  ただし、値上げは「良さを伝える」こととセットです。メニューと店員の言葉で、港の魚の良さを伝えます。1〜2 か月は客数を毎日見て、92 人に近づいたら売り方を見直します。現場の数字（客数と原価率）を 3 つの表につなげると、こわい値上げを、確かめながら進められる判断に変えられます。
