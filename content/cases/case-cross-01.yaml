schemaVersion: 1
id: case-cross-01
kind: cross
field: marketing
order: 1
title: 高い価格帯に移ったら、3つの表はどう動く？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  半年後、近くに外資系ホテルが開きます。そこの1部屋の値段（客室単価）は 2.2 万円です。みなと館ホテルは 1.4 万円で、稼働率は 80％ です。
  客室を全部改装して、1泊 2 万円の高い価格帯に移る案が出ています。改装にかかるお金は 4 億円です。
  銀行は「3 億円までなら、10 年で返す・金利 1.5％ で貸す」と言っています。残りの 1 億円は、自分たちで用意する必要があります。
facts:
  - { label: "いまの客室単価", value: "1.4 万円" }
  - { label: "稼働率", value: "80％" }
  - { label: "改装にかかるお金", value: "4 億円" }
  - { label: "手元の現金", value: "0.8 億円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 値段はそのままにして、稼働率を守る
    detail: 改装はしない。値段で選ぶお客様を残す
  - id: b
    label: 全部改装して、2 万円に上げる
    detail: 借金 3 億円 ＋ 自分たちのお金 1 億円
  - id: c
    label: 一部の客室だけ改装して、ためす
    detail: 20 室・1 億円で、お客様の反応を見る
perspectives:
  - field: marketing
    heading: 誰に選ばれるホテルになるか
    body: |
      2 万円にすると、安さを大事にする出張のお客様は離れていきます。かわりに、記念日や観光で質を求めるお客様に入れかわります。この案では、稼働率は 80％ から 75％ に下がると見込みます。
      高い価格帯に移ることは、外資系ホテルと同じ土俵で戦うことでもあります。相手より 2,000 円安く、地元らしい体験を出せるか。それが選ばれる理由になります。
      新しいお客様に知ってもらうため、広告費は1年で 800 万円増えると見込みます。
  - field: operations
    heading: 値段と稼働率を1つの数字でくらべる
    body: |
      客室の稼ぎは、RevPAR（売れる 1 室あたりの売上）＝ 客室単価 × 稼働率 でくらべます。
      いまは 1.4 万円 × 80％ ＝ 11,200 円です。改装後は 2 万円 × 75％ ＝ 15,000 円で、約 1.34 倍になります。
      一方で、値段に見合うアメニティとリネン（シーツやタオル）にすると、1 室 1 泊あたりの費用は 2,000 円から 2,800 円に上がります。
  - field: hr
    heading: 接客のレベルに合う人をそろえる
    body: |
      2 万円のホテルでは、お客様は 1.4 万円のときより良い接客を期待します。外国語ができるスタッフの採用と、全員の接客の研修が必要です。
      この案では、人件費が1年で 3,000 万円増えると見込みます。採用が間に合わないと、改装しても評判が上がりません。そして、高い値段を保てなくなります。
  - field: finance
    heading: 4 億円をどう集めるか
    body: |
      銀行から借りる 3 億円は、毎年 3,000 万円ずつ返します。利息（1.5％）は 1 年目が 450 万円で、返すにつれて減ります。
      残りの 1 億円を自分たちのお金で出すには、手元の現金 8,000 万円では足りません。やり方は3つです。いまの本業で生む現金を何年分かためる、出資を受ける、借りる額を増やせないか交渉する、です。
  - field: accounting
    heading: 3 つの表で確かめる
    body: |
      最後に、改装後の 1 年目に、PL・BS・CF がどれだけ変わるかを数字で確かめます。下の問題に答えてから、増減表を開きましょう。
checks:
  - id: case-cross-01/q-room-revenue
    prompt: 改装後の 1 年目、客室の売上はいくら増えますか。（いまは 80室 × 365日 × 80％ × 1.4 万円、改装後は 80室 × 365日 × 75％ × 2 万円）
    choices:
      - { id: a, label: "4,000 万円" }
      - { id: b, label: "11,096 万円" }
      - { id: c, label: "32,704 万円" }
      - { id: d, label: "43,800 万円" }
    answer: b
    explanation: いまは 23,360 室泊 × 1.4 万円 ＝ 32,704 万円です。改装後は 21,900 室泊 × 2 万円 ＝ 43,800 万円です。差は 11,096 万円の増加です。
  - id: case-cross-01/q-operating-cf
    prompt: 当期純利益の増加は 970 万円、増えた減価償却費は 4,000 万円です（4 億円 ÷ 10 年）。営業キャッシュフローはいくら増えますか。
    choices:
      - { id: a, label: "970 万円" }
      - { id: b, label: "1,836 万円" }
      - { id: c, label: "3,030 万円" }
      - { id: d, label: "4,970 万円" }
    answer: d
    explanation: 減価償却費は、現金が出ていかない費用です。なので、当期純利益に足し戻します。970 ＋ 4,000 ＝ 4,970 万円です。1,836 万円は、営業利益の増加です。
  - id: case-cross-01/q-cash
    prompt: 1 年目の終わりに、現金は、改装しなかった場合とくらべてどう変わりますか。（営業 CF ＋4,970、投資 CF −40,000、借入 ＋30,000、返済 −3,000）
    choices:
      - { id: a, label: "8,030 万円減る" }
      - { id: b, label: "4,970 万円増える" }
      - { id: c, label: "40,000 万円減る" }
      - { id: d, label: "変わらない" }
    answer: a
    explanation: 4,970 − 40,000 ＋ 30,000 − 3,000 ＝ −8,030 万円です。手元の現金 8,000 万円より大きく減ります。利益は増えても、現金は大きく減ります。
effects:
  unit: 万円
  period: 改装後の 1 年目（改装しなかった場合との差）
  pl:
    - { item: 客室の売上高の増加, delta: 11096 }
    - { item: アメニティ・リネン費の増加, delta: -1460 }
    - { item: 人件費の増加, delta: -3000 }
    - { item: 広告費の増加, delta: -800 }
    - { item: 減価償却費の増加, delta: -4000 }
    - { item: 営業利益, delta: 1836, total: true }
    - { item: 支払利息の増加, delta: -450 }
    - { item: 税引前当期純利益, delta: 1386, total: true }
    - { item: 法人税等の増加, delta: -416 }
    - { item: 当期純利益, delta: 970, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: -8030, cash: true }
    - { item: 建物・設備, side: asset, delta: 36000 }
    - { item: 借入金, side: liability, delta: 27000 }
    - { item: 利益剰余金, side: equity, delta: 970, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: 970 }
    - { item: 減価償却費の足し戻し, section: operating, delta: 4000 }
    - { item: 改装の支払い, section: investing, delta: -40000 }
    - { item: 銀行からの借入, section: financing, delta: 30000 }
    - { item: 借入金の返済, section: financing, delta: -3000 }
  payback:
    investment: 40000
    annualCash: 4970
    note: 改装費 4 億円を、増えた営業キャッシュフロー（利息を払ったあとの簡単な計算）で割った年数です。改装の使える年数（10 年）より短いかを見ます
  assumptions:
    - 稼働率は 80％ から 75％ に下がり、客室単価は 1.4 万円から 2 万円に上がるとします
    - アメニティ・リネン費は、1 室 1 泊 2,000 円から 2,800 円に上がります（いま 4,672 万円 → 改装後 6,132 万円）
    - 改装費 4 億円は、10 年で毎年同じ額を減価償却します。改装は年のはじめに終わるとします
    - 借金 3 億円は年のはじめに借ります。1 年目の利息は 3 億円 × 1.5％ ＝ 450 万円、返済は1年 3,000 万円とします
    - 増えた利益には、そのまま 30％ の法人税等がかかるとします。万円より下は四捨五入しました（1,386 × 30％ ≒ 416）
    - 広告費は、高い価格帯を知らせるため、1年で 800 万円増えます
    - 法人税等は、その年のうちに払い終えるとします（まだ払っていない税金は残りません）
    - 料理・飲み物の売上や、売掛金などの増減はないとします
modelAnswer: |
  どれか 1 つが正解というより、3 つの表で確かめると、次のことが見えてきます。

  - 全部改装（b）は、PL では営業利益が1年で 1,836 万円増えます。うまくいけば魅力があります。ただし、元を取るのに約 8 年かかります。1 年目に現金は 8,030 万円減り、手元の 8,000 万円より大きく減ります。自分たちで出す 1 億円も、いまの手元の現金では足りません
  - そのまま（a）は、投資のリスクはありません。そのかわり、外資系ホテルが開いたあとに、値段と稼働率の両方が下がるおそれがあります。「何もしない」ことにも、PL への効果があります
  - 一部改装（c）は、1 億円で、高い価格帯のお客様の反応（値段と稼働率）を確かめてから、残りの改装を決められます。借金も小さく、お金のやりくりに余裕が残ります

  お手本の考え方はこうです。まず c で、「2 万円で 75％ 売れるか」といういちばん大事な前提を確かめます。そのあいだに、接客の採用と研修を進めます。銀行とは、全部改装するときの借り入れの条件を交渉しておきます。マーケティングの判断を、PL（利益）だけでなく、BS（借金）と CF（現金）でも確かめましょう。すると、同じ「値上げ」でも、進め方が変わります。
