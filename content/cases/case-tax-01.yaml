schemaVersion: 1
id: case-tax-01
kind: field
field: tax
order: 1
title: インボイスを出せない漁師との取引、どうする？
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  朝どれの魚を、地元の漁師から年 1,200 万円（税を除く）買っています。漁師は免税事業者で、インボイスを出せません。消費税にあたる分は 8％ で 96 万円です。
  税理士から「この分の消費税は、全部は差し引けません」と言われました。漁師の魚は、店の強みそのものです。
facts:
  - { label: "年の仕入れ（税を除く）", value: "1,200 万円" }
  - { label: "消費税にあたる分（8％）", value: "96 万円" }
  - { label: "差し引ける割合（今）", value: "70％" }
  - { label: "仕入れ先", value: "免税の漁師" }
question: あなたならどうしますか？
options:
  - id: a
    label: 取引をやめて、インボイスを出せる卸に替える
    detail: 消費税は全部差し引ける
  - id: b
    label: 取引を続け、差し引けない分を費用として見こむ
    detail: 値段の相談は、相手の事情を聞いてから
  - id: c
    label: 差し引けない分を、漁師に一方的に値引きさせる
    detail: 損を相手に負わせる
perspectives:
  - field: tax
    heading: 差し引けない額を計算する
    body: |
      2026 年 10 月 1 日から 2 年間は、免税事業者からの仕入れの消費税にあたる分のうち、70％ を差し引けます。96 万円 × 30％ ＝ 年 28.8 万円が差し引けません。
      この割合は、2028 年 10 月 1 日から 50％ に下がります。そのあとも、段階的に下がります。
  - field: strategy
    heading: 強みを手放す損と比べる
    body: |
      朝どれの魚は、店が選ばれる理由です。年 28.8 万円をさけるために仕入れ先を替えると、ほかの店とのちがいで勝つ作戦そのものを失うおそれがあります。
  - field: negotiation
    heading: 相手の得もいっしょに考える
    body: |
      値段の相談をするなら、一方的な値引きにはしません。たくさん買う約束や、早めに払うことなど、相手にとっての得を組み合わせます。
checks:
  - id: case-tax-01/q-calc
    prompt: 消費税にあたる分 96 万円のうち、2026-11-07 時点で差し引けない額はいくらですか。
    choices:
      - { id: a, label: "28.8 万円" }
      - { id: b, label: "67.2 万円" }
      - { id: c, label: "96 万円" }
      - { id: d, label: "0 円" }
    answer: a
    explanation: 差し引けるのは 70％ の 67.2 万円です。残りの 30％、28.8 万円が差し引けません。
modelAnswer: |
  b がよい答えです。差し引けない額は、今は年 28.8 万円です。店の強み（朝どれの魚）を失う損と比べれば、小さい額です。費用として見こみ、これから割合が下がる（50％、30％）のに合わせて、毎年の影響を計算しておきます。

  a は、税は減っても、強みを失うおそれがあります。c のように損を一方的に相手に負わせると、よい魚を回してもらえなくなります。相談するなら、相手の得になる条件と組み合わせましょう。このケースは、2026-11-07 時点の制度にもとづく入門の考え方です。実際の扱いは、税理士に確かめましょう。
