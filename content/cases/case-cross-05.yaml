schemaVersion: 1
id: case-cross-05
kind: cross
field: hr
order: 5
title: パートを正社員にしたら、人件費は増える？減る？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  レストランとフロントでは、人がよく入れかわります。そのため、残った正社員に残業が集まっています。
  時間外労働（残業）は、全体で月 400 時間あります。一部の人は、月 45 時間に近づいています。
  そこで、こんな案が出ています。経験のあるパート 3 人を正社員にして、レストランとフロントの両方をできるように育てる案です。
facts:
  - { label: "時間外労働（残業）", value: "月 400 時間" }
  - { label: "正社員にする人", value: "3 人" }
  - { label: "1年で辞めた人", value: "12 人" }
  - { label: "残業1時間あたりの賃金", value: "1,875 円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 3 人を正社員にし、両方の仕事を教える
    detail: 人件費は増えるが、残業と辞める人を減らす
  - id: b
    label: アルバイトを増やして残業を減らす
    detail: 採る人を増やす
  - id: c
    label: 今のまま
    detail: 残業で回す
perspectives:
  - field: hr
    heading: 正社員にする費用と、辞めない効果
    body: |
      3 人を正社員にすると、給料と社会保険などで、人件費が1年に 360 万円増えます。両方の仕事を教える研修に、120 万円かかります。
      いっぽう、仕事を任されて将来が見えると、人は辞めにくくなります。
      1 年で辞める人が 12 人から 8 人に減ったとします。1 人 70 万円の採用・育てる費用が 4 人分、つまり 280 万円減ります。
  - field: legal
    heading: 残業の上限と割増
    body: |
      36 協定（さぶろくきょうてい）とは、会社が残業をさせるために、働く人の代表と結ぶ取り決めです。
      この協定で決められる残業は、原則（げんそく）として、上限が月 45 時間・年 360 時間です。
      月 45 時間に近い人がいるのは、危ない状態です。忙しい時期に、上限をこえるおそれがあります。
      残業代は、ふだんの時給に 25％ 以上を上乗せして払います。これを割増（わりまし）といいます。
      時給にして 1,500 円の人なら、残業 1 時間は 1,875 円になります。
  - field: operations
    heading: 両方できる人がいると、残業が減る
    body: |
      朝はレストラン、夕方はフロントが混みます。両方できる 3 人を、混む時間に回します。
      そうすれば、残業を月 400 時間から 200 時間に減らせると見こみます。
      200 時間 × 1,875 円 × 12 か月 ＝ 1年に 450 万円、残業代が減ります。
  - field: leadership
    heading: 選ばれなかった人への説明
    body: |
      3 人を選んだ基準を、全員に説明します。基準は、経験と、両方の仕事をやる気があるかです。
      基準が見えないと、選ばれなかった人が不満を持ち、辞めることにつながります。次に正社員になる道も示しましょう。
  - field: accounting
    heading: 3 表で確かめる
    body: |
      最後に、1 年目の PL・BS・CF を確かめます。人件費の行が増えても、ほかの行がどう動くかを見ましょう。
checks:
  - id: case-cross-05/q-overtime
    prompt: 残業が月 400 時間から 200 時間に減ります。残業 1 時間を 1,875 円とすると、残業代は1年でいくら減りますか。
    choices:
      - { id: a, label: "37.5 万円" }
      - { id: b, label: "450 万円" }
      - { id: c, label: "900 万円" }
      - { id: d, label: "360 万円" }
    answer: b
    explanation: 200 時間 × 1,875 円 × 12 か月 ＝ 450 万円です。900 万円は、400 時間すべてが減った場合の金額です。
  - id: case-cross-05/q-operating
    prompt: 残業代 −450、正社員にした人件費 ＋360、研修費 ＋120、採用・育てる費用 −280（万円）です。営業利益は、いくら増えたり減ったりしますか。
    choices:
      - { id: a, label: "−30 万円" }
      - { id: b, label: "＋450 万円" }
      - { id: c, label: "＋250 万円" }
      - { id: d, label: "＋1,210 万円" }
    answer: c
    explanation: 450 − 360 − 120 ＋ 280 ＝ 250 万円の増加です。辞める人が減る分を入れないと、−30 万円になります。
  - id: case-cross-05/q-without
    prompt: 辞める人が減らなかった（採用・育てる費用が変わらない）場合、営業利益はどうなりますか。
    choices:
      - { id: a, label: "30 万円減る" }
      - { id: b, label: "250 万円増える" }
      - { id: c, label: "変わらない" }
      - { id: d, label: "280 万円増える" }
    answer: a
    explanation: 450 − 360 − 120 ＝ −30 万円です。この案が数字で成り立つかは、辞める人が本当に減るかにかかっています。
effects:
  unit: 万円
  period: 正社員にしたあとの 1 年目（今のままの場合との差）
  pl:
    - { item: 残業代が減る, delta: 450 }
    - { item: 正社員にしたことで増える人件費, delta: -360 }
    - { item: 研修費, delta: -120 }
    - { item: 採用・育てる費用が減る, delta: 280 }
    - { item: 営業利益, delta: 250, total: true }
    - { item: 法人税などが増える, delta: -75 }
    - { item: 当期純利益, delta: 175, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: 175, cash: true }
    - { item: 利益剰余金, side: equity, delta: 175, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: 175 }
    - { item: 設備を買う（なし）, section: investing, delta: 0 }
    - { item: 借入・返済（なし）, section: financing, delta: 0 }
  assumptions:
    - 残業は、月 400 時間から 200 時間に減ります。残業 1 時間は、時給にして 1,500 円 × 1.25 ＝ 1,875 円です
    - 3 人を正社員にすると、給料と社会保険などで、人件費が1年に 360 万円増えます
    - 両方の仕事を教える研修に、120 万円かかります（1 年目だけ）
    - 1 年で辞める人が 12 人から 8 人に減ります。1 人 70 万円の採用・育てる費用が、4 人分減ります
    - 法人税などは、増えた利益の 30％ とします。その年のうちに払います。まだ払っていない給料などの増減は、ないものとします
modelAnswer: |
  正社員にする案（a）は、人件費の行だけを見ると増えます。でも、残業代と、人が辞める費用が減ります。そのため、1 年目から営業利益が 250 万円増える見こみです。

  - ただし、辞める人が減らなければ −30 万円になります。効果のほとんどは「辞めなくなること」にかかっています。だから、仕事を任せ、評価で認め、将来の道を示すことが欠かせません
  - アルバイトを増やす案（b）では、教える手間と、辞める人が増えます。残業のかたよりも、なくなりにくいです
  - 今のまま（c）では、2つの問題をかかえます。残業の上限をこえるおそれと、つかれて人が次々に辞めることです。法律の問題は、数字以上に重いです

  おすすめの考え方は、a を選び、6 か月ごとに残業の時間と、辞めた人数を確かめることです。
  人事の判断を、法律（上限と割増）と、現場（多能工化：1人がいくつもの仕事をできるようにすること）と、3 表でつなげて考えましょう。すると「正社員は高い」という思いこみを、数字で見直せます。

  残業の上限と割増のきまりは、2026-11-07 時点の法律にもとづく入門の説明です。実際に決めるときは、社会保険労務士や労働基準監督署に確かめましょう。
