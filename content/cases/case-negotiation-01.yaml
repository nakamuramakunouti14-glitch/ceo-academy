schemaVersion: 1
id: case-negotiation-01
kind: field
field: negotiation
order: 1
title: 家主から家賃の 1 割値上げを求められた
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  契約の更新で、家主から「家賃を月 60 万円から 66 万円に上げたい」と言われました。
  近くの空き物件は、月 52 万円です。ただし、引っこしと内装に 600 万円かかります。5 年使うなら、月 10 万円にあたります。常連のお客様の一部が、離れるおそれもあります。
  家主の側にも事情があります。部屋が空けば、数か月分の家賃が入りません。仲介の費用もかかります。
facts:
  - { label: "今の家賃", value: "月 60 万円" }
  - { label: "家主の希望", value: "月 66 万円" }
  - { label: "移る先の家賃", value: "月 52 万円" }
  - { label: "引っこしと内装", value: "600 万円" }
question: あなたなら、どうしますか？
options:
  - id: a
    label: 66 万円をそのまま受ける
    detail: 引っこしは大変なので
  - id: b
    label: 引っこしの見積もりを取り、理由を示して 60 万円前後で交渉する
    detail: 長めの契約など、家主の得も示す
  - id: c
    label: すぐに引っこしを決める
    detail: 値上げには応じない
perspectives:
  - field: negotiation
    heading: 自分の上限を数字で知る
    body: |
      引っこした場合、実際にかかる家賃は 52 ＋ 10 ＝ 月 62 万円です。今の店で 62 万円をこえるなら、移る方が得です。66 万円は、この上限をこえています。
      家主の側も、部屋が空く損を考えれば、今の借り手に続けてもらう方がよいと考えそうです。
  - field: legal
    heading: 条件は契約書に残す
    body: |
      決まった家賃を、契約書に書きます。契約の期間と、次の更新で家賃をどう見直すかも書きます。
      口約束だけだと、次の更新でまた同じ交渉になります。
checks:
  - id: case-negotiation-01/q-limit
    prompt: 移る先の家賃は月 52 万円です。引っこしと内装の 600 万円を、5 年でならします。今の店で受けてよい家賃の上限はいくらですか。
    choices:
      - { id: a, label: "月 52 万円" }
      - { id: b, label: "月 66 万円" }
      - { id: c, label: "月 60 万円" }
      - { id: d, label: "月 62 万円" }
    answer: d
    explanation: 600 万円 ÷ 60 か月 ＝ 月 10 万円です。52 ＋ 10 ＝ 月 62 万円が上限です。
modelAnswer: |
  b がおすすめです。まず、引っこしの見積もりを実際に取ります。上限が月 62 万円であることを、自分で確かめます。
  そのうえで、まわりの家賃の相場などの理由を示して交渉します。長めの契約や、きちんと払うことなど、家主にとっての得も示しましょう。

  a では、上限をこえる家賃を払い続けることになります。
  c は、交渉できる余地を試さずに捨てています。常連が離れる損や、引っこしの手間も考える必要があります。
  決まった条件は、契約書に正しく残しましょう。
relatedThemes:
