title: 隣の旅館を買わないかと言われました
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  隣の旅館（30 室）の経営者が引退します。「会社ごと買わないか」と持ちかけられました。言われた株式の値段は 2 億円です。
  旅館の営業利益は年 1,500 万円、減価償却費は 1,000 万円です。借入金は 1 億円、現金は 2,000 万円です。
  似た旅館が売り買いされた例では、EBITDA の 6 倍前後が多いと聞きました。
facts:
  - { label: "言われた値段（株式）", value: "2 億円" }
  - { label: "EBITDA", value: "2,500 万円" }
  - { label: "借入金", value: "1 億円" }
  - { label: "現金", value: "2,000 万円" }
question: あなたならどうしますか？
options:
  - id: a
    label: 言われた値段のまま、すぐに買う
    detail: 隣なので、よい話だと考える
  - id: b
    label: 値段を見積もり、調べてから話し合う
    detail: 残業代や建物の状態も調べる
  - id: c
    label: すぐに断る
    detail: M&A は危ない
perspectives:
  - field: ma
    heading: 株式の値段を見積もる
    body: |
      EBITDA ＝ 1,500 ＋ 1,000 ＝ 2,500 万円です。6 倍なら、事業価値は 1 億 5,000 万円です。
      株式の値段は 1 億 5,000 − 1 億 ＋ 2,000 ＝ 7,000 万円になります。言われた 2 億円は、この見積もりよりずっと高いです。
  - field: legal
    heading: 帳簿に出ない問題を調べる
    body: |
      専門家といっしょに、次のようなことを調べます。払われていない残業代。経営者が変わると、家主や取引先が契約をやめられる決まり。建物の大きな修理の予定。
      見つかった問題は、値段か、契約の条件で手当てします。
      旅館の売り買いでは、土地と建物の今の値段（時価）から値段を考えることも多いです。言われた値段との差がどこから来ているのか、土地の時価も確かめましょう。
checks:
  - id: case-ma-01/q-value
    prompt: EBITDA 2,500 万円、倍率 6 倍、借入金 1 億円、現金 2,000 万円です。株式の値段の見積もりはいくらですか。
    choices:
      - { id: a, label: "2 億円" }
      - { id: b, label: "1 億 5,000 万円" }
      - { id: c, label: "7,000 万円" }
      - { id: d, label: "5,000 万円" }
    answer: c
    explanation: 事業価値は 2,500 × 6 ＝ 15,000 万円です。株式の値段 ＝ 15,000 − 10,000 ＋ 2,000 ＝ 7,000 万円です。5,000 万円は、現金を足し忘れた額です。
modelAnswer: |
  b がおすすめの答えです。見積もると、株式の値段は約 7,000 万円です。言われた 2 億円とは、大きくはなれています。倍率の根拠を確かめ、詳しく調べてから話し合いましょう。

  a は、払いすぎるおそれがあります。調べなかった問題を引き継ぐおそれもあります。c は、隣の旅館といっしょに運営する価値を確かめずに、チャンスを捨てることになります（仕入れをまとめる、人を貸し借りする、部屋の種類が増える、など）。
  買うと決めたら、買ったあとの人と運営のまとめ方まで、契約の前に計画しておきましょう。
