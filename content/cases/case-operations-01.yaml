schemaVersion: 1
id: case-operations-01
kind: field
field: operations
order: 1
title: 原価率が 4 ポイント上がった。原因はどこ？
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  レシピどおりなら、原価率は 28％ のはずです。なのに、先月の実際の原価率は 32％ でした。売上は1か月 600 万円です。
  仕入れの値段は、ほとんど変わっていません。料理長は「いそがしいから、しかたがない」と言っています。
facts:
  - { label: "理論原価率（レシピどおりの原価率）", value: "28％" }
  - { label: "実際原価率", value: "32％" }
  - { label: "1か月の売上", value: "600 万円" }
  - { label: "仕入れの値段", value: "ほぼ同じ" }
question: あなたが店主なら、まず何をしますか？
options:
  - id: a
    label: 仕入れ先に値下げをたのむ
    detail: 原価を下げる
  - id: b
    label: 捨てた食材・盛りつけ・まかないを記録して、差の原因をさがす
    detail: 1 週間、どこで食材が消えているかを数える
  - id: c
    label: メニューを値上げする
    detail: 原価率を価格で下げる
perspectives:
  - field: operations
    heading: 差の 4 ポイントはいくらか
    body: |
      600 万円 × 4％ ＝ 1か月 24 万円、1年で 288 万円です。仕入れの値段が変わっていないなら、お店の中で、食材が売上にならずに消えています。
      捨てた食材の量、盛りつけの量、記録していないまかないを、1 週間記録しましょう。すると、どこで消えているかが見えます。
  - field: governance
    heading: 不正がないかも、仕組みで確かめる
    body: |
      原因の多くは、捨てた食材や盛りつけのばらつきです。でも、食材の持ち帰りがかくれていることもあります。人を疑うのではなく、仕組みで確かめます。たとえば、残った食材を数える作業（棚卸し）を別の人といっしょにする、注文する人と受け取る人を分ける、などです。
checks:
  - id: case-operations-01/q-gap
    prompt: 売上 600 万円のお店で、理論原価率 28％ と実際原価率 32％ の差は、1年でいくらにあたりますか。
    choices:
      - { id: a, label: "24 万円" }
      - { id: b, label: "4 万円" }
      - { id: c, label: "2,304 万円" }
      - { id: d, label: "288 万円" }
    answer: d
    explanation: 600 万円 × 4％ ＝ 1か月 24 万円です。12 か月で 288 万円です。
modelAnswer: |
  まずは b です。仕入れの値段は変わっていません。なので、仕入れ先との交渉（a）や値上げ（c）では、原因はなおりません。差の 4 ポイントは1年で 288 万円にあたり、営業利益を大きくけずっています。

  1 週間の記録で、どれがいちばん大きいかを確かめます。捨てた食材（仕込みすぎ）、盛りつけのばらつき（量の決まりがない）、まかないの記録もれ、のどれかです。そのうえで、仕込みの量と盛りつけの決まりを作ります。棚卸しを別の人とする仕組みは、不正をふせぐことにもなり、正直な人を守ります。
