schemaVersion: 1
id: case-cross-03
kind: cross
field: strategy
order: 3
title: 2 号店を出したら、1 年目の現金はどうなりますか？
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  1 号店は、昼も夜も行列ができています。港の反対側の駅前に、2 号店を出す話があります。
  内装と厨房に 2,000 万円かかります。家主に預ける保証金も 300 万円かかります。
  銀行は、2,000 万円までなら貸すと言っています。5 年で返し、金利は 2％ です。店長は、1 号店の副店長に任せる案があります。
facts:
  - { label: "内装・厨房", value: "2,000 万円" }
  - { label: "保証金", value: "300 万円" }
  - { label: "見込む1年の売上", value: "6,000 万円" }
  - { label: "借入", value: "2,000 万円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 駅前に 2 号店を出す
    detail: 借入 2,000 万円 ＋ 手元のお金 300 万円
  - id: b
    label: 出さずに、1 号店を広げる
    detail: 席を増やして行列を減らす
  - id: c
    label: 1 年待って、副店長を育ててから出す
    detail: 店長が育つまで、出店は見送る
perspectives:
  - field: strategy
    heading: 近くに出すか、はなれて出すか
    body: |
      同じ地域に店を集めると、よいことがあります。仕入れ・配送・人の行き来がまとまります。店の名前も知られやすくなります。
      一方で、1 号店のお客様を取り合うおそれもあります。
      駅前のお客様は、港の観光客とはちがいます。通勤する人と、地元の人が中心です。「港の魚」という強みが、このお客様にも響くか。そこがいちばん大事な点です。
  - field: finance
    heading: 2,300 万円をどう用意するか
    body: |
      借入 2,000 万円は、毎年 400 万円ずつ返します。1 年目の利息は 40 万円（2％）です。保証金 300 万円は、手元のお金で出します。
      保証金は費用ではありません。家主に預けたお金なので、BS の資産に残ります。ただし、現金は出ていきます。
  - field: hr
    heading: 店長を誰に任せるか
    body: |
      2 号店がうまくいくかは、店長で決まります。1 号店の副店長を店長にすると、1 号店の夜の回し方が弱くなります。
      開店の前に、採用と研修に 150 万円をかけます。両方の店が回る人数をそろえましょう。
  - field: legal
    heading: 店を借りる契約で確かめること
    body: |
      次のことを確かめます。契約の期間。途中でやめるときに、いつまでに伝えるかと、違約金。出ていくときに、どこまで元の形にもどすか（原状回復）。保証金の返し方。
      うまくいかなかったときに店をたたむ費用は、契約で決まります。
  - field: accounting
    heading: 3 表で確かめる
    body: |
      最後に、開店 1 年目の PL・BS・CF を、数字で確かめます。利益が出ても、現金は減ることがあります。
checks:
  - id: case-cross-03/q-operating
    prompt: 2 号店の 1 年目です。売上 6,000、食材 1,800、人件費 1,950、家賃 600、光熱費・その他 900、減価償却費 200、開店の準備費 150（万円）。営業利益はいくらですか。
    choices:
      - { id: a, label: "400 万円" }
      - { id: b, label: "550 万円" }
      - { id: c, label: "6,000 万円" }
      - { id: d, label: "−150 万円" }
    answer: a
    explanation: 6,000 − 1,800 − 1,950 − 600 − 900 − 200 − 150 ＝ 400 万円です。550 万円は、開店の準備費を引き忘れた額です。
  - id: case-cross-03/q-cash
    prompt: 営業 CF ＋452、投資 CF −2,300（内装 2,000 と保証金 300）、財務 CF ＋1,600（借入 2,000、返済 400）です。1 年目の現金の増減はいくらですか。
    choices:
      - { id: a, label: "＋252 万円" }
      - { id: b, label: "＋1,600 万円" }
      - { id: c, label: "−248 万円" }
      - { id: d, label: "−2,300 万円" }
    answer: c
    explanation: 452 − 2,300 ＋ 1,600 ＝ −248 万円です。利益は 252 万円出ていますが、現金は 248 万円減ります。
  - id: case-cross-03/q-deposit
    prompt: 家主に預けた保証金 300 万円は、どこに出ますか。
    choices:
      - { id: a, label: "PL の費用（家賃）" }
      - { id: b, label: "BS の資産と、CF の投資の支出" }
      - { id: c, label: "BS の負債" }
      - { id: d, label: "どこにも出ない" }
    answer: b
    explanation: 保証金は、出ていくときに返ってくる、預けたお金です。だから費用ではなく、BS の資産に載ります。払った現金は、CF の投資のところに出ます。
effects:
  unit: 万円
  period: 2 号店の開店 1 年目（出店しなかった場合との差）
  pl:
    - { item: 売上高の増加, delta: 6000 }
    - { item: 食材費の増加, delta: -1800 }
    - { item: 人件費の増加, delta: -1950 }
    - { item: 家賃の増加, delta: -600 }
    - { item: 水道光熱費・その他の増加, delta: -900 }
    - { item: 減価償却費の増加, delta: -200 }
    - { item: 開店の準備費（採用・研修）, delta: -150 }
    - { item: 営業利益, delta: 400, total: true }
    - { item: 支払利息の増加, delta: -40 }
    - { item: 税引前当期純利益, delta: 360, total: true }
    - { item: 法人税などの増加, delta: -108 }
    - { item: 当期純利益, delta: 252, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: -248, cash: true }
    - { item: 内装・厨房設備, side: asset, delta: 1800 }
    - { item: 家主に預けた保証金, side: asset, delta: 300 }
    - { item: 借入金, side: liability, delta: 1600 }
    - { item: 利益剰余金, side: equity, delta: 252, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: 252 }
    - { item: 減価償却費をもどす（現金は出ていないため）, section: operating, delta: 200 }
    - { item: 内装・厨房の支払い, section: investing, delta: -2000 }
    - { item: 保証金を預ける, section: investing, delta: -300 }
    - { item: 銀行からの借入, section: financing, delta: 2000 }
    - { item: 借入金の返済, section: financing, delta: -400 }
  payback:
    investment: 2300
    annualCash: 452
    note: 内装・厨房と保証金の 2,300 万円を、2 号店が生む営業キャッシュフローで割った年数です（利息と税を払ったあとの、かんたんな計算）。保証金は出ていくときに戻りますが、ここでは含めて考えました。2 年目からは開店の準備費がなくなるので、約 4 年に縮みます
  assumptions:
    - 2 号店の 1 年目の売上は 6,000 万円と見込みます（40 席、昼と夜で 1 日約 190 人、1人あたり約 1,050 円、営業 300 日）
    - 内装・厨房の 2,000 万円は、10 年間、毎年同じ額を減価償却します
    - 借入 2,000 万円は年の初めに借ります。1 年目の利息は 2％ の 40 万円、返済は年 400 万円とします
    - 1 号店の売上は、2 号店の影響を受けないとします（実際は、お客様を取り合うおそれがあります）
    - 法人税などは、増えた利益の 30％ とし、その年のうちに払います。売掛金や在庫の増減はないとします
modelAnswer: |
  出店（a）すると、1 年目から営業利益 400 万円が見込めます。でも現金は 248 万円減り、取りもどすには約 5 年かかります。数字だけなら悪くありません。それでも、この決定でいちばん大事なのは、数字の外にあります。

  - 店長：2 号店を任せられる人がいないまま出すと、2 号店の売上の見込みも、1 号店の夜の回し方もくずれます
  - お客様：駅前の通勤する人に「港の魚」が響くかは、まだ確かめていません
  - やめるとき：うまくいかなかったときに契約をやめる費用と、原状回復の費用は、契約で決まります

  おすすめの考え方は、まず店長候補を育てる計画（c）を立てることです。その間に、駅前で弁当を売るなど小さく試して、お客様の反応を見ます。
  出すと決めたら、5 年の返済にたえられるよう、悪い場合（売上が 2 割少ない）の資金繰り表も作っておきましょう。戦略・人・契約・お金を 3 表でつなぐと、「行列があるから出す」より一歩進んだ決め方になります。
