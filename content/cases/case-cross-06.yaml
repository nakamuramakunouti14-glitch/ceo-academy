schemaVersion: 1
id: case-cross-06
kind: cross
field: finance
order: 6
title: 金利が 1％ 上がったら、ホテルの利益はどうなる？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  銀行から、来月から金利が 1.5％ から 2.5％ に上がると知らせが来ました。みなと館ホテルは、4 億 4,000 万円を変動金利で借りています。
  手元の現金は 8,000 万円です。預けている銀行の金利も、1％ 上がる見込みです。
facts:
  - { label: "借りているお金", value: "4.4 億円" }
  - { label: "金利", value: "1.5％ → 2.5％" }
  - { label: "手元の現金", value: "0.8 億円" }
  - { label: "金利のタイプ", value: "変動金利" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 何もしない
    detail: そのうち金利が下がるのを待つ
  - id: b
    label: 手元の現金で 3,000 万円を先に返す
    detail: 借りているお金を減らして、利息を減らす
  - id: c
    label: 銀行と相談し、一部を固定金利に切りかえる
    detail: これからの利息を読めるようにする
perspectives:
  - field: finance
    heading: 利息はいくら増える？
    body: |
      変動金利なので、利息は 44,000 万円 × 1％ ＝ 1 年で 440 万円増えます。
      預けている現金 8,000 万円の利息は、8,000 万円 × 1％ ＝ 80 万円増えます。差し引きで、1 年に 360 万円の負担が増えます。
  - field: accounting
    heading: PL のどこに出る？
    body: |
      利息は「支払利息」の行に出ます。本業のもうけ（営業利益）は変わりません。でも、最後に残る利益（当期純利益）は減ります。
      税金も少し減るので、当期純利益の減り方は 360 万円より少なくなります。
  - field: strategy
    heading: 物の値段も上がっていないか
    body: |
      金利が上がるのは、物の値段が上がり続けている（インフレの）ときが多いです。食材や光熱費も同時に上がっていないかを確かめましょう。
      利息の増加と原価の増加を合わせて、値上げが必要かを考えます。
  - field: negotiation
    heading: 銀行と何を相談するか
    body: |
      一部を固定金利に切りかえると、これからの利息が読めるようになります。ただし、固定金利は変動金利より高めのことが多いです。
      資金繰り表と、これからの計画を持って相談すると、条件の話がしやすくなります。
checks:
  - id: case-cross-06/q-interest
    prompt: 44,000 万円を変動金利で借りています。金利が 1％ 上がると、1 年の利息はいくら増えますか。
    choices:
      - { id: a, label: "44 万円" }
      - { id: b, label: "80 万円" }
      - { id: c, label: "440 万円" }
      - { id: d, label: "4,400 万円" }
    answer: c
    explanation: 44,000 万円 × 1％ ＝ 440 万円です。80 万円は、預けている現金の利息が増える分です。
  - id: case-cross-06/q-net
    prompt: 支払利息が 440 万円増え、受け取る利息が 80 万円増えます。税金（30％）も考えると、当期純利益はいくら減りますか。
    choices:
      - { id: a, label: "252 万円" }
      - { id: b, label: "360 万円" }
      - { id: c, label: "440 万円" }
      - { id: d, label: "108 万円" }
    answer: a
    explanation: 差し引きで利益は 360 万円減ります。そのぶん税金が 360 × 30％ ＝ 108 万円減るので、当期純利益は 360 − 108 ＝ 252 万円減ります。
  - id: case-cross-06/q-repay
    prompt: 手元の現金で 3,000 万円を先に返すと、1 年の利息の差し引きはいくら良くなりますか（借りる金利 2.5％、預ける金利 1％）。
    choices:
      - { id: a, label: "75 万円" }
      - { id: b, label: "45 万円" }
      - { id: c, label: "30 万円" }
      - { id: d, label: "3,000 万円" }
    answer: b
    explanation: 払う利息が 3,000 × 2.5％ ＝ 75 万円減ります。でも、預けていた現金の利息も 3,000 × 1％ ＝ 30 万円減ります。差し引きで 45 万円良くなります。
effects:
  unit: 万円
  period: 金利が上がった後の 1 年間（金利が上がらなかった場合との差）
  pl:
    - { item: 本業のもうけ（変わらない）, delta: 0 }
    - { item: 営業利益, delta: 0, total: true }
    - { item: 受け取る利息の増加, delta: 80 }
    - { item: 支払利息の増加, delta: -440 }
    - { item: 税引前当期純利益, delta: -360, total: true }
    - { item: 法人税等の減少, delta: 108 }
    - { item: 当期純利益, delta: -252, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: -252, cash: true }
    - { item: 利益剰余金, side: equity, delta: -252, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: -252 }
    - { item: 設備の購入（なし）, section: investing, delta: 0 }
    - { item: 借入・返済（変わらない）, section: financing, delta: 0 }
  assumptions:
    - 何もしない案（a）の数字です。借りているお金 44,000 万円は 1 年間変わらないとします
    - 借りる金利は 1.5％ から 2.5％ に上がるとします。預ける金利も、練習のため同じ 1％ 上がるとします（実際は、預ける金利の上がり方はもっと小さいことが多いです）
    - 税金（法人税等）は、減った利益の 30％ だけ減るとします。その年のうちに払います
    - 数字は練習用の例です。実際の金利は、日本銀行の発表や取引している銀行に確かめます
modelAnswer: |
  何もしない（a）と、1 年で当期純利益が 252 万円減り、そのぶん現金も減ります。金利がすぐ下がる保証はありません。

  - 先に返す（b）は、利息の差し引きで 1 年 45 万円よくなります。でも、手元の現金が 8,000 万円から 5,000 万円に減ります。賞与と税金の支払いが重なる月のように、現金が少なくなる月を、乗り切れるかを確かめる必要があります
  - 固定金利に切りかえる（c）は、これからの利息が読めるようになります。金利がさらに上がっても、計画が崩れにくくなります。切りかえにかかる手数料や、条件の変わり方も銀行に確かめましょう

  考え方のお手本は、まず c を銀行と相談し、借りているお金の一部を固定金利にすることです。そのうえで、現金に余裕がある月に、少しずつ b も行います。あわせて、食材や光熱費の値上がりも確かめ、必要なら値上げも考えます。金利の話は、ファイナンス・財務・戦略・交渉がひとつにつながる、よい練習になります。
