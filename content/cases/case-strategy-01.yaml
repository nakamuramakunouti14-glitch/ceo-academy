schemaVersion: 1
id: case-strategy-01
kind: field
field: strategy
order: 1
title: 赤字の郊外店を閉じるべきでしょうか
company: 架空の定食屋チェーン（港店・駅前店・郊外店の3店）
situation: |
  店ごとの数字を出しました。郊外店の貢献利益は、年 −200 万円でした。貢献利益とは、店の売上から、店で直接かかる費用を引いたものです。
  港店は ＋1,100 万円、駅前店は ＋500 万円です。本部の費用は年 1,000 万円で、郊外店を閉じても減りません。
  郊外店のまわりには、大きな工場ができる予定です。店を借りる契約は残り 3 年です。途中でやめると、違約金が 300 万円かかります。
facts:
  - { label: "郊外店の貢献利益", value: "−200 万円" }
  - { label: "本部の費用", value: "1,000 万円" }
  - { label: "契約を途中でやめる違約金", value: "300 万円" }
  - { label: "契約の残り", value: "3 年" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: すぐに閉じる
    detail: 違約金を払って、店から手を引く
  - id: b
    label: 工場の開業に合わせて、昼の弁当で立て直しを試す
    detail: 1 年で黒字にならなければ、そのときに契約をやめて閉じる
  - id: c
    label: 何もせず続ける
    detail: 様子を見る
perspectives:
  - field: strategy
    heading: 市場が伸びるかどうか
    body: |
      郊外店は、今は弱い店です。でも工場ができれば、昼ごはんを買う人が増えます。
      「市場が伸びる × 自社が弱い」は、勝てる見込みがあればお金をかけ、なければ手を引く場所です。
      工場で働く人向けの弁当という、はっきりした勝ち方があるかで決めます。
  - field: leadership
    heading: 取り消せない決定は、期限を決めて試す
    body: |
      閉店は、あとから取り消しにくい決定です。一方、弁当の販売は小さく試せます。だめならやめられます。
      期限（1 年）と、続ける条件（貢献利益が黒字）を、先に決めておきましょう。
checks:
  - id: case-strategy-01/q-close
    prompt: 郊外店を閉じると、貢献利益 −200 万円はなくなります。でも本部の費用 1,000 万円は減りません。違約金 300 万円も考えると、閉じた 1 年目の会社全体の営業利益はいくらですか。（今は 1,100 ＋ 500 − 200 − 1,000 ＝ 400 万円）
    choices:
      - { id: a, label: "600 万円" }
      - { id: b, label: "300 万円" }
      - { id: c, label: "400 万円" }
      - { id: d, label: "−400 万円" }
    answer: b
    explanation: 閉じると 1,100 ＋ 500 − 1,000 ＝ 600 万円になります。でも 1 年目は違約金 300 万円がかかるので、300 万円です。1 年目だけなら、今の 400 万円より下がります。契約の残り 3 年でくらべると、閉じるほうは 300 ＋ 600 ＋ 600 ＝ 1,500 万円です。赤字のまま続けるほうは 400 × 3 ＝ 1,200 万円です。
modelAnswer: |
  数字だけでくらべると、立て直せない店は、早く閉じるほうが得です。契約の残り 3 年の営業利益は、すぐ閉じる（a）と 1,500 万円、何もしない（c）と 1,200 万円です。なので c は選びません。

  それでも b を選ぶのは、工場の開業で市場が変わり、立て直せる見込みがあるからです。1 年試して届かなければ、そのときに契約をやめます（1 年目 400 ＋ 2 年目 300 ＋ 3 年目 600 ＝ 1,300 万円）。a との差の 200 万円が、お客様がいるかを確かめる「試すための費用」です。
  工場で売れる見込みがはっきりしなければ（昼の弁当の注文の約束など）、a を選びます。どちらでも、働く人をほかの店に移す計画を、前もって作っておきましょう。
