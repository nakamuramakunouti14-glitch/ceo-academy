schemaVersion: 1
id: case-accounting-01
kind: field
field: accounting
order: 1
title: 黒字なのに、なぜ現金が減っている？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  決算が出ました。当期純利益は 3,500 万円の黒字です。ところが、年のはじめに 9,800 万円あった現金が、年の終わりには 8,000 万円に減っていました。
  取締役会で「利益が出ているのに、なぜ現金が減るのか」と聞かれました。手元にある数字は、営業キャッシュフロー 8,700 万円、設備の入れかえ 6,000 万円、借金の返済 4,000 万円、配当 500 万円です。
facts:
  - { label: "当期純利益", value: "3,500 万円" }
  - { label: "現金の増減", value: "−1,800 万円" }
  - { label: "営業 CF（本業で入った現金）", value: "8,700 万円" }
  - { label: "借金の返済", value: "4,000 万円" }
question: 取締役会で、まず何を説明しますか？
options:
  - id: a
    label: 利益と現金がずれる理由を、CF の3つの区分で説明する
    detail: 本業では現金を生んでいることと、その使い道を分けて話す
  - id: b
    label: 会計のきまりだから、と答える
    detail: くわしい説明ははぶく
  - id: c
    label: 来年は利益を増やす、とだけ約束する
    detail: 現金の話はしない
perspectives:
  - field: accounting
    heading: 本業は現金を生んでいる
    body: |
      営業キャッシュフローは 8,700 万円です。当期純利益 3,500 万円より大きいです。減価償却費 5,000 万円は、費用ですが現金は出ていかないからです。
      現金が減ったのは、本業で生んだ以上の現金を使ったためです。使い道は、設備の入れかえ（−6,000 万円）、借金の返済（−4,000 万円）、配当（−500 万円）です。
  - field: finance
    heading: このやり方は続けられるか
    body: |
      フリーキャッシュフロー（営業 ＋ 投資）は、8,700 − 6,000 ＝ 2,700 万円です。返済の 4,000 万円には足りません。同じことが続けば、現金は毎年減ります。
      設備の入れかえの時期をずらすか、返済の期間をのばせないか銀行に相談するか、を考える必要があります。
checks:
  - id: case-accounting-01/q-fcf
    prompt: 営業 CF が 8,700 万円、投資 CF が −6,000 万円です。借金の返済 4,000 万円に対して、フリーキャッシュフローはいくら足りませんか。
    choices:
      - { id: a, label: "足りている" }
      - { id: b, label: "1,300 万円" }
      - { id: c, label: "4,000 万円" }
      - { id: d, label: "1,800 万円" }
    answer: b
    explanation: フリーキャッシュフローは 2,700 万円です。返済 4,000 万円に対して、1,300 万円足りません。配当 500 万円も合わせると、現金は 1,800 万円減ります。
modelAnswer: |
  基本は a の説明です。CF の3つの区分で、こう話します。「本業では 8,700 万円の現金を生みました。それを、設備の入れかえと借金の返済と配当に、1 億 500 万円使いました。だから現金は 1,800 万円減りました」。

  そのうえで、フリーキャッシュフロー 2,700 万円では、返済 4,000 万円をまかなえないことを見せます。来年の手（設備の入れかえの時期の見直し、返済の期間の相談）まで出すと、取締役会は判断できます。b や c では、現金が減り続けるあぶなさを見のがします。
relatedThemes:
