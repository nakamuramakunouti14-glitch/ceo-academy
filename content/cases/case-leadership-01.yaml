schemaVersion: 1
id: case-leadership-01
kind: field
field: leadership
order: 1
title: 週末の料金を、誰が決めるか
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  週末の客室の料金は、毎回、支配人が社長に相談して決めています。
  あるとき、社長が出張中で、返事がおくれました。その週末は、近くのライバルのホテルより高い料金のまま、部屋が売れ残りました。
  支配人は、近くの宿の料金と、予約の入り方を毎日見ています。
facts:
  - { label: "今の決め方", value: "毎回社長に相談" }
  - { label: "売れ残った週末", value: "先月 2 回" }
  - { label: "支配人の経験", value: "8 年" }
  - { label: "料金の幅（案）", value: "1〜2.4 万円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: これからも毎回相談させる
    detail: 料金は大事なので、社長が決める
  - id: b
    label: 料金の幅を決めて、その中は支配人に任せる
    detail: 毎週の報告で、稼働率と単価を確かめる
  - id: c
    label: 支配人にすべて任せ、報告もいらない
    detail: まるごと任せる
perspectives:
  - field: leadership
    heading: 取り消せる決定は、現場に任せる
    body: |
      週末の料金は、次の週に直せます。取り消せる決定です。毎回社長が決めると、判断がおくれて、売りどきを逃します。
      幅（1〜2.4 万円）を決めて任せます。幅から外れるときだけ、相談してもらいます。
      毎週、稼働率・単価・RevPAR を紙 1 枚で報告してもらいます。RevPAR（レブパー）とは、売れる1部屋が、空室も含めて平均いくらかせいだかです。
  - field: operations
    heading: 任せた結果を RevPAR で見る
    body: |
      任せたあとは、RevPAR で結果を確かめます。稼働率だけ、単価だけを見るのではありません。
      前の年の同じ週とくらべると、任せた効果がわかります。
checks:
  - id: case-leadership-01/q-reversible
    prompt: 週末の客室の料金は、どんな決定ですか。
    choices:
      - { id: a, label: "次の週に直せる、取り消せる決定" }
      - { id: b, label: "一度決めると戻せない、取り消せない決定" }
      - { id: c, label: "法律で社長が決めると決まっている決定" }
      - { id: d, label: "株主総会で決める決定" }
    answer: a
    explanation: 料金は、試して直せます。取り消せる決定は、範囲を決めて現場に任せる方が、速く、正しくなります。
modelAnswer: |
  b がおすすめです。料金は取り消せる決定なので、幅を決めて支配人に任せます。
  社長は、毎週の報告で RevPAR を確かめます。幅から外れるときだけ、話し合います。

  a では、社長のところで判断がつまり、売りどきを逃します。
  c では、結果を確かめるしくみがありません。問題に気づくのがおくれます。
  任せるとは、目的・範囲・確かめ方を渡すことです。
relatedThemes:
