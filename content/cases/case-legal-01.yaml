id: case-legal-01
kind: field
field: legal
order: 1
title: 宴会のキャンセル料、全額もらってよい？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  今の宴会の決まりは「申し込んだあとのキャンセルは、いつでも料金の全額」です。60 日前にキャンセルしたお客様（個人の法事の会食）から、全額は納得できないと言われました。
  これまでの記録では、60 日前のキャンセルの多くは、ほかの予約で埋まっています。
facts:
  - { label: "今の決まり", value: "いつでも全額" }
  - { label: "キャンセルの時期", value: "60 日前" }
  - { label: "お客様", value: "個人（消費者）" }
  - { label: "60日前の空きの埋まり方", value: "多くは埋まる" }
question: あなたならどうしますか？
options:
  - id: a
    label: 決まりどおり全額をもらう
    detail: 決まりに書いてあるので有効と考える
  - id: b
    label: 決まりを時期ごとの段階に見直し、今回も見直した率で対応する
    detail: 理由を説明できる率にする
  - id: c
    label: キャンセル料をやめる
    detail: 少しも取らない
perspectives:
  - field: legal
    heading: お客様との契約の違約金には上限がある
    body: |
      お客様（消費者）との契約で先に決めた違約金には、上限があります。同じ種類の契約が取り消されたときに、会社にふつう出る損の額（平均的な損害の額）を超える部分は無効です（消費者契約法 第9条第1項第1号）。
      60 日前のキャンセルは、多くがほかの予約で埋まっています。そのため、全額を取る決まりは、平均的な損害を超えると見られるおそれがあります。
  - field: marketing
    heading: お客様の納得と、次の利用
    body: |
      法事やお祝いの会食は、地元のお客様がくり返し使います。理由を説明できる決まりにしておくと、もめごとが減ります。次の利用にもつながります。
checks:
  - id: case-legal-01/q-law
    prompt: お客様（消費者）との契約で先に決めたキャンセル料について、消費者契約法の決まりとして正しいのはどれですか。
    choices:
      - { id: a, label: "どんな額でも、決まりに書けば有効" }
      - { id: b, label: "キャンセル料は少しも取れない" }
      - { id: c, label: "平均的な損害の額を超える部分は無効になる" }
      - { id: d, label: "料金の半額までなら必ず有効" }
    answer: c
    explanation: 消費者契約法第9条第1項第1号で、平均的な損害の額を超える部分は無効になります。
modelAnswer: |
  b がよい答えです。キャンセルの時期ごとに、記録を見ます。ほかの予約で埋まる見込みや、準備にかかった費用を調べ、段階のある率に見直します（例：直前ほど高く、早い時期は低く）。今回のお客様にも、見直した考え方で説明して対応します。

  a は、平均的な損害を超える部分が無効とされるおそれがあります。もめごとや、評判が下がる損につながります。c は、直前のキャンセルの損まで、自分の会社がかぶることになります。実際の率の決め方は、記録をもとに弁護士に確かめましょう。このケースは、2026-11-07 時点の法令にもとづく入門の考え方です。
