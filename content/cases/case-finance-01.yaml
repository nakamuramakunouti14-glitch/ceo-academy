schemaVersion: 1
id: case-finance-01
kind: field
field: finance
order: 1
title: 7 月に現金が足りなくなります。どう手を打ちますか？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  資金繰り表を作ってみました。すると 7 月は、賞与と納税が重なるとわかりました。月末の残高が 6,700 万円まで減る見込みです。
  安全のため、毎月かならず出ていくお金（約 3,500 万円）の 2 か月分、7,000 万円は手元に置いておきたいです。
  6 月の月末の残高は、8,300 万円の見込みです。
facts:
  - { label: "7月末の残高の見込み", value: "6,700 万円" }
  - { label: "置いておきたい額", value: "7,000 万円" }
  - { label: "足りない額", value: "300 万円" }
  - { label: "毎月かならず出ていくお金", value: "約 3,500 万円" }
question: あなたならどうしますか？
options:
  - id: a
    label: 何もしない
    detail: 8 月には戻るので待つ
  - id: b
    label: 早めに銀行と話し、短い期間の借入の枠を用意しておく
    detail: 使わなければ借りなくてよい
  - id: c
    label: 賞与を減らす
    detail: 支払いを減らして残高を守る
perspectives:
  - field: finance
    heading: 足りない月を前もって知った価値
    body: |
      足りないのは 300 万円です。8 月には 7,900 万円に戻る見込みです。
      一時的に足りないだけなので、短い期間の借入の枠で備えるのが合っています。たとえば当座貸越（とうざかしこし）です。決めた額までなら、必要なときにすぐ借りられるしくみです。
      銀行は、足りなくなってから頼まれるより、資金繰り表を持って前もって相談されるほうが応じやすいです。
  - field: hr
    heading: 賞与を減らすとどうなるか
    body: |
      お金のやりくりのために賞与を急に減らすと、働く人の信頼をなくします。辞める人が出るきっかけにもなります。
      賞与は、業績に合わせて決めるものです。お金のやりくりに使うのは、最後の手段です。
checks:
  - id: case-finance-01/q-shortfall
    prompt: 月初 8,300 万円、入金 4,500 万円、出金 6,100 万円の月です。7,000 万円を残したいとき、いくら足りませんか。
    choices:
      - { id: a, label: "300 万円" }
      - { id: b, label: "1,600 万円" }
      - { id: c, label: "0 円" }
      - { id: d, label: "700 万円" }
    answer: a
    explanation: 月末の残高は 8,300 ＋ 4,500 − 6,100 ＝ 6,700 万円です。7,000 万円にするには、300 万円足りません。
modelAnswer: |
  b がおすすめの答えです。資金繰り表で、足りない月と額（300 万円）が前もってわかりました。そこで、資金繰り表を持って銀行に相談し、短い期間の借入の枠を用意しておきます。使わずに済めば、利息もほとんどかかりません。

  a は、見込みが外れて入金が減ると、毎月のお金を払えなくなるおそれがあります。c は、一時的に足りないだけなのに、働く人の信頼をなくします。資金繰り表は、あわてずに手を打つための道具です。
