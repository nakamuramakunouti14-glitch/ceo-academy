schemaVersion: 1
id: case-hr-01
kind: field
field: hr
order: 1
title: 入って 3 か月で辞める人が多い
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  1 年で 12 人が辞めました。そのうち 8 人は、入社して 3 か月以内でした。
  辞めた人の声は「誰に聞けばいいかわからなかった」「いきなり一人で夜勤を任された」です。
  1 人辞めるごとに、採用と育てる費用で 70 万円かかっています。
facts:
  - { label: "1年で辞めた人", value: "12 人" }
  - { label: "3か月以内に辞めた人", value: "8 人" }
  - { label: "1人あたりの費用", value: "70 万円" }
  - { label: "従業員", value: "60 人" }
question: あなたなら、どうしますか？
options:
  - id: a
    label: 給料を全員 5％ 上げる
    detail: お金の待遇で引き止める
  - id: b
    label: 最初の 3 か月の迎え方を作り直す
    detail: 教える担当の人をつけ、夜勤は 3 か月目からにする
  - id: c
    label: 採る人数を増やす
    detail: 辞める分を多めに採る
perspectives:
  - field: hr
    heading: 辞める時期に原因がある
    body: |
      辞めた人の 3 分の 2 が、入って 3 か月以内です。給料よりも、入ってすぐの迎え方に原因がありそうです。
      教える担当の人を決めます。最初の 3 か月の目標と、夜勤を任せる時期も決めます。
  - field: accounting
    heading: 給料を上げる費用とくらべる
    body: |
      給料を上げて、人件費 17,000 万円が全体で 5％ 増えるとします。すると、1年で 850 万円の費用が増えます。
      いっぽう、3 か月以内に辞める人を 8 人から 3 人に減らせたとします。すると、5 人 × 70 万円 ＝ 350 万円の費用が減ります。
checks:
  - id: case-hr-01/q-saving
    prompt: 3 か月以内に辞める人を、8 人から 3 人に減らしました。1 人 70 万円とすると、費用は1年でいくら減りますか。
    choices:
      - { id: a, label: "210 万円" }
      - { id: b, label: "560 万円" }
      - { id: c, label: "70 万円" }
      - { id: d, label: "350 万円" }
    answer: d
    explanation: 減った人数は 5 人です。5 人 × 70 万円 ＝ 350 万円です。
modelAnswer: |
  b がおすすめです。辞める人は、入ってすぐの時期に集まっています。だから、迎え方を作り直すことが、原因に直接効きます。
  教える担当の人をつけ、夜勤は 3 か月目からと決めるだけでもかまいません。費用は、ほとんどかかりません。

  a は、1年に 850 万円かかります。それなのに「誰に聞けばいいかわからない」という原因は残ります。
  c は、辞める人を補い続けるだけです。採用の費用も、教える人の負担も増えます。
  まず、原因がどこにあるかを数字で見つけましょう。それから手を打ちます。
