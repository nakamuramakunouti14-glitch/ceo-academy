schemaVersion: 1
id: case-governance-01
kind: field
field: governance
order: 1
title: お客様がおなかの痛みを訴えた。最初の 1 時間に何をする？
company: うみかぜ食堂（架空・40席の定食屋）
situation: |
  昼に刺身定食を食べたお客様 3 人から、夕方に「おなかが痛い」と電話がありました。同じ日に、刺身定食は 40 食出ています。
  店長は「たまたまだろう」と言っています。夜の営業も、いつもどおり刺身を出すつもりです。
facts:
  - { label: "おなかが痛いという連絡", value: "3 人" }
  - { label: "同じ日の刺身定食", value: "40 食" }
  - { label: "夜の営業", value: "これから" }
  - { label: "1日の売上", value: "20 万円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 様子を見て、夜もいつもどおり営業する
    detail: たまたまかもしれない
  - id: b
    label: 刺身を出すのを止め、残りの食材をとっておき、保健所に相談する
    detail: 連絡のあったお客様の様子も記録する
  - id: c
    label: お客様に、人に話さないようたのむ
    detail: 評判を守る
perspectives:
  - field: governance
    heading: 被害を広げないことがいちばん
    body: |
      食中毒のおそれがあるときは、原因がわかる前に、あやしい料理を出すのを止めます。残った食材は、捨てずにとっておきます。保健所に相談して、指示にしたがいます。
      誰が決めて、誰に連絡するかを、前もって決めておきましょう。そうすれば、この 1 時間で迷いません。
  - field: leadership
    heading: 悪い知らせを早く上げる
    body: |
      店長が「たまたま」と考えて報告しなかったら、どうなるでしょう。社長は知らないまま、夜の営業が始まります。
      悪い知らせほど早く上がってくる職場にしておきましょう。
checks:
  - id: case-governance-01/q-first
    prompt: 食中毒のおそれがあるとき、最初にすることはどれですか。
    choices:
      - { id: a, label: "原因がわかるまで、いつもどおり営業する" }
      - { id: b, label: "残った食材を捨てて、店をきれいにする" }
      - { id: c, label: "SNS で打ち消す" }
      - { id: d, label: "あやしい料理を出すのを止め、食材をとっておき、保健所に相談する" }
    answer: d
    explanation: 被害を広げないことが、いちばん大事です。食材は、原因を調べる手がかりになります。だから捨てません。
modelAnswer: |
  b がおすすめです。原因がわかる前に、あやしい料理を止めます。食材はとっておき、保健所に相談します。連絡のあったお客様の様子も記録します。

  a では、もし食中毒だったら、被害が広がります。店を開けられない期間も、信用の損も大きくなります。
  c では、かくしたことがあとでわかると、食中毒そのものより大きく信用をなくします。
  店を開けられないあいだに失う売上は、1 日 20 万円です。でも、そのあとのお客様の減り方の方が大きいことを思い出しましょう。
relatedThemes:
