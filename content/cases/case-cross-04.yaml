schemaVersion: 1
id: case-cross-04
kind: cross
field: it-dx
order: 4
title: 自動チェックイン機を入れたら、本当にもうかる？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  夕方のチェックインの時間には、フロントに 3〜4 人がはりついています。それでも、お客様を待たせています。予約サイトの予約を、客室の管理システムに打ち直す作業も、毎日続いています。
  そこで、2つを入れる案が出ています。自動チェックイン機（600 万円）と、予約サイトと客室の管理システムをつなぐ仕組み（連携、200 万円）です。費用は、手元のお金で払います。
facts:
  - { label: "自動チェックイン機", value: "600 万円" }
  - { label: "システムの連携", value: "200 万円" }
  - { label: "減る働く時間", value: "年 2,180 時間" }
  - { label: "保守・利用料", value: "年 84 万円" }
question: あなたが社長なら、どうしますか？
options:
  - id: a
    label: 両方入れて、フロントのシフトを減らす
    detail: 浮いた時間の分、シフトを組み直す
  - id: b
    label: 両方入れて、フロントの人は案内役に回す
    detail: シフトは減らさず、港町の案内と予約の相談に回す
  - id: c
    label: 入れない
    detail: 今のまま人で回す
perspectives:
  - field: it-dx
    heading: 何時間減るかを先に数える
    body: |
      自動チェックイン機で、チェックインの手続きが年 2,000 時間減ります。予約サイトの予約の打ち直しは 1 日約 30 分で、年約 180 時間減ります。合わせて年 2,180 時間です。
      費用は、買うときの 800 万円（5 年で減価償却）と、保守・利用料の年 84 万円です。
  - field: operations
    heading: 人時生産性はどう変わるか
    body: |
      1 時間あたりの人件費は 1,500 円です。2,180 時間減れば、人件費は年 327 万円減ります。ただし、それはシフトを本当に減らした場合です。
      人数を減らさなければ、人時生産性（1人が1時間でどれだけ稼ぐか）は変わりません。機械の費用だけが増えます。
  - field: hr
    heading: 減った時間を、誰のどの仕事にするか
    body: |
      シフトを減らすと、働く時間が減る人が出ます。パートの働く条件を、会社が一方的に下げることはできません。本人と話し合い、希望する人には、レストランの朝の手伝いなど、ほかの仕事を用意します。
      案内役に回す案（b）は、人件費は減りません。でも、高い値段の部屋に泊まるお客様への接客の質を上げます。その効果は、客室の単価や口コミの点数で測ります。
  - field: leadership
    heading: 使われる仕組みにする
    body: |
      機械を入れても、年配のお客様が迷えば、けっきょくフロントが手伝うことになります。はじめの 1 か月は、機械の横に案内の人を立てます。困った例を集めて、手順を直しましょう。
  - field: accounting
    heading: 3 表で確かめる
    body: |
      シフトを減らす案（a）で、1 年目の PL・BS・CF を確かめます。利益の増え方と、現金の減り方を見比べましょう。
checks:
  - id: case-cross-04/q-labor
    prompt: 働く時間が年 2,180 時間減り、1 時間あたりの人件費は 1,500 円です。シフトを減らした場合、人件費は年いくら減りますか。
    choices:
      - { id: a, label: "300 万円" }
      - { id: b, label: "218 万円" }
      - { id: c, label: "3,270 万円" }
      - { id: d, label: "327 万円" }
    answer: d
    explanation: 2,180 時間 × 1,500 円 ＝ 327 万円です。300 万円は、自動チェックイン機の分（2,000 時間）だけの額です。
  - id: case-cross-04/q-operating
    prompt: 人件費 −327、保守・利用料 ＋84、減価償却費 ＋160（800 ÷ 5 年）です。営業利益はいくら増えたり減ったりしますか。
    choices:
      - { id: a, label: "＋83 万円" }
      - { id: b, label: "＋243 万円" }
      - { id: c, label: "＋327 万円" }
      - { id: d, label: "−244 万円" }
    answer: a
    explanation: 327 − 84 − 160 ＝ 83 万円増えます。シフトを減らさなければ人件費は減らず、−84 − 160 ＝ −244 万円になります。
  - id: case-cross-04/q-no-shift
    prompt: 案内役に回す案（b）で、シフトを減らしませんでした。単価や口コミが変わらないとすると、営業利益はどうなりますか。
    choices:
      - { id: a, label: "＋83 万円" }
      - { id: b, label: "変わらない" }
      - { id: c, label: "244 万円減る" }
      - { id: d, label: "354 万円増える" }
    answer: c
    explanation: 人件費は減らず、保守・利用料 84 万円と減価償却費 160 万円だけが増えます。だから 244 万円減ります。案内役の効果で、単価や点数を上げて取り戻せるかが勝負です。
effects:
  unit: 万円
  period: 入れたあとの 1 年目、シフトを減らす案（a）（入れなかった場合との差）
  pl:
    - { item: 人件費の減少, delta: 327 }
    - { item: 保守・利用料の増加, delta: -84 }
    - { item: 減価償却費の増加, delta: -160 }
    - { item: 営業利益, delta: 83, total: true }
    - { item: 法人税等の増加, delta: -25 }
    - { item: 当期純利益, delta: 58, total: true, netIncome: true }
  bs:
    - { item: 現金・預金, side: asset, delta: -582, cash: true }
    - { item: 機械・ソフトウェア, side: asset, delta: 640 }
    - { item: 利益剰余金, side: equity, delta: 58, retainedEarnings: true }
  cf:
    - { item: 当期純利益, section: operating, delta: 58 }
    - { item: 減価償却費の足し戻し, section: operating, delta: 160 }
    - { item: 機械と連携の支払い, section: investing, delta: -800 }
    - { item: 借入・返済（なし）, section: financing, delta: 0 }
  payback:
    investment: 800
    annualCash: 218
    note: 機械と連携の 800 万円を、毎年増える営業のお金の流れ（営業キャッシュフロー）で割った年数です。機械を使える年数（耐用年数、5 年）より短いかを見ます
  assumptions:
    - 働く時間が減り、その分シフトを減らします。自動チェックイン機で年 2,000 時間、予約サイトの予約の打ち直し（1 日約 30 分）がなくなって年約 180 時間です
    - 1 時間あたりの人件費は 1,500 円とします
    - 学びやすくするため、機械 600 万円と連携 200 万円は、両方とも年のはじめに手元のお金で払うとしました。5 年で毎年同じ額を減価償却します（よい答えのように順に入れると、1 年目の数字は小さくなります）
    - 保守・利用料は、機械 60 万円、連携 24 万円で、年 84 万円です
    - 法人税などは、増えた利益の 30％ とし、その年のうちに払います（83 × 30％ ≒ 25）
modelAnswer: |
  シフトを減らす案（a）なら、営業利益は年 83 万円増えます。約 3.7 年で回収でき、機械を使える年数の 5 年に収まります。ただし、1 年目の現金は 582 万円減ります。

  - 案内役に回す案（b）は、単価や口コミの点数が上がらなければ、年 244 万円の損になります。効果を測る数字（口コミの点数、客室の単価、リピート率）を先に決めておきましょう
  - 入れない案（c）は、人手が足りない中で、待ち時間と打ちまちがいの損をかかえ続けます

  よい答えは、順番に入れることです。まず予約の連携（200 万円）を入れて、打ち直しの手間とまちがいを減らします。次に自動チェックイン機を入れて、シフトを組み直します。浮いた時間の一部は、ホテルを高めの値段の路線に変えていくのに合わせて、案内役に回します。その効果は、単価で確かめます。IT への投資の 3 表への効果は、機械の代金ではなく「減った時間を何に変えるか」で決まります。
