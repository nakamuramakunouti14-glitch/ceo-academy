schemaVersion: 1
id: case-marketing-01
kind: field
field: marketing
order: 1
title: 予約の 7 割が旅行サイト。手数料を減らすには？
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  1年に 23,000 泊の予約があります。そのうち 7 割（16,100 泊）が、手数料 12％ の旅行サイトからの予約です。1部屋の平均の値段は 14,000 円で、手数料は1年で 2,700 万円をこえます。
  支配人は「旅行サイトをやめて、全部自分たちのサイトにしよう」と言っています。
facts:
  - { label: "旅行サイトからの予約の割合", value: "70％" }
  - { label: "旅行サイトの手数料", value: "12％" }
  - { label: "1部屋の平均の値段（客室単価）", value: "14,000 円" }
  - { label: "自分のサイトのカード払いなどの手数料", value: "3％" }
question: あなたならどうしますか？
options:
  - id: a
    label: 旅行サイトをすぐにやめる
    detail: 全部を自分のサイトに切りかえる
  - id: b
    label: 2 回目からのお客様を、自分のサイトに案内する
    detail: はじめての人は旅行サイト、常連さんは直接予約
  - id: c
    label: いまのまま
    detail: お客様集めは旅行サイトに任せる
perspectives:
  - field: marketing
    heading: 入口と、2 回目からの道
    body: |
      旅行サイトは、遠くのお客様に見つけてもらう入口です。やめると、はじめてのお客様が大きく減るおそれがあります。
      チェックアウトのときに「次は自分たちのサイトから予約すると特典があります」と伝えます。こうして、2 回目からの予約を直接予約に移します。
  - field: it-dx
    heading: 誰が 2 回目かを見えるようにする
    body: |
      同じお客様を1人として数えられないと、リピート率も、直接予約に移った効果も測れません。予約のデータに、お客様を見分けるための情報を残しましょう。
checks:
  - id: case-marketing-01/q-shift
    prompt: 旅行サイトからの 16,100 泊のうち、3,000 泊を自分のサイトに移しました。1泊 14,000 円で、手数料は 12％ と 3％ の差です。営業利益はいくら増えますか。
    choices:
      - { id: a, label: "504 万円" }
      - { id: b, label: "126 万円" }
      - { id: c, label: "378 万円" }
      - { id: d, label: "4,200 万円" }
    answer: c
    explanation: 1泊あたりの差は 14,000 × (12％ − 3％) ＝ 1,260 円です。1,260 円 × 3,000 泊 ＝ 378 万円です。
modelAnswer: |
  お手本は b です。旅行サイトは入口として残して、2 回目からを自分のサイトに移します。3,000 泊を移すだけで、営業利益は1年で 378 万円増えます。

  a は、手数料は減ります。でも、はじめてのお客様が減って、売上そのものをなくすおそれがあります。c は、リピートのお客様の分まで手数料を払い続けることになります。リピート率を測れるようにデータを整えることが、手数料を減らす土台になります。
relatedThemes:
