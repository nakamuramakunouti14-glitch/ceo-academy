schemaVersion: 1
id: case-it-dx-01
kind: field
field: it-dx
order: 1
title: パスワードを書いた付箋が、フロントに貼ってある
company: みなと館ホテル（架空・80室、レストラン併設）
situation: |
  フロントのパソコンに、付箋が貼ってありました。予約システムの ID とパスワードが書いてあります。全員が同じ ID を使っていて、辞めた人も同じパスワードを知っています。
  予約システムには、お客様 2 万人分の名前と連絡先が入っています。
facts:
  - { label: "ID", value: "全員で 1 つ" }
  - { label: "パスワード", value: "付箋に書いてある" }
  - { label: "お客様の情報", value: "2 万人分" }
  - { label: "辞めた人", value: "パスワードを知っている" }
question: あなたならどうしますか？
options:
  - id: a
    label: 付箋をはがすだけにする
    detail: 見えなくすれば十分
  - id: b
    label: 1 人 1 つの ID にし、2 段階の確認を入れ、パスワードを変える
    detail: 辞めた人のアカウントはすぐ止める決まりを作る
  - id: c
    label: 予約システムをやめて紙に戻す
    detail: 紙なら盗まれない
perspectives:
  - field: it-dx
    heading: 基本の対策でほとんど防げる
    body: |
      全員で 1 つの ID だと、誰が何をしたかわかりません。辞めた人も入れてしまいます。
      次の対策で、多くの危険を防げます。1 人 1 つの ID、2 段階の確認（パスワードとスマホのコード）、見られる範囲をしぼること、辞めた人のアカウントを止めることです。
  - field: legal
    heading: 漏れたら報告が必要になる
    body: |
      不正アクセスで漏れたときや、1,000 人を超える人の情報が漏れたときは、報告が必要になる場合に当たります。個人情報保護委員会への報告と、本人へのお知らせ（通知）です。2 万人分の情報は、その対象になりえます。
checks:
  - id: case-it-dx-01/q-scope
    prompt: 2 万人分のお客様の情報が、不正アクセスで漏れたおそれがあります。個人情報保護法の報告が必要な場合に当たる理由で、正しいのはどれですか。
    choices:
      - { id: a, label: "当たらない。名前と連絡先だけだから" }
      - { id: b, label: "不正の目的によるおそれがあり、本人の数も 1,000 人を超えるから" }
      - { id: c, label: "当たらない。紙ではないから" }
      - { id: d, label: "ホテルだけが報告するきまりだから" }
    answer: b
    explanation: 施行規則の4つの場合のうち、「不正の目的によるおそれ」と「1,000 人超」の2つに当たります。
modelAnswer: |
  b がよい答えです。1 人 1 つの ID と 2 段階の確認を入れ、パスワードを変え、辞めた人のアカウントを止めます。どれも、大きなお金はかかりません。

  a は、見えなくなるだけです。全員が同じ ID を使い、辞めた人も入れる状態は残ります。c は、予約の管理が手間になります。紙の名簿をなくすという、別の危険もあります。2 万人分の情報が漏れれば、報告とおわびの手間、信用をなくす損は大きくなります。
