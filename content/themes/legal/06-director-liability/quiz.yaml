schemaVersion: 1
themeId: legal-06
questions:
  - id: legal-06/q-duty
    prompt: 会社と取締役の関係について、正しいのはどれですか。
    choices:
      - { id: a, label: "雇用のきまりに従い、取締役は残業代をもらう" }
      - { id: b, label: "取締役は、結果が悪ければいつでも必ず責任を負う" }
      - { id: c, label: "取締役は、株主総会の決議を守らなくてよい" }
      - { id: d, label: "委任のきまりに従い、取締役は善良な管理者の注意をもって仕事をする義務を負う" }
    answer: d
    explanation: 会社法第330条で、会社と役員の関係は委任のきまりに従います。民法第644条で、任された人は善良な管理者の注意をもって仕事をします（善管注意義務）。
    reviewSection: 要点
  - id: legal-06/q-company
    prompt: 取締役が任された務めを怠り、会社に損害が出ました。会社法第423条で、取締役は誰に責任を負いますか。
    choices:
      - { id: a, label: "国" }
      - { id: b, label: "会社" }
      - { id: c, label: "誰にも負わない" }
      - { id: d, label: "従業員一人ひとり" }
    answer: b
    explanation: 第423条第1項で、任務を怠った役員等は、それで会社に生じた損害を会社につぐなう責任を負います。
    reviewSection: 2つの責任
  - id: legal-06/q-third
    prompt: 会社法第429条第1項で、取締役が第三者（取引先など）に責任を負うのは、どんなときですか。
    choices:
      - { id: a, label: "少しでも不注意があったとき" }
      - { id: b, label: "会社が赤字になったとき" }
      - { id: c, label: "職務について悪意か重大な過失があり、第三者に損害が出たとき" }
      - { id: d, label: "取締役になったときから、いつでも" }
    answer: c
    explanation: 第429条第1項は、悪意か重大な過失があるときと決めています。会社への責任とは条件がちがいます。
    reviewSection: 2つの責任
  - id: legal-06/q-system
    prompt: 業務を正しく進めるための体制づくりについて、会社法第362条に合うのはどれですか。
    choices:
      - { id: a, label: "取締役会が決める。子会社を含むグループの体制も入る" }
      - { id: b, label: "現場の店長が決める" }
      - { id: c, label: "取締役1人に任せて決めてよい" }
      - { id: d, label: "親会社には関係がない" }
    answer: a
    explanation: 第362条第4項第6号で、この体制の整備は取締役会が決め、取締役に任せられません。子会社を含むグループの体制も入ります。
    reviewSection: 体制をつくるのも取締役会の仕事
  - id: legal-06/q-record
    prompt: 新しい店を出すと決めるときの備えとして、このテーマに合うのはどれですか。
    choices:
      - { id: a, label: "記録は残さず、口頭で決める" }
      - { id: b, label: "集めた情報・比べた案・外の意見・議事録を残す" }
      - { id: c, label: "反対意見は議事録から消す" }
      - { id: d, label: "うまくいったときだけ記録を作る" }
    answer: b
    explanation: コーポレートガバナンス・コードは、責任を負うかの判断で、一般に決めた時点の決め方の合理性が大事な考えどころの一つになると説明しています。筋道を残しておきましょう。
    reviewSection: 決めたときの筋道を残す
