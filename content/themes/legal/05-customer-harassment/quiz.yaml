schemaVersion: 1
themeId: legal-05
questions:
  - id: legal-05/q-three
    prompt: 職場のカスハラに当たるのは、どんなときですか。
    choices:
      - { id: a, label: "顧客等の言動で、ふつうに許される範囲を超え、従業員の働く環境が害される。この3つがすべてそろうとき" }
      - { id: b, label: "お客様が少しでも不満を言ったとき" }
      - { id: c, label: "従業員が嫌だと感じたときなら、いつでも" }
      - { id: d, label: "暴力があったときだけ" }
    answer: a
    explanation: カスハラは3つの要素がすべてそろうものです。不満の声がすべて当たるわけではありません。暴言や居座りなども、範囲を超えるやり方の例です。
    reviewSection: 要点
  - id: legal-05/q-date
    prompt: 改正労働施策総合推進法で、カスハラを防ぐ措置が会社の義務になったのはいつからですか。
    choices:
      - { id: a, label: "2023年12月13日から" }
      - { id: b, label: "2024年4月1日から" }
      - { id: c, label: "2026年1月1日から" }
      - { id: d, label: "2026年10月1日から" }
    answer: d
    explanation: 2026年10月1日からです。2023年12月13日は、改正旅館業法が施行された日です。
    reviewSection: 要点
  - id: legal-05/q-measure
    prompt: 厚生労働省のリーフレットが挙げる、会社がすることに当たるのはどれですか。
    choices:
      - { id: a, label: "カスハラを受けた従業員を配置換えして終わりにする" }
      - { id: b, label: "相談窓口を決めて従業員に伝え、相談した人を不利益に扱わないと決める" }
      - { id: c, label: "どんな要求にも、まず全部応じるよう指示する" }
      - { id: d, label: "対応はいつも1人の担当者に任せる" }
    answer: b
    explanation: 相談窓口を決めて伝えることや、相談した人を不利益に扱わないと決めることが挙げられています。できるだけ1人で対応させないことも、対処の例です。
    reviewSection: 会社がすること
  - id: legal-05/q-repeat
    prompt: 改正旅館業法で、ホテルが宿泊を断れる場合として加わったものに合うのはどれですか。
    choices:
      - { id: a, label: "一度でも値引きを頼まれたとき" }
      - { id: b, label: "口コミに悪い感想を書きそうなとき" }
      - { id: c, label: "負担がとても重く、ほかのお客様へのサービスをひどく妨げるおそれのある要求を繰り返したとき" }
      - { id: d, label: "障害について事前に知らせてくれなかったとき" }
    answer: c
    explanation: 第5条第1項第3号は、要求を繰り返したときと決めています。どんな要求が当たるかは厚生労働省令で決まっています。障害を理由に断ることはできません。
    reviewSection: ホテルが宿泊を断れる場合
  - id: legal-05/q-not
    prompt: 指針の概要で、宿泊を断れる理由に「当たらない」とされている例はどれですか。
    choices:
      - { id: a, label: "障害のある人が、筆談などで障害による壁を取りのぞくよう求めること" }
      - { id: b, label: "長い時間にわたって、従業員に不当な要求をし続けること" }
      - { id: c, label: "暴言をまじえて、宿泊料の大きな値引きを何度も求めること" }
      - { id: d, label: "従業員に土下座を求めること" }
    answer: a
    explanation: 障害による壁を取りのぞくよう求めることは当たりません。宿泊を断ったときは、その理由などを記録します。
    reviewSection: ホテルが宿泊を断れる場合
