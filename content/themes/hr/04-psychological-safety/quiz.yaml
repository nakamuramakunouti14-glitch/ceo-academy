schemaVersion: 1
themeId: hr-04
questions:
  - id: hr-04/q-definition
    prompt: 心理的安全性の説明として、正しいものはどれですか。
    choices:
      - { id: a, label: "仕事の目標を低くして、だれも困らないようにすること" }
      - { id: b, label: "意見やミスを言っても責められないと、チームのみんなが思えている状態" }
      - { id: c, label: "給料が安定していて、辞めさせられる心配がないこと" }
      - { id: d, label: "上の人の言うことに、だれも反対しない状態" }
    answer: b
    explanation: 心理的安全性は「言っても大丈夫」と思えることです。目標を下げることでも、なれ合いでもありません。
    reviewSection: 要点
  - id: hr-04/q-researcher
    prompt: チームの心理的安全性を研究で広めた研究者と、その研究について正しいものはどれですか。
    choices:
      - { id: a, label: "カーネマンが、レストランの客を調べた" }
      - { id: b, label: "コッターが、銀行の支店を調べた" }
      - { id: c, label: "チャルディーニが、販売員の話し方を調べた" }
      - { id: d, label: "エドモンドソンが、工場のチームを調べた" }
    answer: d
    explanation: ハーバード・ビジネス・スクールのエドモンドソンが、1999 年の論文で、工場の 51 のチームを調べました。
    reviewSection: 要点
  - id: hr-04/q-report-count
    prompt: 小さなミスの報告が、ほかの館よりずっと少ない館があります。どう考えるのがよいですか。
    choices:
      - { id: a, label: "言えていないだけかもしれない。上の人の反応を確かめる" }
      - { id: b, label: "ミスがない、よい館なので、そのままでよい" }
      - { id: c, label: "報告が多い館の支配人を叱る" }
      - { id: d, label: "報告の決まりをなくす" }
    answer: a
    explanation: 報告が少ないのは、ミスをかくしているからかもしれません。かくれたミスは、やがて大きなクレームになります。
    reviewSection: ミスが上がる職場、かくれる職場
  - id: hr-04/q-first-reaction
    prompt: スタッフが「お客様の予約を入れまちがえました」と報告に来ました。上の人の最初の反応として、よいものはどれですか。
    choices:
      - { id: a, label: "ほかのスタッフの前で強く叱る" }
      - { id: b, label: "聞かなかったことにする" }
      - { id: c, label: "まず報告にお礼を言い、そのあとで一緒に直し方を考える" }
      - { id: d, label: "報告した人の評価を下げる" }
    answer: c
    explanation: 最初の反応で、次も言うかどうかが決まります。まずお礼を言い、直し方はそのあとで考えます。
    reviewSection: 言いやすさをつくる3つの行動
  - id: hr-04/q-not-lenient
    prompt: 心理的安全性のある職場について、正しいものはどれですか。
    choices:
      - { id: a, label: "何をしても注意しない" }
      - { id: b, label: "目標を下げて、ミスが起きないようにする" }
      - { id: c, label: "悪い知らせは社長に届けない" }
      - { id: d, label: "言ったことは責めないが、決まりを何度も破る人には、はっきり注意する" }
    answer: d
    explanation: 責めないのは「言ったこと」です。わざと手を抜くことや、決まりを何度も破ることまで許すわけではありません。
    reviewSection: 言いやすさをつくる3つの行動
