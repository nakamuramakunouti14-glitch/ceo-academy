schemaVersion: 1
themeId: tax-03
questions:
  - id: tax-03/q-define
    prompt: 節税と脱税のちがいで、正しいのはどれですか。
    choices:
      - { id: a, label: "節税は法律の仕組みを事実のとおりに使うこと、脱税は事実をかくしたりうそをついたりして税を払わずにすませること" }
      - { id: b, label: "金額が小さければ節税、大きければ脱税" }
      - { id: c, label: "税理士に頼めば何でも節税になる" }
      - { id: d, label: "どちらも同じ意味" }
    answer: a
    explanation: ちがいは金額ではなく、事実のとおりかどうかです。事実をかくしたり、うそをついたりすると、脱税になります。
    reviewSection: 要点
  - id: tax-03/q-example
    prompt: 脱税に当たるのはどれですか。
    choices:
      - { id: a, label: "青色申告の赤字（欠損金）を次の年の所得から差し引く" }
      - { id: b, label: "1人 10,000 円以下の会食を、記録を残して交際費から外す" }
      - { id: c, label: "現金の売上の一部をレジに通さず、帳簿から外す" }
      - { id: d, label: "必要な設備を買って減価償却する" }
    answer: c
    explanation: 売上をかくすのは、事実をいつわることなので、脱税です。ほかの3つは、法律の仕組みを事実のとおりに使っています。
    reviewSection: 線引きの例
  - id: tax-03/q-penalty
    prompt: 事実をかくして、法人税を 1,000 万円少なく申告していました（期限までに申告はしていました）。重加算税はいくらですか。
    choices:
      - { id: a, label: "100 万円" }
      - { id: b, label: "350 万円" }
      - { id: c, label: "400 万円" }
      - { id: d, label: "1,000 万円" }
    answer: b
    explanation: 申告はしていて、事実をかくした場合の重加算税は 35％ です。1,000 万円 × 35％ ＝ 350 万円です。申告していなかったときは 40％ です。
    reviewSection: 重加算税の重さ
  - id: tax-03/q-trap
    prompt: 税率がおよそ 3 割の会社が、税を減らすために、その年の費用にできる要らない消耗品を 100 万円買いました。手元の現金はどうなりますか。
    choices:
      - { id: a, label: "30 万円増える" }
      - { id: b, label: "変わらない" }
      - { id: c, label: "100 万円増える" }
      - { id: d, label: "およそ 70 万円減る" }
    answer: d
    explanation: 100 万円を払い、税がおよそ 30 万円減ります。差し引き、およそ 70 万円の現金が減ります。要らない支出は、節税になりません。
    reviewSection: 節税の落とし穴
  - id: tax-03/q-gray
    prompt: 法律の形は守っているけれど、税を減らすことだけが目的の不自然な取引について、このテーマの考え方に合うのはどれですか。
    choices:
      - { id: a, label: "形を守っていれば必ず認められる" }
      - { id: b, label: "税務署に認められないおそれがあるので、税理士に相談しないまま行わない" }
      - { id: c, label: "見つからなければ問題ない" }
      - { id: d, label: "どんどん行うべき" }
    answer: b
    explanation: 不自然な取引は、税務署に認められない（否認される）おそれがあります。必ず税理士に相談し、事業として必要な取引かを確かめましょう。
    reviewSection: 線引きの例
