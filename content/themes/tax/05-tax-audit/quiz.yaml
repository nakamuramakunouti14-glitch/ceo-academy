schemaVersion: 1
themeId: tax-05
questions:
  - id: tax-05/q-notice
    prompt: 実地の税務調査の前の連絡（事前通知）について、正しいのはどれですか。
    choices:
      - { id: a, label: "連絡は一度もなく、いつも突然来る" }
      - { id: b, label: "原則として前もって連絡があり、税理士がいれば税理士にも伝えられる" }
      - { id: c, label: "連絡は手紙だけで、日時は書かれない" }
      - { id: d, label: "会社が頼んだときだけ調査がある" }
    answer: b
    explanation: 国税通則法第74条の9で、実地の調査の前に、開始の日時・場所・目的・税目・期間などを通知します。税務代理人がいれば、その人も含みます。
    reviewSection: 要点
  - id: tax-05/q-content
    prompt: 事前通知で伝えられることに入っていないのはどれですか。
    choices:
      - { id: a, label: "調査を始める日時と場所" }
      - { id: b, label: "対象の税目と期間" }
      - { id: c, label: "最後に払う税の額" }
      - { id: d, label: "対象の帳簿や書類" }
    answer: c
    explanation: 事前通知では、日時・場所・目的・税目・期間・対象の帳簿などが伝えられます。税の額は、調査の結果で決まります。
    reviewSection: 前もって連絡されること
  - id: tax-05/q-skip
    prompt: 事前通知なしで調査が行われることがあるのは、どんなときですか。
    choices:
      - { id: a, label: "正しい税の額をつかみにくくなるおそれなど、調査に支障が出るおそれがあると判断されたとき" }
      - { id: b, label: "会社の社長が忙しいとき" }
      - { id: c, label: "会社が黒字のとき" }
      - { id: d, label: "税理士がいないとき" }
    answer: a
    explanation: 第74条の10で、申告の内容や過去の調査などから、違法・不当な行為をしやすくするおそれや、正しい額をつかみにくくするおそれなどがあると認めるときは、事前通知を要しないとしています。
    reviewSection: 要点
  - id: tax-05/q-revise
    prompt: 調査の結果、修正申告をすすめられました。修正申告をしたときの扱いで、正しいのはどれですか。
    choices:
      - { id: a, label: "不服申立ても更正の請求も、どちらもできる" }
      - { id: b, label: "どちらもできない" }
      - { id: c, label: "不服申立てはできるが、更正の請求はできない" }
      - { id: d, label: "不服申立てはできないが、更正の請求はできる" }
    answer: d
    explanation: 第74条の11第3項で、修正申告をすすめるときは、不服申立てはできないが更正の請求はできることを説明し、その書面を渡します。
    reviewSection: 調査が終わるとき
  - id: tax-05/q-none
    prompt: 調査の結果、直すところがなかったとき、税務署はどうしますか。
    choices:
      - { id: a, label: "何も連絡しない" }
      - { id: b, label: "その時点で直すところがない旨を、書面で通知する" }
      - { id: c, label: "必ず翌年にもう一度調査に来る" }
      - { id: d, label: "修正申告をすすめる" }
    answer: b
    explanation: 第74条の11第1項で、書面で通知します。通知のあとでも、新しく得た情報から誤りがあると認められれば、もう一度調べられることがあります。
    reviewSection: 調査が終わるとき
