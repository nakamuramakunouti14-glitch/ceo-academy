schemaVersion: 1
themeId: tax-04
questions:
  - id: tax-04/q-relation
    prompt: グループ通算制度の前提になる「完全支配関係」とは、どんな関係ですか。
    choices:
      - { id: a, label: "株の半分以上を持つ関係" }
      - { id: b, label: "1つの者が、会社の発行済株式などの全部を直接か間接に持つ関係" }
      - { id: c, label: "同じ社長がいる関係" }
      - { id: d, label: "取引が多い関係" }
    answer: b
    explanation: 法人税法第2条第12号の7の6で、発行済株式などの全部を直接か間接に持つ関係（くわしくは政令）と決めています。
    reviewSection: 要点
  - id: tax-04/q-approval
    prompt: グループ通算制度を使うときの決まりで、正しいのはどれですか。
    choices:
      - { id: a, label: "入れたい子会社だけを選んで入れられる" }
      - { id: b, label: "届け出るだけで、承認は要らない" }
      - { id: c, label: "国税庁長官の承認を、親会社と、完全支配関係にある国内の子会社の全部で受ける" }
      - { id: d, label: "親会社だけが申告すればよい" }
    answer: c
    explanation: 第64条の9で、親会社と完全支配関係にある国内の子会社の全部が、国税庁長官の承認を受けます。子会社も、それぞれ申告します。
    reviewSection: 要点
  - id: tax-04/q-calc
    prompt: 親会社の所得が 3,000 万円、100％子会社の欠損が 1,000 万円です。通算したあと、親会社の所得はいくらですか（ほかの会社はないものとします）。
    choices:
      - { id: a, label: "2,000 万円" }
      - { id: b, label: "3,000 万円" }
      - { id: c, label: "4,000 万円" }
      - { id: d, label: "1,000 万円" }
    answer: a
    explanation: 親会社は子会社の欠損 1,000 万円を損金に入れて、所得 2,000 万円になります。子会社は欠損と同じ額を益金に入れて、所得 0 円になります。
    reviewSection: 黒字と赤字を合わせる
  - id: tax-04/q-etax
    prompt: 通算法人の申告のしかたについて、正しいのはどれですか。
    choices:
      - { id: a, label: "資本金が大きい会社だけ電子申告をする" }
      - { id: b, label: "紙で出しても特に問題はない" }
      - { id: c, label: "申告はしなくてよい" }
      - { id: d, label: "資本金の大きさにかかわらず、法人税と地方法人税を電子申告（e-Tax）でする" }
    answer: d
    explanation: 通算法人は資本金にかかわらず電子申告が必要です。期限までに電子申告をせず紙で出すと、無申告加算税がかかる対象になります。
    reviewSection: 入れない会社と、守ること
  - id: tax-04/q-out
    prompt: グループ通算に入れない会社の例として、このテーマが挙げているのはどれですか。
    choices:
      - { id: a, label: "資本金が1億円以下の会社" }
      - { id: b, label: "飲食業の会社" }
      - { id: c, label: "青色申告の承認を取り消されてから5年がたっていない会社" }
      - { id: d, label: "設立1年目の会社" }
    answer: c
    explanation: 第64条の9で、青色申告の承認の取り消しから5年がたっていない会社、清算中の会社などは入れないと決めています。
    reviewSection: 入れない会社と、守ること
