schemaVersion: 1
themeId: marketing-02
questions:
  - id: marketing-02/q-floor
    prompt: 3つの決め方のうち、「これより下げると損をする」下限を表すのはどれですか。
    choices:
      - { id: a, label: "お客様が感じる価値" }
      - { id: b, label: "ライバルの価格" }
      - { id: c, label: "広告の効果" }
      - { id: d, label: "原価" }
    answer: d
    explanation: 原価は、価格の下限です。お客様が払ってもいいと思う額は、上限です。その間で、ライバルと自分の店の立ち位置を見て、価格を決めます。
    reviewSection: 要点
  - id: marketing-02/q-cost-plus
    prompt: 食材の原価が 330 円の定食を、原価率 30％ になるように値段をつけると、いくらですか。
    choices:
      - { id: a, label: "1,100 円" }
      - { id: b, label: "990 円" }
      - { id: c, label: "430 円" }
      - { id: d, label: "1,320 円" }
    answer: a
    explanation: 価格 ＝ 原価 ÷ 原価率 ＝ 330 ÷ 0.3 ＝ 1,100 円です。原価率は「原価 ÷ 価格」なので、式を逆にすると価格が出ます。
    reviewSection: 3つの決め方
  - id: marketing-02/q-raise
    prompt: 定食を 980 円から 1,180 円に上げたら、客数が1日 120 人から 110 人に減りました。1人 330 円の食材費を引いた額は、1か月（30日）でどうなりますか。
    choices:
      - { id: a, label: "36.6 万円減る" }
      - { id: b, label: "変わらない" }
      - { id: c, label: "46.5 万円増える" }
      - { id: d, label: "9.9 万円増える" }
    answer: c
    explanation: 値上げ前は (980 − 330) × 120 × 30 ＝ 234.0 万円です。値上げ後は (1,180 − 330) × 110 × 30 ＝ 280.5 万円です。差は 46.5 万円の増加です。
    reviewSection: 値上げは利益にどう効くか
  - id: marketing-02/q-why-profit
    prompt: 値上げの効果が、ほぼそのまま利益の増加になりやすいのはなぜですか。
    choices:
      - { id: a, label: "値上げすると税金がかからないから" }
      - { id: b, label: "人件費や家賃などの固定費は、客数が少し減っても変わらないから" }
      - { id: c, label: "値上げすると客数が必ず増えるから" }
      - { id: d, label: "食材費が値上げ分だけ下がるから" }
    answer: b
    explanation: 固定費は、客数に関係なくかかります。値上げで増えた「売上 − 変動費」は、固定費が増えないので、ほぼそのまま利益になります。
    reviewSection: 値上げは利益にどう効くか
  - id: marketing-02/q-revenue-management
    prompt: ホテルが、泊まりたい人が多い日は高く、少ない日は安く値段を変えます。その理由として、いちばん正しいものはどれですか。
    choices:
      - { id: a, label: "毎日同じ値段だと法律に違反するから" }
      - { id: b, label: "お客様をまよわせるため" }
      - { id: c, label: "人件費を減らすため" }
      - { id: d, label: "空き部屋は次の日に売れないので、日ごとに売上をいちばん大きくするため" }
    answer: d
    explanation: 今日の空き部屋は、明日には売れません。日ごとの泊まりたい人の数に合わせて値段を変え、稼働率と1部屋の値段を掛けた RevPAR をいちばん大きくします。これをレベニューマネジメントと呼びます。
    reviewSection: 日によって値段を変える
