schemaVersion: 1
themeId: finance-03
questions:
  - id: finance-03/q-dilution
    prompt: 新しく株式を出して出資を受けました。元の株主に起こることはどれですか。
    choices:
      - { id: a, label: "持株比率が下がる" }
      - { id: b, label: "持株比率が上がる" }
      - { id: c, label: "持っている株数が減る" }
      - { id: d, label: "配当が必ず増える" }
    answer: a
    explanation: 元の株主の株数は変わりません。でも全体の株数が増えるので、元の株主の割合（持株比率）が下がります。これを希薄化といいます。
    reviewSection: 要点
  - id: finance-03/q-ratio
    prompt: 社長が 1,000 株を持つ会社が、投資家に新しく 250 株を出しました。社長の持株比率は何％ですか。
    choices:
      - { id: a, label: "75％" }
      - { id: b, label: "100％" }
      - { id: c, label: "80％" }
      - { id: d, label: "25％" }
    answer: c
    explanation: 社長の 1,000 株 ÷ 全体の 1,250 株 ＝ 80％ です。75％ は、100％ から 250 ÷ 1,000（25％）を引いた、まちがった計算です。
    reviewSection: 出資を受けると持株比率はどう変わるか
  - id: finance-03/q-threshold
    prompt: 定款の変更や合併などの重い議案を1人で決めるには、一般にどれだけの議決権が要りますか。
    choices:
      - { id: a, label: "3分の1 超" }
      - { id: b, label: "過半数" }
      - { id: c, label: "10％" }
      - { id: d, label: "3分の2 以上" }
    answer: d
    explanation: 重い議案は、出席した株主の議決権の 3分の2 以上で決めます。過半数はふつうの議案を決められる割合です。3分の1 超は、重い議案を止められる割合です。
    reviewSection: 要点
  - id: finance-03/q-price
    prompt: 1 億円を集めます。1株 40 万円で出す場合と、20 万円で出す場合のちがいはどれですか。
    choices:
      - { id: a, label: "どちらも渡す株数は同じ" }
      - { id: b, label: "40 万円のほうが渡す株数が少なく、持ち分を守れる" }
      - { id: c, label: "20 万円のほうが渡す株数が少ない" }
      - { id: d, label: "20 万円のほうが多くのお金が集まる" }
    answer: b
    explanation: 1 億円 ÷ 40 万円 ＝ 250 株、1 億円 ÷ 20 万円 ＝ 500 株です。1株の値段が高いほど、同じ額を集めるのに渡す株式が少なくて済みます。
    reviewSection: 1株の値段が大事な理由
  - id: finance-03/q-careful
    prompt: 資本政策を慎重に決めるべき理由として、いちばん当てはまるものはどれですか。
    choices:
      - { id: a, label: "株式は毎年出し直すから" }
      - { id: b, label: "出資は返済が必要だから" }
      - { id: c, label: "一度渡した株式はかんたんには戻らず、決められることが変わるから" }
      - { id: d, label: "株式を出すと売上が減るから" }
    answer: c
    explanation: 株式を渡すと、株主総会での発言の力も渡すことになります。あとから買い戻すのは難しいので、先のことまで考えて決めましょう。
    reviewSection: 要点
