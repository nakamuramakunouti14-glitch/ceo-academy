schemaVersion: 1
themeId: finance-02
questions:
  - id: finance-02/q-formula
    prompt: 運転資金の計算として、正しいものはどれですか。
    choices:
      - { id: a, label: "売上高 − 費用" }
      - { id: b, label: "現金 ＋ 借入金" }
      - { id: c, label: "買掛金 − 売掛金" }
      - { id: d, label: "売掛金 ＋ 在庫 − 買掛金" }
    answer: d
    explanation: 運転資金は、入金を待っているお金（売掛金）と在庫を足し、支払いを待ってもらっているお金（買掛金）を引いたものです。
    reviewSection: 要点
  - id: finance-02/q-calc
    prompt: 売掛金 4,000 万円、在庫 600 万円、買掛金 2,500 万円の会社です。運転資金はいくらですか。
    choices:
      - { id: a, label: "2,100 万円" }
      - { id: b, label: "7,100 万円" }
      - { id: c, label: "1,500 万円" }
      - { id: d, label: "900 万円" }
    answer: a
    explanation: 4,000 ＋ 600 − 2,500 ＝ 2,100 万円です。
    reviewSection: 運転資金を計算する
  - id: finance-02/q-growth
    prompt: 売上が伸びているのに、現金が減っていきます。いちばん当てはまる理由はどれですか。
    choices:
      - { id: a, label: "売上が伸びると減価償却費が増えるから" }
      - { id: b, label: "売上が伸びると税金がかからなくなるから" }
      - { id: c, label: "入金を待つ売掛金や在庫が増え、運転資金が増えるから" }
      - { id: d, label: "売上が伸びると借入金が減るから" }
    answer: c
    explanation: 売上が伸びると、まだ入金されていない売掛金や、在庫も増えます。その分の現金を先に立てかえることになり、手元の現金が減ります。
    reviewSection: 運転資金を計算する
  - id: finance-02/q-table
    prompt: 月初の残高 8,300 万円、入金 4,500 万円、出金 6,100 万円の月です。月末の残高はいくらですか。
    choices:
      - { id: a, label: "9,900 万円" }
      - { id: b, label: "6,700 万円" }
      - { id: c, label: "1,600 万円" }
      - { id: d, label: "18,900 万円" }
    answer: b
    explanation: 月末の残高 ＝ 月初の残高 ＋ 入金 − 出金 ＝ 8,300 ＋ 4,500 − 6,100 ＝ 6,700 万円です。
    reviewSection: 資金繰り表を作る
  - id: finance-02/q-purpose
    prompt: 資金繰り表を作る、いちばんの目的はどれですか。
    choices:
      - { id: a, label: "税金を少なくするため" }
      - { id: b, label: "利益を大きく見せるため" }
      - { id: c, label: "株主に配当を払うため" }
      - { id: d, label: "現金が足りなくなる月を前もって知り、先に手を打つため" }
    answer: d
    explanation: 資金繰り表は、これから先の現金の動きを、月ごとに見通す表です。足りない月を前もって知れば、借入や支払いの調整が間に合います。
    reviewSection: 要点
