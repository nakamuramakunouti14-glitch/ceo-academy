schemaVersion: 1
themeId: finance-07
questions:
  - id: finance-07/q-order
    prompt: ペッキングオーダー理論で、会社がお金を集める順番として正しいものはどれですか。
    choices:
      - { id: a, label: "出資 → 借入 → 手元のお金" }
      - { id: b, label: "借入 → 出資 → 手元のお金" }
      - { id: c, label: "手元のお金 → 借入 → 出資" }
      - { id: d, label: "手元のお金 → 出資 → 借入" }
    answer: c
    explanation: まず手元のお金（ためてきた利益）、足りなければ借入、出資は最後です。
    reviewSection: 要点
  - id: finance-07/q-reason
    prompt: ペッキングオーダー理論で、出資が最後になる理由はどれですか。
    choices:
      - { id: a, label: "出資は法律で禁止されているから" }
      - { id: b, label: "出資には利息がかかるから" }
      - { id: c, label: "出資のほうが手続きが早いから" }
      - { id: d, label: "経営者のほうが会社をよく知っているので、株を出すと「株が高すぎる合図」と思われやすいから" }
    answer: d
    explanation: 経営者と投資家の間に情報の差があります。新しく株を出すと、投資家は「今の株は高すぎるのでは」と疑い、株の値段が下がりやすくなります。
    reviewSection: 順番が生まれる理由（ペッキングオーダー理論）
  - id: finance-07/q-tradeoff
    prompt: トレードオフ理論で、くらべる「得」と「損」の組み合わせはどれですか。
    choices:
      - { id: a, label: "利息で税金が減る得と、返せなくなりそうなときの費用の損" }
      - { id: b, label: "売上が増える得と、原価が増える損" }
      - { id: c, label: "株主が増える得と、配当が減る損" }
      - { id: d, label: "人が増える得と、人件費が増える損" }
    answer: a
    explanation: 借入には、利息で税金が減る得があります。でも借りすぎると、返せなくなりそうなときの費用が大きくなります。つり合うところが、ちょうどよい借入の量です。
    reviewSection: ちょうどよい借入の量（トレードオフ理論）
  - id: finance-07/q-who
    prompt: ペッキングオーダー理論の論文を書いた2人と、その年の組み合わせはどれですか。
    choices:
      - { id: a, label: "クラウスとリッツェンバーガー、1958年" }
      - { id: b, label: "マイヤーズとマジュフ、1984年" }
      - { id: c, label: "キャプランとノートン、1984年" }
      - { id: d, label: "モディリアーニとミラー、1973年" }
    answer: b
    explanation: スチュワート・マイヤーズとニコラス・マジュフが、1984年に Journal of Financial Economics で論文を出しました。クラウスとリッツェンバーガーは、1973年のトレードオフ理論のもとになった論文です。
    reviewSection: 順番が生まれる理由（ペッキングオーダー理論）
  - id: finance-07/q-hotel
    prompt: ホテルが借入をするときに、トレードオフ理論から気をつけることはどれですか。
    choices:
      - { id: a, label: "ホテルは担保がないので、借入はできない" }
      - { id: b, label: "借入はいくらしても損はない" }
      - { id: c, label: "借りやすくても、需要が急に落ちたときに返せるかを考えて借りすぎない" }
      - { id: d, label: "出資は必ず最初に受ける" }
    answer: c
    explanation: ホテルは土地や建物を担保にできるので借りやすいです。でも、景気や感染症で需要が落ちることがあります。返せなくなる損まで考えて、借入の量を決めます。
    reviewSection: ちょうどよい借入の量（トレードオフ理論）
