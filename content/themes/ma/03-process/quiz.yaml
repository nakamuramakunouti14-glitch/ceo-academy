schemaVersion: 1
themeId: ma-03
questions:
  - id: ma-03/q-order
    prompt: M&A の進め方の順番として、正しいものはどれですか。
    choices:
      - { id: a, label: "最後の契約 → 詳しく調べる → 相手を探す" }
      - { id: b, label: "相手を探す → 基本の合意 → 詳しく調べる → 最後の契約 → まとめる" }
      - { id: c, label: "まとめる → 相手を探す → 契約" }
      - { id: d, label: "詳しく調べずに契約する" }
    answer: b
    explanation: 基本の合意のあとに、詳しく調べます。見つかった問題を最後の契約に入れます。そして買ったあとに、1つにまとめていきます。
    reviewSection: 要点
  - id: ma-03/q-dd
    prompt: デューデリジェンスの、おもな目的はどれですか。
    choices:
      - { id: a, label: "相手の会社の広告を作ること" }
      - { id: b, label: "値段を必ず上げること" }
      - { id: c, label: "帳簿に出ない問題を見つけること" }
      - { id: d, label: "従業員を減らすこと" }
    answer: c
    explanation: 帳簿だけではわからない問題を見つけます。たとえば、払われていない残業代、不利な契約、かくれた借金、設備の不具合です。
    reviewSection: 詳しく調べる（デューデリジェンス）
  - id: ma-03/q-overtime
    prompt: 20 人に月 10 時間ずつの残業代が、2 年分払われていません。時給にすると 1,500 円、割増は 25％ です。合計はいくらですか。
    choices:
      - { id: a, label: "720 万円" }
      - { id: b, label: "450 万円" }
      - { id: c, label: "37.5 万円" }
      - { id: d, label: "900 万円" }
    answer: d
    explanation: 1 時間あたり 1,500 × 1.25 ＝ 1,875 円です。20 人 × 10 時間 × 24 か月 × 1,875 円 ＝ 900 万円です。720 万円は、割増を付け忘れた額です。
    reviewSection: 詳しく調べる（デューデリジェンス）
  - id: ma-03/q-fail
    prompt: M&A の失敗が多く起きるのは、どの段階だと、このテーマは言っていますか。
    choices:
      - { id: a, label: "買ったあとに1つにまとめる段階" }
      - { id: b, label: "相手を探す段階" }
      - { id: c, label: "書類を印刷する段階" }
      - { id: d, label: "銀行に振り込む段階" }
    answer: a
    explanation: 人が辞める、やり方がぶつかる、お客様が離れる。こうして、まとめる段階でつまずくことが多いのです。
    reviewSection: 要点
  - id: ma-03/q-pmi
    prompt: 買ったあとに、よい人から辞めていくのを防ぎたいです。まずすることはどれですか。
    choices:
      - { id: a, label: "何も伝えずに様子を見る" }
      - { id: b, label: "給料や働き方がどうなるかを、早く伝える" }
      - { id: c, label: "すぐに全部のやり方を変える" }
      - { id: d, label: "社名を何度も変える" }
    answer: b
    explanation: わからない状態が続くと、ほかでも働けるよい人から辞めていきます。何が変わり、何が変わらないかを、早く伝えましょう。
    reviewSection: 買った後の統合（PMI）
