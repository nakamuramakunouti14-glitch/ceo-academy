\"},{\"id\":\"b\",\"label\":\"アンカリング\"},{\"id\":\"c\",\"label\":\"計画の楽観\"},{\"id\":\"d\",\"label\":\"思い出しやすさ\"}],\"answer\":\"b\",\"explanation\":\"アンカリングは、最初に見た数字に引っぱられるくせです。アンカーは船のいかりのことです。\",\"reviewSection\":\"よくある5つのくせ\"},\"ownerTitle\":\"速い考えと遅い考え：直感のくせを知る\",\"ownerHref\":\"/themes/leadership-05\"},{\"question\":{\"id\":\"leadership-05/q-sunk\",\"prompt\":\"赤字の店を「内装にお金をかけたから」と続けています。どう考えるのがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"使ったお金はもう戻らないので、これからの得と損だけで決める\"},{\"id\":\"b\",\"label\":\"かけたお金を取り返すまで、必ず続ける\"},{\"id\":\"c\",\"label\":\"もっとお金をかけて内装を直す\"},{\"id\":\"d\",\"label\":\"直感で決める\"}],\"answer\":\"a\",\"explanation\":\"もう戻らないお金にしばられると、やめるべきことをやめられません。これからの得と損だけで決めます。\",\"reviewSection\":\"よくある5つのくせ\"},\"ownerTitle\":\"速い考えと遅い考え：直感のくせを知る\",\"ownerHref\":\"/themes/leadership-05\"},{\"question\":{\"id\":\"leadership-05/q-mechanism\",\"prompt\":\"直感のくせをふせぐ方法として、このテーマがすすめているものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"「気をつけよう」と強く思う\"},{\"id\":\"b\",\"label\":\"決定をできるだけ速くする\"},{\"id\":\"c\",\"label\":\"似た例の実際の数字を見る、反対の役を決める、一晩おく\"},{\"id\":\"d\",\"label\":\"経験の長い人の直感にまかせる\"}],\"answer\":\"c\",\"explanation\":\"思うだけでは、くせはなくなりません。決め方に、システム2 を呼ぶしくみを入れます。\",\"reviewSection\":\"システム2 を呼ぶしくみ\"},\"ownerTitle\":\"速い考えと遅い考え：直感のくせを知る\",\"ownerHref\":\"/themes/leadership-05\"},{\"question\":{\"id\":\"leadership-05/q-caution\",\"prompt\":\"『ファスト＆スロー』について、このテーマが注意していることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"本の研究の一部は、あとで同じ結果が出ないと言われた\"},{\"id\":\"b\",\"label\":\"日本では売られていない\"},{\"id\":\"c\",\"label\":\"直感は、いつもまちがっている\"},{\"id\":\"d\",\"label\":\"システム1 は使ってはいけない\"}],\"answer\":\"a\",\"explanation\":\"一部の研究は、同じ結果が出ないと言われ、カーネマンも認めました。直感はずれることがある、と知って、しくみでふせぎます。\",\"reviewSection\":\"気をつけること\"},\"ownerTitle\":\"速い考えと遅い考え：直感のくせを知る\",\"ownerHref\":\"/themes/leadership-05\"},{\"question\":{\"id\":\"leadership-02/q-three\",\"prompt\":\"任せるときに渡す3つのものとして、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"目的・範囲・確かめ方\"},{\"id\":\"b\",\"label\":\"給料・賞与・役職\"},{\"id\":\"c\",\"label\":\"名刺・机・パソコン\"},{\"id\":\"d\",\"label\":\"期限・罰・ほうび\"}],\"answer\":\"a\",\"explanation\":\"何のためか（目的）、どこまで決めてよいか（範囲）、いつ何で結果を見るか（確かめ方）。この3つを渡して、はじめて任せたことになります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"任せ方：決めてよい範囲を先に渡す\",\"ownerHref\":\"/themes/leadership-02\"},{\"question\":{\"id\":\"leadership-02/q-specific\",\"prompt\":\"範囲の決め方として、いちばんよいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"常識の範囲で決めてよい\"},{\"id\":\"b\",\"label\":\"全部社長に確認する\"},{\"id\":\"c\",\"label\":\"好きに決めてよい\"},{\"id\":\"d\",\"label\":\"返金は 1件 3 万円まで、修理は 1件 30 万円まで自分で決めてよい\"}],\"answer\":\"d\",\"explanation\":\"金額や条件ではっきり決めると、人によって受け取り方がぶれません。任された人が、迷わずに決められます。\",\"reviewSection\":\"範囲を具体的に決める\"},\"ownerTitle\":\"任せ方：決めてよい範囲を先に渡す\",\"ownerHref\":\"/themes/leadership-02\"},{\"question\":{\"id\":\"leadership-02/q-over\",\"prompt\":\"細かい指示を出し続けると、起こりやすいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"任された人がどんどん成長する\"},{\"id\":\"b\",\"label\":\"現場の判断が速くなる\"},{\"id\":\"c\",\"label\":\"任された人が自分で考えなくなり、確認待ちで現場が止まる\"},{\"id\":\"d\",\"label\":\"社長の時間が増える\"}],\"answer\":\"c\",\"explanation\":\"細かい指示が続くと、任された人は指示を待つようになります。判断が上に集まり、現場の動きがおそくなります。\",\"reviewSection\":\"任せた後の関わり方\"},\"ownerTitle\":\"任せ方：決めてよい範囲を先に渡す\",\"ownerHref\":\"/themes/leadership-02\"},{\"question\":{\"id\":\"leadership-02/q-trigger\",\"prompt\":\"任せたあと、上司が口を出すのは、どんなときがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎日、すべての判断に\"},{\"id\":\"b\",\"label\":\"数字が決めた幅から外れたとき\"},{\"id\":\"c\",\"label\":\"気が向いたとき\"},{\"id\":\"d\",\"label\":\"一度も口を出さない\"}],\"answer\":\"b\",\"explanation\":\"口を出す条件を先に決めておきます。すると任された人は安心して決められます。上司も、必要なときにきちんと関われます。\",\"reviewSection\":\"任せた後の関わり方\"},\"ownerTitle\":\"任せ方：決めてよい範囲を先に渡す\",\"ownerHref\":\"/themes/leadership-02\"},{\"question\":{\"id\":\"leadership-02/q-signal\",\"prompt\":\"もっと広く任せる合図として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上が減ったとき\"},{\"id\":\"b\",\"label\":\"支配人が辞めたいと言ったとき\"},{\"id\":\"c\",\"label\":\"競合が値下げしたとき\"},{\"id\":\"d\",\"label\":\"小さな承認が経営者のところにたまっているとき\"}],\"answer\":\"d\",\"explanation\":\"経営者のところで小さな判断が止まっているなら、任せる範囲がせますぎます。できたことを確かめて、範囲を広げましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"任せ方：決めてよい範囲を先に渡す\",\"ownerHref\":\"/themes/leadership-02\"},{\"question\":{\"id\":\"leadership-04/q-idea\",\"prompt\":\"SL 理論の考え方として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"よいリーダーは、いつも同じ関わり方をする\"},{\"id\":\"b\",\"label\":\"相手の準備の度合いに合わせて、関わり方を変える\"},{\"id\":\"c\",\"label\":\"部下には、いつもすべてを任せる\"},{\"id\":\"d\",\"label\":\"部下には、いつも細かく指示する\"}],\"answer\":\"b\",\"explanation\":\"SL 理論では、相手が「できるか」「やる気や自信があるか」に合わせて、関わり方を変えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"SL 理論：相手に合わせて関わり方を変える\",\"ownerHref\":\"/themes/leadership-04\"},{\"question\":{\"id\":\"leadership-04/q-newcomer\",\"prompt\":\"初日の新人に、チェックインの仕事を教えます。合う関わり方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"S1 指示する\"},{\"id\":\"b\",\"label\":\"S3 一緒に決める\"},{\"id\":\"c\",\"label\":\"S4 任せる\"},{\"id\":\"d\",\"label\":\"何もしない\"}],\"answer\":\"a\",\"explanation\":\"できない・自信もない段階では、何を、どうするかを、細かく見せて伝えます。\",\"reviewSection\":\"4つの関わり方\"},\"ownerTitle\":\"SL 理論：相手に合わせて関わり方を変える\",\"ownerHref\":\"/themes/leadership-04\"},{\"question\":{\"id\":\"leadership-04/q-unsure\",\"prompt\":\"仕事はできるのに、自信がないスタッフがいます。合う関わり方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"S1 指示する\"},{\"id\":\"b\",\"label\":\"S2 説得する\"},{\"id\":\"c\",\"label\":\"S4 任せる\"},{\"id\":\"d\",\"label\":\"S3 一緒に決める\"}],\"answer\":\"d\",\"explanation\":\"できるが自信がない人には、話を聞き、一緒に考えます。自信がついたら、任せる段階へ進みます。\",\"reviewSection\":\"4つの関わり方\"},\"ownerTitle\":\"SL 理論：相手に合わせて関わり方を変える\",\"ownerHref\":\"/themes/leadership-04\"},{\"question\":{\"id\":\"leadership-04/q-mistake\",\"prompt\":\"ベテランのスタッフに、いつも手順を細かく言っています。起こりやすいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"仕事がとても速くなる\"},{\"id\":\"b\",\"label\":\"自信がつく\"},{\"id\":\"c\",\"label\":\"「信用されていない」と感じ、やる気が下がる\"},{\"id\":\"d\",\"label\":\"何も変わらない\"}],\"answer\":\"c\",\"explanation\":\"できる人に細かく言いすぎると、やる気が下がります。相手の段階に合った関わり方にしましょう。\",\"reviewSection\":\"よくある失敗\"},\"ownerTitle\":\"SL 理論：相手に合わせて関わり方を変える\",\"ownerHref\":\"/themes/leadership-04\"},{\"question\":{\"id\":\"leadership-04/q-same-person\",\"prompt\":\"同じ人への関わり方について、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"一度決めた段階は、ずっと変えない\"},{\"id\":\"b\",\"label\":\"仕事によって段階が違うことがあるので、仕事ごとに見る\"},{\"id\":\"c\",\"label\":\"年齢で段階を決める\"},{\"id\":\"d\",\"label\":\"入社した年で段階を決める\"}],\"answer\":\"b\",\"explanation\":\"チェックインは任せられても、宴会の見積もりは指示が要る、ということがあります。仕事ごとに見ましょう。\",\"reviewSection\":\"4つの関わり方\"},\"ownerTitle\":\"SL 理論：相手に合わせて関わり方を変える\",\"ownerHref\":\"/themes/leadership-04\"},{\"question\":{\"id\":\"leadership-03/q-order\",\"prompt\":\"変化を進める順番として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"なぜ変わるのか → 何がどう変わるのか → 最初の成果を早く見せる\"},{\"id\":\"b\",\"label\":\"最初の成果 → なぜ → 何を\"},{\"id\":\"c\",\"label\":\"命令する → 評価する → 処分する\"},{\"id\":\"d\",\"label\":\"全員が賛成するまで待つ → 始める\"}],\"answer\":\"a\",\"explanation\":\"理由がわかり、自分の仕事がどう変わるかがわかり、うまくいく証拠が見える。そうなると、人は動きやすくなります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"変化を進める：なぜ・何を・最初の成果\",\"ownerHref\":\"/themes/leadership-03\"},{\"question\":{\"id\":\"leadership-03/q-resist\",\"prompt\":\"人が変化に反対する理由として、このテーマが挙げていないのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"理由がわからない\"},{\"id\":\"b\",\"label\":\"自分の仕事がどうなるかわからない\"},{\"id\":\"c\",\"label\":\"変化を知らせる資料の色が気に入らない\"},{\"id\":\"d\",\"label\":\"うまくいくと思えない\"}],\"answer\":\"c\",\"explanation\":\"反対の多くは、理由・自分への影響・うまくいく見こみがわからないことから来ます。資料の見た目は、根っこの理由ではありません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"変化を進める：なぜ・何を・最初の成果\",\"ownerHref\":\"/themes/leadership-03\"},{\"question\":{\"id\":\"leadership-03/q-first-win\",\"prompt\":\"最初の成果を、小さな範囲で試して見せるのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"お金をまったく使わないため\"},{\"id\":\"b\",\"label\":\"うまくいきやすく、反対していた人の気持ちを変える材料になるため\"},{\"id\":\"c\",\"label\":\"失敗をかくすため\"},{\"id\":\"d\",\"label\":\"全社に一度に広げると法律に違反するため\"}],\"answer\":\"b\",\"explanation\":\"うまくいった事実は、言葉の説明より強いです。最初は、うまくいきやすい小さな範囲で試して、成果を見せましょう。\",\"reviewSection\":\"3つの段階\"},\"ownerTitle\":\"変化を進める：なぜ・何を・最初の成果\",\"ownerHref\":\"/themes/leadership-03\"},{\"question\":{\"id\":\"leadership-03/q-objection\",\"prompt\":\"「朝の人手が足りなくなる」という反対の意見に、どうこたえるのがいちばんよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"反対する人を外す\"},{\"id\":\"b\",\"label\":\"聞かなかったことにする\"},{\"id\":\"c\",\"label\":\"計画をやめる\"},{\"id\":\"d\",\"label\":\"多能工化や採用の計画を先に立て、反対の理由を計画に取り入れる\"}],\"answer\":\"d\",\"explanation\":\"反対の意見には、現場の大事な情報が入っています。その理由を計画に取り入れると、変化は速く進みます。\",\"reviewSection\":\"抵抗を味方に変える\"},\"ownerTitle\":\"変化を進める：なぜ・何を・最初の成果\",\"ownerHref\":\"/themes/leadership-03\"},{\"question\":{\"id\":\"leadership-03/q-sustain\",\"prompt\":\"変化を根づかせて、元に戻らないようにする方法として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"社長が毎日見張る\"},{\"id\":\"b\",\"label\":\"一度伝えたら二度と言わない\"},{\"id\":\"c\",\"label\":\"新しいやり方を評価の項目や手順書に入れる\"},{\"id\":\"d\",\"label\":\"変化を知らせる張り紙を増やす\"}],\"answer\":\"c\",\"explanation\":\"評価や手順書に入れると、新しいやり方が、毎日の仕事の「ふつう」になります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"変化を進める：なぜ・何を・最初の成果\",\"ownerHref\":\"/themes/leadership-03\"},{\"question\":{\"id\":\"leadership-06/q-first-step\",\"prompt\":\"コッターの8段階で、いちばん最初の段階はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"最初の成果を出す\"},{\"id\":\"b\",\"label\":\"危機感を高める\"},{\"id\":\"c\",\"label\":\"根づかせる\"},{\"id\":\"d\",\"label\":\"ビジョンを描く\"}],\"answer\":\"b\",\"explanation\":\"まず、変わらないと何が起きるかを事実で示し、危機感を高めます。\",\"reviewSection\":\"8つの段階\"},\"ownerTitle\":\"コッターの8段階：大きな変化を進める段取り\",\"ownerHref\":\"/themes/leadership-06\"},{\"question\":{\"id\":\"leadership-06/q-coalition\",\"prompt\":\"「推進チームをつくる」の例として、よいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"社長が1人で決めて進める\"},{\"id\":\"b\",\"label\":\"外の会社にすべて任せる\"},{\"id\":\"c\",\"label\":\"IT 担当だけで進める\"},{\"id\":\"d\",\"label\":\"支配人と、フロント・清掃のリーダー、IT 担当でチームを作る\"}],\"answer\":\"d\",\"explanation\":\"立場の違う人でチームを作ると、現場の事情もわかり、変化を引っぱる力が強くなります。\",\"reviewSection\":\"8つの段階\"},\"ownerTitle\":\"コッターの8段階：大きな変化を進める段取り\",\"ownerHref\":\"/themes/leadership-06\"},{\"question\":{\"id\":\"leadership-06/q-anchor\",\"prompt\":\"「根づかせる」の段階で、することはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"新しいやり方を、評価の項目や新人の研修に入れる\"},{\"id\":\"b\",\"label\":\"古い手順書をそのまま残す\"},{\"id\":\"c\",\"label\":\"推進チームを解散して、もう見ない\"},{\"id\":\"d\",\"label\":\"危機感を高める\"}],\"answer\":\"a\",\"explanation\":\"評価や研修に入れると、新しいやり方が、ふつうのやり方になります。\",\"reviewSection\":\"8つの段階\"},\"ownerTitle\":\"コッターの8段階：大きな変化を進める段取り\",\"ownerHref\":\"/themes/leadership-06\"},{\"question\":{\"id\":\"leadership-06/q-fail\",\"prompt\":\"変化がとちゅうで失敗しやすいのは、どんなときですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"最初に事実で危機感を示したとき\"},{\"id\":\"b\",\"label\":\"うまくいきやすい部署から始めたとき\"},{\"id\":\"c\",\"label\":\"成果が1つ出たところで、早く「終わった」と言ったとき\"},{\"id\":\"d\",\"label\":\"推進チームに現場のリーダーを入れたとき\"}],\"answer\":\"c\",\"explanation\":\"早く手を止めると、元のやり方に戻ります。危機感がうすいまま進むのも、失敗のもとです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"コッターの8段階：大きな変化を進める段取り\",\"ownerHref\":\"/themes/leadership-06\"},{\"question\":{\"id\":\"leadership-06/q-book\",\"prompt\":\"コッターの8段階の、もとになった本はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"『影響力の武器』\"},{\"id\":\"b\",\"label\":\"『ファスト＆スロー』\"},{\"id\":\"c\",\"label\":\"『恐れのない組織』\"},{\"id\":\"d\",\"label\":\"『Leading Change』（訳は『企業変革力』）\"}],\"answer\":\"d\",\"explanation\":\"コッターは 1996 年に『Leading Change』を出しました。訳は『企業変革力』（日経BP、2002 年）です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"コッターの8段階：大きな変化を進める段取り\",\"ownerHref\":\"/themes/leadership-06\"},{\"question\":{\"id\":\"legal-01/q-formation\",\"prompt\":\"民法の原則では、契約はいつ成り立ちますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"申込みに相手が承諾したとき（紙の契約書がなくてもよい）\"},{\"id\":\"b\",\"label\":\"契約書に両方が印鑑を押したときだけ\"},{\"id\":\"c\",\"label\":\"代金を全部払ったときだけ\"},{\"id\":\"d\",\"label\":\"役所に届け出たとき\"}],\"answer\":\"a\",\"explanation\":\"民法第522条で、契約は申込みと承諾で成り立ちます。法律に特別の決まりがある場合を除き、紙の契約書は要りません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"契約と契約書：口約束でも契約になる\",\"ownerHref\":\"/themes/legal-01\"},{\"question\":{\"id\":\"legal-01/q-purpose\",\"prompt\":\"契約書を作るおもな目的として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"契約を成り立たせるため\"},{\"id\":\"b\",\"label\":\"税金を安くするため\"},{\"id\":\"c\",\"label\":\"何を約束したかと、もめたときにどうするかを残すため\"},{\"id\":\"d\",\"label\":\"相手を信用していないと伝えるため\"}],\"answer\":\"c\",\"explanation\":\"契約は紙がなくても成り立ちます。契約書は、約束の中身と、問題が起きたときの決め方を残すためにあります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"契約と契約書：口約束でも契約になる\",\"ownerHref\":\"/themes/legal-01\"},{\"question\":{\"id\":\"legal-01/q-later\",\"prompt\":\"契約書の項目のうち、問題が起きてから効いてくるので、特にサインの前に読むべきものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"会社の住所\"},{\"id\":\"b\",\"label\":\"解約の条件と責任の上限\"},{\"id\":\"c\",\"label\":\"契約書の題名\"},{\"id\":\"d\",\"label\":\"担当者の名前\"}],\"answer\":\"b\",\"explanation\":\"解約や賠償の条件は、うまくいっている間は気になりません。でも、問題が起きたときの損と得を大きく変えます。\",\"reviewSection\":\"契約書で決めておくこと\"},\"ownerTitle\":\"契約と契約書：口約束でも契約になる\",\"ownerHref\":\"/themes/legal-01\"},{\"question\":{\"id\":\"legal-01/q-cancel\",\"prompt\":\"お客様（消費者）との契約で先に決めたキャンセル料について、消費者契約法はどう決めていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どんな額でも有効\"},{\"id\":\"b\",\"label\":\"キャンセル料は少しも取れない\"},{\"id\":\"c\",\"label\":\"料金の半額までなら必ず有効\"},{\"id\":\"d\",\"label\":\"同じ種類の契約の取り消しで、会社にふつう出る損（平均的な損害の額）を超える部分は無効\"}],\"answer\":\"d\",\"explanation\":\"消費者契約法第9条第1項第1号で、平均的な損害の額を超える部分は無効になります。日にちごとに段階を分け、理由を説明できる率にしておきましょう。\",\"reviewSection\":\"お客様とのキャンセル料\"},\"ownerTitle\":\"契約と契約書：口約束でも契約になる\",\"ownerHref\":\"/themes/legal-01\"},{\"question\":{\"id\":\"legal-01/q-long\",\"prompt\":\"店の 10 年の賃貸借契約を結ぶときの考え方で、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"長い契約は何年も費用をしばるので、解約の条件までよく確かめ、専門家にも見せる\"},{\"id\":\"b\",\"label\":\"家賃が安ければ、ほかの条件は読まなくてよい\"},{\"id\":\"c\",\"label\":\"口約束で十分\"},{\"id\":\"d\",\"label\":\"解約はいつでも自由にできるので気にしなくてよい\"}],\"answer\":\"a\",\"explanation\":\"長い契約は、将来の費用の約束です。やめるときは何日前に言うかや、違約金を確かめましょう。大きな契約は弁護士に見てもらいます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"契約と契約書：口約束でも契約になる\",\"ownerHref\":\"/themes/legal-01\"},{\"question\":{\"id\":\"legal-04/q-start\",\"prompt\":\"取適法（下請法を改正した法律）は、いつ施行されましたか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2024年4月1日\"},{\"id\":\"b\",\"label\":\"2026年1月1日\"},{\"id\":\"c\",\"label\":\"2026年10月1日\"},{\"id\":\"d\",\"label\":\"まだ施行されていない\"}],\"answer\":\"b\",\"explanation\":\"取適法は 2026年1月1日に施行されました。下請法を改正し、名前も変わりました。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"取適法：小さな取引先に仕事を頼むときのきまり\",\"ownerHref\":\"/themes/legal-04\"},{\"question\":{\"id\":\"legal-04/q-employees\",\"prompt\":\"役務提供委託（一部をのぞく）で、資本金の基準に当たらないとき、頼む側が対象になる従業員数の基準はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"いつも使う従業員が 50 人を超える\"},{\"id\":\"b\",\"label\":\"いつも使う従業員が 300 人を超える\"},{\"id\":\"c\",\"label\":\"いつも使う従業員が 100 人を超え、相手が 100 人以下か個人\"},{\"id\":\"d\",\"label\":\"従業員数は関係ない\"}],\"answer\":\"c\",\"explanation\":\"改正で従業員数の基準が加わりました。役務提供委託など（一部をのぞく）は 100 人、製造委託などは 300 人が境目です。\",\"reviewSection\":\"対象になるかどうか\"},\"ownerTitle\":\"取適法：小さな取引先に仕事を頼むときのきまり\",\"ownerHref\":\"/themes/legal-04\"},{\"question\":{\"id\":\"legal-04/q-pay\",\"prompt\":\"取適法で、支払期日はどう決めますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"受け取った日から 60 日以内で、できるだけ短くする\"},{\"id\":\"b\",\"label\":\"受け取った日から 90 日以内\"},{\"id\":\"c\",\"label\":\"決算日までに払えばよい\"},{\"id\":\"d\",\"label\":\"相手と合意すれば何日でもよい\"}],\"answer\":\"a\",\"explanation\":\"第3条で、受け取った日から数えて 60 日以内の、できるだけ短い期間で支払期日を決めます。決めなかったときは、受け取った日が支払期日とみなされます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"取適法：小さな取引先に仕事を頼むときのきまり\",\"ownerHref\":\"/themes/legal-04\"},{\"question\":{\"id\":\"legal-04/q-price\",\"prompt\":\"取引先から「材料費が上がったので値段を相談したい」と言われました。取適法で禁止されているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"相談の日を決めて話し合う\"},{\"id\":\"b\",\"label\":\"値上げの理由を聞き、自社の考えを説明する\"},{\"id\":\"c\",\"label\":\"話し合った結果、値段を少し上げる\"},{\"id\":\"d\",\"label\":\"話し合いに応じず、説明もしないで、今までの値段のまま決める\"}],\"answer\":\"d\",\"explanation\":\"改正で、相談を求められたのに話し合いに応じない、必要な説明をしないなどで、一方的に代金を決めることが禁止されました（第5条第2項第4号）。\",\"reviewSection\":\"してはいけないこと\"},\"ownerTitle\":\"取適法：小さな取引先に仕事を頼むときのきまり\",\"ownerHref\":\"/themes/legal-04\"},{\"question\":{\"id\":\"legal-04/q-bill\",\"prompt\":\"改正で、支払いのしかたについて新しく禁止されたのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"銀行振込で払う\"},{\"id\":\"b\",\"label\":\"現金で払う\"},{\"id\":\"c\",\"label\":\"手形で払う、振込手数料を相手に負担させる\"},{\"id\":\"d\",\"label\":\"支払期日より早く払う\"}],\"answer\":\"c\",\"explanation\":\"改正で、手形での支払いが禁止されました。期日までに満額を受け取りにくい電子の支払い手段や、振込手数料を相手に負担させることも禁止です。\",\"reviewSection\":\"してはいけないこと\"},\"ownerTitle\":\"取適法：小さな取引先に仕事を頼むときのきまり\",\"ownerHref\":\"/themes/legal-04\"},{\"question\":{\"id\":\"legal-02/q-legal-hours\",\"prompt\":\"労働基準法で決まった働く時間（法定労働時間、休憩を除く）はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1日10時間・1週50時間\"},{\"id\":\"b\",\"label\":\"1日7時間・1週35時間\"},{\"id\":\"c\",\"label\":\"1日8時間・1週40時間\"},{\"id\":\"d\",\"label\":\"決まりはない\"}],\"answer\":\"c\",\"explanation\":\"労働基準法第32条で、法定労働時間は1日8時間・1週40時間です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"働く時間と残業代：上限と上乗せのきまり\",\"ownerHref\":\"/themes/legal-02\"},{\"question\":{\"id\":\"legal-02/q-36\",\"prompt\":\"法律で決まった時間を超えて残業してもらうために、要るものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"本人が口で「いいよ」と言うことだけ\"},{\"id\":\"b\",\"label\":\"従業員の代表と36協定を結び、届け出ること\"},{\"id\":\"c\",\"label\":\"社長の許可だけ\"},{\"id\":\"d\",\"label\":\"何も要らない\"}],\"answer\":\"b\",\"explanation\":\"時間外や休日に働いてもらうには、労働基準法第36条の協定（36協定）を結んで届け出る必要があります。協定があっても上限があります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"働く時間と残業代：上限と上乗せのきまり\",\"ownerHref\":\"/themes/legal-02\"},{\"question\":{\"id\":\"legal-02/q-limit\",\"prompt\":\"36協定のふつう（原則）の上限はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"月 100 時間・年 1,200 時間\"},{\"id\":\"b\",\"label\":\"月 80 時間・年 720 時間\"},{\"id\":\"c\",\"label\":\"上限はない\"},{\"id\":\"d\",\"label\":\"月 45 時間・年 360 時間\"}],\"answer\":\"d\",\"explanation\":\"原則は月 45 時間・年 360 時間です。特別条項を使っても、時間外は年 720 時間以内などの上限があります。\",\"reviewSection\":\"残業の上限\"},\"ownerTitle\":\"働く時間と残業代：上限と上乗せのきまり\",\"ownerHref\":\"/themes/legal-02\"},{\"question\":{\"id\":\"legal-02/q-premium\",\"prompt\":\"時給にすると 1,500 円の人が、月 20 時間残業しました（月 60 時間以内）。上乗せの率 25％ で計算すると、残業代はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"37,500 円\"},{\"id\":\"b\",\"label\":\"30,000 円\"},{\"id\":\"c\",\"label\":\"45,000 円\"},{\"id\":\"d\",\"label\":\"7,500 円\"}],\"answer\":\"a\",\"explanation\":\"1,500 円 × 1.25 × 20 時間 ＝ 37,500 円です。30,000 円は上乗せをしていない額、7,500 円は上乗せの部分だけです。\",\"reviewSection\":\"割増賃金\"},\"ownerTitle\":\"働く時間と残業代：上限と上乗せのきまり\",\"ownerHref\":\"/themes/legal-02\"},{\"question\":{\"id\":\"legal-02/q-industry\",\"prompt\":\"宿泊業・飲食業と残業の上限について、2026-11-07 時点の厚生労働省の説明に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"宿泊業・飲食業には上限が当てはまらない\"},{\"id\":\"b\",\"label\":\"宿泊業・飲食業は、ふつうでも月 100 時間まで残業できる\"},{\"id\":\"c\",\"label\":\"猶予・除外の業種に宿泊業・飲食業は入らず、ほかの業種と同じ上限が当てはまる\"},{\"id\":\"d\",\"label\":\"忙しい時期は上限がなくなる\"}],\"answer\":\"c\",\"explanation\":\"猶予・除外の業種は、建設業、自動車運転の仕事、医師、鹿児島県・沖縄県の砂糖づくりです。宿泊業・飲食業は入っていません。\",\"reviewSection\":\"残業の上限\"},\"ownerTitle\":\"働く時間と残業代：上限と上乗せのきまり\",\"ownerHref\":\"/themes/legal-02\"},{\"question\":{\"id\":\"legal-05/q-three\",\"prompt\":\"職場のカスハラに当たるのは、どんなときですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"顧客等の言動で、ふつうに許される範囲を超え、従業員の働く環境が害される。この3つがすべてそろうとき\"},{\"id\":\"b\",\"label\":\"お客様が少しでも不満を言ったとき\"},{\"id\":\"c\",\"label\":\"従業員が嫌だと感じたときなら、いつでも\"},{\"id\":\"d\",\"label\":\"暴力があったときだけ\"}],\"answer\":\"a\",\"explanation\":\"カスハラは3つの要素がすべてそろうものです。不満の声がすべて当たるわけではありません。暴言や居座りなども、範囲を超えるやり方の例です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"カスハラから従業員を守る：会社の義務と旅館業法\",\"ownerHref\":\"/themes/legal-05\"},{\"question\":{\"id\":\"legal-05/q-date\",\"prompt\":\"改正労働施策総合推進法で、カスハラを防ぐ措置が会社の義務になったのはいつからですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2023年12月13日から\"},{\"id\":\"b\",\"label\":\"2024年4月1日から\"},{\"id\":\"c\",\"label\":\"2026年1月1日から\"},{\"id\":\"d\",\"label\":\"2026年10月1日から\"}],\"answer\":\"d\",\"explanation\":\"2026年10月1日からです。2023年12月13日は、改正旅館業法が施行された日です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"カスハラから従業員を守る：会社の義務と旅館業法\",\"ownerHref\":\"/themes/legal-05\"},{\"question\":{\"id\":\"legal-05/q-measure\",\"prompt\":\"厚生労働省のリーフレットが挙げる、会社がすることに当たるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"カスハラを受けた従業員を配置換えして終わりにする\"},{\"id\":\"b\",\"label\":\"相談窓口を決めて従業員に伝え、相談した人を不利益に扱わないと決める\"},{\"id\":\"c\",\"label\":\"どんな要求にも、まず全部応じるよう指示する\"},{\"id\":\"d\",\"label\":\"対応はいつも1人の担当者に任せる\"}],\"answer\":\"b\",\"explanation\":\"相談窓口を決めて伝えることや、相談した人を不利益に扱わないと決めることが挙げられています。できるだけ1人で対応させないことも、対処の例です。\",\"reviewSection\":\"会社がすること\"},\"ownerTitle\":\"カスハラから従業員を守る：会社の義務と旅館業法\",\"ownerHref\":\"/themes/legal-05\"},{\"question\":{\"id\":\"legal-05/q-repeat\",\"prompt\":\"改正旅館業法で、ホテルが宿泊を断れる場合として加わったものに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"一度でも値引きを頼まれたとき\"},{\"id\":\"b\",\"label\":\"口コミに悪い感想を書きそうなとき\"},{\"id\":\"c\",\"label\":\"負担がとても重く、ほかのお客様へのサービスをひどく妨げるおそれのある要求を繰り返したとき\"},{\"id\":\"d\",\"label\":\"障害について事前に知らせてくれなかったとき\"}],\"answer\":\"c\",\"explanation\":\"第5条第1項第3号は、要求を繰り返したときと決めています。どんな要求が当たるかは厚生労働省令で決まっています。障害を理由に断ることはできません。\",\"reviewSection\":\"ホテルが宿泊を断れる場合\"},\"ownerTitle\":\"カスハラから従業員を守る：会社の義務と旅館業法\",\"ownerHref\":\"/themes/legal-05\"},{\"question\":{\"id\":\"legal-05/q-not\",\"prompt\":\"指針の概要で、宿泊を断れる理由に「当たらない」とされている例はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"障害のある人が、筆談などで障害による壁を取りのぞくよう求めること\"},{\"id\":\"b\",\"label\":\"長い時間にわたって、従業員に不当な要求をし続けること\"},{\"id\":\"c\",\"label\":\"暴言をまじえて、宿泊料の大きな値引きを何度も求めること\"},{\"id\":\"d\",\"label\":\"従業員に土下座を求めること\"}],\"answer\":\"a\",\"explanation\":\"障害による壁を取りのぞくよう求めることは当たりません。宿泊を断ったときは、その理由などを記録します。\",\"reviewSection\":\"ホテルが宿泊を断れる場合\"},\"ownerTitle\":\"カスハラから従業員を守る：会社の義務と旅館業法\",\"ownerHref\":\"/themes/legal-05\"},{\"question\":{\"id\":\"legal-03/q-purpose\",\"prompt\":\"お客様の個人情報の扱い方で、基本として正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"集めた情報は、どんな目的に使ってもよい\"},{\"id\":\"b\",\"label\":\"何に使うか（利用目的）を伝え、その中で使い、漏れないように守る\"},{\"id\":\"c\",\"label\":\"紙の名簿は個人情報ではない\"},{\"id\":\"d\",\"label\":\"従業員なら誰でも自由に見てよい\"}],\"answer\":\"b\",\"explanation\":\"個人情報は、集めるときに利用目的を伝え、その中で使い、安全に守ります。紙の名簿も個人情報です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"お客様の情報を守る：個人情報と宿泊者名簿\",\"ownerHref\":\"/themes/legal-03\"},{\"question\":{\"id\":\"legal-03/q-four\",\"prompt\":\"情報が漏れたときに委員会への報告が必要になる場合として、施行規則に挙げられていないのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"クレジットカードの番号が漏れ、財産の被害のおそれがある\"},{\"id\":\"b\",\"label\":\"外から勝手にシステムに入られて（不正アクセス）漏れた\"},{\"id\":\"c\",\"label\":\"本人の数が 1,000 人を超える\"},{\"id\":\"d\",\"label\":\"漏れたのは 10 人分の名前だけで、不正の目的もない\"}],\"answer\":\"d\",\"explanation\":\"4つの場合は、要配慮個人情報、財産の被害のおそれ、不正の目的、1,000 人超です。10 人分の名前だけで不正の目的もない場合は、この4つに当たりません（ただし、社内での対応は必要です）。\",\"reviewSection\":\"漏えいのときに報告が必要になる4つの場合\"},\"ownerTitle\":\"お客様の情報を守る：個人情報と宿泊者名簿\",\"ownerHref\":\"/themes/legal-03\"},{\"question\":{\"id\":\"legal-03/q-report-deadline\",\"prompt\":\"不正アクセス（不正の目的）で情報が漏れたとき、確報は知った日から何日以内に出しますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"60 日以内\"},{\"id\":\"b\",\"label\":\"3 日以内\"},{\"id\":\"c\",\"label\":\"1 年以内\"},{\"id\":\"d\",\"label\":\"期限はない\"}],\"answer\":\"a\",\"explanation\":\"確報は、ふつうは 30 日以内です。不正の目的による場合は 60 日以内です（施行規則第8条）。その前に、すぐに速報を出します。\",\"reviewSection\":\"漏えいのときに報告が必要になる4つの場合\"},\"ownerTitle\":\"お客様の情報を守る：個人情報と宿泊者名簿\",\"ownerHref\":\"/themes/legal-03\"},{\"question\":{\"id\":\"legal-03/q-register\",\"prompt\":\"宿泊者名簿は、どれだけの間取っておきますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1 年間\"},{\"id\":\"b\",\"label\":\"取っておかなくてよい\"},{\"id\":\"c\",\"label\":\"作った日から 3 年間\"},{\"id\":\"d\",\"label\":\"10 年間\"}],\"answer\":\"c\",\"explanation\":\"旅館業法施行規則第4条の2 で、宿泊者名簿は作った日から 3 年間取っておきます。\",\"reviewSection\":\"宿泊者名簿\"},\"ownerTitle\":\"お客様の情報を守る：個人情報と宿泊者名簿\",\"ownerHref\":\"/themes/legal-03\"},{\"question\":{\"id\":\"legal-03/q-allergy\",\"prompt\":\"予約メモに書いたお客様の持病の情報が漏れたとき、どう扱われますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"メモなので個人情報ではない\"},{\"id\":\"b\",\"label\":\"要配慮個人情報が入っているので、報告が必要になる場合に当たる\"},{\"id\":\"c\",\"label\":\"1,000 人を超えなければ何もしなくてよい\"},{\"id\":\"d\",\"label\":\"お客様が自分で書いたので責任はない\"}],\"answer\":\"b\",\"explanation\":\"病歴などは要配慮個人情報です。漏れたおそれがあれば、人数に関係なく、報告が必要になる場合に当たります（とても強い暗号化などの対策をしている場合は除きます）。\",\"reviewSection\":\"漏えいのときに報告が必要になる4つの場合\"},\"ownerTitle\":\"お客様の情報を守る：個人情報と宿泊者名簿\",\"ownerHref\":\"/themes/legal-03\"},{\"question\":{\"id\":\"legal-06/q-duty\",\"prompt\":\"会社と取締役の関係について、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"雇用のきまりに従い、取締役は残業代をもらう\"},{\"id\":\"b\",\"label\":\"取締役は、結果が悪ければいつでも必ず責任を負う\"},{\"id\":\"c\",\"label\":\"取締役は、株主総会の決議を守らなくてよい\"},{\"id\":\"d\",\"label\":\"委任のきまりに従い、取締役は善良な管理者の注意をもって仕事をする義務を負う\"}],\"answer\":\"d\",\"explanation\":\"会社法第330条で、会社と役員の関係は委任のきまりに従います。民法第644条で、任された人は善良な管理者の注意をもって仕事をします（善管注意義務）。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"取締役の責任：会社とまわりの人に負う責任\",\"ownerHref\":\"/themes/legal-06\"},{\"question\":{\"id\":\"legal-06/q-company\",\"prompt\":\"取締役が任された務めを怠り、会社に損害が出ました。会社法第423条で、取締役は誰に責任を負いますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"国\"},{\"id\":\"b\",\"label\":\"会社\"},{\"id\":\"c\",\"label\":\"誰にも負わない\"},{\"id\":\"d\",\"label\":\"従業員一人ひとり\"}],\"answer\":\"b\",\"explanation\":\"第423条第1項で、任務を怠った役員等は、それで会社に生じた損害を会社につぐなう責任を負います。\",\"reviewSection\":\"2つの責任\"},\"ownerTitle\":\"取締役の責任：会社とまわりの人に負う責任\",\"ownerHref\":\"/themes/legal-06\"},{\"question\":{\"id\":\"legal-06/q-third\",\"prompt\":\"会社法第429条第1項で、取締役が第三者（取引先など）に責任を負うのは、どんなときですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"少しでも不注意があったとき\"},{\"id\":\"b\",\"label\":\"会社が赤字になったとき\"},{\"id\":\"c\",\"label\":\"職務について悪意か重大な過失があり、第三者に損害が出たとき\"},{\"id\":\"d\",\"label\":\"取締役になったときから、いつでも\"}],\"answer\":\"c\",\"explanation\":\"第429条第1項は、悪意か重大な過失があるときと決めています。会社への責任とは条件がちがいます。\",\"reviewSection\":\"2つの責任\"},\"ownerTitle\":\"取締役の責任：会社とまわりの人に負う責任\",\"ownerHref\":\"/themes/legal-06\"},{\"question\":{\"id\":\"legal-06/q-system\",\"prompt\":\"業務を正しく進めるための体制づくりについて、会社法第362条に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"取締役会が決める。子会社を含むグループの体制も入る\"},{\"id\":\"b\",\"label\":\"現場の店長が決める\"},{\"id\":\"c\",\"label\":\"取締役1人に任せて決めてよい\"},{\"id\":\"d\",\"label\":\"親会社には関係がない\"}],\"answer\":\"a\",\"explanation\":\"第362条第4項第6号で、この体制の整備は取締役会が決め、取締役に任せられません。子会社を含むグループの体制も入ります。\",\"reviewSection\":\"体制をつくるのも取締役会の仕事\"},\"ownerTitle\":\"取締役の責任：会社とまわりの人に負う責任\",\"ownerHref\":\"/themes/legal-06\"},{\"question\":{\"id\":\"legal-06/q-record\",\"prompt\":\"新しい店を出すと決めるときの備えとして、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"記録は残さず、口頭で決める\"},{\"id\":\"b\",\"label\":\"集めた情報・比べた案・外の意見・議事録を残す\"},{\"id\":\"c\",\"label\":\"反対意見は議事録から消す\"},{\"id\":\"d\",\"label\":\"うまくいったときだけ記録を作る\"}],\"answer\":\"b\",\"explanation\":\"コーポレートガバナンス・コードは、責任を負うかの判断で、一般に決めた時点の決め方の合理性が大事な考えどころの一つになると説明しています。筋道を残しておきましょう。\",\"reviewSection\":\"決めたときの筋道を残す\"},\"ownerTitle\":\"取締役の責任：会社とまわりの人に負う責任\",\"ownerHref\":\"/themes/legal-06\"},{\"question\":{\"id\":\"ma-01/q-payback\",\"prompt\":\"1,000 万円を投資して、毎年 300 万円の現金が戻ります。回収期間はおよそ何年ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 3.3 年\"},{\"id\":\"b\",\"label\":\"約 0.3 年\"},{\"id\":\"c\",\"label\":\"5 年\"},{\"id\":\"d\",\"label\":\"10 年\"}],\"answer\":\"a\",\"explanation\":\"回収期間 ＝ 投資額 ÷ 毎年戻る現金 ＝ 1,000 ÷ 300 ≒ 3.3 年です。\",\"reviewSection\":\"割り引いて計算する\"},\"ownerTitle\":\"投資判断：回収期間と NPV\",\"ownerHref\":\"/themes/ma-01\"},{\"question\":{\"id\":\"ma-01/q-time-value\",\"prompt\":\"何年かあとにもらう 100 万円は、今の 100 万円より価値が低いとされます。理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"先になるとお札のデザインが変わるから\"},{\"id\":\"b\",\"label\":\"先になると税金がかからないから\"},{\"id\":\"c\",\"label\":\"今あれば運用したり借入を返したりでき、その分の価値があるから\"},{\"id\":\"d\",\"label\":\"あとでもらうお金は数えにくいから\"}],\"answer\":\"c\",\"explanation\":\"今あるお金は、すぐに使って利息を減らしたり、運用したりできます。だから、あとでもらうお金は、割り引いてからくらべます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"投資判断：回収期間と NPV\",\"ownerHref\":\"/themes/ma-01\"},{\"question\":{\"id\":\"ma-01/q-npv\",\"prompt\":\"先の現金を割り引いた合計が約 1,299 万円、投資額が 1,000 万円です。NPV はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 500 万円\"},{\"id\":\"b\",\"label\":\"約 299 万円\"},{\"id\":\"c\",\"label\":\"約 2,299 万円\"},{\"id\":\"d\",\"label\":\"約 −299 万円\"}],\"answer\":\"b\",\"explanation\":\"NPV ＝ 割り引いた合計 − 投資額 ＝ 1,299 − 1,000 ＝ 約 299 万円です。500 万円は、割り引かずに計算したまちがいです。\",\"reviewSection\":\"割り引いて計算する\"},\"ownerTitle\":\"投資判断：回収期間と NPV\",\"ownerHref\":\"/themes/ma-01\"},{\"question\":{\"id\":\"ma-01/q-positive\",\"prompt\":\"NPV がプラスであることの意味として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"必ず 1 年で取りもどせる\"},{\"id\":\"b\",\"label\":\"リスクがまったくない\"},{\"id\":\"c\",\"label\":\"会計の利益が必ず増える\"},{\"id\":\"d\",\"label\":\"集めたお金の費用（割引率）より多くの価値を生む\"}],\"answer\":\"d\",\"explanation\":\"NPV がプラスなら、割引率で表したお金の費用を引いても、価値が残ります。ただし、見積もりが外れればマイナスにもなります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"投資判断：回収期間と NPV\",\"ownerHref\":\"/themes/ma-01\"},{\"question\":{\"id\":\"ma-01/q-weak\",\"prompt\":\"回収期間の弱いところとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"計算が難しすぎる\"},{\"id\":\"b\",\"label\":\"取りもどしたあとに戻る現金と、お金の時間の価値を見ていない\"},{\"id\":\"c\",\"label\":\"早く取りもどせるかがわからない\"},{\"id\":\"d\",\"label\":\"投資額を使わない\"}],\"answer\":\"b\",\"explanation\":\"回収期間で、早さ（安全か）はわかります。でも、そのあとの現金や時間の価値は見ません。価値の大きさは、NPV で補いましょう。\",\"reviewSection\":\"2つの物差しの使い分け\"},\"ownerTitle\":\"投資判断：回収期間と NPV\",\"ownerHref\":\"/themes/ma-01\"},{\"question\":{\"id\":\"ma-05/q-define\",\"prompt\":\"IRR（内部収益率）の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"投資を取りもどすまでの年数\"},{\"id\":\"b\",\"label\":\"投資の金額の合計\"},{\"id\":\"c\",\"label\":\"NPV がちょうどゼロになる割引率\"},{\"id\":\"d\",\"label\":\"借入の金利\"}],\"answer\":\"c\",\"explanation\":\"IRR は、NPV がゼロになる割引率です。「この投資は年何％で回るか」と考えるとわかりやすいです。a は回収期間です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"IRR の落とし穴：利回りが高い案が、いちばん得とは限らない\",\"ownerHref\":\"/themes/ma-05\"},{\"question\":{\"id\":\"ma-05/q-compare\",\"prompt\":\"1,000 万円を投資し、5 年間、毎年 300 万円が戻ります。IRR は約 15.2％ です。集めたお金の費用が 5％ なら、どう判断しますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"IRR が費用より高いので、投資する価値がある\"},{\"id\":\"b\",\"label\":\"IRR が費用より低いので、やめる\"},{\"id\":\"c\",\"label\":\"IRR と費用はくらべられない\"},{\"id\":\"d\",\"label\":\"回収期間が 5 年なので、やめる\"}],\"answer\":\"a\",\"explanation\":\"IRR 15.2％ は、集めたお金の費用 5％ より高いです。1つの案だけなら、NPV がプラスであることと同じ意味になります。\",\"reviewSection\":\"IRR を計算する\"},\"ownerTitle\":\"IRR の落とし穴：利回りが高い案が、いちばん得とは限らない\",\"ownerHref\":\"/themes/ma-05\"},{\"question\":{\"id\":\"ma-05/q-scale\",\"prompt\":\"どちらか1つしか選べない2つの案があります。A は IRR 30％・NPV 約 238 万円、B は IRR 15％・NPV 約 476 万円です。基本はどちらを選びますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"A。IRR が高いから\"},{\"id\":\"b\",\"label\":\"どちらも選ばない\"},{\"id\":\"c\",\"label\":\"A。投資の金額が小さいから\"},{\"id\":\"d\",\"label\":\"B。生まれる価値（NPV）が大きいから\"}],\"answer\":\"d\",\"explanation\":\"IRR は割合なので、投資の大きさがわかりません。どちらか1つを選ぶときは、NPV の大きい B を選ぶのが基本です。\",\"reviewSection\":\"落とし穴1：大きさを見ていない\"},\"ownerTitle\":\"IRR の落とし穴：利回りが高い案が、いちばん得とは限らない\",\"ownerHref\":\"/themes/ma-05\"},{\"question\":{\"id\":\"ma-05/q-multiple\",\"prompt\":\"IRR が2つ以上出てしまうことがあるのは、どんな計画ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"最初に1回だけお金が出て、あとは毎年戻る計画\"},{\"id\":\"b\",\"label\":\"途中で大きな支出があり、お金の向きが何度も変わる計画\"},{\"id\":\"c\",\"label\":\"毎年同じ額が戻る計画\"},{\"id\":\"d\",\"label\":\"投資の金額が小さい計画\"}],\"answer\":\"b\",\"explanation\":\"出る → 戻る → また出る、と向きが何度も変わると、NPV がゼロになる割引率が2つ以上出ることがあります。そのときは NPV で判断します。\",\"reviewSection\":\"落とし穴2：答えが2つ出ることがある\"},\"ownerTitle\":\"IRR の落とし穴：利回りが高い案が、いちばん得とは限らない\",\"ownerHref\":\"/themes/ma-05\"},{\"question\":{\"id\":\"ma-05/q-check\",\"prompt\":\"投資ファンドの資料に「IRR 20％ が目標」と書かれていました。経営者として、あわせて確かめたいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ファンドの社員の人数\"},{\"id\":\"b\",\"label\":\"資料のページ数\"},{\"id\":\"c\",\"label\":\"投資の大きさと期間、そして NPV\"},{\"id\":\"d\",\"label\":\"何も確かめなくてよい\"}],\"answer\":\"c\",\"explanation\":\"同じ IRR でも、投資の大きさや期間で、生まれる価値は変わります。IRR だけでなく、NPV や金額もあわせて見ましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"IRR の落とし穴：利回りが高い案が、いちばん得とは限らない\",\"ownerHref\":\"/themes/ma-05\"},{\"question\":{\"id\":\"ma-02/q-ebitda\",\"prompt\":\"営業利益 6,000 万円、減価償却費 5,000 万円の会社です。EBITDA はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1,000 万円\"},{\"id\":\"b\",\"label\":\"6,000 万円\"},{\"id\":\"c\",\"label\":\"30,000 万円\"},{\"id\":\"d\",\"label\":\"11,000 万円\"}],\"answer\":\"d\",\"explanation\":\"EBITDA ＝ 営業利益 ＋ 減価償却費 ＝ 6,000 ＋ 5,000 ＝ 11,000 万円です。\",\"reviewSection\":\"みなと館ホテルの値段を見積もる\"},\"ownerTitle\":\"会社の値段の測り方：EBITDA と倍率\",\"ownerHref\":\"/themes/ma-02\"},{\"question\":{\"id\":\"ma-02/q-equity\",\"prompt\":\"事業価値 77,000 万円、借入金 44,000 万円、現金 8,000 万円です。株式の値段はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"41,000 万円\"},{\"id\":\"b\",\"label\":\"33,000 万円\"},{\"id\":\"c\",\"label\":\"129,000 万円\"},{\"id\":\"d\",\"label\":\"77,000 万円\"}],\"answer\":\"a\",\"explanation\":\"株式の値段 ＝ 事業価値 − 借入金 ＋ 現金 ＝ 77,000 − 44,000 ＋ 8,000 ＝ 41,000 万円です。33,000 万円は、現金を足し忘れた額です。\",\"reviewSection\":\"みなと館ホテルの値段を見積もる\"},\"ownerTitle\":\"会社の値段の測り方：EBITDA と倍率\",\"ownerHref\":\"/themes/ma-02\"},{\"question\":{\"id\":\"ma-02/q-why-debt\",\"prompt\":\"株式の値段を出すとき、借入金を引くのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"借入金は売上だから\"},{\"id\":\"b\",\"label\":\"株式を買うと、その会社の借入も引き継ぐから\"},{\"id\":\"c\",\"label\":\"借入金は税金だから\"},{\"id\":\"d\",\"label\":\"引く必要はない\"}],\"answer\":\"b\",\"explanation\":\"株式を買えば、会社ごと手に入ります。借入の返済も、買い手のものになった会社が続けます。その分を、値段から引くのです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"会社の値段の測り方：EBITDA と倍率\",\"ownerHref\":\"/themes/ma-02\"},{\"question\":{\"id\":\"ma-02/q-multiple\",\"prompt\":\"EBITDA 11,000 万円の会社です。倍率が 7 倍から 6 倍に変わると、事業価値はいくら変わりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1,000 万円\"},{\"id\":\"b\",\"label\":\"6,000 万円\"},{\"id\":\"c\",\"label\":\"11,000 万円\"},{\"id\":\"d\",\"label\":\"変わらない\"}],\"answer\":\"c\",\"explanation\":\"倍率 1 倍分は、EBITDA と同じ 11,000 万円です。倍率の根拠しだいで、値段が大きく変わります。\",\"reviewSection\":\"みなと館ホテルの値段を見積もる\"},\"ownerTitle\":\"会社の値段の測り方：EBITDA と倍率\",\"ownerHref\":\"/themes/ma-02\"},{\"question\":{\"id\":\"ma-02/q-normal\",\"prompt\":\"見積もりに使う EBITDA について、このテーマが気をつけていることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"その年だけの利益や費用をのぞいた、ふつうの年の数字で見る\"},{\"id\":\"b\",\"label\":\"いちばんよかった年の数字を使う\"},{\"id\":\"c\",\"label\":\"売上高をそのまま使う\"},{\"id\":\"d\",\"label\":\"設備の入れかえの費用まで、すべて含んでいる\"}],\"answer\":\"a\",\"explanation\":\"その年だけの数字で見積もると、値段をまちがえます。また、EBITDA は先々の設備の入れかえの費用を見ていません。それは別に確かめます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"会社の値段の測り方：EBITDA と倍率\",\"ownerHref\":\"/themes/ma-02\"},{\"question\":{\"id\":\"ma-04/q-fcf\",\"prompt\":\"フリーキャッシュフロー（FCF）の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"PL の売上高そのもの\"},{\"id\":\"b\",\"label\":\"BS の現金・預金の残高\"},{\"id\":\"c\",\"label\":\"その年の当期純利益と同じ金額\"},{\"id\":\"d\",\"label\":\"本業で生んだ現金から、設備の投資などを引いた、自由に使えるお金\"}],\"answer\":\"d\",\"explanation\":\"FCF は、借入の返済や配当に回せる、自由に使えるお金です。利益とも現金の残高とも違います。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"DCF 法とフリーキャッシュフロー：将来のお金から会社の値段を出す\",\"ownerHref\":\"/themes/ma-04\"},{\"question\":{\"id\":\"ma-04/q-calc\",\"prompt\":\"税金を引いた営業利益 4,200、減価償却費 5,000、設備投資 5,000、運転資金の増加 200（単位は万円）のとき、FCF はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"4,200 万円\"},{\"id\":\"b\",\"label\":\"4,000 万円\"},{\"id\":\"c\",\"label\":\"9,200 万円\"},{\"id\":\"d\",\"label\":\"14,400 万円\"}],\"answer\":\"b\",\"explanation\":\"4,200 ＋ 5,000 − 5,000 − 200 ＝ 4,000 万円です。\",\"reviewSection\":\"FCF を計算する\"},\"ownerTitle\":\"DCF 法とフリーキャッシュフロー：将来のお金から会社の値段を出す\",\"ownerHref\":\"/themes/ma-04\"},{\"question\":{\"id\":\"ma-04/q-value\",\"prompt\":\"FCF 4,000 万円が毎年ずっと続き、割引率が 5％ のとき、会社全体の値段（事業価値）はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"20,000 万円\"},{\"id\":\"b\",\"label\":\"4,200 万円\"},{\"id\":\"c\",\"label\":\"80,000 万円\"},{\"id\":\"d\",\"label\":\"200 万円\"}],\"answer\":\"c\",\"explanation\":\"ずっと同じ額が続くときは、FCF ÷ 割引率 で出せます。4,000 ÷ 5％ ＝ 80,000 万円です。\",\"reviewSection\":\"割り引いて会社の値段を出す\"},\"ownerTitle\":\"DCF 法とフリーキャッシュフロー：将来のお金から会社の値段を出す\",\"ownerHref\":\"/themes/ma-04\"},{\"question\":{\"id\":\"ma-04/q-rate\",\"prompt\":\"割引率が 5％ から 6％ に上がると、DCF 法で出す会社の値段はどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"下がる\"},{\"id\":\"b\",\"label\":\"上がる\"},{\"id\":\"c\",\"label\":\"変わらない\"},{\"id\":\"d\",\"label\":\"必ずゼロになる\"}],\"answer\":\"a\",\"explanation\":\"割引率が上がると、将来のお金の今の価値が小さくなります。みなと館ホテルの例では、80,000 万円から約 66,700 万円に下がります。\",\"reviewSection\":\"割り引いて会社の値段を出す\"},\"ownerTitle\":\"DCF 法とフリーキャッシュフロー：将来のお金から会社の値段を出す\",\"ownerHref\":\"/themes/ma-04\"},{\"question\":{\"id\":\"ma-04/q-capex\",\"prompt\":\"ホテルの DCF 法で、特に気をつけることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高を必ず小さく見積もる\"},{\"id\":\"b\",\"label\":\"減価償却費を FCF から引く\"},{\"id\":\"c\",\"label\":\"割引率は 0％ にする\"},{\"id\":\"d\",\"label\":\"建物や設備の入れかえにかかる投資を、小さく見積もらない\"}],\"answer\":\"d\",\"explanation\":\"設備投資を小さく見積もると、FCF が大きく見え、会社の値段も高く出てしまいます。ホテルは設備の入れかえにお金がかかるので、特に気をつけます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"DCF 法とフリーキャッシュフロー：将来のお金から会社の値段を出す\",\"ownerHref\":\"/themes/ma-04\"},{\"question\":{\"id\":\"ma-03/q-order\",\"prompt\":\"M\u0026A の進め方の順番として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"最後の契約 → 詳しく調べる → 相手を探す\"},{\"id\":\"b\",\"label\":\"相手を探す → 基本の合意 → 詳しく調べる → 最後の契約 → まとめる\"},{\"id\":\"c\",\"label\":\"まとめる → 相手を探す → 契約\"},{\"id\":\"d\",\"label\":\"詳しく調べずに契約する\"}],\"answer\":\"b\",\"explanation\":\"基本の合意のあとに、詳しく調べます。見つかった問題を最後の契約に入れます。そして買ったあとに、1つにまとめていきます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"M\u0026A の進め方：調べてから買い、買ってからまとめる\",\"ownerHref\":\"/themes/ma-03\"},{\"question\":{\"id\":\"ma-03/q-dd\",\"prompt\":\"デューデリジェンスの、おもな目的はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"相手の会社の広告を作ること\"},{\"id\":\"b\",\"label\":\"値段を必ず上げること\"},{\"id\":\"c\",\"label\":\"帳簿に出ない問題を見つけること\"},{\"id\":\"d\",\"label\":\"従業員を減らすこと\"}],\"answer\":\"c\",\"explanation\":\"帳簿だけではわからない問題を見つけます。たとえば、払われていない残業代、不利な契約、かくれた借金、設備の不具合です。\",\"reviewSection\":\"詳しく調べる（デューデリジェンス）\"},\"ownerTitle\":\"M\u0026A の進め方：調べてから買い、買ってからまとめる\",\"ownerHref\":\"/themes/ma-03\"},{\"question\":{\"id\":\"ma-03/q-overtime\",\"prompt\":\"20 人に月 10 時間ずつの残業代が、2 年分払われていません。時給にすると 1,500 円、割増は 25％ です。合計はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"720 万円\"},{\"id\":\"b\",\"label\":\"450 万円\"},{\"id\":\"c\",\"label\":\"37.5 万円\"},{\"id\":\"d\",\"label\":\"900 万円\"}],\"answer\":\"d\",\"explanation\":\"1 時間あたり 1,500 × 1.25 ＝ 1,875 円です。20 人 × 10 時間 × 24 か月 × 1,875 円 ＝ 900 万円です。720 万円は、割増を付け忘れた額です。\",\"reviewSection\":\"詳しく調べる（デューデリジェンス）\"},\"ownerTitle\":\"M\u0026A の進め方：調べてから買い、買ってからまとめる\",\"ownerHref\":\"/themes/ma-03\"},{\"question\":{\"id\":\"ma-03/q-fail\",\"prompt\":\"M\u0026A の失敗が多く起きるのは、どの段階だと、このテーマは言っていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"買ったあとに1つにまとめる段階\"},{\"id\":\"b\",\"label\":\"相手を探す段階\"},{\"id\":\"c\",\"label\":\"書類を印刷する段階\"},{\"id\":\"d\",\"label\":\"銀行に振り込む段階\"}],\"answer\":\"a\",\"explanation\":\"人が辞める、やり方がぶつかる、お客様が離れる。こうして、まとめる段階でつまずくことが多いのです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"M\u0026A の進め方：調べてから買い、買ってからまとめる\",\"ownerHref\":\"/themes/ma-03\"},{\"question\":{\"id\":\"ma-03/q-pmi\",\"prompt\":\"買ったあとに、よい人から辞めていくのを防ぎたいです。まずすることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何も伝えずに様子を見る\"},{\"id\":\"b\",\"label\":\"給料や働き方がどうなるかを、早く伝える\"},{\"id\":\"c\",\"label\":\"すぐに全部のやり方を変える\"},{\"id\":\"d\",\"label\":\"社名を何度も変える\"}],\"answer\":\"b\",\"explanation\":\"わからない状態が続くと、ほかでも働けるよい人から辞めていきます。何が変わり、何が変わらないかを、早く伝えましょう。\",\"reviewSection\":\"買った後の統合（PMI）\"},\"ownerTitle\":\"M\u0026A の進め方：調べてから買い、買ってからまとめる\",\"ownerHref\":\"/themes/ma-03\"},{\"question\":{\"id\":\"ma-06/q-questions\",\"prompt\":\"まとめ方を選ぶ2つの問いの組み合わせとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どれだけ一緒にする必要があるか、どれだけ任せておく必要があるか\"},{\"id\":\"b\",\"label\":\"いくらで買うか、いつ売るか\"},{\"id\":\"c\",\"label\":\"何人雇うか、何店出すか\"},{\"id\":\"d\",\"label\":\"借入で買うか、出資で買うか\"}],\"answer\":\"a\",\"explanation\":\"価値を生むために一緒にする必要と、買った会社の良さを守るために任せる必要の2つで、まとめ方を選びます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"PMI：買ったあと「どこまで1つにするか」を決める\",\"ownerHref\":\"/themes/ma-06\"},{\"question\":{\"id\":\"ma-06/q-preserve\",\"prompt\":\"人気の老舗旅館を、名前やおもてなしのやり方をそのまま残して経営する型はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"吸収\"},{\"id\":\"b\",\"label\":\"持ち株\"},{\"id\":\"c\",\"label\":\"保護\"},{\"id\":\"d\",\"label\":\"共生\"}],\"answer\":\"c\",\"explanation\":\"一緒にする必要が小さく、任せる必要が大きいときは「保護」の型です。買った理由の良さを残すことを大事にします。\",\"reviewSection\":\"まとめ方は4つに分けられる\"},\"ownerTitle\":\"PMI：買ったあと「どこまで1つにするか」を決める\",\"ownerHref\":\"/themes/ma-06\"},{\"question\":{\"id\":\"ma-06/q-payback\",\"prompt\":\"そろえるために1回 1,500 万円かかり、毎年 600 万円の費用が減ります。1回の費用を取りもどすのは何年ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"0.4 年\"},{\"id\":\"b\",\"label\":\"2.5 年\"},{\"id\":\"c\",\"label\":\"9 年\"},{\"id\":\"d\",\"label\":\"4 年\"}],\"answer\":\"b\",\"explanation\":\"1,500 ÷ 600 ＝ 2.5 年です。ただし、費用が減り始めるのは、システムの入れかえが終わってからです。\",\"reviewSection\":\"シナジーを数字で確かめる\"},\"ownerTitle\":\"PMI：買ったあと「どこまで1つにするか」を決める\",\"ownerHref\":\"/themes/ma-06\"},{\"question\":{\"id\":\"ma-06/q-mistake\",\"prompt\":\"良さを残したくて買った会社を、全部自社のやり方にそろえると、何が起きやすいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"シナジーが必ず大きくなる\"},{\"id\":\"b\",\"label\":\"税金が減る\"},{\"id\":\"c\",\"label\":\"買う値段が下がる\"},{\"id\":\"d\",\"label\":\"買った理由だった良さを、自分でなくしてしまう\"}],\"answer\":\"d\",\"explanation\":\"買った理由が、その会社の味やおもてなしなら、そこを変えると価値がなくなります。買った理由とまとめ方を合わせましょう。\",\"reviewSection\":\"まとめ方は4つに分けられる\"},\"ownerTitle\":\"PMI：買ったあと「どこまで1つにするか」を決める\",\"ownerHref\":\"/themes/ma-06\"},{\"question\":{\"id\":\"ma-06/q-first\",\"prompt\":\"まとめ始めに、働く人の不安を減らすためにまずすることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何も伝えずに、全部決まってから発表する\"},{\"id\":\"b\",\"label\":\"全員の給料を下げる\"},{\"id\":\"c\",\"label\":\"給料や働く場所など、変えないものを早く伝える\"},{\"id\":\"d\",\"label\":\"責任者を決めずに、現場に任せる\"}],\"answer\":\"c\",\"explanation\":\"わからないままだと、よい人から辞めていきます。変えないものを早く伝え、責任者と期限も決めておきます。\",\"reviewSection\":\"最初に決めておくこと\"},\"ownerTitle\":\"PMI：買ったあと「どこまで1つにするか」を決める\",\"ownerHref\":\"/themes/ma-06\"},{\"question\":{\"id\":\"marketing-01/q-stp-order\",\"prompt\":\"STP の順番として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"お客様を分ける → ねらう層を選ぶ → ライバルとくらべた立ち位置を決める\"},{\"id\":\"b\",\"label\":\"立ち位置を決める → お客様を分ける → ねらう層を選ぶ\"},{\"id\":\"c\",\"label\":\"ねらう層を選ぶ → 価格を決める → 広告を出す\"},{\"id\":\"d\",\"label\":\"広告を出す → 反応を見る → お客様を分ける\"}],\"answer\":\"a\",\"explanation\":\"セグメンテーション（お客様を分ける）、ターゲティング（ねらう層を選ぶ）、ポジショニング（立ち位置を決める）の順に考えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"誰に何を売るか：セグメント・ターゲット・ポジショニング\",\"ownerHref\":\"/themes/marketing-01\"},{\"question\":{\"id\":\"marketing-01/q-everyone\",\"prompt\":\"「すべてのお客様に選ばれる店にする」という方針の問題として、いちばん当てはまるものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"広告費がかからなくなる\"},{\"id\":\"b\",\"label\":\"客単価が必ず上がる\"},{\"id\":\"c\",\"label\":\"誰にとっても「ほかの店でもいい店」になり、選ばれる理由がなくなる\"},{\"id\":\"d\",\"label\":\"ライバルがまねできなくなる\"}],\"answer\":\"c\",\"explanation\":\"ほしいものがちがうお客様全員に合わせると、どの層にとっても一番にはなれません。ねらわない層を決めると、選ばれる理由がはっきりします。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"誰に何を売るか：セグメント・ターゲット・ポジショニング\",\"ownerHref\":\"/themes/marketing-01\"},{\"question\":{\"id\":\"marketing-01/q-segment\",\"prompt\":\"ホテルのお客様を「出張」「観光」「記念日」に分けました。これはどの分け方ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"予約のしかた\"},{\"id\":\"b\",\"label\":\"使う目的\"},{\"id\":\"c\",\"label\":\"価格の感じ方\"},{\"id\":\"d\",\"label\":\"住んでいる地域\"}],\"answer\":\"b\",\"explanation\":\"出張・観光・記念日は、泊まる目的のちがいで分けています。目的がちがうと、ほしい部屋、場所、サービスもちがいます。\",\"reviewSection\":\"お客様を分ける\"},\"ownerTitle\":\"誰に何を売るか：セグメント・ターゲット・ポジショニング\",\"ownerHref\":\"/themes/marketing-01\"},{\"question\":{\"id\":\"marketing-01/q-consistency\",\"prompt\":\"高い価格帯の立ち位置をとると決めました。でも、客室だけ改装して、接客と料理は変えませんでした。何が起こりやすいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何も起こらない。客室が良ければ十分である\"},{\"id\":\"b\",\"label\":\"稼働率が必ず上がる\"},{\"id\":\"c\",\"label\":\"広告費が減る\"},{\"id\":\"d\",\"label\":\"期待と体験が合わず、評判が下がって、高い値段を保てなくなる\"}],\"answer\":\"d\",\"explanation\":\"ポジショニングは、価格・設備・人・言葉をそろえて、はじめてお客様に伝わります。一部だけ高級にすると、高い期待に体験が追いつきません。そして評判が下がります。\",\"reviewSection\":\"立ち位置を決める\"},\"ownerTitle\":\"誰に何を売るか：セグメント・ターゲット・ポジショニング\",\"ownerHref\":\"/themes/marketing-01\"},{\"question\":{\"id\":\"marketing-01/q-check\",\"prompt\":\"ねらう層を選ぶとき、経営者がまず確かめることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"社長の好みに合うか\"},{\"id\":\"b\",\"label\":\"その層の人数と払える金額で、店や客室を埋められるか\"},{\"id\":\"c\",\"label\":\"ライバルが1つもいないか\"},{\"id\":\"d\",\"label\":\"はやっているか\"}],\"answer\":\"b\",\"explanation\":\"ねらう層が小さすぎると、どれだけ満足してもらっても売上が足りません。人数（市場の大きさ）と払える金額で、商売が成り立つかを確かめます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"誰に何を売るか：セグメント・ターゲット・ポジショニング\",\"ownerHref\":\"/themes/marketing-01\"},{\"question\":{\"id\":\"marketing-04/q-four\",\"prompt\":\"4P に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"商品（Product）\"},{\"id\":\"b\",\"label\":\"値段（Price）\"},{\"id\":\"c\",\"label\":\"利益（Profit）\"},{\"id\":\"d\",\"label\":\"知らせ方（Promotion）\"}],\"answer\":\"c\",\"explanation\":\"4P は、商品・値段・届け方（Place）・知らせ方の4つです。利益は、4P を組み立てた結果として出てくるものです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"売り方を組み立てる：4P とサービスの7P\",\"ownerHref\":\"/themes/marketing-04\"},{\"question\":{\"id\":\"marketing-04/q-added\",\"prompt\":\"サービスのために足された3つの P はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人・手順・見た目（証拠）\"},{\"id\":\"b\",\"label\":\"値段・届け方・知らせ方\"},{\"id\":\"c\",\"label\":\"商品・人・利益\"},{\"id\":\"d\",\"label\":\"計画・実行・確認\"}],\"answer\":\"a\",\"explanation\":\"ブームスとビトナーが、人（People）・手順（Process）・見た目や証拠（Physical evidence）を足しました。合わせて7P です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"売り方を組み立てる：4P とサービスの7P\",\"ownerHref\":\"/themes/marketing-04\"},{\"question\":{\"id\":\"marketing-04/q-why\",\"prompt\":\"サービスで、人・手順・見た目が大事になるのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"法律で決まっているから\"},{\"id\":\"b\",\"label\":\"サービスは買う前にためせないので、お客様はそれを手がかりに決めるから\"},{\"id\":\"c\",\"label\":\"値段を決めなくてよくなるから\"},{\"id\":\"d\",\"label\":\"広告がいらなくなるから\"}],\"answer\":\"b\",\"explanation\":\"形のないサービスは、買う前に中身がわかりません。お客様は、スタッフ・流れ・お店のようすを見て「よさそうか」を判断します。\",\"reviewSection\":\"7つの P\"},\"ownerTitle\":\"売り方を組み立てる：4P とサービスの7P\",\"ownerHref\":\"/themes/marketing-04\"},{\"question\":{\"id\":\"marketing-04/q-evidence\",\"prompt\":\"「見た目・証拠（Physical evidence）」の例はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"平日の料金\"},{\"id\":\"b\",\"label\":\"予約サイトとの契約\"},{\"id\":\"c\",\"label\":\"料理人の数\"},{\"id\":\"d\",\"label\":\"ロビーのきれいさや、メニュー表\"}],\"answer\":\"d\",\"explanation\":\"目で見て質がわかるものが、見た目・証拠です。ロビー、制服、メニュー表、口コミの写真などです。\",\"reviewSection\":\"7つの P\"},\"ownerTitle\":\"売り方を組み立てる：4P とサービスの7P\",\"ownerHref\":\"/themes/marketing-04\"},{\"question\":{\"id\":\"marketing-04/q-umikaze\",\"prompt\":\"うみかぜ食堂の 8,000 円のコースで、まず直すとよいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"値段を 3,000 円に下げる\"},{\"id\":\"b\",\"label\":\"料理の品数を倍にする\"},{\"id\":\"c\",\"label\":\"説明の練習、出す順番の見直し、メニュー表の作り直し\"},{\"id\":\"d\",\"label\":\"コースをやめる\"}],\"answer\":\"c\",\"explanation\":\"商品と値段は「特別な日」向けなのに、人・手順・見た目がふだんのままでした。ちぐはぐな3つを、コースの立ち位置にそろえます。\",\"reviewSection\":\"7P がそろっていない例\"},\"ownerTitle\":\"売り方を組み立てる：4P とサービスの7P\",\"ownerHref\":\"/themes/marketing-04\"},{\"question\":{\"id\":\"marketing-02/q-floor\",\"prompt\":\"3つの決め方のうち、「これより下げると損をする」下限を表すのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"お客様が感じる価値\"},{\"id\":\"b\",\"label\":\"ライバルの価格\"},{\"id\":\"c\",\"label\":\"広告の効果\"},{\"id\":\"d\",\"label\":\"原価\"}],\"answer\":\"d\",\"explanation\":\"原価は、価格の下限です。お客様が払ってもいいと思う額は、上限です。その間で、ライバルと自分の店の立ち位置を見て、価格を決めます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"価格の決め方：原価・ライバル・お客様が感じる価値\",\"ownerHref\":\"/themes/marketing-02\"},{\"question\":{\"id\":\"marketing-02/q-cost-plus\",\"prompt\":\"食材の原価が 330 円の定食を、原価率 30％ になるように値段をつけると、いくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1,100 円\"},{\"id\":\"b\",\"label\":\"990 円\"},{\"id\":\"c\",\"label\":\"430 円\"},{\"id\":\"d\",\"label\":\"1,320 円\"}],\"answer\":\"a\",\"explanation\":\"価格 ＝ 原価 ÷ 原価率 ＝ 330 ÷ 0.3 ＝ 1,100 円です。原価率は「原価 ÷ 価格」なので、式を逆にすると価格が出ます。\",\"reviewSection\":\"3つの決め方\"},\"ownerTitle\":\"価格の決め方：原価・ライバル・お客様が感じる価値\",\"ownerHref\":\"/themes/marketing-02\"},{\"question\":{\"id\":\"marketing-02/q-raise\",\"prompt\":\"定食を 980 円から 1,180 円に上げたら、客数が1日 120 人から 110 人に減りました。1人 330 円の食材費を引いた額は、1か月（30日）でどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"36.6 万円減る\"},{\"id\":\"b\",\"label\":\"変わらない\"},{\"id\":\"c\",\"label\":\"46.5 万円増える\"},{\"id\":\"d\",\"label\":\"9.9 万円増える\"}],\"answer\":\"c\",\"explanation\":\"値上げ前は (980 − 330) × 120 × 30 ＝ 234.0 万円です。値上げ後は (1,180 − 330) × 110 × 30 ＝ 280.5 万円です。差は 46.5 万円の増加です。\",\"reviewSection\":\"値上げは利益にどう効くか\"},\"ownerTitle\":\"価格の決め方：原価・ライバル・お客様が感じる価値\",\"ownerHref\":\"/themes/marketing-02\"},{\"question\":{\"id\":\"marketing-02/q-why-profit\",\"prompt\":\"値上げの効果が、ほぼそのまま利益の増加になりやすいのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"値上げすると税金がかからないから\"},{\"id\":\"b\",\"label\":\"人件費や家賃などの固定費は、客数が少し減っても変わらないから\"},{\"id\":\"c\",\"label\":\"値上げすると客数が必ず増えるから\"},{\"id\":\"d\",\"label\":\"食材費が値上げ分だけ下がるから\"}],\"answer\":\"b\",\"explanation\":\"固定費は、客数に関係なくかかります。値上げで増えた「売上 − 変動費」は、固定費が増えないので、ほぼそのまま利益になります。\",\"reviewSection\":\"値上げは利益にどう効くか\"},\"ownerTitle\":\"価格の決め方：原価・ライバル・お客様が感じる価値\",\"ownerHref\":\"/themes/marketing-02\"},{\"question\":{\"id\":\"marketing-02/q-revenue-management\",\"prompt\":\"ホテルが、泊まりたい人が多い日は高く、少ない日は安く値段を変えます。その理由として、いちばん正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎日同じ値段だと法律に違反するから\"},{\"id\":\"b\",\"label\":\"お客様をまよわせるため\"},{\"id\":\"c\",\"label\":\"人件費を減らすため\"},{\"id\":\"d\",\"label\":\"空き部屋は次の日に売れないので、日ごとに売上をいちばん大きくするため\"}],\"answer\":\"d\",\"explanation\":\"今日の空き部屋は、明日には売れません。日ごとの泊まりたい人の数に合わせて値段を変え、稼働率と1部屋の値段を掛けた RevPAR をいちばん大きくします。これをレベニューマネジメントと呼びます。\",\"reviewSection\":\"日によって値段を変える\"},\"ownerTitle\":\"価格の決め方：原価・ライバル・お客様が感じる価値\",\"ownerHref\":\"/themes/marketing-02\"},{\"question\":{\"id\":\"marketing-03/q-ota-fee\",\"prompt\":\"1泊 14,000 円の予約を、手数料 12％ の旅行サイトで売りました。手数料はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"120 円\"},{\"id\":\"b\",\"label\":\"12,320 円\"},{\"id\":\"c\",\"label\":\"1,680 円\"},{\"id\":\"d\",\"label\":\"1,400 円\"}],\"answer\":\"c\",\"explanation\":\"14,000 円 × 12％ ＝ 1,680 円です。手元に残るのは 12,320 円です。\",\"reviewSection\":\"経路ごとの費用\"},\"ownerTitle\":\"お客様を呼ぶ経路とリピート：手数料と顧客生涯価値\",\"ownerHref\":\"/themes/marketing-03\"},{\"question\":{\"id\":\"marketing-03/q-shift\",\"prompt\":\"旅行サイト（1件 1,680 円）で売っていた 5,000 泊を、自分のホテルのサイト（1件 420 円）に移しました。営業利益はいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"210 万円\"},{\"id\":\"b\",\"label\":\"630 万円\"},{\"id\":\"c\",\"label\":\"840 万円\"},{\"id\":\"d\",\"label\":\"1,680 万円\"}],\"answer\":\"b\",\"explanation\":\"1件あたりの差は 1,680 − 420 ＝ 1,260 円です。1,260 円 × 5,000 泊 ＝ 630 万円の費用が減ります。その分、営業利益が増えます。\",\"reviewSection\":\"経路ごとの費用\"},\"ownerTitle\":\"お客様を呼ぶ経路とリピート：手数料と顧客生涯価値\",\"ownerHref\":\"/themes/marketing-03\"},{\"question\":{\"id\":\"marketing-03/q-ltv\",\"prompt\":\"1回 850 円の利益を、1年に 24 回、3年もたらしてくれるお客様の LTV はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"20,400 円\"},{\"id\":\"b\",\"label\":\"2,550 円\"},{\"id\":\"c\",\"label\":\"850 円\"},{\"id\":\"d\",\"label\":\"61,200 円\"}],\"answer\":\"d\",\"explanation\":\"LTV ＝ 1回あたりの利益 × 1年の回数 × 年数 ＝ 850 × 24 × 3 ＝ 61,200 円です。20,400 円は1年分です。\",\"reviewSection\":\"顧客生涯価値（LTV）\"},\"ownerTitle\":\"お客様を呼ぶ経路とリピート：手数料と顧客生涯価値\",\"ownerHref\":\"/themes/marketing-03\"},{\"question\":{\"id\":\"marketing-03/q-ota-role\",\"prompt\":\"旅行サイトとの付き合い方として、このテーマですすめているものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"はじめてのお客様の入口として使い、2回目からは直接予約してもらう\"},{\"id\":\"b\",\"label\":\"手数料がかかるので、すぐにやめる\"},{\"id\":\"c\",\"label\":\"すべての予約を旅行サイトに任せる\"},{\"id\":\"d\",\"label\":\"旅行サイトだけ値段を下げる\"}],\"answer\":\"a\",\"explanation\":\"旅行サイトは、遠くのお客様に見つけてもらう入口になります。やめるのではありません。リピートのお客様を直接予約に移して、手数料を減らします。\",\"reviewSection\":\"経路ごとの費用\"},\"ownerTitle\":\"お客様を呼ぶ経路とリピート：手数料と顧客生涯価値\",\"ownerHref\":\"/themes/marketing-03\"},{\"question\":{\"id\":\"marketing-03/q-acquisition\",\"prompt\":\"新しいお客様を1人呼ぶ費用について、経営者が確かめることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"できるだけ 0 円に近いこと\"},{\"id\":\"b\",\"label\":\"ライバルより多く使っていること\"},{\"id\":\"c\",\"label\":\"その人の LTV より大きくなっていないこと\"},{\"id\":\"d\",\"label\":\"売上高のちょうど 10％ であること\"}],\"answer\":\"c\",\"explanation\":\"獲得費用が LTV より小さければ、呼ぶほど利益が増えます。LTV より大きいと、呼ぶほど損をします。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"お客様を呼ぶ経路とリピート：手数料と顧客生涯価値\",\"ownerHref\":\"/themes/marketing-03\"},{\"question\":{\"id\":\"marketing-05/q-start\",\"prompt\":\"サービス・プロフィット・チェーンで、くさりの前のほう（お客様より先）にあるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"広告をふやすこと\"},{\"id\":\"b\",\"label\":\"値段を下げること\"},{\"id\":\"c\",\"label\":\"部屋をふやすこと\"},{\"id\":\"d\",\"label\":\"働く人の満足\"}],\"answer\":\"d\",\"explanation\":\"くさりは、社内のしくみが整い、働く人が満足するところから始まります。そこから、辞めない・サービスの質・お客様の満足とリピート・利益へとつながります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"働く人の満足が利益になる：サービス・プロフィット・チェーン\",\"ownerHref\":\"/themes/marketing-05\"},{\"question\":{\"id\":\"marketing-05/q-order\",\"prompt\":\"くさりの順番として正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"働く人の満足 → サービスの質 → お客様のリピート → 利益\"},{\"id\":\"b\",\"label\":\"利益 → 働く人の満足 → サービスの質 → お客様のリピート\"},{\"id\":\"c\",\"label\":\"お客様のリピート → 利益 → 働く人の満足 → サービスの質\"},{\"id\":\"d\",\"label\":\"サービスの質 → 利益 → お客様のリピート → 働く人の満足\"}],\"answer\":\"a\",\"explanation\":\"働く人が満足して残ると、サービスの質が上がります。するとお客様がまた来て、利益がふえます。\",\"reviewSection\":\"くさりの輪を順に見る\"},\"ownerTitle\":\"働く人の満足が利益になる：サービス・プロフィット・チェーン\",\"ownerHref\":\"/themes/marketing-05\"},{\"question\":{\"id\":\"marketing-05/q-minatokan\",\"prompt\":\"みなと館ホテルで、リピートがへっていた一番の原因はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"部屋の値段が高すぎた\"},{\"id\":\"b\",\"label\":\"フロントの人がたくさん辞めて、常連のお客様を覚えた人がいなくなった\"},{\"id\":\"c\",\"label\":\"近くに新しいホテルができた\"},{\"id\":\"d\",\"label\":\"朝ごはんの量が少なかった\"}],\"answer\":\"b\",\"explanation\":\"フロントの人が1年で半分辞め、常連のお客様の顔と名前がわかる人がへりました。くさりの最初の輪が切れていました。\",\"reviewSection\":\"みなと館ホテルで考える\"},\"ownerTitle\":\"働く人の満足が利益になる：サービス・プロフィット・チェーン\",\"ownerHref\":\"/themes/marketing-05\"},{\"question\":{\"id\":\"marketing-05/q-time\",\"prompt\":\"働く人への投資について、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"次の日には利益がふえる\"},{\"id\":\"b\",\"label\":\"PL には出てこない\"},{\"id\":\"c\",\"label\":\"先に費用として出て、利益になるまでには時間がかかる\"},{\"id\":\"d\",\"label\":\"お客様の満足とは関係がない\"}],\"answer\":\"c\",\"explanation\":\"道具の入れかえや休みのしくみには、先にお金がかかります。辞める人がへり、リピートがふえて利益になるまでには、何か月かかかります。\",\"reviewSection\":\"気をつけること\"},\"ownerTitle\":\"働く人の満足が利益になる：サービス・プロフィット・チェーン\",\"ownerHref\":\"/themes/marketing-05\"},{\"question\":{\"id\":\"marketing-05/q-measure\",\"prompt\":\"くさりがどこで切れているかを確かめるには、どうしますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"利益だけを見る\"},{\"id\":\"b\",\"label\":\"スタッフの満足度、口コミの点数、リピートの割合を続けて記録する\"},{\"id\":\"c\",\"label\":\"社長の感覚で決める\"},{\"id\":\"d\",\"label\":\"ライバルの値段だけを見る\"}],\"answer\":\"b\",\"explanation\":\"最後の利益だけを見ても、どの輪が弱いかはわかりません。途中の輪も数字で見て、切れている場所をさがします。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"働く人の満足が利益になる：サービス・プロフィット・チェーン\",\"ownerHref\":\"/themes/marketing-05\"},{\"question\":{\"id\":\"marketing-06/q-equity\",\"prompt\":\"ブランド・エクイティとは何ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"会社の建物と土地の値段\"},{\"id\":\"b\",\"label\":\"名前があるだけで、同じ中身でも選ばれやすくなる力\"},{\"id\":\"c\",\"label\":\"広告にかけたお金の合計\"},{\"id\":\"d\",\"label\":\"商標の登録の手数料\"}],\"answer\":\"b\",\"explanation\":\"ブランド・エクイティは、ブランドの資産のことです。名前を見ただけで選ばれやすくなる力を指します。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"名前が選ばれる理由になる：ブランド（アーカーとケラー）\",\"ownerHref\":\"/themes/marketing-06\"},{\"question\":{\"id\":\"marketing-06/q-aaker\",\"prompt\":\"アーカーがあげたブランドの価値の中身に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"知られていること\"},{\"id\":\"b\",\"label\":\"思いうかぶイメージ\"},{\"id\":\"c\",\"label\":\"また選んでくれる気持ち\"},{\"id\":\"d\",\"label\":\"社員の人数\"}],\"answer\":\"d\",\"explanation\":\"アーカーの4つは、知られていること、質が高いと思われていること、思いうかぶイメージ、また選んでくれる気持ちです。\",\"reviewSection\":\"ブランドの価値は4つでできている\"},\"ownerTitle\":\"名前が選ばれる理由になる：ブランド（アーカーとケラー）\",\"ownerHref\":\"/themes/marketing-06\"},{\"question\":{\"id\":\"marketing-06/q-keller\",\"prompt\":\"ケラーの見方で、価値の高いイメージはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"港の朝市に歩いて行ける宿\"},{\"id\":\"b\",\"label\":\"きれいなホテル\"},{\"id\":\"c\",\"label\":\"ふつうのホテル\"},{\"id\":\"d\",\"label\":\"安いホテル\"}],\"answer\":\"a\",\"explanation\":\"イメージは、強く、好ましく、ほかにないものほど価値があります。「きれい」はどこでも言えますが、「朝市に歩いて行ける」はほかにありません。\",\"reviewSection\":\"ブランドの価値は4つでできている\"},\"ownerTitle\":\"名前が選ばれる理由になる：ブランド（アーカーとケラー）\",\"ownerHref\":\"/themes/marketing-06\"},{\"question\":{\"id\":\"marketing-06/q-same-name\",\"prompt\":\"グループの全部の館とお店に同じ名前を付けるとき、気をつけることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"名前を知ってもらうのにお金がかかりすぎる\"},{\"id\":\"b\",\"label\":\"1つの評判がほかに広がらない\"},{\"id\":\"c\",\"label\":\"1つの館の悪い口コミが、全部に広がる\"},{\"id\":\"d\",\"label\":\"法律で禁止されている\"}],\"answer\":\"c\",\"explanation\":\"同じ名前だと、よい評判も悪い評判も全部に広がります。だから、どの館やお店でも質をそろえる必要があります。\",\"reviewSection\":\"グループの名前をどう付けるか\"},\"ownerTitle\":\"名前が選ばれる理由になる：ブランド（アーカーとケラー）\",\"ownerHref\":\"/themes/marketing-06\"},{\"question\":{\"id\":\"marketing-06/q-where\",\"prompt\":\"ブランドのイメージをつくるのに、いちばん効くものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎日、現場でお客様が受ける体験\"},{\"id\":\"b\",\"label\":\"社長のあいさつ文\"},{\"id\":\"c\",\"label\":\"会社のロゴの色だけ\"},{\"id\":\"d\",\"label\":\"決算書\"}],\"answer\":\"a\",\"explanation\":\"イメージは、お客様の頭の中でつくられます。広告で言うことより、実際の接客や料理の体験が効きます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"名前が選ばれる理由になる：ブランド（アーカーとケラー）\",\"ownerHref\":\"/themes/marketing-06\"},{\"question\":{\"id\":\"negotiation-01/q-batna\",\"prompt\":\"BATNA とは、何のことですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"交渉がまとまらなかったときの、いちばんよい代わりの案\"},{\"id\":\"b\",\"label\":\"交渉で最初に出す数字\"},{\"id\":\"c\",\"label\":\"相手の名前\"},{\"id\":\"d\",\"label\":\"契約書の題名\"}],\"answer\":\"a\",\"explanation\":\"BATNA は、話がまとまらなかったときに取る、いちばんよい代わりの案です。これがよいほど、交渉で強く出られます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"交渉の準備：決裂したらどうするかを先に決める\",\"ownerHref\":\"/themes/negotiation-01\"},{\"question\":{\"id\":\"negotiation-01/q-limit\",\"prompt\":\"移る先の家賃は月 52 万円です。引っこしの費用を月にならすと 10 万円です。今の店で受けてよい家賃の上限はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"月 52 万円\"},{\"id\":\"b\",\"label\":\"月 60 万円\"},{\"id\":\"c\",\"label\":\"月 62 万円\"},{\"id\":\"d\",\"label\":\"月 42 万円\"}],\"answer\":\"c\",\"explanation\":\"移った場合、実際にかかる家賃は 52 ＋ 10 ＝ 62 万円です。これより安ければ、今の店に残る方がよいです。\",\"reviewSection\":\"家賃の交渉で考える\"},\"ownerTitle\":\"交渉の準備：決裂したらどうするかを先に決める\",\"ownerHref\":\"/themes/negotiation-01\"},{\"question\":{\"id\":\"negotiation-01/q-zopa\",\"prompt\":\"自分の上限は月 62 万円です。家主が受けてよい下限は月 55 万円です。合意できる範囲はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"月 62 万円以上\"},{\"id\":\"b\",\"label\":\"月 55〜62 万円\"},{\"id\":\"c\",\"label\":\"月 55 万円未満\"},{\"id\":\"d\",\"label\":\"合意できる範囲はない\"}],\"answer\":\"b\",\"explanation\":\"自分の上限と、相手の下限のあいだが、合意できる範囲です。この中で、理由のある数字を示して交渉します。\",\"reviewSection\":\"家賃の交渉で考える\"},\"ownerTitle\":\"交渉の準備：決裂したらどうするかを先に決める\",\"ownerHref\":\"/themes/negotiation-01\"},{\"question\":{\"id\":\"negotiation-01/q-prepare\",\"prompt\":\"交渉で強く出られるようになるための、いちばんの準備はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"大きな声で話す練習\"},{\"id\":\"b\",\"label\":\"相手を急がせる\"},{\"id\":\"c\",\"label\":\"最初に極端な数字を出す\"},{\"id\":\"d\",\"label\":\"交渉の前に、自分の代わりの案を調べてよくしておく\"}],\"answer\":\"d\",\"explanation\":\"交渉の強さは、まとまらなくても困らない代わりの案があるかで決まります。実際に見積もりを取るなどして、代わりの案を確かなものにしましょう。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"交渉の準備：決裂したらどうするかを先に決める\",\"ownerHref\":\"/themes/negotiation-01\"},{\"question\":{\"id\":\"negotiation-01/q-bluff\",\"prompt\":\"持っていない代わりの案をちらつかせると、どうなりやすいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"見ぬかれたときに信用をなくし、その後の交渉で不利になる\"},{\"id\":\"b\",\"label\":\"必ず有利な条件になる\"},{\"id\":\"c\",\"label\":\"相手が喜ぶ\"},{\"id\":\"d\",\"label\":\"何も起こらない\"}],\"answer\":\"a\",\"explanation\":\"長く付き合う相手との交渉では、信用がいちばん大事な財産です。代わりの案は、本物を用意しましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"交渉の準備：決裂したらどうするかを先に決める\",\"ownerHref\":\"/themes/negotiation-01\"},{\"question\":{\"id\":\"negotiation-04/q-principles\",\"prompt\":\"ハーバード流交渉術の4つの原則に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人と問題を分ける\"},{\"id\":\"b\",\"label\":\"立場ではなく、利害に目を向ける\"},{\"id\":\"c\",\"label\":\"最初に強く出て、相手をおどす\"},{\"id\":\"d\",\"label\":\"だれもが納得できる基準を使う\"}],\"answer\":\"c\",\"explanation\":\"4つの原則は、人と問題を分ける、利害に目を向ける、得になる案を作る、基準を使う、です。おどしは入りません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ハーバード流交渉術：4つの原則で話し合う\",\"ownerHref\":\"/themes/negotiation-04\"},{\"question\":{\"id\":\"negotiation-04/q-interest\",\"prompt\":\"「利害」の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"「いくらにしてほしい」という言い分\"},{\"id\":\"b\",\"label\":\"交渉に勝った方の得\"},{\"id\":\"c\",\"label\":\"契約書の条文\"},{\"id\":\"d\",\"label\":\"言い分の裏にある、本当の望みや心配\"}],\"answer\":\"d\",\"explanation\":\"「いくらにしてほしい」は立場です。その裏にある理由や心配が利害です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ハーバード流交渉術：4つの原則で話し合う\",\"ownerHref\":\"/themes/negotiation-04\"},{\"question\":{\"id\":\"negotiation-04/q-ask-why\",\"prompt\":\"酒屋さんに「1割値上げしたい」と言われました。最初にすることとして、よいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"すぐに断る\"},{\"id\":\"b\",\"label\":\"なぜ値上げしたいのか、理由を聞く\"},{\"id\":\"c\",\"label\":\"まん中の 5％ で手を打つ\"},{\"id\":\"d\",\"label\":\"ほかの酒屋さんに変えると言う\"}],\"answer\":\"b\",\"explanation\":\"理由（利害）を聞くと、値段のほかに動かせる条件が見つかります。\",\"reviewSection\":\"4つの原則\"},\"ownerTitle\":\"ハーバード流交渉術：4つの原則で話し合う\",\"ownerHref\":\"/themes/negotiation-04\"},{\"question\":{\"id\":\"negotiation-04/q-criteria\",\"prompt\":\"「だれもが納得できる基準」の例はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ガソリン代の上がり具合や、まわりの店の仕入れ値\"},{\"id\":\"b\",\"label\":\"どちらの声が大きいか\"},{\"id\":\"c\",\"label\":\"先に言い出した方の数字\"},{\"id\":\"d\",\"label\":\"社長の気分\"}],\"answer\":\"a\",\"explanation\":\"相場や数字のように、どちらの言い分でもない物差しを使うと、言い合いになりにくいです。\",\"reviewSection\":\"4つの原則\"},\"ownerTitle\":\"ハーバード流交渉術：4つの原則で話し合う\",\"ownerHref\":\"/themes/negotiation-04\"},{\"question\":{\"id\":\"negotiation-04/q-book\",\"prompt\":\"ハーバード流交渉術のもとになった本について、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"カーネマンが 2011 年に書いた\"},{\"id\":\"b\",\"label\":\"コッターが 1996 年に書いた\"},{\"id\":\"c\",\"label\":\"チャルディーニが 1984 年に書いた\"},{\"id\":\"d\",\"label\":\"フィッシャーとユーリーが 1981 年に書いた『Getting to Yes』\"}],\"answer\":\"d\",\"explanation\":\"『Getting to Yes』は 1981 年に出ました。訳は『ハーバード流交渉術』です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ハーバード流交渉術：4つの原則で話し合う\",\"ownerHref\":\"/themes/negotiation-04\"},{\"question\":{\"id\":\"negotiation-02/q-calc\",\"prompt\":\"1年に 2,000 万円の仕入れの値段が 3％ 下がると、1年でいくら費用が減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"6 万円\"},{\"id\":\"b\",\"label\":\"600 万円\"},{\"id\":\"c\",\"label\":\"60 万円\"},{\"id\":\"d\",\"label\":\"1,940 万円\"}],\"answer\":\"c\",\"explanation\":\"2,000 万円 × 3％ ＝ 60 万円です。交渉の前に、1％ の違いが1年でいくらになるかを計算しておきましょう。\",\"reviewSection\":\"仕入先との交渉\"},\"ownerTitle\":\"仕入先・銀行との交渉：相手の得を一緒に考える\",\"ownerHref\":\"/themes/negotiation-02\"},{\"question\":{\"id\":\"negotiation-02/q-only-price\",\"prompt\":\"値段だけを押し下げる交渉のよくない点として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"法律で禁止されている\"},{\"id\":\"b\",\"label\":\"一度は勝てても、品質が下がる・後回しにされるなどの形で返ってくる\"},{\"id\":\"c\",\"label\":\"必ず値段が上がる\"},{\"id\":\"d\",\"label\":\"税金が増える\"}],\"answer\":\"b\",\"explanation\":\"相手に得がない条件は、長続きしません。よい魚を後回しにされるなど、別の形で損が返ってきます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"仕入先・銀行との交渉：相手の得を一緒に考える\",\"ownerHref\":\"/themes/negotiation-02\"},{\"question\":{\"id\":\"negotiation-02/q-give\",\"prompt\":\"仕入先にとって得になる条件として、このテーマが挙げていないのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1年分の注文の量を約束する\"},{\"id\":\"b\",\"label\":\"支払いを早める\"},{\"id\":\"c\",\"label\":\"注文を前の日に決めておく\"},{\"id\":\"d\",\"label\":\"支払いを半年おくらせる\"}],\"answer\":\"d\",\"explanation\":\"支払いをおくらせると、相手のお金のやりくりが苦しくなります。注文の量の約束、早い支払い、早い注文の決定は、相手の得になります。\",\"reviewSection\":\"仕入先との交渉\"},\"ownerTitle\":\"仕入先・銀行との交渉：相手の得を一緒に考える\",\"ownerHref\":\"/themes/negotiation-02\"},{\"question\":{\"id\":\"negotiation-02/q-bank\",\"prompt\":\"銀行がお金を貸すかどうかを決めるとき、いちばん知りたいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"返してもらえるか\"},{\"id\":\"b\",\"label\":\"社長の趣味\"},{\"id\":\"c\",\"label\":\"店の内装の色\"},{\"id\":\"d\",\"label\":\"競合の社長の名前\"}],\"answer\":\"a\",\"explanation\":\"銀行は、貸したお金が利息といっしょに返ってくるかを見ます。数字と計画で、本業でかせぐ現金から返せることを示しましょう。\",\"reviewSection\":\"銀行との交渉\"},\"ownerTitle\":\"仕入先・銀行との交渉：相手の得を一緒に考える\",\"ownerHref\":\"/themes/negotiation-02\"},{\"question\":{\"id\":\"negotiation-02/q-bad-news\",\"prompt\":\"業績が悪くなったとき、銀行への伝え方として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"決算までかくしておく\"},{\"id\":\"b\",\"label\":\"悪い知らせほど早く伝え、計画といっしょに相談する\"},{\"id\":\"c\",\"label\":\"別の銀行に乗りかえる\"},{\"id\":\"d\",\"label\":\"数字をよく見せて伝える\"}],\"answer\":\"b\",\"explanation\":\"早く伝えるほど、返す条件の見直しなど、いっしょに手を考えやすくなります。かくしてあとでわかると、信用をなくします。\",\"reviewSection\":\"銀行との交渉\"},\"ownerTitle\":\"仕入先・銀行との交渉：相手の得を一緒に考える\",\"ownerHref\":\"/themes/negotiation-02\"},{\"question\":{\"id\":\"negotiation-05/q-reciprocity\",\"prompt\":\"「してもらったら、お返ししたくなる」原則を何と呼びますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"希少性\"},{\"id\":\"b\",\"label\":\"返報性\"},{\"id\":\"c\",\"label\":\"権威\"},{\"id\":\"d\",\"label\":\"社会的証明\"}],\"answer\":\"b\",\"explanation\":\"返報性は、何かをしてもらうと、お返しをしたくなる原則です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"影響力の武器：人が「はい」と言うしくみ\",\"ownerHref\":\"/themes/negotiation-05\"},{\"question\":{\"id\":\"negotiation-05/q-scarcity\",\"prompt\":\"予約ページに「残り 2 室」と出すとき、正直な使い方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"いつも「残り 2 室」と出しておく\"},{\"id\":\"b\",\"label\":\"空いている部屋が多いときほど出す\"},{\"id\":\"c\",\"label\":\"本当に残りが少ない部屋だけに出す\"},{\"id\":\"d\",\"label\":\"ほかのホテルの残りの数を出す\"}],\"answer\":\"c\",\"explanation\":\"希少性は、事実のときだけ使います。うその限定は、ばれたときに信用をなくします。\",\"reviewSection\":\"ホテルと飲食での使い方\"},\"ownerTitle\":\"影響力の武器：人が「はい」と言うしくみ\",\"ownerHref\":\"/themes/negotiation-05\"},{\"question\":{\"id\":\"negotiation-05/q-social-proof\",\"prompt\":\"営業の人に「ほかのホテルさんも、みんな入れています」と言われました。これはどの原則ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"返報性\"},{\"id\":\"b\",\"label\":\"一貫性\"},{\"id\":\"c\",\"label\":\"好意\"},{\"id\":\"d\",\"label\":\"社会的証明\"}],\"answer\":\"d\",\"explanation\":\"みんながしていることは正しいと思う、社会的証明の原則です。自分の店に合うかは、別に考えます。\",\"reviewSection\":\"使われる側として気づく\"},\"ownerTitle\":\"影響力の武器：人が「はい」と言うしくみ\",\"ownerHref\":\"/themes/negotiation-05\"},{\"question\":{\"id\":\"negotiation-05/q-seventh\",\"prompt\":\"2021 年の新しい版で足された 7 つ目の原則は、どんな内容ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"「同じ仲間だ」と感じる相手には、「はい」と言いやすい\"},{\"id\":\"b\",\"label\":\"値段が高いものほど、よく売れる\"},{\"id\":\"c\",\"label\":\"朝より夜の方が、決めやすい\"},{\"id\":\"d\",\"label\":\"書面にすると、断りやすい\"}],\"answer\":\"a\",\"explanation\":\"7 つ目は、「同じ仲間だ」と感じる相手に応じやすい、という原則です。訳の新版は 2023 年に出ました。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"影響力の武器：人が「はい」と言うしくみ\",\"ownerHref\":\"/themes/negotiation-05\"},{\"question\":{\"id\":\"negotiation-05/q-pressure\",\"prompt\":\"営業で「今日決めてくれれば、この値段です」と言われました。よい対応はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"その場ですぐ契約する\"},{\"id\":\"b\",\"label\":\"明日でも同じ条件か聞き、一晩おいて数字で確かめる\"},{\"id\":\"c\",\"label\":\"何も聞かずに断る\"},{\"id\":\"d\",\"label\":\"ほかの店にも今日決めるようにすすめる\"}],\"answer\":\"b\",\"explanation\":\"「今日だけ」は希少性です。その場で決めず、数字で確かめると、くせにふり回されにくくなります。\",\"reviewSection\":\"使われる側として気づく\"},\"ownerTitle\":\"影響力の武器：人が「はい」と言うしくみ\",\"ownerHref\":\"/themes/negotiation-05\"},{\"question\":{\"id\":\"negotiation-03/q-order\",\"prompt\":\"このテーマがすすめる、説明の順番はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"いきさつ → 苦労話 → 結論\"},{\"id\":\"b\",\"label\":\"理由を10個 → 結論\"},{\"id\":\"c\",\"label\":\"数字だけを並べる\"},{\"id\":\"d\",\"label\":\"結論 → 理由（3つまで） → 数字 → お願い\"}],\"answer\":\"d\",\"explanation\":\"聞く人が決めることを、先に言います。それを理由と数字でささえます。最後に、何を決めてほしいかをはっきり伝えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"伝わる説明：結論から、数字で、お願いまで\",\"ownerHref\":\"/themes/negotiation-03\"},{\"question\":{\"id\":\"negotiation-03/q-first\",\"prompt\":\"聞く人が、説明の最初に知りたいことは何ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"自分は何を決めればよいか\"},{\"id\":\"b\",\"label\":\"話す人の経歴\"},{\"id\":\"c\",\"label\":\"これまでのいきさつ\"},{\"id\":\"d\",\"label\":\"資料の枚数\"}],\"answer\":\"a\",\"explanation\":\"何を決めるのかがわかれば、聞く人はそのつもりで理由や数字を聞けます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"伝わる説明：結論から、数字で、お願いまで\",\"ownerHref\":\"/themes/negotiation-03\"},{\"question\":{\"id\":\"negotiation-03/q-number\",\"prompt\":\"数字の示し方として、いちばん伝わるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"RevPAR は 15,000 円\"},{\"id\":\"b\",\"label\":\"RevPAR は 15,000 円（今は 11,200 円）\"},{\"id\":\"c\",\"label\":\"RevPAR はかなり上がる\"},{\"id\":\"d\",\"label\":\"数字は示さない\"}],\"answer\":\"b\",\"explanation\":\"数字は、くらべる相手と並べると意味が伝わります。今との差が見えると、案の効果を判断しやすくなります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"伝わる説明：結論から、数字で、お願いまで\",\"ownerHref\":\"/themes/negotiation-03\"},{\"question\":{\"id\":\"negotiation-03/q-reasons\",\"prompt\":\"理由の数について、このテーマの考え方に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"多いほど説得力がある\"},{\"id\":\"b\",\"label\":\"理由は言わない\"},{\"id\":\"c\",\"label\":\"強いものを3つまでにしぼる\"},{\"id\":\"d\",\"label\":\"10個以上並べる\"}],\"answer\":\"c\",\"explanation\":\"理由が多すぎると、聞く人は1つもおぼえられません。強い3つにしぼりましょう。\",\"reviewSection\":\"よくある失敗\"},\"ownerTitle\":\"伝わる説明：結論から、数字で、お願いまで\",\"ownerHref\":\"/themes/negotiation-03\"},{\"question\":{\"id\":\"negotiation-03/q-ask\",\"prompt\":\"「お願い」がぬけた説明で、起こりやすいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"説明が終わっても、何を決めればよいかが伝わらず、決めるのが先のばしになる\"},{\"id\":\"b\",\"label\":\"すぐに承認される\"},{\"id\":\"c\",\"label\":\"数字が正しくなる\"},{\"id\":\"d\",\"label\":\"理由が増える\"}],\"answer\":\"a\",\"explanation\":\"最後に「何を、いつまでに決めてほしいか」を言いましょう。言わないと、聞く人は、決める場だと気づかないことがあります。\",\"reviewSection\":\"よくある失敗\"},\"ownerTitle\":\"伝わる説明：結論から、数字で、お願いまで\",\"ownerHref\":\"/themes/negotiation-03\"},{\"question\":{\"id\":\"negotiation-06/q-top\",\"prompt\":\"ピラミッド原則で、いちばん上に置くものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"調べたことの一覧\"},{\"id\":\"b\",\"label\":\"これまでのいきさつ\"},{\"id\":\"c\",\"label\":\"細かい数字の表\"},{\"id\":\"d\",\"label\":\"言いたいこと（結論）を1つ\"}],\"answer\":\"d\",\"explanation\":\"いちばん上は結論です。その下に理由、さらにその下に事実や数字を積みます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ピラミッド原則：結論を上に、理由を下に積む\",\"ownerHref\":\"/themes/negotiation-06\"},{\"question\":{\"id\":\"negotiation-06/q-link\",\"prompt\":\"ピラミッドの上と下は、どんな問いでつながりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"「いつ？」と「どこで？」\"},{\"id\":\"b\",\"label\":\"「なぜ？」と「だから？」\"},{\"id\":\"c\",\"label\":\"「だれが？」と「いくら？」\"},{\"id\":\"d\",\"label\":\"「本当に？」と「どうして今？」\"}],\"answer\":\"b\",\"explanation\":\"上から「なぜ？」と聞くと下が答え、下から「だから？」と聞くと上が答えになるように組みます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ピラミッド原則：結論を上に、理由を下に積む\",\"ownerHref\":\"/themes/negotiation-06\"},{\"question\":{\"id\":\"negotiation-06/q-overlap\",\"prompt\":\"ランチを始める理由に「売上が増える」と「お客様が増える」を並べました。どう直すのがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ほぼ同じことなので、1つにまとめる\"},{\"id\":\"b\",\"label\":\"そのまま並べる\"},{\"id\":\"c\",\"label\":\"理由をもっと増やす\"},{\"id\":\"d\",\"label\":\"結論を消す\"}],\"answer\":\"a\",\"explanation\":\"横にならぶ理由は、重ならず、もれがないようにします。重なる理由は1つにまとめます。\",\"reviewSection\":\"よくある失敗\"},\"ownerTitle\":\"ピラミッド原則：結論を上に、理由を下に積む\",\"ownerHref\":\"/themes/negotiation-06\"},{\"question\":{\"id\":\"negotiation-06/q-count\",\"prompt\":\"結論を支える理由は、いくつくらいにしぼるとよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1つだけ\"},{\"id\":\"b\",\"label\":\"思いつくだけ全部\"},{\"id\":\"c\",\"label\":\"3つくらい\"},{\"id\":\"d\",\"label\":\"10 個以上\"}],\"answer\":\"c\",\"explanation\":\"理由が多すぎると覚えられません。まとめて 3 つくらいにしぼりましょう。\",\"reviewSection\":\"よくある失敗\"},\"ownerTitle\":\"ピラミッド原則：結論を上に、理由を下に積む\",\"ownerHref\":\"/themes/negotiation-06\"},{\"question\":{\"id\":\"negotiation-06/q-book\",\"prompt\":\"ピラミッド原則を教えてきたバーバラ・ミントについて、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"『ファスト＆スロー』を書いた\"},{\"id\":\"b\",\"label\":\"ハーバード流交渉術の4つの原則を作った\"},{\"id\":\"c\",\"label\":\"影響力の6つの原則を作った\"},{\"id\":\"d\",\"label\":\"マッキンゼーで初めての女性コンサルタントで、本の訳は『考える技術・書く技術』\"}],\"answer\":\"d\",\"explanation\":\"ミントはマッキンゼーで初めての女性コンサルタントでした。本の訳は『考える技術・書く技術』（ダイヤモンド社）です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ピラミッド原則：結論を上に、理由を下に積む\",\"ownerHref\":\"/themes/negotiation-06\"},{\"question\":{\"id\":\"operations-01/q-occupancy\",\"prompt\":\"80室のホテルで、ある日 60 室が売れました。稼働率は何％ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"75％\"},{\"id\":\"b\",\"label\":\"60％\"},{\"id\":\"c\",\"label\":\"80％\"},{\"id\":\"d\",\"label\":\"133％\"}],\"answer\":\"a\",\"explanation\":\"稼働率 ＝ 売れた部屋の数 ÷ 売れる部屋の数 ＝ 60 ÷ 80 ＝ 75％ です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ホテルの数字：稼働率・客室単価・RevPAR\",\"ownerHref\":\"/themes/operations-01\"},{\"question\":{\"id\":\"operations-01/q-adr\",\"prompt\":\"客室の売上が 90 万円で、売れた部屋は 60 室でした。客室単価（ADR）はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"11,250 円\"},{\"id\":\"b\",\"label\":\"9,000 円\"},{\"id\":\"c\",\"label\":\"15,000 円\"},{\"id\":\"d\",\"label\":\"16,000 円\"}],\"answer\":\"c\",\"explanation\":\"ADR ＝ 客室の売上 ÷ 売れた部屋の数 ＝ 90 万円 ÷ 60 室 ＝ 15,000 円です。売れる部屋の数（80室）で割ると、RevPAR（11,250 円）になります。\",\"reviewSection\":\"3つの数字を計算する\"},\"ownerTitle\":\"ホテルの数字：稼働率・客室単価・RevPAR\",\"ownerHref\":\"/themes/operations-01\"},{\"question\":{\"id\":\"operations-01/q-revpar\",\"prompt\":\"稼働率 75％、客室単価 16,000 円のとき、RevPAR はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"16,000 円\"},{\"id\":\"b\",\"label\":\"12,000 円\"},{\"id\":\"c\",\"label\":\"21,333 円\"},{\"id\":\"d\",\"label\":\"4,000 円\"}],\"answer\":\"b\",\"explanation\":\"RevPAR ＝ 稼働率 × 客室単価 ＝ 0.75 × 16,000 ＝ 12,000 円です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ホテルの数字：稼働率・客室単価・RevPAR\",\"ownerHref\":\"/themes/operations-01\"},{\"question\":{\"id\":\"operations-01/q-compare\",\"prompt\":\"A 案は稼働率 95％・値段 11,000 円、B 案は稼働率 80％・値段 14,000 円です。客室の稼ぎが多いのはどちらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"A 案。満室に近いから\"},{\"id\":\"b\",\"label\":\"同じ\"},{\"id\":\"c\",\"label\":\"くらべられない\"},{\"id\":\"d\",\"label\":\"B 案。RevPAR が 11,200 円で、A 案の 10,450 円より高いから\"}],\"answer\":\"d\",\"explanation\":\"RevPAR は、A が 0.95 × 11,000 ＝ 10,450 円、B が 0.8 × 14,000 ＝ 11,200 円です。さらに B は売れた部屋が少ないので、そうじなどの費用も少なくなります。\",\"reviewSection\":\"どちらの案がよいか\"},\"ownerTitle\":\"ホテルの数字：稼働率・客室単価・RevPAR\",\"ownerHref\":\"/themes/operations-01\"},{\"question\":{\"id\":\"operations-01/q-trap\",\"prompt\":\"「稼働率が 95％ なので、経営は順調だ」という考えの問題点はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"稼働率は 100％ でないと意味がないから\"},{\"id\":\"b\",\"label\":\"安く売って埋めているだけなら、売上も利益も少ないことがあるから\"},{\"id\":\"c\",\"label\":\"稼働率は PL に関係ないから\"},{\"id\":\"d\",\"label\":\"稼働率は毎日変わるから\"}],\"answer\":\"b\",\"explanation\":\"稼働率は、値段を見ていません。値下げで埋めた満室は、RevPAR も利益も低いことがあります。稼働率と値段をいっしょに見ましょう。\",\"reviewSection\":\"どちらの案がよいか\"},\"ownerTitle\":\"ホテルの数字：稼働率・客室単価・RevPAR\",\"ownerHref\":\"/themes/operations-01\"},{\"question\":{\"id\":\"operations-04/q-what\",\"prompt\":\"レベニュー・マネジメントで決めることとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"社員の給料の上げ方\"},{\"id\":\"b\",\"label\":\"建物の修理の時期\"},{\"id\":\"c\",\"label\":\"いつ・誰に・いくらで・どれだけ売るか\"},{\"id\":\"d\",\"label\":\"決算の日\"}],\"answer\":\"c\",\"explanation\":\"売れる量に限りがある部屋や席を、いつ・誰に・いくらで・どれだけ売るかを決めて、売上をいちばん大きくします。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"売れ残りをへらし、売り時を逃さない：レベニュー・マネジメント\",\"ownerHref\":\"/themes/operations-04\"},{\"question\":{\"id\":\"operations-04/q-calc\",\"prompt\":\"80 室のうち、60 室を 12,000 円、20 室を 18,000 円で売りました。客室の売上はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"108 万円\"},{\"id\":\"b\",\"label\":\"96 万円\"},{\"id\":\"c\",\"label\":\"120 万円\"},{\"id\":\"d\",\"label\":\"144 万円\"}],\"answer\":\"a\",\"explanation\":\"60 室 × 12,000 円 ＝ 72 万円、20 室 × 18,000 円 ＝ 36 万円。合わせて 108 万円です。\",\"reviewSection\":\"早く安く売りすぎない\"},\"ownerTitle\":\"売れ残りをへらし、売り時を逃さない：レベニュー・マネジメント\",\"ownerHref\":\"/themes/operations-04\"},{\"question\":{\"id\":\"operations-04/q-early\",\"prompt\":\"1か月前に全部の部屋を安く売り切る案の、いちばんの問題はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"そうじの手間がふえる\"},{\"id\":\"b\",\"label\":\"高くても泊まりたい直前のお客様を断ることになる\"},{\"id\":\"c\",\"label\":\"税金が高くなる\"},{\"id\":\"d\",\"label\":\"稼働率が下がる\"}],\"answer\":\"b\",\"explanation\":\"満室にはなりますが、18,000 円でも泊まる直前のお客様を断ることになります。そのぶん売上を逃しています。\",\"reviewSection\":\"早く安く売りすぎない\"},\"ownerTitle\":\"売れ残りをへらし、売り時を逃さない：レベニュー・マネジメント\",\"ownerHref\":\"/themes/operations-04\"},{\"question\":{\"id\":\"operations-04/q-slow\",\"prompt\":\"予約の入り方が去年の同じ日より遅いとき、とる手はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何もせずに待つ\"},{\"id\":\"b\",\"label\":\"値段を上げる\"},{\"id\":\"c\",\"label\":\"部屋の数をへらす\"},{\"id\":\"d\",\"label\":\"値段を下げるか、出す経路をふやす\"}],\"answer\":\"d\",\"explanation\":\"予想より遅いときは、値段を下げたり、予約サイトに出す部屋をふやしたりします。予想より早いときは、値段を上げます。\",\"reviewSection\":\"予想がはずれたときは\"},\"ownerTitle\":\"売れ残りをへらし、売り時を逃さない：レベニュー・マネジメント\",\"ownerHref\":\"/themes/operations-04\"},{\"question\":{\"id\":\"operations-04/q-revpash\",\"prompt\":\"30 席のお店で、18〜22時の4時間の売上が 18 万円でした。RevPASH はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"6,000 円\"},{\"id\":\"b\",\"label\":\"4,500 円\"},{\"id\":\"c\",\"label\":\"1,500 円\"},{\"id\":\"d\",\"label\":\"750 円\"}],\"answer\":\"c\",\"explanation\":\"RevPASH ＝ 売上 ÷（席の数 × 営業時間）＝ 18 万円 ÷（30 席 × 4 時間）＝ 1,500 円です。\",\"reviewSection\":\"飲食店では席と時間で考える\"},\"ownerTitle\":\"売れ残りをへらし、売り時を逃さない：レベニュー・マネジメント\",\"ownerHref\":\"/themes/operations-04\"},{\"question\":{\"id\":\"operations-02/q-cost-rate\",\"prompt\":\"1か月の売上が 500 万円、食材・飲み物の原価が 160 万円のお店です。原価率はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"16％\"},{\"id\":\"b\",\"label\":\"68％\"},{\"id\":\"c\",\"label\":\"3.1％\"},{\"id\":\"d\",\"label\":\"32％\"}],\"answer\":\"d\",\"explanation\":\"原価率 ＝ 原価 ÷ 売上高 ＝ 160 ÷ 500 ＝ 32％ です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"飲食の数字：原価率と FL 比率\",\"ownerHref\":\"/themes/operations-02\"},{\"question\":{\"id\":\"operations-02/q-fl\",\"prompt\":\"売上 600 万円、食材 180 万円、人件費 180 万円のとき、FL 比率はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"60％\"},{\"id\":\"b\",\"label\":\"30％\"},{\"id\":\"c\",\"label\":\"40％\"},{\"id\":\"d\",\"label\":\"100％\"}],\"answer\":\"a\",\"explanation\":\"FL 比率 ＝ (食材 ＋ 人件費) ÷ 売上高 ＝ 360 ÷ 600 ＝ 60％ です。\",\"reviewSection\":\"うみかぜ食堂の1か月\"},\"ownerTitle\":\"飲食の数字：原価率と FL 比率\",\"ownerHref\":\"/themes/operations-02\"},{\"question\":{\"id\":\"operations-02/q-gap\",\"prompt\":\"理論原価率 28％、実際原価率 30％、売上 600 万円のお店です。差は1か月いくらにあたりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2 万円\"},{\"id\":\"b\",\"label\":\"1.2 万円\"},{\"id\":\"c\",\"label\":\"12 万円\"},{\"id\":\"d\",\"label\":\"180 万円\"}],\"answer\":\"c\",\"explanation\":\"差は 2％ です。600 万円 × 2％ ＝ 12 万円です。この分が、捨てた食材や盛りつけのばらつきなどで、なくなっています。\",\"reviewSection\":\"理論原価率と実際原価率\"},\"ownerTitle\":\"飲食の数字：原価率と FL 比率\",\"ownerHref\":\"/themes/operations-02\"},{\"question\":{\"id\":\"operations-02/q-gap-cause\",\"prompt\":\"理論原価率と実際原価率の差の原因として、当てはまらないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"仕込みすぎて捨てた食材\"},{\"id\":\"b\",\"label\":\"家賃の値上がり\"},{\"id\":\"c\",\"label\":\"盛りつけの量のばらつき\"},{\"id\":\"d\",\"label\":\"記録していないまかない\"}],\"answer\":\"b\",\"explanation\":\"家賃は原価（食材・飲み物）ではないので、原価率の差の原因になりません。ほかの3つは、使った食材が売上につながらない原因です。\",\"reviewSection\":\"理論原価率と実際原価率\"},\"ownerTitle\":\"飲食の数字：原価率と FL 比率\",\"ownerHref\":\"/themes/operations-02\"},{\"question\":{\"id\":\"operations-02/q-high-cost\",\"prompt\":\"原価率は 45％ ですが、1皿の粗利が 900 円あって、よく売れる人気の料理があります。どう考えるのがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"原価率が高いので、すぐにメニューから外す\"},{\"id\":\"b\",\"label\":\"原価率が 30％ になるまで値上げする\"},{\"id\":\"c\",\"label\":\"食材の質を下げる\"},{\"id\":\"d\",\"label\":\"粗利の額と売れる数も見て、お店全体の利益にどれだけ役立っているかで決める\"}],\"answer\":\"d\",\"explanation\":\"原価率が高くても、粗利の額が大きく、たくさん売れる料理は、お店の利益を支えていることがあります。割合だけでなく、額と数で決めましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"飲食の数字：原価率と FL 比率\",\"ownerHref\":\"/themes/operations-02\"},{\"question\":{\"id\":\"operations-03/q-formula\",\"prompt\":\"このテーマで使う、人時生産性の計算はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高 ÷ スタッフの人数\"},{\"id\":\"b\",\"label\":\"人件費 ÷ 売上高\"},{\"id\":\"c\",\"label\":\"粗利 ÷ 全員の働いた時間の合計\"},{\"id\":\"d\",\"label\":\"全員の働いた時間の合計 ÷ 営業日数\"}],\"answer\":\"c\",\"explanation\":\"人時生産性は、1時間働くと、いくらの粗利が生まれたかを表します。粗利 ÷ 全員の働いた時間の合計 で計算します。人件費 ÷ 売上高 は、人件費率です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"人時生産性とシフトの組み方\",\"ownerHref\":\"/themes/operations-03\"},{\"question\":{\"id\":\"operations-03/q-calc\",\"prompt\":\"粗利 420 万円、全員の働いた時間の合計が 1,750 時間のお店です。人時生産性はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2,400 円\"},{\"id\":\"b\",\"label\":\"3,429 円\"},{\"id\":\"c\",\"label\":\"1,200 円\"},{\"id\":\"d\",\"label\":\"24,000 円\"}],\"answer\":\"a\",\"explanation\":\"420 万円 ÷ 1,750 時間 ＝ 2,400 円です。売上 600 万円で割ると 3,429 円になりますが、ここでは粗利で計算します。\",\"reviewSection\":\"計算してみる\"},\"ownerTitle\":\"人時生産性とシフトの組み方\",\"ownerHref\":\"/themes/operations-03\"},{\"question\":{\"id\":\"operations-03/q-idle\",\"prompt\":\"時間帯ごとの表で、まず見直す時間帯はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"11〜14時（1時間の売上 3.6 万円、5 人）\"},{\"id\":\"b\",\"label\":\"17〜21時（1時間の売上 2.0 万円、5 人）\"},{\"id\":\"c\",\"label\":\"どの時間帯も同じ\"},{\"id\":\"d\",\"label\":\"14〜17時（1時間の売上 0.4 万円、4 人）\"}],\"answer\":\"d\",\"explanation\":\"14〜17時は、売上が少ないのに 4 人いて、1人あたりの売上がいちばん低いです。仕込みやそうじをまとめて、人数を減らせる余地があります。\",\"reviewSection\":\"時間帯ごとに見る\"},\"ownerTitle\":\"人時生産性とシフトの組み方\",\"ownerHref\":\"/themes/operations-03\"},{\"question\":{\"id\":\"operations-03/q-after\",\"prompt\":\"粗利 420 万円のまま、働いた時間の合計を 1,750 時間から 1,570 時間に減らしました。人時生産性はおよそいくらになりますか。\",\"ch
