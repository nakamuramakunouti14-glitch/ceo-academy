oices\":[{\"id\":\"a\",\"label\":\"2,400 円\"},{\"id\":\"b\",\"label\":\"約 2,675 円\"},{\"id\":\"c\",\"label\":\"2,800 円\"},{\"id\":\"d\",\"label\":\"2,250 円\"}],\"answer\":\"b\",\"explanation\":\"420 万円 ÷ 1,570 時間 ≒ 2,675 円です。粗利が同じでも、時間が減れば、人時生産性は上がります。\",\"reviewSection\":\"時間帯ごとに見る\"},\"ownerTitle\":\"人時生産性とシフトの組み方\",\"ownerHref\":\"/themes/operations-03\"},{\"question\":{\"id\":\"operations-03/q-caution\",\"prompt\":\"人時生産性を上げようとして、こむ時間の人も減らしました。起こりやすいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"粗利が必ず増える\"},{\"id\":\"b\",\"label\":\"何も起こらない\"},{\"id\":\"c\",\"label\":\"料理を出すのが遅れてお客様が減り、粗利も減る\"},{\"id\":\"d\",\"label\":\"人時生産性がいつまでも上がり続ける\"}],\"answer\":\"c\",\"explanation\":\"人を減らしてサービスが悪くなると、お客様が減り、粗利も減ります。ただ減らすのではなく、仕事のやり方を変えて時間を減らしましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"人時生産性とシフトの組み方\",\"ownerHref\":\"/themes/operations-03\"},{\"question\":{\"id\":\"operations-05/q-jit\",\"prompt\":\"ジャスト・イン・タイムの考え方として正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"必要なものを、必要なときに、必要な量だけつくる\"},{\"id\":\"b\",\"label\":\"売り切れないように、いつも多めにつくる\"},{\"id\":\"c\",\"label\":\"まとめてつくって、安くする\"},{\"id\":\"d\",\"label\":\"注文がなくても、機械を止めない\"}],\"answer\":\"a\",\"explanation\":\"ジャスト・イン・タイムは、必要なものを、必要なときに、必要な量だけつくる考え方です。つくりすぎをなくします。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"むだをなくし、毎日よくする：トヨタ生産方式とカイゼン\",\"ownerHref\":\"/themes/operations-05\"},{\"question\":{\"id\":\"operations-05/q-3mu\",\"prompt\":\"カイゼンでなくしたい「ムダ・ムラ・ムリ」の、ムラはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"役に立たない作業\"},{\"id\":\"b\",\"label\":\"体や心に重すぎる負担\"},{\"id\":\"c\",\"label\":\"高すぎる値段\"},{\"id\":\"d\",\"label\":\"ばらつき\"}],\"answer\":\"d\",\"explanation\":\"ムダは役に立たない作業、ムラはばらつき、ムリは重すぎる負担です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"むだをなくし、毎日よくする：トヨタ生産方式とカイゼン\",\"ownerHref\":\"/themes/operations-05\"},{\"question\":{\"id\":\"operations-05/q-umikaze\",\"prompt\":\"うみかぜ食堂が、煮魚のつくりすぎをへらすためにしたことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎朝 80 人分つくるようにした\"},{\"id\":\"b\",\"label\":\"朝は少なめにつくり、お昼の出方を見て夜の分を追加した\"},{\"id\":\"c\",\"label\":\"煮魚をメニューから外した\"},{\"id\":\"d\",\"label\":\"雨の日は店を閉めた\"}],\"answer\":\"b\",\"explanation\":\"朝は 30 人分だけつくり、お昼の注文の出方を見て、14時に夜の分を追加するようにしました。\",\"reviewSection\":\"必要な量だけつくる\"},\"ownerTitle\":\"むだをなくし、毎日よくする：トヨタ生産方式とカイゼン\",\"ownerHref\":\"/themes/operations-05\"},{\"question\":{\"id\":\"operations-05/q-stop\",\"prompt\":\"客室のそうじでシーツのしみを見つけました。自働化の考え方に合う動きはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"時間がないので、そのまま使う\"},{\"id\":\"b\",\"label\":\"あとでまとめて報告する\"},{\"id\":\"c\",\"label\":\"その場で替えて、フロントに知らせる\"},{\"id\":\"d\",\"label\":\"お客様が気づかなければよいと考える\"}],\"answer\":\"c\",\"explanation\":\"おかしなことを見つけたら、すぐ止めて直し、知らせます。悪い部屋をお客様に届けないためです。\",\"reviewSection\":\"おかしいと思ったら止める\"},\"ownerTitle\":\"むだをなくし、毎日よくする：トヨタ生産方式とカイゼン\",\"ownerHref\":\"/themes/operations-05\"},{\"question\":{\"id\":\"operations-05/q-kaizen\",\"prompt\":\"カイゼンの進め方として、テーマの内容に合うものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"数年に一度、大きな改革をする\"},{\"id\":\"b\",\"label\":\"社長だけが改善を考える\"},{\"id\":\"c\",\"label\":\"お金をかけて新しい機械を入れることから始める\"},{\"id\":\"d\",\"label\":\"気づきを集め、小さくためし、うまくいったら決まりにする\"}],\"answer\":\"d\",\"explanation\":\"カイゼンは、全員で小さな改善を続けることです。気づきを集め、すぐためし、うまくいったやり方を決まりにします。\",\"reviewSection\":\"カイゼンを続けるしくみ\"},\"ownerTitle\":\"むだをなくし、毎日よくする：トヨタ生産方式とカイゼン\",\"ownerHref\":\"/themes/operations-05\"},{\"question\":{\"id\":\"operations-06/q-idea\",\"prompt\":\"制約理論（TOC）の考え方として正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"全部の工程を同じだけよくすると、全体がいちばんよくなる\"},{\"id\":\"b\",\"label\":\"全体の出来高は、いちばん詰まるところで決まる\"},{\"id\":\"c\",\"label\":\"人をふやせば、いつでも売上がふえる\"},{\"id\":\"d\",\"label\":\"いちばん速い工程に合わせて、ほかを急がせる\"}],\"answer\":\"b\",\"explanation\":\"びんの首が細いと、中身はその細さでしか出てきません。全体の出来高は、いちばん詰まるところで決まります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"いちばん細いところを直す：制約理論（TOC）\",\"ownerHref\":\"/themes/operations-06\"},{\"question\":{\"id\":\"operations-06/q-order\",\"prompt\":\"5つの手順で、「人や道具を足す（強くする）」はいつ行いますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"いちばん最初\"},{\"id\":\"b\",\"label\":\"詰まりを見つける前\"},{\"id\":\"c\",\"label\":\"見つける・使いきる・ほかを合わせる、をやったあと\"},{\"id\":\"d\",\"label\":\"やってはいけない\"}],\"answer\":\"c\",\"explanation\":\"お金をかけるのは、詰まりを見つけ、目いっぱい使い、ほかを合わせてからです。それでも足りないときに強くします。\",\"reviewSection\":\"5つの手順\"},\"ownerTitle\":\"いちばん細いところを直す：制約理論（TOC）\",\"ownerHref\":\"/themes/operations-06\"},{\"question\":{\"id\":\"operations-06/q-exploit\",\"prompt\":\"朝ごはんで卵料理のコーナーに行列ができています。「使いきる」にあたる手はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"卵を焼く人に、皿洗いをさせない\"},{\"id\":\"b\",\"label\":\"焼く台をすぐに3つ買う\"},{\"id\":\"c\",\"label\":\"コーヒーの機械を新しくする\"},{\"id\":\"d\",\"label\":\"朝ごはんの時間を短くする\"}],\"answer\":\"a\",\"explanation\":\"お金をかけずに、詰まりの力を目いっぱい使うのが「使いきる」です。焼く人を焼くことに集中させます。\",\"reviewSection\":\"5つの手順\"},\"ownerTitle\":\"いちばん細いところを直す：制約理論（TOC）\",\"ownerHref\":\"/themes/operations-06\"},{\"question\":{\"id\":\"operations-06/q-umikaze\",\"prompt\":\"うみかぜ食堂のお昼のピークで、本当の詰まりはどこでしたか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ホールの人数\"},{\"id\":\"b\",\"label\":\"レジ\"},{\"id\":\"c\",\"label\":\"入口の案内\"},{\"id\":\"d\",\"label\":\"1つしかない揚げ物の台\"}],\"answer\":\"d\",\"explanation\":\"注文は揚げ物の台で止まっていました。ホールの人をふやしても、料理が出てくる速さは変わりません。\",\"reviewSection\":\"うみかぜ食堂で考える\"},\"ownerTitle\":\"いちばん細いところを直す：制約理論（TOC）\",\"ownerHref\":\"/themes/operations-06\"},{\"question\":{\"id\":\"operations-06/q-move\",\"prompt\":\"詰まりを1つ直したあと、どうしますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"もう見直さなくてよい\"},{\"id\":\"b\",\"label\":\"新しく詰まったところを見つけるため、1にもどる\"},{\"id\":\"c\",\"label\":\"直したところに、さらに人を足す\"},{\"id\":\"d\",\"label\":\"全部の工程に同じだけ人を足す\"}],\"answer\":\"b\",\"explanation\":\"1つ直すと、詰まりは別のところに動きます。手順の1にもどって、くり返し見直します。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"いちばん細いところを直す：制約理論（TOC）\",\"ownerHref\":\"/themes/operations-06\"},{\"question\":{\"id\":\"strategy-01/q-3c\",\"prompt\":\"3C の3つの目線の組み合わせとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"お客様・競合・自社\"},{\"id\":\"b\",\"label\":\"現金・顧客・コスト\"},{\"id\":\"c\",\"label\":\"強み・弱み・機会\"},{\"id\":\"d\",\"label\":\"会社・会計・契約\"}],\"answer\":\"a\",\"explanation\":\"3C は、Customer（お客様）、Competitor（競合）、Company（自社）の頭文字です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"状況を整理する：3C と SWOT\",\"ownerHref\":\"/themes/strategy-01\"},{\"question\":{\"id\":\"strategy-01/q-overlap\",\"prompt\":\"3C の整理から勝てる場所を探します。ねらうのはどこですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"競合がいちばん強いこと\"},{\"id\":\"b\",\"label\":\"自社が苦手だが、はやっていること\"},{\"id\":\"c\",\"label\":\"お客様が求めていて、競合が弱く、自社が得意なこと\"},{\"id\":\"d\",\"label\":\"お客様が求めていないが、自社が得意なこと\"}],\"answer\":\"c\",\"explanation\":\"3つの目線が重なるところが、勝てる場所の候補です。みなと館ホテルでは、地元の魚料理と港の景色です。\",\"reviewSection\":\"3C で見る\"},\"ownerTitle\":\"状況を整理する：3C と SWOT\",\"ownerHref\":\"/themes/strategy-01\"},{\"question\":{\"id\":\"strategy-01/q-swot-place\",\"prompt\":\"「外資系ホテルの開業」は、SWOT のどこに入りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"強み\"},{\"id\":\"b\",\"label\":\"脅威\"},{\"id\":\"c\",\"label\":\"弱み\"},{\"id\":\"d\",\"label\":\"機会\"}],\"answer\":\"b\",\"explanation\":\"自社の外で起きる、悪いことなので脅威です。強み・弱みは自社の中のこと、機会・脅威は外のことです。\",\"reviewSection\":\"SWOT で見る\"},\"ownerTitle\":\"状況を整理する：3C と SWOT\",\"ownerHref\":\"/themes/strategy-01\"},{\"question\":{\"id\":\"strategy-01/q-action\",\"prompt\":\"SWOT の使い方として、いちばんよいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"4つのマスを埋めたら終わりにする\"},{\"id\":\"b\",\"label\":\"強みだけを書く\"},{\"id\":\"c\",\"label\":\"毎回、同じ内容を使い回す\"},{\"id\":\"d\",\"label\":\"強みと機会の組み合わせなど、打ち手まで考える\"}],\"answer\":\"d\",\"explanation\":\"SWOT は整理の道具です。打ち手を考えて、はじめて役に立ちます。機会に強みをどう使うか、脅威を弱みで受けないにはどうするかを考えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"状況を整理する：3C と SWOT\",\"ownerHref\":\"/themes/strategy-01\"},{\"question\":{\"id\":\"strategy-01/q-fact\",\"prompt\":\"強みの書き方として、いちばんよいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"サービスがよい\"},{\"id\":\"b\",\"label\":\"口コミの点数 4.5、料理にふれた口コミが全体の 6 割\"},{\"id\":\"c\",\"label\":\"雰囲気がよい\"},{\"id\":\"d\",\"label\":\"社員ががんばっている\"}],\"answer\":\"b\",\"explanation\":\"強みは、確かめられる事実で書きます。数字があれば、競合とくらべたり、時間がたってからの変化を追ったりできます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"状況を整理する：3C と SWOT\",\"ownerHref\":\"/themes/strategy-01\"},{\"question\":{\"id\":\"strategy-05/q-five\",\"prompt\":\"ポーターの5つの力に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"代わりになるもの\"},{\"id\":\"b\",\"label\":\"社長の好み\"},{\"id\":\"c\",\"label\":\"売り手（仕入先）の力\"},{\"id\":\"d\",\"label\":\"新しく入ってくる会社\"}],\"answer\":\"b\",\"explanation\":\"5つの力は、ライバルどうしの競争、新しく入る会社、代わりになるもの、買い手の力、売り手の力です。社長の好みは入りません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"業界のもうけやすさを見る：ポーターの5つの力\",\"ownerHref\":\"/themes/strategy-05\"},{\"question\":{\"id\":\"strategy-05/q-why\",\"prompt\":\"5つの力が強い業界では、何が起きやすいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"値段を上げやすくなる\"},{\"id\":\"b\",\"label\":\"費用が必ず下がる\"},{\"id\":\"c\",\"label\":\"業界のお客様がふえる\"},{\"id\":\"d\",\"label\":\"値段を上げにくくなったり、費用が上がったりして、利益がへる\"}],\"answer\":\"d\",\"explanation\":\"力が強いと、利益がお客様や仕入先、ライバルなどへ逃げていきます。手元に残る利益がへります。\",\"reviewSection\":\"5つの力とは\"},\"ownerTitle\":\"業界のもうけやすさを見る：ポーターの5つの力\",\"ownerHref\":\"/themes/strategy-05\"},{\"question\":{\"id\":\"strategy-05/q-ota\",\"prompt\":\"予約の多くが予約サイト（OTA）から来ていて、手数料を下げてもらえません。これは5つの力のどれが強い例ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"買い手の力\"},{\"id\":\"b\",\"label\":\"新しく入ってくる会社\"},{\"id\":\"c\",\"label\":\"売り手の力\"},{\"id\":\"d\",\"label\":\"代わりになるもの\"}],\"answer\":\"a\",\"explanation\":\"お客様とのあいだに立って値段や手数料を決める相手は、買い手の力として見ます。\",\"reviewSection\":\"5つの力とは\"},\"ownerTitle\":\"業界のもうけやすさを見る：ポーターの5つの力\",\"ownerHref\":\"/themes/strategy-05\"},{\"question\":{\"id\":\"strategy-05/q-substitute\",\"prompt\":\"ホテルにとって「代わりになるもの」の例はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"となりのチェーンのホテル\"},{\"id\":\"b\",\"label\":\"リネンを洗う会社\"},{\"id\":\"c\",\"label\":\"民泊\"},{\"id\":\"d\",\"label\":\"予約サイト\"}],\"answer\":\"c\",\"explanation\":\"民泊は、ホテルとは別の形で「泊まる」という用を足します。となりのホテルはライバル、洗濯の会社は売り手、予約サイトは買い手として見ます。\",\"reviewSection\":\"みなと館ホテルで考える\"},\"ownerTitle\":\"業界のもうけやすさを見る：ポーターの5つの力\",\"ownerHref\":\"/themes/strategy-05\"},{\"question\":{\"id\":\"strategy-05/q-supplier\",\"prompt\":\"リネンを洗う会社が町に1社しかありません。売り手の力を弱める手はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"客室の値段を下げる\"},{\"id\":\"b\",\"label\":\"別の町の会社にも頼めるようにしておく\"},{\"id\":\"c\",\"label\":\"広告をふやす\"},{\"id\":\"d\",\"label\":\"部屋の数をへらす\"}],\"answer\":\"b\",\"explanation\":\"替えのきかない仕入先は、値段を上げやすい立場です。ほかに頼める先を持っておくと、力の差が小さくなります。\",\"reviewSection\":\"みなと館ホテルで考える\"},\"ownerTitle\":\"業界のもうけやすさを見る：ポーターの5つの力\",\"ownerHref\":\"/themes/strategy-05\"},{\"question\":{\"id\":\"strategy-06/q-letters\",\"prompt\":\"VRIO の O は何を問いますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"その強みを生かすしくみが社内にあるか\"},{\"id\":\"b\",\"label\":\"お客様の数が多いか\"},{\"id\":\"c\",\"label\":\"値段が安いか\"},{\"id\":\"d\",\"label\":\"海外でも使えるか\"}],\"answer\":\"a\",\"explanation\":\"O は組織です。価値があり、めずらしく、まねしにくい強みでも、生かすしくみがなければ使えません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"本当の強みか確かめる：VRIO\",\"ownerHref\":\"/themes/strategy-06\"},{\"question\":{\"id\":\"strategy-06/q-bed\",\"prompt\":\"新しいベッドは、VRIO で見るとどんな強みですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"長く続く強み\"},{\"id\":\"b\",\"label\":\"どの問いにも当てはまらない、価値のないもの\"},{\"id\":\"c\",\"label\":\"価値はあるが、ほかもすぐ買えるので、他社と同じ\"},{\"id\":\"d\",\"label\":\"めずらしいが、価値がない\"}],\"answer\":\"c\",\"explanation\":\"ベッドはお客様に喜ばれますが、お金を出せばどこでも買えます。めずらしさもまねしにくさもないので、他社と同じです。\",\"reviewSection\":\"4つの問いで点検する\"},\"ownerTitle\":\"本当の強みか確かめる：VRIO\",\"ownerHref\":\"/themes/strategy-06\"},{\"question\":{\"id\":\"strategy-06/q-location\",\"prompt\":\"みなと館ホテルの強みのうち、4つの問いすべてに「はい」となったものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"新しいベッド\"},{\"id\":\"b\",\"label\":\"料理長の魚料理\"},{\"id\":\"c\",\"label\":\"広い駐車場\"},{\"id\":\"d\",\"label\":\"港が見える立地\"}],\"answer\":\"d\",\"explanation\":\"港が見える場所には、ほかのホテルが同じように建てられません。価値・めずらしさ・まねしにくさ・組織の4つがそろっています。\",\"reviewSection\":\"4つの問いで点検する\"},\"ownerTitle\":\"本当の強みか確かめる：VRIO\",\"ownerHref\":\"/themes/strategy-06\"},{\"question\":{\"id\":\"strategy-06/q-chef\",\"prompt\":\"料理長の魚料理を、辞めても消えない強みにする手として、テーマで挙げていないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"レシピと仕入れ先を書いて残す\"},{\"id\":\"b\",\"label\":\"料理長の給料を下げる\"},{\"id\":\"c\",\"label\":\"若い料理人を料理長の下で育てる\"},{\"id\":\"d\",\"label\":\"予約ページで料理を大きく見せる\"}],\"answer\":\"b\",\"explanation\":\"書いて残す、育てる、見せる、の3つが挙げた手です。給料を下げると、強みを持つ人が辞めてしまうおそれがあります。\",\"reviewSection\":\"組織の問いがいちばん見落とされる\"},\"ownerTitle\":\"本当の強みか確かめる：VRIO\",\"ownerHref\":\"/themes/strategy-06\"},{\"question\":{\"id\":\"strategy-06/q-barney\",\"prompt\":\"VRIO を考えたのは誰ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"マイケル・ポーター\"},{\"id\":\"b\",\"label\":\"ジェイ・バーニー\"},{\"id\":\"c\",\"label\":\"エリヤフ・ゴールドラット\"},{\"id\":\"d\",\"label\":\"デービッド・アーカー\"}],\"answer\":\"b\",\"explanation\":\"VRIO は、経営学者のジェイ・バーニーの考えです。会社が持つ資源から強みが生まれる、という見方にもとづいています。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"本当の強みか確かめる：VRIO\",\"ownerHref\":\"/themes/strategy-06\"},{\"question\":{\"id\":\"strategy-02/q-three\",\"prompt\":\"基本の3つの戦い方に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"コストで勝つ\"},{\"id\":\"b\",\"label\":\"違いで勝つ\"},{\"id\":\"c\",\"label\":\"絞り込む\"},{\"id\":\"d\",\"label\":\"すべてのお客様に、すべての価値を一番安く出す\"}],\"answer\":\"d\",\"explanation\":\"すべてを同時に一番にするのは、現実にはできません。3つの戦い方は、どこで一番になるかを選ぶ考え方です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"競争の戦い方：安さ・違い・絞り込み\",\"ownerHref\":\"/themes/strategy-02\"},{\"question\":{\"id\":\"strategy-02/q-middle\",\"prompt\":\"中途半端な戦い方が危ないのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"安さでも違いでも一番でないと、どちらのお客様にも選ばれないから\"},{\"id\":\"b\",\"label\":\"法律で禁止されているから\"},{\"id\":\"c\",\"label\":\"税金が高くなるから\"},{\"id\":\"d\",\"label\":\"広告が出せなくなるから\"}],\"answer\":\"a\",\"explanation\":\"安さを求めるお客様は、もっと安い店に行きます。違いを求めるお客様は、もっと特徴のある店に行きます。どちらでも一番でないと、選ばれる理由がなくなります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"競争の戦い方：安さ・違い・絞り込み\",\"ownerHref\":\"/themes/strategy-02\"},{\"question\":{\"id\":\"strategy-02/q-pl-shape\",\"prompt\":\"「違いで勝つ」会社の PL に出やすい特徴はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"単価が低く、費用もとても小さい\"},{\"id\":\"b\",\"label\":\"売上高がない\"},{\"id\":\"c\",\"label\":\"単価が高く、売上総利益率が高い\"},{\"id\":\"d\",\"label\":\"営業外収益が大きい\"}],\"answer\":\"c\",\"explanation\":\"ほかにない価値で高く売るので、単価と売上総利益率が高くなります。単価が低く費用が小さいのは、コストで勝つ会社の形です。\",\"reviewSection\":\"3つの戦い方\"},\"ownerTitle\":\"競争の戦い方：安さ・違い・絞り込み\",\"ownerHref\":\"/themes/strategy-02\"},{\"question\":{\"id\":\"strategy-02/q-minatokan\",\"prompt\":\"みなと館ホテルに、このテーマですすめている道はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"チェーンより安く運営して、値段で勝つ\"},{\"id\":\"b\",\"label\":\"港町を味わいたい観光客に絞り込み、地元の魚料理という違いで勝つ\"},{\"id\":\"c\",\"label\":\"外資系ホテルと同じ設備をそろえる\"},{\"id\":\"d\",\"label\":\"出張のお客様と観光客の両方に、同じように売る\"}],\"answer\":\"b\",\"explanation\":\"80室の大きさでは、チェーンより安くするのも、外資系と同じ設備をそろえるのも難しいです。せまい客層に絞り、自社の強みで違いを出します。\",\"reviewSection\":\"みなと館ホテルはどれを選ぶか\"},\"ownerTitle\":\"競争の戦い方：安さ・違い・絞り込み\",\"ownerHref\":\"/themes/strategy-02\"},{\"question\":{\"id\":\"strategy-02/q-imitate\",\"prompt\":\"競合にまねされにくい違いはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"新しいベッド\"},{\"id\":\"b\",\"label\":\"大きなテレビ\"},{\"id\":\"c\",\"label\":\"長く育ててきた料理人と、地元の漁師とのつながり\"},{\"id\":\"d\",\"label\":\"値下げ\"}],\"answer\":\"c\",\"explanation\":\"設備や値下げは、お金があればすぐまねできます。人や地域とのつながりは、時間をかけて作るものです。だから、まねされにくいのです。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"競争の戦い方：安さ・違い・絞り込み\",\"ownerHref\":\"/themes/strategy-02\"},{\"question\":{\"id\":\"strategy-07/q-red\",\"prompt\":\"レッド・オーシャンとはどんな市場ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"まだ誰も手をつけていない市場\"},{\"id\":\"b\",\"label\":\"海の近くにある市場\"},{\"id\":\"c\",\"label\":\"多くの会社が同じお客様を取り合い、値下げが続く市場\"},{\"id\":\"d\",\"label\":\"国が値段を決めている市場\"}],\"answer\":\"c\",\"explanation\":\"同じお客様を取り合って値下げが続く市場を、赤い海（レッド・オーシャン）と呼びます。誰も手をつけていない市場は青い海です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"競争のない市場をつくる：ブルー・オーシャン戦略\",\"ownerHref\":\"/themes/strategy-07\"},{\"question\":{\"id\":\"strategy-07/q-four\",\"prompt\":\"4つのアクションのうち、主に費用をへらす2つはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"増やす・付け加える\"},{\"id\":\"b\",\"label\":\"取り除く・付け加える\"},{\"id\":\"c\",\"label\":\"減らす・増やす\"},{\"id\":\"d\",\"label\":\"取り除く・減らす\"}],\"answer\":\"d\",\"explanation\":\"取り除く・減らすで費用がへります。増やす・付け加えるで、お客様にとっての価値が上がります。\",\"reviewSection\":\"4つのアクション\"},\"ownerTitle\":\"競争のない市場をつくる：ブルー・オーシャン戦略\",\"ownerHref\":\"/themes/strategy-07\"},{\"question\":{\"id\":\"strategy-07/q-both\",\"prompt\":\"4つのアクションを同時に行うと、何をねらえますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"安さと違いの両方\"},{\"id\":\"b\",\"label\":\"部屋の数を倍にすること\"},{\"id\":\"c\",\"label\":\"税金をなくすこと\"},{\"id\":\"d\",\"label\":\"ライバルと同じものを同じ値段で売ること\"}],\"answer\":\"a\",\"explanation\":\"費用をおさえながら価値も上げるので、安さと違いの両方をねらえます。\",\"reviewSection\":\"4つのアクション\"},\"ownerTitle\":\"競争のない市場をつくる：ブルー・オーシャン戦略\",\"ownerHref\":\"/themes/strategy-07\"},{\"question\":{\"id\":\"strategy-07/q-add\",\"prompt\":\"みなと館ホテルの2館目の案で、「付け加える」にあたるものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"大浴場をなくす\"},{\"id\":\"b\",\"label\":\"近くの食堂と組んだ朝ごはん券\"},{\"id\":\"c\",\"label\":\"部屋の広さをおさえる\"},{\"id\":\"d\",\"label\":\"ベッドと枕の質を上げる\"}],\"answer\":\"b\",\"explanation\":\"朝ごはん券は、まわりのホテルがまだ出していない価値です。大浴場をなくすのは取り除く、部屋の広さは減らす、ベッドの質は増やすです。\",\"reviewSection\":\"みなと館ホテルで考える\"},\"ownerTitle\":\"競争のない市場をつくる：ブルー・オーシャン戦略\",\"ownerHref\":\"/themes/strategy-07\"},{\"question\":{\"id\":\"strategy-07/q-copy\",\"prompt\":\"青い海でうまくいったあと、気をつけることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"もう何も見直さなくてよい\"},{\"id\":\"b\",\"label\":\"すぐに値下げをする\"},{\"id\":\"c\",\"label\":\"まねする会社が出てきて、いずれ赤い海になる\"},{\"id\":\"d\",\"label\":\"取り除いたものをすべて元にもどす\"}],\"answer\":\"c\",\"explanation\":\"うまくいくと、まねする会社が出てきます。青い海もいずれ競争の海になるので、次の見直しを考えておきます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"競争のない市場をつくる：ブルー・オーシャン戦略\",\"ownerHref\":\"/themes/strategy-07\"},{\"question\":{\"id\":\"strategy-03/q-axes\",\"prompt\":\"店や事業を分ける2つの軸として、このテーマで使ったものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"市場が伸びているか、自社がその市場で強いか\"},{\"id\":\"b\",\"label\":\"店長の年齢と店の広さ\"},{\"id\":\"c\",\"label\":\"開店した年と席数\"},{\"id\":\"d\",\"label\":\"売上の大きさと従業員数\"}],\"answer\":\"a\",\"explanation\":\"市場の伸びと、自社の強さの2つの軸で分けます。伸ばす・選ぶ・守る・やめるの4つです。\",\"reviewSection\":\"2つの軸で分ける\"},\"ownerTitle\":\"事業と店の選び方：どこに力を集めるか\",\"ownerHref\":\"/themes/strategy-03\"},{\"question\":{\"id\":\"strategy-03/q-cash-cow\",\"prompt\":\"「市場は伸びていないが、自社は強い」店の、基本の扱い方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"すぐにやめる\"},{\"id\":\"b\",\"label\":\"大きくお金をかけて伸ばす\"},{\"id\":\"c\",\"label\":\"かけるお金をおさえて現金を生み、伸ばす店に回す\"},{\"id\":\"d\",\"label\":\"値下げしてお客様を増やす\"}],\"answer\":\"c\",\"explanation\":\"伸びない市場で強い店は、大きくお金をかけなくても現金を生みます。そのお金を、伸びる市場の店に回すのが基本です。\",\"reviewSection\":\"2つの軸で分ける\"},\"ownerTitle\":\"事業と店の選び方：どこに力を集めるか\",\"ownerHref\":\"/themes/strategy-03\"},{\"question\":{\"id\":\"strategy-03/q-total\",\"prompt\":\"店の貢献利益が 1,100、500、−200 万円です。本部の費用が 1,000 万円のとき、会社全体の営業利益はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1,400 万円\"},{\"id\":\"b\",\"label\":\"400 万円\"},{\"id\":\"c\",\"label\":\"1,600 万円\"},{\"id\":\"d\",\"label\":\"−600 万円\"}],\"answer\":\"b\",\"explanation\":\"1,100 ＋ 500 − 200 − 1,000 ＝ 400 万円です。\",\"reviewSection\":\"店ごとの数字で見る\"},\"ownerTitle\":\"事業と店の選び方：どこに力を集めるか\",\"ownerHref\":\"/themes/strategy-03\"},{\"question\":{\"id\":\"strategy-03/q-close-check\",\"prompt\":\"赤字の郊外店を閉じる前に確かめること。このテーマが挙げていないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"立て直せる見込み\"},{\"id\":\"b\",\"label\":\"残りの契約期間の家賃や、原状回復の費用\"},{\"id\":\"c\",\"label\":\"働く人の行き先\"},{\"id\":\"d\",\"label\":\"店長の好きな料理\"}],\"answer\":\"d\",\"explanation\":\"閉じるかを決めるときは、立て直せる見込み、閉店の費用、働く人の行き先を確かめます。店長の好みは、決める材料ではありません。\",\"reviewSection\":\"店ごとの数字で見る\"},\"ownerTitle\":\"事業と店の選び方：どこに力を集めるか\",\"ownerHref\":\"/themes/strategy-03\"},{\"question\":{\"id\":\"strategy-03/q-hq-cost\",\"prompt\":\"郊外店を閉じても、営業利益が思ったほど増えないことがあります。理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"本部の費用は、店を閉じても減らないことが多いから\"},{\"id\":\"b\",\"label\":\"閉じると売上が増えるから\"},{\"id\":\"c\",\"label\":\"貢献利益は税金だから\"},{\"id\":\"d\",\"label\":\"ほかの店の売上がすべて減るから\"}],\"answer\":\"a\",\"explanation\":\"本部の費用を店ごとに割りふって見ると、閉じれば本部の費用も減るように見えます。でも実際は、本部の費用は残ります。残った分は、ほかの店が受け持つことになります。\",\"reviewSection\":\"店ごとの数字で見る\"},\"ownerTitle\":\"事業と店の選び方：どこに力を集めるか\",\"ownerHref\":\"/themes/strategy-03\"},{\"question\":{\"id\":\"strategy-04/q-define\",\"prompt\":\"インフレの説明として正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"物やサービスの値段が、全体として上がり続けること\"},{\"id\":\"b\",\"label\":\"物やサービスの値段が、全体として下がり続けること\"},{\"id\":\"c\",\"label\":\"1つの商品だけ値段が上がること\"},{\"id\":\"d\",\"label\":\"金利が 0％ になること\"}],\"answer\":\"a\",\"explanation\":\"インフレは、値段が全体として上がり続けることです。1つの商品だけの値上げとは違います。逆に下がり続けるのがデフレです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"物の値段が上がるとき・下がるとき：インフレとデフレ\",\"ownerHref\":\"/themes/strategy-04\"},{\"question\":{\"id\":\"strategy-04/q-money\",\"prompt\":\"インフレのとき、お金の価値はどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"上がる\"},{\"id\":\"b\",\"label\":\"変わらない\"},{\"id\":\"c\",\"label\":\"下がる（同じお金で買える物が少なくなる）\"},{\"id\":\"d\",\"label\":\"なくなる\"}],\"answer\":\"c\",\"explanation\":\"値段が上がると、同じ 1,000 円で買える物が少なくなります。つまり、お金の価値が下がります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"物の値段が上がるとき・下がるとき：インフレとデフレ\",\"ownerHref\":\"/themes/strategy-04\"},{\"question\":{\"id\":\"strategy-04/q-cost\",\"prompt\":\"食材 ＋18 万円、光熱費 ＋6 万円、人件費 ＋9 万円。営業利益が月 60 万円の店で、何もしないと営業利益はいくらになりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"60 万円\"},{\"id\":\"b\",\"label\":\"27 万円\"},{\"id\":\"c\",\"label\":\"93 万円\"},{\"id\":\"d\",\"label\":\"33 万円\"}],\"answer\":\"b\",\"explanation\":\"増えた費用の合計は 18 ＋ 6 ＋ 9 ＝ 33 万円です。60 − 33 ＝ 27 万円になります。33 万円は増えた費用の合計です。\",\"reviewSection\":\"インフレのとき、店の数字はどう動く？\"},\"ownerTitle\":\"物の値段が上がるとき・下がるとき：インフレとデフレ\",\"ownerHref\":\"/themes/strategy-04\"},{\"question\":{\"id\":\"strategy-04/q-price\",\"prompt\":\"売上が月 600 万円の店で、増えた費用 33 万円を値上げで取り戻すには、およそ何％の値上げが要りますか（客数は変わらないとします）。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 33％\"},{\"id\":\"b\",\"label\":\"約 0.5％\"},{\"id\":\"c\",\"label\":\"約 10％\"},{\"id\":\"d\",\"label\":\"約 5.5％\"}],\"answer\":\"d\",\"explanation\":\"33 ÷ 600 ＝ 0.055 なので、約 5.5％ です。\",\"reviewSection\":\"インフレのとき、店の数字はどう動く？\"},\"ownerTitle\":\"物の値段が上がるとき・下がるとき：インフレとデフレ\",\"ownerHref\":\"/themes/strategy-04\"},{\"question\":{\"id\":\"strategy-04/q-contract\",\"prompt\":\"インフレのときに損になりやすいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何年も同じ値段で売る約束（長い契約）\"},{\"id\":\"b\",\"label\":\"毎月値段を見直せる売り方\"},{\"id\":\"c\",\"label\":\"その日の値段で売る売り方\"},{\"id\":\"d\",\"label\":\"仕入れ値に合わせてメニューを変える売り方\"}],\"answer\":\"a\",\"explanation\":\"費用は上がっていくのに、売る値段が何年も同じだと、利益がどんどん減ります。長い契約には、値段を見直すきまりを入れておきます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"物の値段が上がるとき・下がるとき：インフレとデフレ\",\"ownerHref\":\"/themes/strategy-04\"},{\"question\":{\"id\":\"tax-01/q-base\",\"prompt\":\"法人税は何にかかりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"税法で計算した所得（益金 − 損金）\"},{\"id\":\"b\",\"label\":\"売上高\"},{\"id\":\"c\",\"label\":\"会計の営業利益そのもの\"},{\"id\":\"d\",\"label\":\"現金の残高\"}],\"answer\":\"a\",\"explanation\":\"法人税は、税法で計算した所得にかかります。会計の利益に、損金にならない費用などの直しを加えて出します。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"法人税のしくみ：会計の利益と税金の所得はちがう\",\"ownerHref\":\"/themes/tax-01\"},{\"question\":{\"id\":\"tax-01/q-income\",\"prompt\":\"会計の利益が 2,800 万円、損金にならない費用が 200 万円のとき、所得はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2,600 万円\"},{\"id\":\"b\",\"label\":\"2,800 万円\"},{\"id\":\"c\",\"label\":\"3,000 万円\"},{\"id\":\"d\",\"label\":\"200 万円\"}],\"answer\":\"c\",\"explanation\":\"損金にならない費用は、会計では引かれていますが、税法では引けません。だから足し戻します。2,800 ＋ 200 ＝ 3,000 万円です。\",\"reviewSection\":\"会計の利益と所得のずれ\"},\"ownerTitle\":\"法人税のしくみ：会計の利益と税金の所得はちがう\",\"ownerHref\":\"/themes/tax-01\"},{\"question\":{\"id\":\"tax-01/q-tax\",\"prompt\":\"中小法人（所得 10 億円以下）の所得が 3,000 万円のとき、法人税はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"696 万円\"},{\"id\":\"b\",\"label\":\"630.4 万円\"},{\"id\":\"c\",\"label\":\"450 万円\"},{\"id\":\"d\",\"label\":\"120 万円\"}],\"answer\":\"b\",\"explanation\":\"800 万円 × 15％ ＝ 120 万円、2,200 万円 × 23.2％ ＝ 510.4 万円で、合計 630.4 万円です。696 万円は、全部に 23.2％ をかけたまちがいです。\",\"reviewSection\":\"税額を計算する\"},\"ownerTitle\":\"法人税のしくみ：会計の利益と税金の所得はちがう\",\"ownerHref\":\"/themes/tax-01\"},{\"question\":{\"id\":\"tax-01/q-meal\",\"prompt\":\"取引先との飲食費を交際費から外せる条件で、2026-11-07 時点の国税庁の説明に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"金額に関係なく、領収書があればよい\"},{\"id\":\"b\",\"label\":\"1人あたり 5,000 円以下で、記録は要らない\"},{\"id\":\"c\",\"label\":\"社内の人だけの飲食である\"},{\"id\":\"d\",\"label\":\"1人あたり 10,000 円以下で、日付・参加者・人数・金額・店名などを記録する\"}],\"answer\":\"d\",\"explanation\":\"2024 年 4 月以後に払ったものは、1人あたり 10,000 円以下で記録を残せば、交際費から外せます。それより前は 5,000 円でした。社内の人だけの飲食は、この扱いになりません。\",\"reviewSection\":\"会計の利益と所得のずれ\"},\"ownerTitle\":\"法人税のしくみ：会計の利益と税金の所得はちがう\",\"ownerHref\":\"/themes/tax-01\"},{\"question\":{\"id\":\"tax-01/q-carryforward\",\"prompt\":\"青色申告の会社が赤字になりました。その赤字は、次の年からどう扱えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"次の年から 10 年間、黒字の年の所得から差し引ける\"},{\"id\":\"b\",\"label\":\"その年で消える\"},{\"id\":\"c\",\"label\":\"国から赤字の額が払われる\"},{\"id\":\"d\",\"label\":\"次の年の売上から差し引く\"}],\"answer\":\"a\",\"explanation\":\"青色申告の赤字（欠損金）は、10 年間持ち越して、黒字の年の所得から差し引けます。中小法人ではない会社は、差し引ける額に上限があります。\",\"reviewSection\":\"赤字の年は繰り越せる\"},\"ownerTitle\":\"法人税のしくみ：会計の利益と税金の所得はちがう\",\"ownerHref\":\"/themes/tax-01\"},{\"question\":{\"id\":\"tax-04/q-relation\",\"prompt\":\"グループ通算制度の前提になる「完全支配関係」とは、どんな関係ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"株の半分以上を持つ関係\"},{\"id\":\"b\",\"label\":\"1つの者が、会社の発行済株式などの全部を直接か間接に持つ関係\"},{\"id\":\"c\",\"label\":\"同じ社長がいる関係\"},{\"id\":\"d\",\"label\":\"取引が多い関係\"}],\"answer\":\"b\",\"explanation\":\"法人税法第2条第12号の7の6で、発行済株式などの全部を直接か間接に持つ関係（くわしくは政令）と決めています。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"グループ通算制度：グループの黒字と赤字を合わせる\",\"ownerHref\":\"/themes/tax-04\"},{\"question\":{\"id\":\"tax-04/q-approval\",\"prompt\":\"グループ通算制度を使うときの決まりで、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"入れたい子会社だけを選んで入れられる\"},{\"id\":\"b\",\"label\":\"届け出るだけで、承認は要らない\"},{\"id\":\"c\",\"label\":\"国税庁長官の承認を、親会社と、完全支配関係にある国内の子会社の全部で受ける\"},{\"id\":\"d\",\"label\":\"親会社だけが申告すればよい\"}],\"answer\":\"c\",\"explanation\":\"第64条の9で、親会社と完全支配関係にある国内の子会社の全部が、国税庁長官の承認を受けます。子会社も、それぞれ申告します。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"グループ通算制度：グループの黒字と赤字を合わせる\",\"ownerHref\":\"/themes/tax-04\"},{\"question\":{\"id\":\"tax-04/q-calc\",\"prompt\":\"親会社の所得が 3,000 万円、100％子会社の欠損が 1,000 万円です。通算したあと、親会社の所得はいくらですか（ほかの会社はないものとします）。\",\"choices\":[{\"id\":\"a\",\"label\":\"2,000 万円\"},{\"id\":\"b\",\"label\":\"3,000 万円\"},{\"id\":\"c\",\"label\":\"4,000 万円\"},{\"id\":\"d\",\"label\":\"1,000 万円\"}],\"answer\":\"a\",\"explanation\":\"親会社は子会社の欠損 1,000 万円を損金に入れて、所得 2,000 万円になります。子会社は欠損と同じ額を益金に入れて、所得 0 円になります。\",\"reviewSection\":\"黒字と赤字を合わせる\"},\"ownerTitle\":\"グループ通算制度：グループの黒字と赤字を合わせる\",\"ownerHref\":\"/themes/tax-04\"},{\"question\":{\"id\":\"tax-04/q-etax\",\"prompt\":\"通算法人の申告のしかたについて、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"資本金が大きい会社だけ電子申告をする\"},{\"id\":\"b\",\"label\":\"紙で出しても特に問題はない\"},{\"id\":\"c\",\"label\":\"申告はしなくてよい\"},{\"id\":\"d\",\"label\":\"資本金の大きさにかかわらず、法人税と地方法人税を電子申告（e-Tax）でする\"}],\"answer\":\"d\",\"explanation\":\"通算法人は資本金にかかわらず電子申告が必要です。期限までに電子申告をせず紙で出すと、無申告加算税がかかる対象になります。\",\"reviewSection\":\"入れない会社と、守ること\"},\"ownerTitle\":\"グループ通算制度：グループの黒字と赤字を合わせる\",\"ownerHref\":\"/themes/tax-04\"},{\"question\":{\"id\":\"tax-04/q-out\",\"prompt\":\"グループ通算に入れない会社の例として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"資本金が1億円以下の会社\"},{\"id\":\"b\",\"label\":\"飲食業の会社\"},{\"id\":\"c\",\"label\":\"青色申告の承認を取り消されてから5年がたっていない会社\"},{\"id\":\"d\",\"label\":\"設立1年目の会社\"}],\"answer\":\"c\",\"explanation\":\"第64条の9で、青色申告の承認の取り消しから5年がたっていない会社、清算中の会社などは入れないと決めています。\",\"reviewSection\":\"入れない会社と、守ること\"},\"ownerTitle\":\"グループ通算制度：グループの黒字と赤字を合わせる\",\"ownerHref\":\"/themes/tax-04\"},{\"question\":{\"id\":\"tax-02/q-mechanism\",\"prompt\":\"会社が納める消費税の計算で、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高 × 10％\"},{\"id\":\"b\",\"label\":\"利益 × 10％\"},{\"id\":\"c\",\"label\":\"預かった消費税 − 仕入れや経費で払った消費税\"},{\"id\":\"d\",\"label\":\"人件費 × 10％\"}],\"answer\":\"c\",\"explanation\":\"消費税は、お客様から預かった税から、仕入れなどで払った税を引き、その差を納めます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"消費税とインボイス：預かった税から払った税を引く\",\"ownerHref\":\"/themes/tax-02\"},{\"question\":{\"id\":\"tax-02/q-eat-in\",\"prompt\":\"定食を店内で食べてもらうときと、持ち帰ってもらうときの消費税率の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"店内 8％・持ち帰り 10％\"},{\"id\":\"b\",\"label\":\"店内 10％・持ち帰り 8％\"},{\"id\":\"c\",\"label\":\"どちらも 8％\"},{\"id\":\"d\",\"label\":\"どちらも 10％\"}],\"answer\":\"b\",\"explanation\":\"店内で食事を出すのは外食なので 10％ です。持ち帰りは飲食料品を売ることになるので、軽減税率の 8％ です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"消費税とインボイス：預かった税から払った税を引く\",\"ownerHref\":\"/themes/tax-02\"},{\"question\":{\"id\":\"tax-02/q-calc\",\"prompt\":\"預かった消費税が 58 万円、払った消費税が 30.4 万円のとき、納める消費税はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"88.4 万円\"},{\"id\":\"b\",\"label\":\"58 万円\"},{\"id\":\"c\",\"label\":\"30.4 万円\"},{\"id\":\"d\",\"label\":\"27.6 万円\"}],\"answer\":\"d\",\"explanation\":\"58 − 30.4 ＝ 27.6 万円です。\",\"reviewSection\":\"納める額を計算する\"},\"ownerTitle\":\"消費税とインボイス：預かった税から払った税を引く\",\"ownerHref\":\"/themes/tax-02\"},{\"question\":{\"id\":\"tax-02/q-labor\",\"prompt\":\"人件費の多い飲食業で、売上にくらべて納める消費税が大きくなりやすいのは、なぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人件費には消費税がかからず、払った消費税として差し引けないから\"},{\"id\":\"b\",\"label\":\"飲食業だけ税率が高いから\"},{\"id\":\"c\",\"label\":\"人件費の消費税は 2 倍になるから\"},{\"id\":\"d\",\"label\":\"飲食業はインボイスが使えないから\"}],\"answer\":\"a\",\"explanation\":\"給料には消費税がかかりません。費用の中で人件費の割合が大きいほど、差し引ける消費税が少なくなります。そのぶん、納める額が大きくなります。\",\"reviewSection\":\"納める額を計算する\"},\"ownerTitle\":\"消費税とインボイス：預かった税から払った税を引く\",\"ownerHref\":\"/themes/tax-02\"},{\"question\":{\"id\":\"tax-02/q-invoice\",\"prompt\":\"2026-11-07 時点で、免税事業者から魚を買いました。消費税にあたる分は 8 万円です。差し引ける額はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"8 万円\"},{\"id\":\"b\",\"label\":\"0 円\"},{\"id\":\"c\",\"label\":\"5.6 万円\"},{\"id\":\"d\",\"label\":\"4 万円\"}],\"answer\":\"c\",\"explanation\":\"2026 年 10 月 1 日から 2 年間は、70％ を差し引けます。8 万円 × 70％ ＝ 5.6 万円です。\",\"reviewSection\":\"インボイスと免税の仕入れ先\"},\"ownerTitle\":\"消費税とインボイス：預かった税から払った税を引く\",\"ownerHref\":\"/themes/tax-02\"},{\"question\":{\"id\":\"tax-06/q-period\",\"prompt\":\"会社の帳簿と書類は、原則として何年保存しますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"確定申告書の提出期限の翌日から 7 年\"},{\"id\":\"b\",\"label\":\"事業年度の終わりの日から 3 年\"},{\"id\":\"c\",\"label\":\"1 年\"},{\"id\":\"d\",\"label\":\"決まりはない\"}],\"answer\":\"a\",\"explanation\":\"国税庁 No.5930 で、原則は確定申告書の提出期限の翌日から 7 年です。数え始めは、事業年度の終わりの日ではありません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"帳簿と書類の保存：7年と電子帳簿保存法\",\"ownerHref\":\"/themes/tax-06\"},{\"question\":{\"id\":\"tax-06/q-ten\",\"prompt\":\"帳簿と書類を 10 年保存するのは、どんな年度ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"黒字が大きかった年度\"},{\"id\":\"b\",\"label\":\"社長が交代した年度\"},{\"id\":\"c\",\"label\":\"税務調査があった年度\"},{\"id\":\"d\",\"label\":\"青色申告で欠損金（赤字）が出た年度\"}],\"answer\":\"d\",\"explanation\":\"青色申告で欠損金が出た年度は 10 年です。青色申告をしていない会社で災害の損失が出た年度も 10 年です。\",\"reviewSection\":\"何を、何年取っておくか\"},\"ownerTitle\":\"帳簿と書類の保存：7年と電子帳簿保存法\",\"ownerHref\":\"/themes/tax-06\"},{\"question\":{\"id\":\"tax-06/q-email\",\"prompt\":\"食材の請求書が、PDF でメールに付いて届きました。電子帳簿保存法での扱いに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"電子取引に当たるので、そのデータを保存しなければならない\"},{\"id\":\"b\",\"label\":\"メールは消してよい\"},{\"id\":\"c\",\"label\":\"保存の決まりは関係ない\"},{\"id\":\"d\",\"label\":\"1 か月だけ取っておけばよい\"}],\"answer\":\"a\",\"explanation\":\"請求書などに書かれる事項を電子でやりとりする取引は電子取引です（第2条第5号）。そのデータを保存しなければなりません（第7条）。\",\"reviewSection\":\"電子帳簿保存法の3つの区分\"},\"ownerTitle\":\"帳簿と書類の保存：7年と電子帳簿保存法\",\"ownerHref\":\"/themes/tax-06\"},{\"question\":{\"id\":\"tax-06/q-scan\",\"prompt\":\"紙で受け取った領収書のスキャナ保存について、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"すべての会社に義務づけられている\"},{\"id\":\"b\",\"label\":\"決まりを守れば、紙の代わりにしてよい\"},{\"id\":\"c\",\"label\":\"法律で禁止されている\"},{\"id\":\"d\",\"label\":\"スキャンすれば、決まりを守らなくても紙を捨ててよい\"}],\"answer\":\"b\",\"explanation\":\"第4条第3項は、財務省令の決まりに従って保存すれば、紙の保存に代えることができる、という決まりです。\",\"reviewSection\":\"電子帳簿保存法の3つの区分\"},\"ownerTitle\":\"帳簿と書類の保存：7年と電子帳簿保存法\",\"ownerHref\":\"/themes/tax-06\"},{\"question\":{\"id\":\"tax-06/q-start\",\"prompt\":\"帳簿書類の保存期間は、いつから数えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"帳簿を作った日から\"},{\"id\":\"b\",\"label\":\"事業年度が始まった日から\"},{\"id\":\"c\",\"label\":\"事業年度の終わりの日から\"},{\"id\":\"d\",\"label\":\"その事業年度の確定申告書の提出期限の翌日から\"}],\"answer\":\"d\",\"explanation\":\"数え始めは、確定申告書の提出期限の翌日です。いつ捨ててよいかは、この日から数えて一覧にしましょう。\",\"reviewSection\":\"何を、何年取っておくか\"},\"ownerTitle\":\"帳簿と書類の保存：7年と電子帳簿保存法\",\"ownerHref\":\"/themes/tax-06\"},{\"question\":{\"id\":\"tax-03/q-define\",\"prompt\":\"節税と脱税のちがいで、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"節税は法律の仕組みを事実のとおりに使うこと、脱税は事実をかくしたりうそをついたりして税を払わずにすませること\"},{\"id\":\"b\",\"label\":\"金額が小さければ節税、大きければ脱税\"},{\"id\":\"c\",\"label\":\"税理士に頼めば何でも節税になる\"},{\"id\":\"d\",\"label\":\"どちらも同じ意味\"}],\"answer\":\"a\",\"explanation\":\"ちがいは金額ではなく、事実のとおりかどうかです。事実をかくしたり、うそをついたりすると、脱税になります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"節税と脱税の線引き\",\"ownerHref\":\"/themes/tax-03\"},{\"question\":{\"id\":\"tax-03/q-example\",\"prompt\":\"脱税に当たるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"青色申告の赤字（欠損金）を次の年の所得から差し引く\"},{\"id\":\"b\",\"label\":\"1人 10,000 円以下の会食を、記録を残して交際費から外す\"},{\"id\":\"c\",\"label\":\"現金の売上の一部をレジに通さず、帳簿から外す\"},{\"id\":\"d\",\"label\":\"必要な設備を買って減価償却する\"}],\"answer\":\"c\",\"explanation\":\"売上をかくすのは、事実をいつわることなので、脱税です。ほかの3つは、法律の仕組みを事実のとおりに使っています。\",\"reviewSection\":\"線引きの例\"},\"ownerTitle\":\"節税と脱税の線引き\",\"ownerHref\":\"/themes/tax-03\"},{\"question\":{\"id\":\"tax-03/q-penalty\",\"prompt\":\"事実をかくして、法人税を 1,000 万円少なく申告していました（期限までに申告はしていました）。重加算税はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"100 万円\"},{\"id\":\"b\",\"label\":\"350 万円\"},{\"id\":\"c\",\"label\":\"400 万円\"},{\"id\":\"d\",\"label\":\"1,000 万円\"}],\"answer\":\"b\",\"explanation\":\"申告はしていて、事実をかくした場合の重加算税は 35％ です。1,000 万円 × 35％ ＝ 350 万円です。申告していなかったときは 40％ です。\",\"reviewSection\":\"重加算税の重さ\"},\"ownerTitle\":\"節税と脱税の線引き\",\"ownerHref\":\"/themes/tax-03\"},{\"question\":{\"id\":\"tax-03/q-trap\",\"prompt\":\"税率がおよそ 3 割の会社が、税を減らすために、その年の費用にできる要らない消耗品を 100 万円買いました。手元の現金はどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"30 万円増える\"},{\"id\":\"b\",\"label\":\"変わらない\"},{\"id\":\"c\",\"label\":\"100 万円増える\"},{\"id\":\"d\",\"label\":\"およそ 70 万円減る\"}],\"answer\":\"d\",\"explanation\":\"100 万円を払い、税がおよそ 30 万円減ります。差し引き、およそ 70 万円の現金が減ります。要らない支出は、節税になりません。\",\"reviewSection\":\"節税の落とし穴\"},\"ownerTitle\":\"節税と脱税の線引き\",\"ownerHref\":\"/themes/tax-03\"},{\"question\":{\"id\":\"tax-03/q-gray\",\"prompt\":\"法律の形は守っているけれど、税を減らすことだけが目的の不自然な取引について、このテーマの考え方に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"形を守っていれば必ず認められる\"},{\"id\":\"b\",\"label\":\"税務署に認められないおそれがあるので、税理士に相談しないまま行わない\"},{\"id\":\"c\",\"label\":\"見つからなければ問題ない\"},{\"id\":\"d\",\"label\":\"どんどん行うべき\"}],\"answer\":\"b\",\"explanation\":\"不自然な取引は、税務署に認められない（否認される）おそれがあります。必ず税理士に相談し、事業として必要な取引かを確かめましょう。\",\"reviewSection\":\"線引きの例\"},\"ownerTitle\":\"節税と脱税の線引き\",\"ownerHref\":\"/themes/tax-03\"},{\"question\":{\"id\":\"tax-05/q-notice\",\"prompt\":\"実地の税務調査の前の連絡（事前通知）について、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"連絡は一度もなく、いつも突然来る\"},{\"id\":\"b\",\"label\":\"原則として前もって連絡があり、税理士がいれば税理士にも伝えられる\"},{\"id\":\"c\",\"label\":\"連絡は手紙だけで、日時は書かれない\"},{\"id\":\"d\",\"label\":\"会社が頼んだときだけ調査がある\"}],\"answer\":\"b\",\"explanation\":\"国税通則法第74条の9で、実地の調査の前に、開始の日時・場所・目的・税目・期間などを通知します。税務代理人がいれば、その人も含みます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"税務調査の進み方：連絡から終わりまで\",\"ownerHref\":\"/themes/tax-05\"},{\"question\":{\"id\":\"tax-05/q-content\",\"prompt\":\"事前通知で伝えられることに入っていないのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"調査を始める日時と場所\"},{\"id\":\"b\",\"label\":\"対象の税目と期間\"},{\"id\":\"c\",\"label\":\"最後に払う税の額\"},{\"id\":\"d\",\"label\":\"対象の帳簿や書類\"}],\"answer\":\"c\",\"explanation\":\"事前通知では、日時・場所・目的・税目・期間・対象の帳簿などが伝えられます。税の額は、調査の結果で決まります。\",\"reviewSection\":\"前もって連絡されること\"},\"ownerTitle\":\"税務調査の進み方：連絡から終わりまで\",\"ownerHref\":\"/themes/tax-05\"},{\"question\":{\"id\":\"tax-05/q-skip\",\"prompt\":\"事前通知なしで調査が行われることがあるのは、どんなときですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"正しい税の額をつかみにくくなるおそれなど、調査に支障が出るおそれがあると判断されたとき\"},{\"id\":\"b\",\"label\":\"会社の社長が忙しいとき\"},{\"id\":\"c\",\"label\":\"会社が黒字のとき\"},{\"id\":\"d\",\"label\":\"税理士がいないとき\"}],\"answer\":\"a\",\"explanation\":\"第74条の10で、申告の内容や過去の調査などから、違法・不当な行為をしやすくするおそれや、正しい額をつかみにくくするおそれなどがあると認めるときは、事前通知を要しないとしています。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"税務調査の進み方：連絡から終わりまで\",\"ownerHref\":\"/themes/tax-05\"},{\"question\":{\"id\":\"tax-05/q-revise\",\"prompt\":\"調査の結果、修正申告をすすめられました。修正申告をしたときの扱いで、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"不服申立ても更正の請求も、どちらもできる\"},{\"id\":\"b\",\"label\":\"どちらもできない\"},{\"id\":\"c\",\"label\":\"不服申立てはできるが、更正の請求はできない\"},{\"id\":\"d\",\"label\":\"不服申立てはできないが、更正の請求はできる\"}],\"answer\":\"d\",\"explanation\":\"第74条の11第3項で、修正申告をすすめるときは、不服申立てはできないが更正の請求はできることを説明し、その書面を渡します。\",\"reviewSection\":\"調査が終わるとき\"},\"ownerTitle\":\"税務調査の進み方：連絡から終わりまで\",\"ownerHref\":\"/themes/tax-05\"},{\"question\":{\"id\":\"tax-05/q-none\",\"prompt\":\"調査の結果、直すところがなかったとき、税務署はどうしますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何も連絡しない\"},{\"id\":\"b\",\"label\":\"その時点で直すところがない旨を、書面で通知する\"},{\"id\":\"c\",\"label\":\"必ず翌年にもう一度調査に来る\"},{\"id\":\"d\",\"label\":\"修正申告をすすめる\"}],\"answer\":\"b\",\"explanation\":\"第74条の11第1項で、書面で通知します。通知のあとでも、新しく得た情報から誤りがあると認められれば、もう一度調べられることがあります。\",\"reviewSection\":\"調査が終わるとき\"},\"ownerTitle\":\"税務調査の進み方：連絡から終わりまで\",\"ownerHref\":\"/themes/tax-05\"},{\"question\":{\"id\":\"case-cross-01/q-room-revenue\",\"prompt\":\"改装後の 1 年目、客室の売上はいくら増えますか。（いまは 80室 × 365日 × 80％ × 1.4 万円、改装後は 80室 × 365日 × 75％ × 2 万円）\",\"choices\":[{\"id\":\"a\",\"label\":\"4,000 万円\"},{\"id\":\"b\",\"label\":\"11,096 万円\"},{\"id\":\"c\",\"label\":\"32,704 万円\"},{\"id\":\"d\",\"label\":\"43,800 万円\"}],\"answer\":\"b\",\"explanation\":\"いまは 23,360 室泊 × 1.4 万円 ＝ 32,704 万円です。改装後は 21,900 室泊 × 2 万円 ＝ 43,800 万円です。差は 11,096 万円の増加です。\"},\"ownerTitle\":\"高い価格帯に移ったら、3つの表はどう動く？\",\"ownerHref\":\"/cases/case-cross-01\"},{\"question\":{\"id\":\"case-cross-01/q-operating-cf\",\"prompt\":\"当期純利益の増加は 970 万円、増えた減価償却費は 4,000 万円です（4 億円 ÷ 10 年）。営業キャッシュフローはいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"970 万円\"},{\"id\":\"b\",\"label\":\"1,836 万円\"},{\"id\":\"c\",\"label\":\"3,030 万円\"},{\"id\":\"d\",\"label\":\"4,970 万円\"}],\"answer\":\"d\",\"explanation\":\"減価償却費は、現金が出ていかない費用です。なので、当期純利益に足し戻します。970 ＋ 4,000 ＝ 4,970 万円です。1,836 万円は、営業利益の増加です。\"},\"ownerTitle\":\"高い価格帯に移ったら、3つの表はどう動く？\",\"ownerHref\":\"/cases/case-cross-01\"},{\"question\":{\"id\":\"case-cross-01/q-cash\",\"prompt\":\"1 年目の終わりに、現金は、改装しなかった場合とくらべてどう変わりますか。（営業 CF ＋4,970、投資 CF −40,000、借入 ＋30,000、返済 −3,000）\",\"choices\":[{\"id\":\"a\",\"label\":\"8,030 万円減る\"},{\"id\":\"b\",\"label\":\"4,970 万円増える\"},{\"id\":\"c\",\"label\":\"40,000 万円減る\"},{\"id\":\"d\",\"label\":\"変わらない\"}],\"answer\":\"a\",\"explanation\":\"4,970 − 40,000 ＋ 30,000 − 3,000 ＝ −8,030 万円です。手元の現金 8,000 万円より大きく減ります。利益は増えても、現金は大きく減ります。\"},\"ownerTitle\":\"高い価格帯に移ったら、3つの表はどう動く？\",\"ownerHref\":\"/cases/case-cross-01\"},{\"question\":{\"id\":\"case-cross-02/q-monthly\",\"prompt\":\"値上げしたあと、1 か月（30 日）の「売上 − 食材費」はいくら増えますか。（前：(980 − 330) × 120 × 30、後：(1,180 − 330) × 110 × 30）\",\"choices\":[{\"id\":\"a\",\"label\":\"36.6 万円\"},{\"id\":\"b\",\"label\":\"9.9 万円\"},{\"id\":\"c\",\"label\":\"46.5 万円\"},{\"id\":\"d\",\"label\":\"0 円\"}],\"answer\":\"c\",\"explanation\":\"前は 234.0 万円、後は 280.5 万円で、差は 46.5 万円の増加です。36.6 万円は売上だけの増加で、食材費が減った分を見ていません。\"},\"ownerTitle\":\"定食を 200 円値上げしたら、利益はどう動く？\",\"ownerHref\":\"/cases/case-cross-02\"},{\"question\":{\"id\":\"case-cross-02/q-breakeven\",\"prompt\":\"1,180 円にしたとき、「売上 − 食材費」が値上げ前（1か月 234 万円）と同じになる 1 日の客数は、およそ何人ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 120 人\"},{\"id\":\"b\",\"label\":\"約 92 人\"},{\"id\":\"c\",\"label\":\"約 80 人\"},{\"id\":\"d\",\"label\":\"約 110 人\"}],\"answer\":\"b\",\"explanation\":\"234 万円 ÷ (850 円 × 30 日) ≒ 91.8 人です。約 92 人までなら、値上げ前より減りません。\"},\"ownerTitle\":\"定食を 200 円値上げしたら、利益はどう動く？\",\"ownerHref\":\"/cases/case-cross-02\"},{\"question\":{\"id\":\"case-cross-02/q-net\",\"prompt\":\"1 年の営業利益の増加が 540 万円で、法人税等が 30％ のとき、当期純利益はいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"540 万円\"},{\"id\":\"b\",\"label\":\"162 万円\"},{\"id\":\"c\",\"label\":\"702 万円\"},{\"id\":\"d\",\"label\":\"378 万円\"}],\"answer\":\"d\",\"explanation\":\"540 − 540 × 30％ ＝ 540 − 162 ＝ 378 万円です。\"},\"ownerTitle\":\"定食を 200 円値上げしたら、利益はどう動く？\",\"ownerHref\":\"/cases/case-cross-02\"},{\"question\":{\"id\":\"case-cross-03/q-operating\",\"prompt\":\"2 号店の 1 年目です。売上 6,000、食材 1,800、人件費 1,950、家賃 600、光熱費・その他 900、減価償却費 200、開店の準備費 150（万円）。営業利益はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"400 万円\"},{\"id\":\"b\",\"label\":\"550 万円\"},{\"id\":\"c\",\"label\":\"6,000 万円\"},{\"id\":\"d\",\"label\":\"−150 万円\"}],\"answer\":\"a\",\"explanation\":\"6,000 − 1,800 − 1,950 − 600 − 900 − 200 − 150 ＝ 400 万円です。550 万円は、開店の準備費を引き忘れた額です。\"},\"ownerTitle\":\"2 号店を出したら、1 年目の現金はどうなりますか？\",\"ownerHref\":\"/cases/case-cross-03\"},{\"question\":{\"id\":\"case-cross-03/q-cash\",\"prompt\":\"営業 CF ＋452、投資 CF −2,300（内装 2,000 と保証金 300）、財務 CF ＋1,600（借入 2,000、返済 400）です。1 年目の現金の増減はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"＋252 万円\"},{\"id\":\"b\",\"label\":\"＋1,600 万円\"},{\"id\":\"c\",\"label\":\"−248 万円\"},{\"id\":\"d\",\"label\":\"−2,300 万円\"}],\"answer\":\"c\",\"explanation\":\"452 − 2,300 ＋ 1,600 ＝ −248 万円です。利益は 252 万円出ていますが、現金は 248 万円減ります。\"},\"ownerTitle\":\"2 号店を出したら、1 年目の現金はどうなりますか？\",\"ownerHref\":\"/cases/case-cross-03\"},{\"question\":{\"id\":\"case-cross-03/q-deposit\",\"prompt\":\"家主に預けた保証金 300 万円は、どこに出ますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"PL の費用（家賃）\"},{\"id\":\"b\",\"label\":\"BS の資産と、CF の投資の支出\"},{\"id\":\"c\",\"label\":\"BS の負債\"},{\"id\":\"d\",\"label\":\"どこにも出ない\"}],\"answer\":\"b\",\"explanation\":\"保証金は、出ていくときに返ってくる、預けたお金です。だから費用ではなく、BS の資産に載ります。払った現金は、CF の投資のところに出ます。\"},\"ownerTitle\":\"2 号店を出したら、1 年目の現金はどうなりますか？\",\"ownerHref\":\"/cases/case-cross-03\"},{\"question\":{\"id\":\"case-cross-04/q-labor\",\"prompt\":\"働く時間が年 2,180 時間減り、1 時間あたりの人件費は 1,500 円です。シフトを減らした場合、人件費は年いくら減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"300 万円\"},{\"id\":\"b\",\"label\":\"218 万円\"},{\"id\":\"c\",\"label\":\"3,270 万円\"},{\"id\":\"d\",\"label\":\"327 万円\"}],\"answer\":\"d\",\"explanation\":\"2,180 時間 × 1,500 円 ＝ 327 万円です。300 万円は、自動チェックイン機の分（2,000 時間）だけの額です。\"},\"ownerTitle\":\"自動チェックイン機を入れたら、本当にもうかる？\",\"ownerHref\":\"/cases/case-cross-04\"},{\"question\":{\"id\":\"case-cross-04/q-operating\",\"prompt\":\"人件費 −327、保守・利用料 ＋84、減価償却費 ＋160（800 ÷ 5 年）です。営業利益はいくら増えたり減ったりしますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"＋83 万円\"},{\"id\":\"b\",\"label\":\"＋243 万円\"},{\"id\":\"c\",\"label\":\"＋327 万円\"},{\"id\":\"d\",\"label\":\"−244 万円\"}],\"answer\":\"a\",\"explanation\":\"327 − 84 − 160 ＝ 83 万円増えます。シフトを減らさなければ人件費は減らず、−84 − 160 ＝ −244 万円になります。\"},\"ownerTitle\":\"自動チェックイン機を入れたら、本当にもうかる？\",\"ownerHref\":\"/cases/case-cross-04\"},{\"question\":{\"id\":\"case-cross-04/q-no-shift\",\"prompt\":\"案内役に回す案（b）で、シフトを減らしませんでした。単価や口コミが変わらないとすると、営業利益はどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"＋83 万円\"},{\"id\":\"b\",\"label\":\"変わらない\"},{\"id\":\"c\",\"label\":\"244 万円減る\"},{\"id\":\"d\",\"label\":\"354 万円増える\"}],\"answer\":\"c\",\"explanation\":\"人件費は減らず、保守・利用料 84 万円と減価償却費 160 万円だけが増えます。だから 244 万円減ります。案内役の効果で、単価や点数を上げて取り戻せるかが勝負です。\"},\"ownerTitle\":\"自動チェックイン機を入れたら、本当にもうかる？\",\"ownerHref\":\"/cases/case-cross-04\"},{\"question\":{\"id\":\"case-cross-05/q-overtime\",\"prompt\":\"残業が月 400 時間から 200 時間に減ります。残業 1 時間を 1,875 円とすると、残業代は1年でいくら減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"37.5 万円\"},{\"id\":\"b\",\"label\":\"450 万円\"},{\"id\":\"c\",\"label\":\"900 万円\"},{\"id\":\"d\",\"label\":\"360 万円\"}],\"answer\":\"b\",\"explanation\":\"200 時間 × 1,875 円 × 12 か月 ＝ 450 万円です。900 万円は、400 時間すべてが減った場合の金額です。\"},\"ownerTitle\":\"パートを正社員にしたら、人件費は増える？減る？\",\"ownerHref\":\"/cases/case-cross-05\"},{\"question\":{\"id\":\"case-cross-05/q-operating\",\"prompt\":\"残業代 −450、正社員にした人件費 ＋360、研修費 ＋120、採用・育てる費用 −280（万円）です。営業利益は、いくら増えたり減ったりしますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"−30 万円\"},{\"id\":\"b\",\"label\":\"＋450 万円\"},{\"id\":\"c\",\"label\":\"＋250 万円\"},{\"id\":\"d\",\"label\":\"＋1,210 万円\"}],\"answer\":\"c\",\"explanation\":\"450 − 360 − 120 ＋ 280 ＝ 250 万円の増加です。辞める人が減る分を入れないと、−30 万円になります。\"},\"ownerTitle\":\"パートを正社員にしたら、人件費は増える？減る？\",\"ownerHref\":\"/cases/case-cross-05\"},{\"question\":{\"id\":\"case-cross-05/q-without\",\"prompt\":\"辞める人が減らなかった（採用・育てる費用が変わらない）場合、営業利益はどうなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"30 万円減る\"},{\"id\":\"b\",\"label\":\"250 万円増える\"},{\"id\":\"c\",\"label\":\"変わらない\"},{\"id\":\"d\",\"label\":\"280 万円増える\"}],\"answer\":\"a\",\"explanation\":\"450 − 360 − 120 ＝ −30 万円です。この案が数字で成り立つかは、辞める人が本当に減るかにかかっています。\"},\"ownerTitle\":\"パートを正社員にしたら、人件費は増える？減る？\",\"ownerHref\":\"/cases/case-cross-05\"},{\"question\":{\"id\":\"case-cross-06/q-interest\",\"prompt\":\"44,000 万円を変動金利で借りています。金利が 1％ 上がると、1 年の利息はいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"44 万円\"},{\"id\":\"b\",\"label\":\"80 万円\"},{\"id\":\"c\",\"label\":\"440 万円\"},{\"id\":\"d\",\"label\":\"4,400 万円\"}],\"answer\":\"c\",\"explanation\":\"44,000 万円 × 1％ ＝ 440 万円です。80 万円は、預けている現金の利息が増える分です。\"},\"ownerTitle\":\"金利が 1％ 上がったら、ホテルの利益はどうなる？\",\"ownerHref\":\"/cases/case-cross-06\"},{\"question\":{\"id\":\"case-cross-06/q-net\",\"prompt\":\"支払利息が 440 万円増え、受け取る利息が 80 万円増えます。税金（30％）も考えると、当期純利益はいくら減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"252 万円\"},{\"id\":\"b\",\"label\":\"360 万円\"},{\"id\":\"c\",\"label\":\"440 万円\"},{\"id\":\"d\",\"label\":\"108 万円\"}],\"answer\":\"a\",\"explanation\":\"差し引きで利益は 360 万円減ります。そのぶん税金が 360 × 30％ ＝ 108 万円減るので、当期純利益は 360 − 108 ＝ 252 万円減ります。\"},\"ownerTitle\":\"金利が 1％ 上がったら、ホテルの利益はどうなる？\",\"ownerHref\":\"/cases/case-cross-06\"},{\"question\":{\"id\":\"case-cross-06/q-repay\",\"prompt\":\"手元の現金で 3,000 万円を先に返すと、1 年の利息の差し引きはいくら良くなりますか（借りる金利 2.5％、預ける金利 1％）。\",\"choices\":[{\"id\":\"a\",\"label\":\"75 万円\"},{\"id\":\"b\",\"label\":\"45 万円\"},{\"id\":\"c\",\"label\":\"30 万円\"},{\"id\":\"d\",\"label\":\"3,000 万円\"}],\"answer\":\"b\",\"explanation\":\"払う利息が 3,000 × 2.5％ ＝ 75 万円減ります。でも、預けていた現金の利息も 3,000 × 1％ ＝ 30 万円減ります。差し引きで 45 万円良くなります。\"},\"ownerTitle\":\"金利が 1％ 上がったら、ホテルの利益はどうなる？\",\"ownerHref\":\"/cases/case-cross-06\"},{\"question\":{\"id\":\"case-accounting-01/q-fcf\",\"prompt\":\"営業 CF が 8,700 万円、投資 CF が −6,000 万円です。借金の返済 4,000 万円に対して、フリーキャッシュフローはいくら足りませんか。\",\"choices\":[{\"id\":\"a\",\"label\":\"足りている\"},{\"id\":\"b\",\"label\":\"1,300 万円\"},{\"id\":\"c\",\"label\":\"4,000 万円\"},{\"id\":\"d\",\"label\":\"1,800 万円\"}],\"answer\":\"b\",\"explanation\":\"フリーキャッシュフローは 2,700 万円です。返済 4,000 万円に対して、1,300 万円足りません。配当 500 万円も合わせると、現金は 1,800 万円減ります。\"},\"ownerTitle\":\"黒字なのに、なぜ現金が減っている？\",\"ownerHref\":\"/cases/case-accounting-01\"},{\"question\":{\"id\":\"case-finance-01/q-shortfall\",\"prompt\":\"月初 8,300 万円、入金 4,500 万円、出金 6,100 万円の月です。7,000 万円を残したいとき、いくら足りませんか。\",\"choices\":[{\"id\":\"a\",\"label\":\"300 万円\"},{\"id\":\"b\",\"label\":\"1,600 万円\"},{\"id\":\"c\",\"label\":\"0 円\"},{\"id\":\"d\",\"label\":\"700 万円\"}],\"answer\":\"a\",\"explanation\":\"月末の残高は 8,300 ＋ 4,500 − 6,100 ＝ 6,700 万円です。7,000 万円にするには、300 万円足りません。\"},\"ownerTitle\":\"7 月に現金が足りなくなります。どう手を打ちますか？\",\"ownerHref\":\"/cases/case-finance-01\"},{\"question\":{\"id\":\"case-governance-01/q-first\",\"prompt\":\"食中毒のおそれがあるとき、最初にすることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"原因がわかるまで、いつもどおり営業する\"},{\"id\":\"b\",\"label\":\"残った食材を捨てて、店をきれいにする\"},{\"id\":\"c\",\"label\":\"SNS で打ち消す\"},{\"id\":\"d\",\"label\":\"あやしい料理を出すのを止め、食材をとっておき、保健所に相談する\"}],\"answer\":\"d\",\"explanation\":\"被害を広げないことが、いちばん大事です。食材は、原因を調べる手がかりになります。だから捨てません。\"},\"ownerTitle\":\"お客様がおなかの痛みを訴えた。最初の 1 時間に何をする？\",\"ownerHref\":\"/cases/case-governance-01\"},{\"question\":{\"id\":\"case-hr-01/q-saving\",\"prompt\":\"3 か月以内に辞める人を、8 人から 3 人に減らしました。1 人 70 万円とすると、費用は1年でいくら減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"210 万円\"},{\"id\":\"b\",\"label\":\"560 万円\"},{\"id\":\"c\",\"label\":\"70 万円\"},{\"id\":\"d\",\"label\":\"350 万円\"}],\"answer\":\"d\",\"explanation\":\"減った人数は 5 人です。5 人 × 70 万円 ＝ 350 万円です。\"},\"ownerTitle\":\"入って 3 か月で辞める人が多い\",\"ownerHref\":\"/cases/case-hr-01\"},{\"question\":{\"id\":\"case-it-dx-01/q-scope\",\"prompt\":\"2 万人分のお客様の情報が、不正アクセスで漏れたおそれがあります。個人情報保護法の報告が必要な場合に当たる理由で、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"当たらない。名前と連絡先だけだから\"},{\"id\":\"b\",\"label\":\"不正の目的によるおそれがあり、本人の数も 1,000 人を超えるから\"},{\"id\":\"c\",\"label\":\"当たらない。紙ではないから\"},{\"id\":\"d\",\"label\":\"ホテルだけが報告するきまりだから\"}],\"answer\":\"b\",\"explanation\":\"施行規則の4つの場合のうち、「不正の目的によるおそれ」と「1,000 人超」の2つに当たります。\"},\"ownerTitle\":\"パスワードを書いた付箋が、フロントに貼ってある\",\"ownerHref\":\"/cases/case-it-dx-01\"},{\"question\":{\"id\":\"case-leadership-01/q-reversible\",\"prompt\":\"週末の客室の料金は、どんな決定ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"次の週に直せる、取り消せる決定\"},{\"id\":\"b\",\"label\":\"一度決めると戻せない、取り消せない決定\"},{\"id\":\"c\",\"label\":\"法律で社長が決めると決まっている決定\"},{\"id\":\"d\",\"label\":\"株主総会で決める決定\"}],\"answer\":\"a\",\"explanation\":\"料金は、試して直せます。取り消せる決定は、範囲を決めて現場に任せる方が、速く、正しくなります。\"},\"ownerTitle\":\"週末の料金を、誰が決めるか\",\"ownerHref\":\"/cases/case-leadership-01\"},{\"question\":{\"id\":\"case-legal-01/q-law\",\"prompt\":\"お客様（消費者）との契約で先に決めたキャンセル料について、消費者契約法の決まりとして正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どんな額でも、決まりに書けば有効\"},{\"id\":\"b\",\"label\":\"キャンセル料は少しも取れない\"},{\"id\":\"c\",\"label\":\"平均的な損害の額を超える部分は無効になる\"},{\"id\":\"d\",\"label\":\"料金の半額までなら必ず有効\"}],\"answer\":\"c\",\"explanation\":\"消費者契約法第9条第1項第1号で、平均的な損害の額を超える部分は無効になります。\"},\"ownerTitle\":\"宴会のキャンセル料、全額もらってよい？\",\"ownerHref\":\"/cases/case-legal-01\"},{\"question\":{\"id\":\"case-ma-01/q-value\",\"prompt\":\"EBITDA 2,500 万円、倍率 6 倍、借入金 1 億円、現金 2,000 万円です。株式の値段の見積もりはいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2 億円\"},{\"id\":\"b\",\"label\":\"1 億 5,000 万円\"},{\"id\":\"c\",\"label\":\"7,000 万円\"},{\"id\":\"d\",\"label\":\"5,000 万円\"}],\"answer\":\"c\",\"explanation\":\"事業価値は 2,500 × 6 ＝ 15,000 万円です。株式の値段 ＝ 15,000 − 10,000 ＋ 2,000 ＝ 7,000 万円です。5,000 万円は、現金を足し忘れた額です。\"},\"ownerTitle\":\"隣の旅館を買わないかと言われました\",\"ownerHref\":\"/cases/case-ma-01\"},{\"question\":{\"id\":\"case-marketing-01/q-shift\",\"prompt\":\"旅行サイトからの 16,100 泊のうち、3,000 泊を自分のサイトに移しました。1泊 14,000 円で、手数料は 12％ と 3％ の差です。営業利益はいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"504 万円\"},{\"id\":\"b\",\"label\":\"126 万円\"},{\"id\":\"c\",\"label\":\"378 万円\"},{\"id\":\"d\",\"label\":\"4,200 万円\"}],\"answer\":\"c\",\"explanation\":\"1泊あたりの差は 14,000 × (12％ − 3％) ＝ 1,260 円です。1,260 円 × 3,000 泊 ＝ 378 万円です。\"},\"ownerTitle\":\"予約の 7 割が旅行サイト。手数料を減らすには？\",\"ownerHref\":\"/cases/case-marketing-01\"},{\"question\":{\"id\":\"case-negotiation-01/q-limit\",\"prompt\":\"移る先の家賃は月 52 万円です。引っこしと内装の 600 万円を、5 年でならします。今の店で受けてよい家賃の上限はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"月 52 万円\"},{\"id\":\"b\",\"label\":\"月 66 万円\"},{\"id\":\"c\",\"label\":\"月 60 万円\"},{\"id\":\"d\",\"label\":\"月 62 万円\"}],\"answer\":\"d\",\"explanation\":\"600 万円 ÷ 60 か月 ＝ 月 10 万円です。52 ＋ 10 ＝ 月 62 万円が上限です。\"},\"ownerTitle\":\"家主から家賃の 1 割値上げを求められた\",\"ownerHref\":\"/cases/case-negotiation-01\"},{\"question\":{\"id\":\"case-operations-01/q-gap\",\"prompt\":\"売上 600 万円のお店で、理論原価率 28％ と実際原価率 32％ の差は、1年でいくらにあたりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"24 万円\"},{\"id\":\"b\",\"label\":\"4 万円\"},{\"id\":\"c\",\"label\":\"2,304 万円\"},{\"id\":\"d\",\"label\":\"288 万円\"}],\"answer\":\"d\",\"explanation\":\"600 万円 × 4％ ＝ 1か月 24 万円です。12 か月で 288 万円です。\"},\"ownerTitle\":\"原価率が 4 ポイント上がった。原因はどこ？\",\"ownerHref\":\"/cases/case-operations-01\"},{\"question\":{\"id\":\"case-strategy-01/q-close\",\"prompt\":\"郊外店を閉じると、貢献利益 −200 万円はなくなります。でも本部の費用 1,000 万円は減りません。違約金 300 万円も考えると、閉じた 1 年目の会社全体の営業利益はいくらですか。（今は 1,100 ＋ 500 − 200 − 1,000 ＝ 400 万円）\",\"choices\":[{\"id\":\"a\",\"label\":\"600 万円\"},{\"id\":\"b\",\"label\":\"300 万円\"},{\"id\":\"c\",\"label\":\"400 万円\"},{\"id\":\"d\",\"label\":\"−400 万円\"}],\"answer\":\"b\",\"explanation\":\"閉じると 1,100 ＋ 500 − 1,000 ＝ 600 万円になります。でも 1 年目は違約金 300 万円がかかるので、300 万円です。1 年目だけなら、今の 400 万円より下がります。契約の残り 3 年でくらべると、閉じるほうは 300 ＋ 600 ＋ 600 ＝ 1,500 万円です。赤字のまま続けるほうは 400 × 3 ＝ 1,200 万円です。\"},\"ownerTitle\":\"赤字の郊外店を閉じるべきでしょうか\",\"ownerHref\":\"/cases/case-strategy-01\"},{\"question\":{\"id\":\"case-tax-01/q-calc\",\"prompt\":\"消費税にあたる分 96 万円のうち、2026-11-07 時点で差し引
