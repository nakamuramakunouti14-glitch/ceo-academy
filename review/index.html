,{\"className\":\"mx-auto flex max-w-[42rem] flex-col gap-6 py-4 md:py-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"flex flex-col gap-2\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold\",\"children\":\"復習\"}],[\"$\",\"p\",null,{\"className\":\"text-[15px] leading-relaxed text-ink-soft\",\"children\":\"間違えた問題を、忘れかけたころにもう一度出します。正解が続くほど、次に出るまでの日にちがあきます。\"}]]}],[\"$\",\"$L14\",null,{\"questions\":[{\"question\":{\"id\":\"accounting-01/q-operating-profit\",\"prompt\":\"本業でどれだけ稼げたかを表す利益は、どれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上総利益\"},{\"id\":\"b\",\"label\":\"営業利益\"},{\"id\":\"c\",\"label\":\"経常利益\"},{\"id\":\"d\",\"label\":\"当期純利益\"}],\"answer\":\"b\",\"explanation\":\"営業利益は、売上総利益から人件費や広告費などの販管費を引いたものです。本業のもうけを表します。経常利益は、利息など本業以外の損益も入ります。\",\"reviewSection\":\"利益は5段階ある\"},\"ownerTitle\":\"損益計算書（PL）：売上から利益までの5段階\",\"ownerHref\":\"/themes/accounting-01\"},{\"question\":{\"id\":\"accounting-01/q-gross-profit\",\"prompt\":\"みなと館ホテルの売上高は 50,000 万円、売上原価は 8,000 万円です。売上総利益はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"6,000 万円\"},{\"id\":\"b\",\"label\":\"36,000 万円\"},{\"id\":\"c\",\"label\":\"42,000 万円\"},{\"id\":\"d\",\"label\":\"58,000 万円\"}],\"answer\":\"c\",\"explanation\":\"売上総利益は、売上高 − 売上原価 ＝ 50,000 − 8,000 ＝ 42,000 万円です。6,000 万円は営業利益です。\",\"reviewSection\":\"みなと館ホテルの PL を読む\"},\"ownerTitle\":\"損益計算書（PL）：売上から利益までの5段階\",\"ownerHref\":\"/themes/accounting-01\"},{\"question\":{\"id\":\"accounting-01/q-renovation-expense\",\"prompt\":\"4億円で客室を改装しました。使える年数（耐用年数）を10年として、毎年同じ額を費用にします。その年の PL に載る減価償却費はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"4,000 万円\"},{\"id\":\"b\",\"label\":\"4億円\"},{\"id\":\"c\",\"label\":\"0 円（費用にならない）\"},{\"id\":\"d\",\"label\":\"2億円\"}],\"answer\":\"a\",\"explanation\":\"改装の代金は、一度に費用にしません。使える年数に分けます。4億円 ÷ 10年 ＝ 1年 4,000 万円が、減価償却費として毎年の PL に載ります。\",\"reviewSection\":\"PL は1年分の通知表\"},\"ownerTitle\":\"損益計算書（PL）：売上から利益までの5段階\",\"ownerHref\":\"/themes/accounting-01\"},{\"question\":{\"id\":\"accounting-01/q-special-loss\",\"prompt\":\"古い設備を捨てたことで出た損は、PL のどこに入りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上原価\"},{\"id\":\"b\",\"label\":\"販売費及び一般管理費\"},{\"id\":\"c\",\"label\":\"営業外費用\"},{\"id\":\"d\",\"label\":\"特別損失\"}],\"answer\":\"d\",\"explanation\":\"その年だけの出来事で出た損は、特別損失に入ります。営業利益と経常利益は変わりません。税引前当期純利益から下に効きます。\",\"reviewSection\":\"利益は5段階ある\"},\"ownerTitle\":\"損益計算書（PL）：売上から利益までの5段階\",\"ownerHref\":\"/themes/accounting-01\"},{\"question\":{\"id\":\"accounting-01/q-largest-cost\",\"prompt\":\"みなと館ホテルの PL で、売上に対する割合がいちばん大きい費用はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人件費\"},{\"id\":\"b\",\"label\":\"売上原価\"},{\"id\":\"c\",\"label\":\"減価償却費\"},{\"id\":\"d\",\"label\":\"水道光熱費\"}],\"answer\":\"a\",\"explanation\":\"人件費は 17,000 万円で、売上の 34％ です。売上原価（16％）や減価償却費（10％）より大きいです。大きい費用ほど、良くしたときに利益が大きく変わります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"損益計算書（PL）：売上から利益までの5段階\",\"ownerHref\":\"/themes/accounting-01\"},{\"question\":{\"id\":\"accounting-05/q-fixed\",\"prompt\":\"次のうち、固定費にあたるものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"食材の仕入れ\"},{\"id\":\"b\",\"label\":\"予約サイトの手数料\"},{\"id\":\"c\",\"label\":\"お店の家賃\"},{\"id\":\"d\",\"label\":\"飲み物の仕入れ\"}],\"answer\":\"c\",\"explanation\":\"家賃は、お客様が来ても来なくても同じ額がかかるので固定費です。仕入れや手数料は、お客様が増えると増えるので変動費です。\",\"reviewSection\":\"固定費と変動費に分ける\"},\"ownerTitle\":\"損益分岐点（CVP 分析）：いくら売れば赤字にならないか\",\"ownerHref\":\"/themes/accounting-05\"},{\"question\":{\"id\":\"accounting-05/q-bep-sales\",\"prompt\":\"固定費が月 390 万円、限界利益率が 65％ です。損益分岐点売上高はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"600 万円\"},{\"id\":\"b\",\"label\":\"253.5 万円\"},{\"id\":\"c\",\"label\":\"455 万円\"},{\"id\":\"d\",\"label\":\"390 万円\"}],\"answer\":\"a\",\"explanation\":\"損益分岐点売上高 ＝ 固定費 ÷ 限界利益率 ＝ 390 ÷ 65％ ＝ 600 万円です。\",\"reviewSection\":\"うみかぜ食堂で計算する\"},\"ownerTitle\":\"損益分岐点（CVP 分析）：いくら売れば赤字にならないか\",\"ownerHref\":\"/themes/accounting-05\"},{\"question\":{\"id\":\"accounting-05/q-margin\",\"prompt\":\"客単価 2,000 円、1人あたりの変動費が 700 円です。1人あたりの限界利益はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2,700 円\"},{\"id\":\"b\",\"label\":\"700 円\"},{\"id\":\"c\",\"label\":\"2,000 円\"},{\"id\":\"d\",\"label\":\"1,300 円\"}],\"answer\":\"d\",\"explanation\":\"限界利益 ＝ 売上 − 変動費 ＝ 2,000 − 700 ＝ 1,300 円です。この 1,300 円で固定費をまかないます。\",\"reviewSection\":\"うみかぜ食堂で計算する\"},\"ownerTitle\":\"損益分岐点（CVP 分析）：いくら売れば赤字にならないか\",\"ownerHref\":\"/themes/accounting-05\"},{\"question\":{\"id\":\"accounting-05/q-safety\",\"prompt\":\"売上が 750 万円、損益分岐点売上高が 600 万円です。安全余裕率はいくつですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"80％\"},{\"id\":\"b\",\"label\":\"20％\"},{\"id\":\"c\",\"label\":\"25％\"},{\"id\":\"d\",\"label\":\"150％\"}],\"answer\":\"b\",\"explanation\":\"安全余裕率 ＝（売上 − 損益分岐点売上高）÷ 売上 ＝（750 − 600）÷ 750 ＝ 20％ です。売上が 2割より多く落ちると赤字になります。\",\"reviewSection\":\"うみかぜ食堂で計算する\"},\"ownerTitle\":\"損益分岐点（CVP 分析）：いくら売れば赤字にならないか\",\"ownerHref\":\"/themes/accounting-05\"},{\"question\":{\"id\":\"accounting-05/q-target\",\"prompt\":\"固定費 390 万円、限界利益率 65％ の店で、月 130 万円の利益を出すには、売上がいくら必要ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"800 万円\"},{\"id\":\"b\",\"label\":\"600 万円\"},{\"id\":\"c\",\"label\":\"520 万円\"},{\"id\":\"d\",\"label\":\"700 万円\"}],\"answer\":\"a\",\"explanation\":\"目標の売上 ＝（固定費 ＋ 目標の利益）÷ 限界利益率 ＝（390 ＋ 130）÷ 65％ ＝ 800 万円です。\",\"reviewSection\":\"損益分岐点を下げる3つの方法\"},\"ownerTitle\":\"損益分岐点（CVP 分析）：いくら売れば赤字にならないか\",\"ownerHref\":\"/themes/accounting-05\"},{\"question\":{\"id\":\"accounting-02/q-equation\",\"prompt\":\"BS でいつも成り立つ式は、どれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"資産 ＝ 負債 − 純資産\"},{\"id\":\"b\",\"label\":\"資産 ＝ 売上高 − 費用\"},{\"id\":\"c\",\"label\":\"資産 ＝ 負債 ＋ 純資産\"},{\"id\":\"d\",\"label\":\"負債 ＝ 資産 ＋ 純資産\"}],\"answer\":\"c\",\"explanation\":\"右側（負債と純資産）はお金の出どころで、左側（資産）はそのお金のいまの形です。同じお金を2つの目で見ているので、資産 ＝ 負債 ＋ 純資産 がいつも成り立ちます。\",\"reviewSection\":\"左右がいつも同じになるわけ\"},\"ownerTitle\":\"貸借対照表（BS）：何を持っていて、そのお金をどう集めたか\",\"ownerHref\":\"/themes/accounting-02\"},{\"question\":{\"id\":\"accounting-02/q-loan-side\",\"prompt\":\"銀行から3億円を借りたすぐあと、BS はどう動きますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"資産の現金が3億円増えて、負債の借入金が3億円増える\"},{\"id\":\"b\",\"label\":\"資産の現金が3億円増えて、純資産が3億円増える\"},{\"id\":\"c\",\"label\":\"負債の借入金が3億円増えて、純資産が3億円減る\"},{\"id\":\"d\",\"label\":\"PL の売上高が3億円増える\"}],\"answer\":\"a\",\"explanation\":\"借りたお金は返さないといけないので、負債に入ります。受け取った現金は資産に入ります。左右が同じ額だけ動きます。借金は売上ではないので、PL には載りません。\",\"reviewSection\":\"左右がいつも同じになるわけ\"},\"ownerTitle\":\"貸借対照表（BS）：何を持っていて、そのお金をどう集めたか\",\"ownerHref\":\"/themes/accounting-02\"},{\"question\":{\"id\":\"accounting-02/q-equity-ratio\",\"prompt\":\"みなと館ホテルの純資産は 44,000 万円、資産の合計は 93,000 万円です。自己資本比率はおよそいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 32％\"},{\"id\":\"b\",\"label\":\"約 47％\"},{\"id\":\"c\",\"label\":\"約 89％\"},{\"id\":\"d\",\"label\":\"約 144％\"}],\"answer\":\"b\",\"explanation\":\"自己資本比率は、純資産 ÷ 資産の合計 ＝ 44,000 ÷ 93,000 ≒ 47％ です。144％ は流動比率です。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"貸借対照表（BS）：何を持っていて、そのお金をどう集めたか\",\"ownerHref\":\"/themes/accounting-02\"},{\"question\":{\"id\":\"accounting-02/q-current-ratio\",\"prompt\":\"流動比率（流動資産 ÷ 流動負債）が 100％ よりずっと低いとき、まず心配することはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上が少ないこと\"},{\"id\":\"b\",\"label\":\"建物が古いこと\"},{\"id\":\"c\",\"label\":\"株主への配当が少ないこと\"},{\"id\":\"d\",\"label\":\"1年以内の支払いに、手元のお金が足りなくなるおそれ\"}],\"answer\":\"d\",\"explanation\":\"流動比率は、1年以内に払うお金（流動負債）を、1年以内に現金になる資産（流動資産）でまかなえるかを表します。100％ より低いと、お金のやりくり（資金繰り）が苦しくなるおそれがあります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"貸借対照表（BS）：何を持っていて、そのお金をどう集めたか\",\"ownerHref\":\"/themes/accounting-02\"},{\"question\":{\"id\":\"accounting-02/q-snapshot\",\"prompt\":\"PL と BS のちがいとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"PL は1年間の動き、BS は決算日の残り高を表す\"},{\"id\":\"b\",\"label\":\"PL は決算日の残り高、BS は1年間の動きを表す\"},{\"id\":\"c\",\"label\":\"PL も BS も1年間の動きを表す\"},{\"id\":\"d\",\"label\":\"BS は現金の動きだけを表す\"}],\"answer\":\"a\",\"explanation\":\"PL は1年間の成績（動画）です。BS はある1日の財産とお金の出どころ（写真）です。現金の動きを表すのは、キャッシュフロー計算書です。\",\"reviewSection\":\"BS は決算日の写真\"},\"ownerTitle\":\"貸借対照表（BS）：何を持っていて、そのお金をどう集めたか\",\"ownerHref\":\"/themes/accounting-02\"},{\"question\":{\"id\":\"accounting-03/q-depreciation-addback\",\"prompt\":\"営業キャッシュフローを当期純利益から出すとき、減価償却費を足し戻すのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"減価償却費には税金がかからないから\"},{\"id\":\"b\",\"label\":\"費用として利益から引かれているが、その年に現金は出ていかないから\"},{\"id\":\"c\",\"label\":\"減価償却費は売上の一部だから\"},{\"id\":\"d\",\"label\":\"銀行から借りたお金だから\"}],\"answer\":\"b\",\"explanation\":\"建物や設備の代金は、ふつう買った年に払い終えています。減価償却費は、その代金を毎年に分けた費用です。その年に現金は出ていかないので、利益に足し戻すと、現金の動きに近づきます。\",\"reviewSection\":\"利益と現金はずれる\"},\"ownerTitle\":\"キャッシュフロー計算書（CF）と3表のつながり\",\"ownerHref\":\"/themes/accounting-03\"},{\"question\":{\"id\":\"accounting-03/q-section\",\"prompt\":\"銀行への借金の返済は、CF のどの区分に入りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"営業キャッシュフロー\"},{\"id\":\"b\",\"label\":\"投資キャッシュフロー\"},{\"id\":\"c\",\"label\":\"財務キャッシュフロー\"},{\"id\":\"d\",\"label\":\"CF には出ない\"}],\"answer\":\"c\",\"explanation\":\"お金を借りる・返す、増資、配当は、財務キャッシュフローに入ります。返済は費用ではないので、PL には出ません。でも現金は出ていきます。\",\"reviewSection\":\"CF は3つに分ける\"},\"ownerTitle\":\"キャッシュフロー計算書（CF）と3表のつながり\",\"ownerHref\":\"/themes/accounting-03\"},{\"question\":{\"id\":\"accounting-03/q-free-cash-flow\",\"prompt\":\"みなと館ホテルの営業キャッシュフローは 8,700 万円、投資キャッシュフローは −6,000 万円です。フリーキャッシュフローはいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"14,700 万円\"},{\"id\":\"b\",\"label\":\"−1,800 万円\"},{\"id\":\"c\",\"label\":\"3,500 万円\"},{\"id\":\"d\",\"label\":\"2,700 万円\"}],\"answer\":\"d\",\"explanation\":\"フリーキャッシュフロー ＝ 営業 ＋ 投資 ＝ 8,700 − 6,000 ＝ 2,700 万円です。−1,800 万円は、財務キャッシュフローまで入れた現金の増減です。\",\"reviewSection\":\"みなと館ホテルの CF を読む\"},\"ownerTitle\":\"キャッシュフロー計算書（CF）と3表のつながり\",\"ownerHref\":\"/themes/accounting-03\"},{\"question\":{\"id\":\"accounting-03/q-kuroji-tousan\",\"prompt\":\"PL は黒字なのに現金が足りなくなる。その原因になりにくいものは、どれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売掛金の回収が遅れて、売上の現金がなかなか入らない\"},{\"id\":\"b\",\"label\":\"減価償却費が大きい\"},{\"id\":\"c\",\"label\":\"借金の返済額が、営業キャッシュフローより大きい\"},{\"id\":\"d\",\"label\":\"大きな設備投資を、手元の現金で払った\"}],\"answer\":\"b\",\"explanation\":\"減価償却費は、現金が出ていかない費用です。大きくても現金は減りません。むしろ、利益より現金が多くなる理由になります。ほかの3つは、利益が出ていても現金を減らします。\",\"reviewSection\":\"利益と現金はずれる\"},\"ownerTitle\":\"キャッシュフロー計算書（CF）と3表のつながり\",\"ownerHref\":\"/themes/accounting-03\"},{\"question\":{\"id\":\"accounting-03/q-link\",\"prompt\":\"CF の合計（現金の増減）と同じになるのは、どれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"PL の当期純利益\"},{\"id\":\"b\",\"label\":\"BS の利益剰余金の増減\"},{\"id\":\"c\",\"label\":\"BS の現金・預金の、前の年からの増減\"},{\"id\":\"d\",\"label\":\"PL の営業利益\"}],\"answer\":\"c\",\"explanation\":\"CF は、現金の動きを区分ごとに集めたものです。なので合計は、BS の現金・預金の増減と同じになります。当期純利益（から配当を引いた額）と同じになるのは、利益剰余金の増減です。\",\"reviewSection\":\"3つの表のつながり\"},\"ownerTitle\":\"キャッシュフロー計算書（CF）と3表のつながり\",\"ownerHref\":\"/themes/accounting-03\"},{\"question\":{\"id\":\"accounting-04/q-roe\",\"prompt\":\"ROE（自己資本利益率）の計算として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高 ÷ 資産の合計\"},{\"id\":\"b\",\"label\":\"当期純利益 ÷ 純資産\"},{\"id\":\"c\",\"label\":\"営業利益 ÷ 売上高\"},{\"id\":\"d\",\"label\":\"資産の合計 ÷ 純資産\"}],\"answer\":\"b\",\"explanation\":\"ROE は、株主が出したお金（純資産）で、どれだけ利益を出したかです。当期純利益 ÷ 純資産 で計算します。a は総資産回転率、d は財務レバレッジです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ROE のデュポン分解：利幅・回転・借入の3つに分ける\",\"ownerHref\":\"/themes/accounting-04\"},{\"question\":{\"id\":\"accounting-04/q-three\",\"prompt\":\"デュポン分解で、ROE を分ける3つの数字の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上原価率 × 人件費率 × 家賃比率\"},{\"id\":\"b\",\"label\":\"自己資本比率 × 流動比率 × 稼働率\"},{\"id\":\"c\",\"label\":\"営業利益 × 減価償却費 × 借入金\"},{\"id\":\"d\",\"label\":\"売上高純利益率 × 総資産回転率 × 財務レバレッジ\"}],\"answer\":\"d\",\"explanation\":\"ROE ＝ 売上高純利益率 × 総資産回転率 × 財務レバレッジ です。「利幅」×「資産の回し方」×「借入の効かせ方」と覚えましょう。\",\"reviewSection\":\"3つの数字の意味\"},\"ownerTitle\":\"ROE のデュポン分解：利幅・回転・借入の3つに分ける\",\"ownerHref\":\"/themes/accounting-04\"},{\"question\":{\"id\":\"accounting-04/q-calc\",\"prompt\":\"ある店は、売上高純利益率 4％、総資産回転率 2.5 回、財務レバレッジ 2 倍です。ROE はいくつですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"20％\"},{\"id\":\"b\",\"label\":\"8.5％\"},{\"id\":\"c\",\"label\":\"10％\"},{\"id\":\"d\",\"label\":\"4％\"}],\"answer\":\"a\",\"explanation\":\"4％ × 2.5 × 2 ＝ 20％ です。うみかぜ食堂の例と同じ計算です。\",\"reviewSection\":\"ホテルと食堂をくらべる\"},\"ownerTitle\":\"ROE のデュポン分解：利幅・回転・借入の3つに分ける\",\"ownerHref\":\"/themes/accounting-04\"},{\"question\":{\"id\":\"accounting-04/q-hotel\",\"prompt\":\"ホテルと食堂をくらべたとき、ホテルの総資産回転率が低くなりやすい理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ホテルは売上がまったくないから\"},{\"id\":\"b\",\"label\":\"ホテルは借入をしないから\"},{\"id\":\"c\",\"label\":\"ホテルは建物や設備にお金がかかり、資産が大きいから\"},{\"id\":\"d\",\"label\":\"ホテルは利益が必ずマイナスになるから\"}],\"answer\":\"c\",\"explanation\":\"総資産回転率は 売上高 ÷ 資産の合計 です。ホテルは建物が大きな資産になるので、売上にくらべて資産が大きくなり、回転率が低くなりがちです。\",\"reviewSection\":\"ホテルと食堂をくらべる\"},\"ownerTitle\":\"ROE のデュポン分解：利幅・回転・借入の3つに分ける\",\"ownerHref\":\"/themes/accounting-04\"},{\"question\":{\"id\":\"accounting-04/q-leverage\",\"prompt\":\"借入を増やして ROE を上げるときに、気をつけることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高が必ず減ること\"},{\"id\":\"b\",\"label\":\"純資産が必ず増えること\"},{\"id\":\"c\",\"label\":\"利幅が必ず上がること\"},{\"id\":\"d\",\"label\":\"利益が減ったときに ROE が大きく下がり、返すお金の重さも増えること\"}],\"answer\":\"d\",\"explanation\":\"財務レバレッジは「てこ」です。利益が出ているときは ROE を押し上げますが、利益が減ったときは逆に大きく下げます。借入の返済も重くなります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"ROE のデュポン分解：利幅・回転・借入の3つに分ける\",\"ownerHref\":\"/themes/accounting-04\"},{\"question\":{\"id\":\"accounting-06/q-four\",\"prompt\":\"バランスト・スコアカードの4つの目の組み合わせとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上・原価・人件費・家賃\"},{\"id\":\"b\",\"label\":\"PL・BS・CF・税金\"},{\"id\":\"c\",\"label\":\"強み・弱み・機会・脅威\"},{\"id\":\"d\",\"label\":\"財務・顧客・業務プロセス・学習と成長\"}],\"answer\":\"d\",\"explanation\":\"4つの目は、財務・顧客・業務プロセス・学習と成長です。c は SWOT の4つです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"バランスト・スコアカード：お金以外の数字も4つの目で見る\",\"ownerHref\":\"/themes/accounting-06\"},{\"question\":{\"id\":\"accounting-06/q-who\",\"prompt\":\"バランスト・スコアカードを考えた人と、最初の論文の年の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ドナルドソン・ブラウン、1914年\"},{\"id\":\"b\",\"label\":\"キャプランとノートン、1992年\"},{\"id\":\"c\",\"label\":\"モディリアーニとミラー、1958年\"},{\"id\":\"d\",\"label\":\"キャプランとノートン、1958年\"}],\"answer\":\"b\",\"explanation\":\"キャプランとノートンが、1992年にハーバード・ビジネス・レビューで論文を出しました。1996年には本も出しています。\",\"reviewSection\":\"誰が考えたか\"},\"ownerTitle\":\"バランスト・スコアカード：お金以外の数字も4つの目で見る\",\"ownerHref\":\"/themes/accounting-06\"},{\"question\":{\"id\":\"accounting-06/q-why\",\"prompt\":\"財務の数字だけで会社を見ると、何が困るとされていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"計算がまちがいやすい\"},{\"id\":\"b\",\"label\":\"税金が増える\"},{\"id\":\"c\",\"label\":\"過去の結果しかわからず、手を打つのが遅れる\"},{\"id\":\"d\",\"label\":\"銀行が見てくれない\"}],\"answer\":\"c\",\"explanation\":\"財務の数字は、過去の行動の結果です。お客様・現場・人の数字を見ると、利益が落ちる前に気づけます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"バランスト・スコアカード：お金以外の数字も4つの目で見る\",\"ownerHref\":\"/themes/accounting-06\"},{\"question\":{\"id\":\"accounting-06/q-chain\",\"prompt\":\"「原因 → 結果」のつながりとして、いちばん自然な順番はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"研修を増やす → 提供が早くなる → 口コミが上がる → 利益が増える\"},{\"id\":\"b\",\"label\":\"利益が増える → 研修を増やす → 口コミが上がる → 提供が早くなる\"},{\"id\":\"c\",\"label\":\"口コミが上がる → 利益が増える → 研修を増やす → 提供が早くなる\"},{\"id\":\"d\",\"label\":\"提供が早くなる → 利益が増える → 研修を増やす → 口コミが上がる\"}],\"answer\":\"a\",\"explanation\":\"学習と成長 → 業務プロセス → 顧客 → 財務 の順に、下の段が上の段の原因になります。\",\"reviewSection\":\"4つの目を原因と結果でつなぐ\"},\"ownerTitle\":\"バランスト・スコアカード：お金以外の数字も4つの目で見る\",\"ownerHref\":\"/themes/accounting-06\"},{\"question\":{\"id\":\"accounting-06/q-count\",\"prompt\":\"スコアカードに載せる数字の数について、よい考え方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"できるだけ多く載せる\"},{\"id\":\"b\",\"label\":\"戦略とつながる数字に絞る\"},{\"id\":\"c\",\"label\":\"財務の数字だけにする\"},{\"id\":\"d\",\"label\":\"毎月ちがう数字にする\"}],\"answer\":\"b\",\"explanation\":\"数字が多すぎると、何が大事かわからなくなります。戦略とつながる数字に絞りましょう。\",\"reviewSection\":\"みなと館ホテルのスコアカード\"},\"ownerTitle\":\"バランスト・スコアカード：お金以外の数字も4つの目で見る\",\"ownerHref\":\"/themes/accounting-06\"},{\"question\":{\"id\":\"finance-01/q-equity-cost\",\"prompt\":\"出資で集めたお金について、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"返さなくてよいが、株主は大きな見返りを期待する。会社の持ち分も渡す\"},{\"id\":\"b\",\"label\":\"毎月決まった額を返す必要がある\"},{\"id\":\"c\",\"label\":\"BS の負債が増える\"},{\"id\":\"d\",\"label\":\"利息が PL の費用になる\"}],\"answer\":\"a\",\"explanation\":\"出資は返さなくてよいお金です。その代わりに、配当と会社の持ち分を渡します。株主は銀行より大きなリスクを取るので、期待する見返りも大きくなります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"お金の集め方：借りる・出してもらう・リース\",\"ownerHref\":\"/themes/finance-01\"},{\"question\":{\"id\":\"finance-01/q-bs\",\"prompt\":\"銀行から借りると、BS のどこが増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"純資産の資本金\"},{\"id\":\"b\",\"label\":\"PL の売上高\"},{\"id\":\"c\",\"label\":\"負債の借入金（と資産の現金）\"},{\"id\":\"d\",\"label\":\"どこも増えない\"}],\"answer\":\"c\",\"explanation\":\"借りたお金は返す必要があるので、負債に入ります。受け取った現金は資産に入ります。出資なら、純資産が増えます。\",\"reviewSection\":\"3つの集め方を比べる\"},\"ownerTitle\":\"お金の集め方：借りる・出してもらう・リース\",\"ownerHref\":\"/themes/finance-01\"},{\"question\":{\"id\":\"finance-01/q-repay-years\",\"prompt\":\"借入金 44,000 万円、営業キャッシュフロー 8,700 万円の会社です。借入を返すのにかかる年数の目安はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 0.2 年\"},{\"id\":\"b\",\"label\":\"約 5 年\"},{\"id\":\"c\",\"label\":\"約 8.7 年\"},{\"id\":\"d\",\"label\":\"約 44 年\"}],\"answer\":\"b\",\"explanation\":\"借入金 ÷ 営業キャッシュフロー ＝ 44,000 ÷ 8,700 ≒ 5.1 年です。本業でかせぐ現金で、約 5 年で返せる計算です。\",\"reviewSection\":\"借入の重さを測る\"},\"ownerTitle\":\"お金の集め方：借りる・出してもらう・リース\",\"ownerHref\":\"/themes/finance-01\"},{\"question\":{\"id\":\"finance-01/q-matching\",\"prompt\":\"20 年使う建物の改装代を、1年で返す短い借入でまかないました。起こりやすい問題はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"利息がかからなくなる\"},{\"id\":\"b\",\"label\":\"株主の持ち分が減る\"},{\"id\":\"c\",\"label\":\"売上が増えすぎる\"},{\"id\":\"d\",\"label\":\"改装の効果で現金が入る前に返済が来て、お金が足りなくなる\"}],\"answer\":\"d\",\"explanation\":\"長く使うものは、長い時間をかけて現金を生みます。短い借入で買うと、現金が戻る前に返済が来ます。使う期間と、借りる期間をそろえましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"お金の集め方：借りる・出してもらう・リース\",\"ownerHref\":\"/themes/finance-01\"},{\"question\":{\"id\":\"finance-01/q-downturn\",\"prompt\":\"売上が大きく落ちた時期に、借入が多い会社が苦しくなりやすいのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"株主に配当を払わなければならないから\"},{\"id\":\"b\",\"label\":\"売上が落ちても、利息と返済は止まらないから\"},{\"id\":\"c\",\"label\":\"借入金が売上高に含まれるから\"},{\"id\":\"d\",\"label\":\"銀行が借入を出資に変えるから\"}],\"answer\":\"b\",\"explanation\":\"借入の利息と返済は、業績が落ちても自動では減りません。出資の配当は、業績が悪ければ減らせます。借入の返済を減らすには、銀行との相談が必要です。\",\"reviewSection\":\"3つの集め方を比べる\"},\"ownerTitle\":\"お金の集め方：借りる・出してもらう・リース\",\"ownerHref\":\"/themes/finance-01\"},{\"question\":{\"id\":\"finance-02/q-formula\",\"prompt\":\"運転資金の計算として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高 − 費用\"},{\"id\":\"b\",\"label\":\"現金 ＋ 借入金\"},{\"id\":\"c\",\"label\":\"買掛金 − 売掛金\"},{\"id\":\"d\",\"label\":\"売掛金 ＋ 在庫 − 買掛金\"}],\"answer\":\"d\",\"explanation\":\"運転資金は、入金を待っているお金（売掛金）と在庫を足し、支払いを待ってもらっているお金（買掛金）を引いたものです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"資金繰り：運転資金と資金繰り表\",\"ownerHref\":\"/themes/finance-02\"},{\"question\":{\"id\":\"finance-02/q-calc\",\"prompt\":\"売掛金 4,000 万円、在庫 600 万円、買掛金 2,500 万円の会社です。運転資金はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2,100 万円\"},{\"id\":\"b\",\"label\":\"7,100 万円\"},{\"id\":\"c\",\"label\":\"1,500 万円\"},{\"id\":\"d\",\"label\":\"900 万円\"}],\"answer\":\"a\",\"explanation\":\"4,000 ＋ 600 − 2,500 ＝ 2,100 万円です。\",\"reviewSection\":\"運転資金を計算する\"},\"ownerTitle\":\"資金繰り：運転資金と資金繰り表\",\"ownerHref\":\"/themes/finance-02\"},{\"question\":{\"id\":\"finance-02/q-growth\",\"prompt\":\"売上が伸びているのに、現金が減っていきます。いちばん当てはまる理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上が伸びると減価償却費が増えるから\"},{\"id\":\"b\",\"label\":\"売上が伸びると税金がかからなくなるから\"},{\"id\":\"c\",\"label\":\"入金を待つ売掛金や在庫が増え、運転資金が増えるから\"},{\"id\":\"d\",\"label\":\"売上が伸びると借入金が減るから\"}],\"answer\":\"c\",\"explanation\":\"売上が伸びると、まだ入金されていない売掛金や、在庫も増えます。その分の現金を先に立てかえることになり、手元の現金が減ります。\",\"reviewSection\":\"運転資金を計算する\"},\"ownerTitle\":\"資金繰り：運転資金と資金繰り表\",\"ownerHref\":\"/themes/finance-02\"},{\"question\":{\"id\":\"finance-02/q-table\",\"prompt\":\"月初の残高 8,300 万円、入金 4,500 万円、出金 6,100 万円の月です。月末の残高はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"9,900 万円\"},{\"id\":\"b\",\"label\":\"6,700 万円\"},{\"id\":\"c\",\"label\":\"1,600 万円\"},{\"id\":\"d\",\"label\":\"18,900 万円\"}],\"answer\":\"b\",\"explanation\":\"月末の残高 ＝ 月初の残高 ＋ 入金 − 出金 ＝ 8,300 ＋ 4,500 − 6,100 ＝ 6,700 万円です。\",\"reviewSection\":\"資金繰り表を作る\"},\"ownerTitle\":\"資金繰り：運転資金と資金繰り表\",\"ownerHref\":\"/themes/finance-02\"},{\"question\":{\"id\":\"finance-02/q-purpose\",\"prompt\":\"資金繰り表を作る、いちばんの目的はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"税金を少なくするため\"},{\"id\":\"b\",\"label\":\"利益を大きく見せるため\"},{\"id\":\"c\",\"label\":\"株主に配当を払うため\"},{\"id\":\"d\",\"label\":\"現金が足りなくなる月を前もって知り、先に手を打つため\"}],\"answer\":\"d\",\"explanation\":\"資金繰り表は、これから先の現金の動きを、月ごとに見通す表です。足りない月を前もって知れば、借入や支払いの調整が間に合います。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"資金繰り：運転資金と資金繰り表\",\"ownerHref\":\"/themes/finance-02\"},{\"question\":{\"id\":\"finance-05/q-claim\",\"prompt\":\"税金も倒産の費用もない世界について、MM 定理は何と言っていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"借入で集めても出資で集めても、会社の価値は変わらない\"},{\"id\":\"b\",\"label\":\"借入をすればするほど、会社の価値は上がる\"},{\"id\":\"c\",\"label\":\"出資だけで集めると、会社の価値が最も高くなる\"},{\"id\":\"d\",\"label\":\"配当を多く払う会社ほど、価値が高い\"}],\"answer\":\"a\",\"explanation\":\"その世界では、会社の価値は事業がどれだけ稼ぐかで決まります。お金の集め方（借入と出資の割合）では変わりません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"MM 定理：借りても出してもらっても、会社の価値は変わらない？\",\"ownerHref\":\"/themes/finance-05\"},{\"question\":{\"id\":\"finance-05/q-who\",\"prompt\":\"MM 定理を考えた2人と、最初の論文の年の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"キャプランとノートン、1992年\"},{\"id\":\"b\",\"label\":\"マイヤーズとマジュフ、1984年\"},{\"id\":\"c\",\"label\":\"モディリアーニとミラー、1958年\"},{\"id\":\"d\",\"label\":\"モディリアーニとミラー、1992年\"}],\"answer\":\"c\",\"explanation\":\"フランコ・モディリアーニとマートン・ミラーが、1958年に American Economic Review で論文を出しました。\",\"reviewSection\":\"誰が考えたか\"},\"ownerTitle\":\"MM 定理：借りても出してもらっても、会社の価値は変わらない？\",\"ownerHref\":\"/themes/finance-05\"},{\"question\":{\"id\":\"finance-05/q-pizza\",\"prompt\":\"借入を増やすと、株主はどうするとされていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"見返りを求めなくなる\"},{\"id\":\"b\",\"label\":\"必ず株を売る\"},{\"id\":\"c\",\"label\":\"銀行と同じ利息で満足する\"},{\"id\":\"d\",\"label\":\"リスクが大きくなるので、もっと大きな見返りを求める\"}],\"answer\":\"d\",\"explanation\":\"借入が増えると、利息を払ったあとの利益が大きくぶれます。株主のリスクが上がるので、求める見返りも上がります。\",\"reviewSection\":\"ピザのたとえ\"},\"ownerTitle\":\"MM 定理：借りても出してもらっても、会社の価値は変わらない？\",\"ownerHref\":\"/themes/finance-05\"},{\"question\":{\"id\":\"finance-05/q-tax\",\"prompt\":\"4 億 4,000 万円を金利 1.5％ で借り、税率が 30％ のとき、利息で減る税金は1年でいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"660 万円\"},{\"id\":\"b\",\"label\":\"198 万円\"},{\"id\":\"c\",\"label\":\"1,320 万円\"},{\"id\":\"d\",\"label\":\"20 万円\"}],\"answer\":\"b\",\"explanation\":\"利息は 44,000 万円 × 1.5％ ＝ 660 万円です。それが費用になるので、税金は 660 万円 × 30％ ＝ 198 万円減ります。\",\"reviewSection\":\"税金を入れると\"},\"ownerTitle\":\"MM 定理：借りても出してもらっても、会社の価値は変わらない？\",\"ownerHref\":\"/themes/finance-05\"},{\"question\":{\"id\":\"finance-05/q-why-debt\",\"prompt\":\"税金のある世界で、借入が出資より有利になる理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"借入の利息は税金の計算で費用になり、税金が減るから\"},{\"id\":\"b\",\"label\":\"借入は返さなくてよいから\"},{\"id\":\"c\",\"label\":\"配当は税金の計算で費用になるから\"},{\"id\":\"d\",\"label\":\"借入をすると売上が増えるから\"}],\"answer\":\"a\",\"explanation\":\"利息は費用になるので、そのぶん法人税が減ります。配当は費用にならないので、税金は減りません。\",\"reviewSection\":\"税金を入れると\"},\"ownerTitle\":\"MM 定理：借りても出してもらっても、会社の価値は変わらない？\",\"ownerHref\":\"/themes/finance-05\"},{\"question\":{\"id\":\"finance-07/q-order\",\"prompt\":\"ペッキングオーダー理論で、会社がお金を集める順番として正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"出資 → 借入 → 手元のお金\"},{\"id\":\"b\",\"label\":\"借入 → 出資 → 手元のお金\"},{\"id\":\"c\",\"label\":\"手元のお金 → 借入 → 出資\"},{\"id\":\"d\",\"label\":\"手元のお金 → 出資 → 借入\"}],\"answer\":\"c\",\"explanation\":\"まず手元のお金（ためてきた利益）、足りなければ借入、出資は最後です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"ペッキングオーダー理論とトレードオフ理論：お金を集める順番\",\"ownerHref\":\"/themes/finance-07\"},{\"question\":{\"id\":\"finance-07/q-reason\",\"prompt\":\"ペッキングオーダー理論で、出資が最後になる理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"出資は法律で禁止されているから\"},{\"id\":\"b\",\"label\":\"出資には利息がかかるから\"},{\"id\":\"c\",\"label\":\"出資のほうが手続きが早いから\"},{\"id\":\"d\",\"label\":\"経営者のほうが会社をよく知っているので、株を出すと「株が高すぎる合図」と思われやすいから\"}],\"answer\":\"d\",\"explanation\":\"経営者と投資家の間に情報の差があります。新しく株を出すと、投資家は「今の株は高すぎるのでは」と疑い、株の値段が下がりやすくなります。\",\"reviewSection\":\"順番が生まれる理由（ペッキングオーダー理論）\"},\"ownerTitle\":\"ペッキングオーダー理論とトレードオフ理論：お金を集める順番\",\"ownerHref\":\"/themes/finance-07\"},{\"question\":{\"id\":\"finance-07/q-tradeoff\",\"prompt\":\"トレードオフ理論で、くらべる「得」と「損」の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"利息で税金が減る得と、返せなくなりそうなときの費用の損\"},{\"id\":\"b\",\"label\":\"売上が増える得と、原価が増える損\"},{\"id\":\"c\",\"label\":\"株主が増える得と、配当が減る損\"},{\"id\":\"d\",\"label\":\"人が増える得と、人件費が増える損\"}],\"answer\":\"a\",\"explanation\":\"借入には、利息で税金が減る得があります。でも借りすぎると、返せなくなりそうなときの費用が大きくなります。つり合うところが、ちょうどよい借入の量です。\",\"reviewSection\":\"ちょうどよい借入の量（トレードオフ理論）\"},\"ownerTitle\":\"ペッキングオーダー理論とトレードオフ理論：お金を集める順番\",\"ownerHref\":\"/themes/finance-07\"},{\"question\":{\"id\":\"finance-07/q-who\",\"prompt\":\"ペッキングオーダー理論の論文を書いた2人と、その年の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"クラウスとリッツェンバーガー、1958年\"},{\"id\":\"b\",\"label\":\"マイヤーズとマジュフ、1984年\"},{\"id\":\"c\",\"label\":\"キャプランとノートン、1984年\"},{\"id\":\"d\",\"label\":\"モディリアーニとミラー、1973年\"}],\"answer\":\"b\",\"explanation\":\"スチュワート・マイヤーズとニコラス・マジュフが、1984年に Journal of Financial Economics で論文を出しました。クラウスとリッツェンバーガーは、1973年のトレードオフ理論のもとになった論文です。\",\"reviewSection\":\"順番が生まれる理由（ペッキングオーダー理論）\"},\"ownerTitle\":\"ペッキングオーダー理論とトレードオフ理論：お金を集める順番\",\"ownerHref\":\"/themes/finance-07\"},{\"question\":{\"id\":\"finance-07/q-hotel\",\"prompt\":\"ホテルが借入をするときに、トレードオフ理論から気をつけることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ホテルは担保がないので、借入はできない\"},{\"id\":\"b\",\"label\":\"借入はいくらしても損はない\"},{\"id\":\"c\",\"label\":\"借りやすくても、需要が急に落ちたときに返せるかを考えて借りすぎない\"},{\"id\":\"d\",\"label\":\"出資は必ず最初に受ける\"}],\"answer\":\"c\",\"explanation\":\"ホテルは土地や建物を担保にできるので借りやすいです。でも、景気や感染症で需要が落ちることがあります。返せなくなる損まで考えて、借入の量を決めます。\",\"reviewSection\":\"ちょうどよい借入の量（トレードオフ理論）\"},\"ownerTitle\":\"ペッキングオーダー理論とトレードオフ理論：お金を集める順番\",\"ownerHref\":\"/themes/finance-07\"},{\"question\":{\"id\":\"finance-03/q-dilution\",\"prompt\":\"新しく株式を出して出資を受けました。元の株主に起こることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"持株比率が下がる\"},{\"id\":\"b\",\"label\":\"持株比率が上がる\"},{\"id\":\"c\",\"label\":\"持っている株数が減る\"},{\"id\":\"d\",\"label\":\"配当が必ず増える\"}],\"answer\":\"a\",\"explanation\":\"元の株主の株数は変わりません。でも全体の株数が増えるので、元の株主の割合（持株比率）が下がります。これを希薄化といいます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"資本政策：誰が会社の持ち分を持つか\",\"ownerHref\":\"/themes/finance-03\"},{\"question\":{\"id\":\"finance-03/q-ratio\",\"prompt\":\"社長が 1,000 株を持つ会社が、投資家に新しく 250 株を出しました。社長の持株比率は何％ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"75％\"},{\"id\":\"b\",\"label\":\"100％\"},{\"id\":\"c\",\"label\":\"80％\"},{\"id\":\"d\",\"label\":\"25％\"}],\"answer\":\"c\",\"explanation\":\"社長の 1,000 株 ÷ 全体の 1,250 株 ＝ 80％ です。75％ は、100％ から 250 ÷ 1,000（25％）を引いた、まちがった計算です。\",\"reviewSection\":\"出資を受けると持株比率はどう変わるか\"},\"ownerTitle\":\"資本政策：誰が会社の持ち分を持つか\",\"ownerHref\":\"/themes/finance-03\"},{\"question\":{\"id\":\"finance-03/q-threshold\",\"prompt\":\"定款の変更や合併などの重い議案を1人で決めるには、一般にどれだけの議決権が要りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"3分の1 超\"},{\"id\":\"b\",\"label\":\"過半数\"},{\"id\":\"c\",\"label\":\"10％\"},{\"id\":\"d\",\"label\":\"3分の2 以上\"}],\"answer\":\"d\",\"explanation\":\"重い議案は、出席した株主の議決権の 3分の2 以上で決めます。過半数はふつうの議案を決められる割合です。3分の1 超は、重い議案を止められる割合です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"資本政策：誰が会社の持ち分を持つか\",\"ownerHref\":\"/themes/finance-03\"},{\"question\":{\"id\":\"finance-03/q-price\",\"prompt\":\"1 億円を集めます。1株 40 万円で出す場合と、20 万円で出す場合のちがいはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どちらも渡す株数は同じ\"},{\"id\":\"b\",\"label\":\"40 万円のほうが渡す株数が少なく、持ち分を守れる\"},{\"id\":\"c\",\"label\":\"20 万円のほうが渡す株数が少ない\"},{\"id\":\"d\",\"label\":\"20 万円のほうが多くのお金が集まる\"}],\"answer\":\"b\",\"explanation\":\"1 億円 ÷ 40 万円 ＝ 250 株、1 億円 ÷ 20 万円 ＝ 500 株です。1株の値段が高いほど、同じ額を集めるのに渡す株式が少なくて済みます。\",\"reviewSection\":\"1株の値段が大事な理由\"},\"ownerTitle\":\"資本政策：誰が会社の持ち分を持つか\",\"ownerHref\":\"/themes/finance-03\"},{\"question\":{\"id\":\"finance-03/q-careful\",\"prompt\":\"資本政策を慎重に決めるべき理由として、いちばん当てはまるものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"株式は毎年出し直すから\"},{\"id\":\"b\",\"label\":\"出資は返済が必要だから\"},{\"id\":\"c\",\"label\":\"一度渡した株式はかんたんには戻らず、決められることが変わるから\"},{\"id\":\"d\",\"label\":\"株式を出すと売上が減るから\"}],\"answer\":\"c\",\"explanation\":\"株式を渡すと、株主総会での発言の力も渡すことになります。あとから買い戻すのは難しいので、先のことまで考えて決めましょう。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"資本政策：誰が会社の持ち分を持つか\",\"ownerHref\":\"/themes/finance-03\"},{\"question\":{\"id\":\"finance-04/q-interest\",\"prompt\":\"100 万円を金利 2％ で 1 年借りました。利息はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2 万円\"},{\"id\":\"b\",\"label\":\"20 万円\"},{\"id\":\"c\",\"label\":\"2,000 円\"},{\"id\":\"d\",\"label\":\"102 万円\"}],\"answer\":\"a\",\"explanation\":\"利息は、借りたお金 × 金利 です。100 万円 × 2％ ＝ 2 万円です。102 万円は、返すお金の合計です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"金利が上がると、会社に何が起きる？\",\"ownerHref\":\"/themes/finance-04\"},{\"question\":{\"id\":\"finance-04/q-floating\",\"prompt\":\"金利が上がったとき、利息が増えるのはどちらで借りている場合ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"固定金利\"},{\"id\":\"b\",\"label\":\"どちらも増えない\"},{\"id\":\"c\",\"label\":\"変動金利\"},{\"id\":\"d\",\"label\":\"どちらも同じだけ増える\"}],\"answer\":\"c\",\"explanation\":\"変動金利は、世の中の金利に合わせて途中で変わります。固定金利は、借りたときの金利のまま変わりません。\",\"reviewSection\":\"変動金利と固定金利\"},\"ownerTitle\":\"金利が上がると、会社に何が起きる？\",\"ownerHref\":\"/themes/finance-04\"},{\"question\":{\"id\":\"finance-04/q-calc\",\"prompt\":\"44,000 万円を変動金利で借りています。金利が 1.5％ から 2.5％ に上がると、1 年の利息はいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"44 万円\"},{\"id\":\"b\",\"label\":\"440 万円\"},{\"id\":\"c\",\"label\":\"1,100 万円\"},{\"id\":\"d\",\"label\":\"660 万円\"}],\"answer\":\"b\",\"explanation\":\"1.5％ なら 660 万円、2.5％ なら 1,100 万円です。差は 440 万円です。44,000 万円 × 1％ ＝ 440 万円と計算しても同じです。\",\"reviewSection\":\"みなと館ホテルで計算する\"},\"ownerTitle\":\"金利が上がると、会社に何が起きる？\",\"ownerHref\":\"/themes/finance-04\"},{\"question\":{\"id\":\"finance-04/q-npv\",\"prompt\":\"金利が上がると、投資の判断はどう変わりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"割引率が下がり、NPV が大きくなる\"},{\"id\":\"b\",\"label\":\"何も変わらない\"},{\"id\":\"c\",\"label\":\"回収期間が必ず短くなる\"},{\"id\":\"d\",\"label\":\"割引率が上がり、同じ投資でも NPV が小さくなる\"}],\"answer\":\"d\",\"explanation\":\"割引率は、金利が上がると上がりやすくなります。将来のお金を今の価値に直すと小さくなるので、NPV も小さくなります。\",\"reviewSection\":\"投資の判断も変わる\"},\"ownerTitle\":\"金利が上がると、会社に何が起きる？\",\"ownerHref\":\"/themes/finance-04\"},{\"question\":{\"id\":\"finance-04/q-check\",\"prompt\":\"金利が上がりそうなとき、経営者がまず計算しておくとよいことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高の合計\"},{\"id\":\"b\",\"label\":\"変動金利の借入が、金利 1％ でいくら利息が増えるか\"},{\"id\":\"c\",\"label\":\"従業員の人数\"},{\"id\":\"d\",\"label\":\"客室の数\"}],\"answer\":\"b\",\"explanation\":\"変動金利で借りている分は、金利が上がると利息が増えます。1％ でいくら増えるかを先に知っておくと、早めに手を打てます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"金利が上がると、会社に何が起きる？\",\"ownerHref\":\"/themes/finance-04\"},{\"question\":{\"id\":\"finance-06/q-capm\",\"prompt\":\"リスクのない金利 1％、β 1.2、市場のリスクの上乗せ 6％ のとき、CAPM で出す株主資本コストはいくつですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"7.0％\"},{\"id\":\"b\",\"label\":\"1.2％\"},{\"id\":\"c\",\"label\":\"6.0％\"},{\"id\":\"d\",\"label\":\"8.2％\"}],\"answer\":\"d\",\"explanation\":\"1％ ＋ 1.2 × 6％ ＝ 1％ ＋ 7.2％ ＝ 8.2％ です。\",\"reviewSection\":\"みなと館ホテルの WACC\"},\"ownerTitle\":\"CAPM と WACC：集めたお金の「費用」を数字にする\",\"ownerHref\":\"/themes/finance-06\"},{\"question\":{\"id\":\"finance-06/q-beta\",\"prompt\":\"β（ベータ）が 1 より大きい会社の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"株全体より大きく株の値段が動き、株主はより大きな見返りを求める\"},{\"id\":\"b\",\"label\":\"株の値段がまったく動かない\"},{\"id\":\"c\",\"label\":\"借入がまったくない\"},{\"id\":\"d\",\"label\":\"必ず赤字になる\"}],\"answer\":\"a\",\"explanation\":\"βは、株全体が動いたときに、その会社の株がどれだけ動くかです。1 より大きいほど景気の波を大きく受け、株主はそのぶん大きな見返りを求めます。\",\"reviewSection\":\"CAPM の考え方\"},\"ownerTitle\":\"CAPM と WACC：集めたお金の「費用」を数字にする\",\"ownerHref\":\"/themes/finance-06\"},{\"question\":{\"id\":\"finance-06/q-wacc\",\"prompt\":\"株主のお金 60％（費用 8.2％）、借入 40％（税金のあとの費用 1.4％）のとき、WACC はおよそいくつですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"約 9.6％\"},{\"id\":\"b\",\"label\":\"約 5.5％\"},{\"id\":\"c\",\"label\":\"約 4.8％\"},{\"id\":\"d\",\"label\":\"約 1.4％\"}],\"answer\":\"b\",\"explanation\":\"60％ × 8.2％ ＋ 40％ × 1.4％ ＝ 4.92％ ＋ 0.56％ ＝ 5.48％ で、約 5.5％ です。\",\"reviewSection\":\"みなと館ホテルの WACC\"},\"ownerTitle\":\"CAPM と WACC：集めたお金の「費用」を数字にする\",\"ownerHref\":\"/themes/finance-06\"},{\"question\":{\"id\":\"finance-06/q-tax\",\"prompt\":\"WACC の計算で、借入の金利に（1 − 税率）をかけるのはなぜですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"借入は返さなくてよいから\"},{\"id\":\"b\",\"label\":\"銀行が税金を払ってくれるから\"},{\"id\":\"c\",\"label\":\"利息は税金の計算で費用になり、そのぶん税金が減るから\"},{\"id\":\"d\",\"label\":\"株主の費用を小さく見せるため\"}],\"answer\":\"c\",\"explanation\":\"利息が費用になると、法人税が減ります。借入の本当の費用は、減った税金の分だけ小さくなります。\",\"reviewSection\":\"みなと館ホテルの WACC\"},\"ownerTitle\":\"CAPM と WACC：集めたお金の「費用」を数字にする\",\"ownerHref\":\"/themes/finance-06\"},{\"question\":{\"id\":\"finance-06/q-use\",\"prompt\":\"WACC の使い方として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上高の目標にする\"},{\"id\":\"b\",\"label\":\"従業員の人数を決める\"},{\"id\":\"c\",\"label\":\"借入の金利そのものとして銀行に伝える\"},{\"id\":\"d\",\"label\":\"NPV を計算するときの割引率にする\"}],\"answer\":\"d\",\"explanation\":\"WACC は、お金を出した人が期待する平均の利回りです。投資の NPV を計算するときの割引率に使います。\",\"reviewSection\":\"WACC の使い方\"},\"ownerTitle\":\"CAPM と WACC：集めたお金の「費用」を数字にする\",\"ownerHref\":\"/themes/finance-06\"},{\"question\":{\"id\":\"governance-01/q-define\",\"prompt\":\"ガバナンスの基本の考え方として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"執行（決めて動かす）と監督（確かめる）を分ける\"},{\"id\":\"b\",\"label\":\"社長がすべてを決めて、すべてを確かめる\"},{\"id\":\"c\",\"label\":\"取締役会を開かない\"},{\"id\":\"d\",\"label\":\"株主に経営を任せる\"}],\"answer\":\"a\",\"explanation\":\"決める人と確かめる人を分けると、思いこみや、都合の悪い情報に気づきやすくなります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"経営を見張るしくみ：執行と監督\",\"ownerHref\":\"/themes/governance-01\"},{\"question\":{\"id\":\"governance-01/q-role\",\"prompt\":\"監督の役割を持つのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"店長\"},{\"id\":\"b\",\"label\":\"支配人\"},{\"id\":\"c\",\"label\":\"取締役会・監査役・株主\"},{\"id\":\"d\",\"label\":\"アルバイト\"}],\"answer\":\"c\",\"explanation\":\"取締役会、監査役、株主は、経営者の計画と結果を確かめる「監督」の役割を持ちます。\",\"reviewSection\":\"執行と監督\"},\"ownerTitle\":\"経営を見張るしくみ：執行と監督\",\"ownerHref\":\"/themes/governance-01\"},{\"question\":{\"id\":\"governance-01/q-agenda\",\"prompt\":\"取締役会で確かめる「大きな決定」にあたるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"日替わり定食の献立\"},{\"id\":\"b\",\"label\":\"3 億円の借入と、全部の改装\"},{\"id\":\"c\",\"label\":\"アルバイトのシフト\"},{\"id\":\"d\",\"label\":\"備品の注文\"}],\"answer\":\"b\",\"explanation\":\"大きな投資や借入は、取り消しにくく、会社の将来を大きく変えます。だから取締役会で話し合って決めます。\",\"reviewSection\":\"取締役会で何を見るか\"},\"ownerTitle\":\"経営を見張るしくみ：執行と監督\",\"ownerHref\":\"/themes/governance-01\"},{\"question\":{\"id\":\"governance-01/q-signal\",\"prompt\":\"監督がうまく働いていない合図として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"資料を会議の前に配っている\"},{\"id\":\"b\",\"label\":\"社外の顧問がいる\"},{\"id\":\"c\",\"label\":\"計画と実際の差を確かめている\"},{\"id\":\"d\",\"label\":\"いつも全員賛成で、反対の意見が出ない\"}],\"answer\":\"d\",\"explanation\":\"反対の意見が出ない会議は、確かめる役割が働いていないおそれがあります。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"経営を見張るしくみ：執行と監督\",\"ownerHref\":\"/themes/governance-01\"},{\"question\":{\"id\":\"governance-01/q-bad-news\",\"prompt\":\"悪い報告を持ってきた人を強く責め続けると、何が起こりやすいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"悪い報告がもっと早く上がるようになる\"},{\"id\":\"b\",\"label\":\"悪い報告が上がってこなくなり、問題が大きくなってから見つかる\"},{\"id\":\"c\",\"label\":\"問題が自然に解決する\"},{\"id\":\"d\",\"label\":\"取締役会がいらなくなる\"}],\"answer\":\"b\",\"explanation\":\"悪い知らせを持ってくると責められるなら、人はかくすようになります。早く上がるようにするには、報告してくれたこと自体をほめましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"経営を見張るしくみ：執行と監督\",\"ownerHref\":\"/themes/governance-01\"},{\"question\":{\"id\":\"governance-05/q-comply\",\"prompt\":\"コーポレートガバナンス・コードの「コンプライ・オア・エクスプレイン」とは、どういう意味ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"原則を守るか、守らない理由を十分に説明するかを選ぶ\"},{\"id\":\"b\",\"label\":\"すべての原則を必ず守らなければ罰がある\"},{\"id\":\"c\",\"label\":\"説明すれば何をしてもよい\"},{\"id\":\"d\",\"label\":\"原則は上場しない会社だけが守る\"}],\"answer\":\"a\",\"explanation\":\"コードの各原則には法的な拘束力がありません。守らない原則があれば、その理由を、ひな型でなく丁寧に説明することが求められます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"コーポレートガバナンス・コード：上場会社の原則集\",\"ownerHref\":\"/themes/governance-05\"},{\"question\":{\"id\":\"governance-05/q-principles\",\"prompt\":\"2026年の改訂後の基本原則に入っていないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"株主の権利・平等性の確保、株主との対話\"},{\"id\":\"b\",\"label\":\"適切な情報開示と透明性の確保\"},{\"id\":\"c\",\"label\":\"売上を毎年 10％ 増やすこと\"},{\"id\":\"d\",\"label\":\"取締役会等の責務\"}],\"answer\":\"c\",\"explanation\":\"基本原則は、株主の権利と対話、株主以外のステークホルダーとの協働、情報開示と透明性、取締役会等の責務の4つです。売上の目標は入っていません。\",\"reviewSection\":\"4つの基本原則\"},\"ownerTitle\":\"コーポレートガバナンス・コード：上場会社の原則集\",\"ownerHref\":\"/themes/governance-05\"},{\"question\":{\"id\":\"governance-05/q-number\",\"prompt\":\"プライム市場の上場会社が選ぶべき独立社外取締役の人数は、コードでどう書かれていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1名以上\"},{\"id\":\"b\",\"label\":\"全員\"},{\"id\":\"c\",\"label\":\"決まりはない\"},{\"id\":\"d\",\"label\":\"少なくとも3分の1以上\"}],\"answer\":\"d\",\"explanation\":\"プライム市場は少なくとも3分の1以上、そのほかの市場は2名以上です。支配株主がいるプライム市場の会社は、少なくとも過半数です。\",\"reviewSection\":\"独立社外取締役\"},\"ownerTitle\":\"コーポレートガバナンス・コード：上場会社の原則集\",\"ownerHref\":\"/themes/governance-05\"},{\"question\":{\"id\":\"governance-05/q-role\",\"prompt\":\"コードが独立社外取締役に期待する役割に入るのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎日の店の運営を自分で指揮する\"},{\"id\":\"b\",\"label\":\"会社と経営陣・支配株主との利益相反を監督する\"},{\"id\":\"c\",\"label\":\"経営陣の決めたことに、いつも賛成する\"},{\"id\":\"d\",\"label\":\"経理の仕訳を入力する\"}],\"answer\":\"b\",\"explanation\":\"経営の監督、利益相反の監督、少数株主などの意見の反映、成長に向けた助言が期待されています。\",\"reviewSection\":\"独立社外取締役\"},\"ownerTitle\":\"コーポレートガバナンス・コード：上場会社の原則集\",\"ownerHref\":\"/themes/governance-05\"},{\"question\":{\"id\":\"governance-05/q-private\",\"prompt\":\"上場していない会社がこのコードを使う考え方として、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"守らなければ罰がある\"},{\"id\":\"b\",\"label\":\"上場していない会社には関係がないので読まない\"},{\"id\":\"c\",\"label\":\"守る決まりはないが、取締役会の動かし方を見直す手がかりにする\"},{\"id\":\"d\",\"label\":\"全文をそのまま社内規程にしなければならない\"}],\"answer\":\"c\",\"explanation\":\"コードは上場会社向けです。それでも、資料の早い配布や社外の目、独立した内部通報の窓口など、取り入れられる考え方があります。\",\"reviewSection\":\"上場していない会社での使い方\"},\"ownerTitle\":\"コーポレートガバナンス・コード：上場会社の原則集\",\"ownerHref\":\"/themes/governance-05\"},{\"question\":{\"id\":\"governance-02/q-segregation\",\"prompt\":\"「職務の分離」の例として、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"注文した人が、自分で支払いも認める\"},{\"id\":\"b\",\"label\":\"レジ締めを、毎日同じ1人だけで行う\"},{\"id\":\"c\",\"label\":\"仕入れの注文と、請求書の支払いを認める人を、別にする\"},{\"id\":\"d\",\"label\":\"記録を残さない\"}],\"answer\":\"c\",\"explanation\":\"1つの仕事を1人だけで終わらせないことが、職務の分離です。注文と支払いの承認を分けると、うその注文などを防げます。\",\"reviewSection\":\"4つの基本\"},\"ownerTitle\":\"不正と誤りを防ぐ：内部統制の基本\",\"ownerHref\":\"/themes/governance-02\"},{\"question\":{\"id\":\"governance-02/q-purpose\",\"prompt\":\"内部統制の目的として、このテーマが強く言っているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"従業員をいつも疑うこと\"},{\"id\":\"b\",\"label\":\"正直な人が疑われないようにし、不正やまちがいを防いで見つけること\"},{\"id\":\"c\",\"label\":\"税金を減らすこと\"},{\"id\":\"d\",\"label\":\"仕事をおそくすること\"}],\"answer\":\"b\",\"explanation\":\"しくみがあれば、まちがいや不正を早く見つけられます。正直な人は、疑いを晴らせます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"不正と誤りを防ぐ：内部統制の基本\",\"ownerHref\":\"/themes/governance-02\"},{\"question\":{\"id\":\"governance-02/q-cash\",\"prompt\":\"レジの記録と現金のつき合わせで、このテーマがすすめているやり方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"閉店後に2人で数え、差額を毎日記録する\"},{\"id\":\"b\",\"label\":\"月に1回だけ数える\"},{\"id\":\"c\",\"label\":\"差額は気にしない\"},{\"id\":\"d\",\"label\":\"担当者が1人で数え、記録は残さない\"}],\"answer\":\"a\",\"explanation\":\"2人で数えて、差額を毎日記録すると、かたよりに早く気づけます。記録は、正直な担当者を守る証拠にもなります。\",\"reviewSection\":\"4つの基本\"},\"ownerTitle\":\"不正と誤りを防ぐ：内部統制の基本\",\"ownerHref\":\"/themes/governance-02\"},{\"question\":{\"id\":\"governance-02/q-cause\",\"prompt\":\"ある担当者の日だけ、レジのお金が足りない日が続きました。最初にすることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"すぐに不正と決めて処分する\"},{\"id\":\"b\",\"label\":\"記録を消す\"},{\"id\":\"c\",\"label\":\"何もしない\"},{\"id\":\"d\",\"label\":\"おつりの渡しまちがいなども含めて原因を確かめ、手順や教え方を直す\"}],\"answer\":\"d\",\"explanation\":\"差額の原因は、不正とはかぎりません。まず原因を確かめます。まちがいなら、手順を直します。\",\"reviewSection\":\"レジの差額を見る\"},\"ownerTitle\":\"不正と誤りを防ぐ：内部統制の基本\",\"ownerHref\":\"/themes/governance-02\"},{\"question\":{\"id\":\"governance-02/q-small\",\"prompt\":\"従業員の少ない小さな会社での、内部統制の考え方として、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人が少ないので内部統制はいらない\"},{\"id\":\"b\",\"label\":\"社長や別の店の人が確かめる役をして、できる範囲から始める\"},{\"id\":\"c\",\"label\":\"大きな会社と同じしくみをすべてそろえる\"},{\"id\":\"d\",\"label\":\"外の会社に全部任せる\"}],\"answer\":\"b\",\"explanation\":\"人が少なくても、社長や別の店の人が確かめる役をすれば、1人だけで終わる仕事を減らせます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"不正と誤りを防ぐ：内部統制の基本\",\"ownerHref\":\"/themes/governance-02\"},{\"question\":{\"id\":\"governance-06/q-objectives\",\"prompt\":\"COSO の内部統制の枠組みが挙げる3つの目的の組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"売上・利益・株価\"},{\"id\":\"b\",\"label\":\"採用・育成・評価\"},{\"id\":\"c\",\"label\":\"業務・報告・法令の順守\"},{\"id\":\"d\",\"label\":\"予約・客室・レジ\"}],\"answer\":\"c\",\"explanation\":\"3つの目的は、業務（operations）、報告（reporting）、法令の順守（compliance）です。\",\"reviewSection\":\"3つの目的\"},\"ownerTitle\":\"COSO の枠組み：内部統制の5つの要素\",\"ownerHref\":\"/themes/governance-06\"},{\"question\":{\"id\":\"governance-06/q-components\",\"prompt\":\"次のうち、COSO の5つの要素に入らないものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"統制環境\"},{\"id\":\"b\",\"label\":\"リスクの評価\"},{\"id\":\"c\",\"label\":\"モニタリング\"},{\"id\":\"d\",\"label\":\"広告宣伝\"}],\"answer\":\"d\",\"explanation\":\"5つの要素は、統制環境・リスクの評価・統制活動・情報と伝達・モニタリングです。\",\"reviewSection\":\"5つの要素\"},\"ownerTitle\":\"COSO の枠組み：内部統制の5つの要素\",\"ownerHref\":\"/themes/governance-06\"},{\"question\":{\"id\":\"governance-06/q-segregation\",\"prompt\":\"「注文する人と支払いを認める人を分ける（職務の分離）」は、5つの要素のどれに入りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"統制活動\"},{\"id\":\"b\",\"label\":\"統制環境\"},{\"id\":\"c\",\"label\":\"情報と伝達\"},{\"id\":\"d\",\"label\":\"どれにも入らない\"}],\"answer\":\"a\",\"explanation\":\"承認・確認・照合などの具体的な手続は統制活動です。COSO は、職務の分離はふつう統制活動の中に組みこまれるとしています。\",\"reviewSection\":\"5つの要素\"},\"ownerTitle\":\"COSO の枠組み：内部統制の5つの要素\",\"ownerHref\":\"/themes/governance-06\"},{\"question\":{\"id\":\"governance-06/q-limit\",\"prompt\":\"COSO が挙げる、内部統制の限界に入るのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"経営者が内部統制を無視できること、何人かが共謀してすり抜けられること\"},{\"id\":\"b\",\"label\":\"内部統制があれば不正は絶対に起きないこと\"},{\"id\":\"c\",\"label\":\"小さな会社では内部統制が作れないこと\"},{\"id\":\"d\",\"label\":\"法律を守る目的が入っていないこと\"}],\"answer\":\"a\",\"explanation\":\"よくできた内部統制でも、判断のまちがい、単純なミス、経営者による無視、共謀、外の出来事で失敗することがあります。だから保証は合理的なもので、絶対ではありません。\",\"reviewSection\":\"内部統制にもできないこと\"},\"ownerTitle\":\"COSO の枠組み：内部統制の5つの要素\",\"ownerHref\":\"/themes/governance-06\"},{\"question\":{\"id\":\"governance-06/q-erm\",\"prompt\":\"COSO の内部統制の枠組みと ERM の枠組みの関係について、COSO の説明に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ERM ができたので、内部統制の枠組みは使わなくなった\"},{\"id\":\"b\",\"label\":\"互いに補い合うもので、どちらかがもう一方に置きかわるものではない\"},{\"id\":\"c\",\"label\":\"2つはまったく関係がない\"},{\"id\":\"d\",\"label\":\"内部統制の枠組みは、上場会社だけのもの\"}],\"answer\":\"b\",\"explanation\":\"COSO は、2つの枠組みは補い合うもので、どちらも置きかわらないとしています。ERM は 2017年に「戦略とパフォーマンスとの統合」として改訂されました。\",\"reviewSection\":\"ERM との関係\"},\"ownerTitle\":\"COSO の枠組み：内部統制の5つの要素\",\"ownerHref\":\"/themes/governance-06\"},{\"question\":{\"id\":\"governance-04/q-lines\",\"prompt\":\"三線モデルの第3線は、誰が受け持ちますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"店長や支配人などの現場\"},{\"id\":\"b\",\"label\":\"外部の会計監査人\"},{\"id\":\"c\",\"label\":\"本部の品質管理\"},{\"id\":\"d\",\"label\":\"独立した立場で全体を確かめる内部監査\"}],\"answer\":\"d\",\"explanation\":\"第3線は内部監査です。第1線は経営陣と現場、第2線は法務・品質などの専門の役です。外部の監査人は、3つの線の外にいます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"三線モデル：現場・本部・内部監査の役割分担\",\"ownerHref\":\"/themes/governance-04\"},{\"question\":{\"id\":\"governance-04/q-second\",\"prompt\":\"本部の品質管理が衛生の基準を決め、店を回って点検しています。これは何線の役割ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"第1線\"},{\"id\":\"b\",\"label\":\"第2線\"},{\"id\":\"c\",\"label\":\"第3線\"},{\"id\":\"d\",\"label\":\"どの線にも入らない\"}],\"answer\":\"b\",\"explanation\":\"専門の目で助言し、支え、点検するのは第2線です。毎日のリスクを持って手順を動かすのは第1線です。\",\"reviewSection\":\"3つの線\"},\"ownerTitle\":\"三線モデル：現場・本部・内部監査の役割分担\",\"ownerHref\":\"/themes/governance-04\"},{\"question\":{\"id\":\"governance-04/q-independence\",\"prompt\":\"IIA が、確かめが信頼できないとしている場合はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"確かめる人が、その手順を自分で作ったり動かしたりしている\"},{\"id\":\"b\",\"label\":\"確かめる人が、取締役会に報告している\"},{\"id\":\"c\",\"label\":\"確かめる人が、必要な情報を制限なく見られる\"},{\"id\":\"d\",\"label\":\"確かめる人が、ほかの線と情報を分け合っている\"}],\"answer\":\"a\",\"explanation\":\"自分で作った手順や、自分の前の判断を自分で評価すると、確かめが信頼されません。独立は大事ですが、孤立することではありません。\",\"reviewSection\":\"内部監査の独立\"},\"ownerTitle\":\"三線モデル：現場・本部・内部監査の役割分担\",\"ownerHref\":\"/themes/governance-04\"},{\"question\":{\"id\":\"governance-04/q-report\",\"prompt\":\"内部監査の報告のしかたとして、IIA が挙げるふつうの形はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"報告はしない\"},{\"id\":\"b\",\"label\":\"現場の店長にだけ報告する\"},{\"id\":\"c\",\"label\":\"仕事の中身では取締役会に報告し、事務の面では社長に報告する\"},{\"id\":\"d\",\"label\":\"外部の会計監査人にだけ報告する\"}],\"answer\":\"c\",\"explanation\":\"IIA は、仕事の中身では取締役会へ、事務の面では社長（CEO）へ報告する形がふつうだとしています。\",\"reviewSection\":\"内部監査の独立\"},\"ownerTitle\":\"三線モデル：現場・本部・内部監査の役割分担\",\"ownerHref\":\"/themes/governance-04\"},{\"question\":{\"id\":\"governance-04/q-small\",\"prompt\":\"人が少ない会社での三線モデルの使い方として、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"3つの線を別々の部署にしないかぎり、意味がない\"},{\"id\":\"b\",\"label\":\"1人が2つの線にまたがるときは、役割を文字にして取締役会に伝えておく\"},{\"id\":\"c\",\"label\":\"内部監査を外に頼めば、取締役会の責任はなくなる\"},{\"id\":\"d\",\"label\":\"小さな会社は、リスク管理をしなくてよい\"}],\"answer\":\"b\",\"explanation\":\"IIA は、会社の大きさやリスクに合わせて形を決めるものだとしています。外に頼んでも、取締役会の責任は変わりません。\",\"reviewSection\":\"小さな会社での使い方\"},\"ownerTitle\":\"三線モデル：現場・本部・内部監査の役割分担\",\"ownerHref\":\"/themes/governance-04\"},{\"question\":{\"id\":\"governance-03/q-axes\",\"prompt\":\"リスクを並べるときの、2つの見方はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"起こりやすさと、影響の大きさ\"},{\"id\":\"b\",\"label\":\"担当者の数と、店の広さ\"},{\"id\":\"c\",\"label\":\"売上と利益\"},{\"id\":\"d\",\"label\":\"季節と曜日\"}],\"answer\":\"a\",\"explanation\":\"起こりやすさと、影響の大きさ。この両方が大きいリスクから備えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"リスク管理と事業継続：起きる前に決めておく\",\"ownerHref\":\"/themes/governance-03\"},{\"question\":{\"id\":\"governance-03/q-transfer\",\"prompt\":\"4つの備え方のうち、保険に入ることは、どれにあたりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"防ぐ\"},{\"id\":\"b\",\"label\":\"受け入れる\"},{\"id\":\"c\",\"label\":\"移す\"},{\"id\":\"d\",\"label\":\"小さくする\"}],\"answer\":\"c\",\"explanation\":\"保険は、起きたときのお金の損を、ほかに受け持ってもらう備え方です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"リスク管理と事業継続：起きる前に決めておく\",\"ownerHref\":\"/themes/governance-03\"},{\"question\":{\"id\":\"governance-03/q-loss\",\"prompt\":\"1日の売上が 20 万円の店が、5 日間店を開けられなくなりました。失う売上はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"20 万円\"},{\"id\":\"b\",\"label\":\"100 万円\"},{\"id\":\"c\",\"label\":\"25 万円\"},{\"id\":\"d\",\"label\":\"300 万円\"}],\"answer\":\"b\",\"explanation\":\"20 万円 × 5 日 ＝ 100 万円です。このあいだも、人件費や家賃は出ていきます。\",\"reviewSection\":\"影響を数字にする\"},\"ownerTitle\":\"リスク管理と事業継続：起きる前に決めておく\",\"ownerHref\":\"/themes/governance-03\"},{\"question\":{\"id\":\"governance-03/q-after\",\"prompt\":\"再開したあと、お客様が 2 割減り、それが 75 日続きました（もとの1日の売上は 20 万円）。減る売上はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"100 万円\"},{\"id\":\"b\",\"label\":\"1,500 万円\"},{\"id\":\"c\",\"label\":\"4 万円\"},{\"id\":\"d\",\"label\":\"300 万円\"}],\"answer\":\"d\",\"explanation\":\"20 万円 × 20％ × 75 日 ＝ 300 万円です。信用をなくしたあとの減り方は、店を閉めていたあいだの損より大きいことがあります。\",\"reviewSection\":\"影響を数字にする\"},\"ownerTitle\":\"リスク管理と事業継続：起きる前に決めておく\",\"ownerHref\":\"/themes/governance-03\"},{\"question\":{\"id\":\"governance-03/q-bcp\",\"prompt\":\"BCP（事業継続計画）の説明として、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"毎年の売上の計画\"},{\"id\":\"b\",\"label\":\"災害やシステムが止まったときに、何を優先し、どう事業を続けるかを前もって決めたもの\"},{\"id\":\"c\",\"label\":\"新しい店を出す計画\"},{\"id\":\"d\",\"label\":\"従業員の休みの計画\"}],\"answer\":\"b\",\"explanation\":\"BCP は、いざというときにあわてず動けるように、優先する仕事と手順を前もって決めておく計画です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"リスク管理と事業継続：起きる前に決めておく\",\"ownerHref\":\"/themes/governance-03\"},{\"question\":{\"id\":\"hr-01/q-rate\",\"prompt\":\"年のはじめに 60 人いた会社で、1 年に 12 人が辞めました。離職率は何％ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"20％\"},{\"id\":\"b\",\"label\":\"12％\"},{\"id\":\"c\",\"label\":\"5％\"},{\"id\":\"d\",\"label\":\"72％\"}],\"answer\":\"a\",\"explanation\":\"離職率 ＝ 辞めた人数 ÷ 年のはじめの人数 ＝ 12 ÷ 60 ＝ 20％ です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"採用と定着：人が辞めるといくらかかるか\",\"ownerHref\":\"/themes/hr-01\"},{\"question\":{\"id\":\"hr-01/q-cost\",\"prompt\":\"1人辞めるごとに、採用に 30 万円、育てるのに 40 万円かかる会社があります。1 年に 12 人辞めると、費用は1年でいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"70 万円\"},{\"id\":\"b\",\"label\":\"360 万円\"},{\"id\":\"c\",\"label\":\"840 万円\"},{\"id\":\"d\",\"label\":\"480 万円\"}],\"answer\":\"c\",\"explanation\":\"(30 ＋ 40) 万円 × 12 人 ＝ 840 万円です。360 万円は採用の費用だけ、480 万円は育てる費用だけの金額です。\",\"reviewSection\":\"離職のコストを計算する\"},\"ownerTitle\":\"採用と定着：人が辞めるといくらかかるか\",\"ownerHref\":\"/themes/hr-01\"},{\"question\":{\"id\":\"hr-01/q-timing\",\"prompt\":\"人に辞めずにいてもらうために、とくに力を入れたい時期はいつですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"入社して 10 年目\"},{\"id\":\"b\",\"label\":\"入社して最初の 3 か月\"},{\"id\":\"c\",\"label\":\"辞めたいと言われた後\"},{\"id\":\"d\",\"label\":\"定年の直前\"}],\"answer\":\"b\",\"explanation\":\"辞める人は、入ってすぐの時期に多いです。初日の迎え方、教える担当の人、最初の目標で、辞めるかどうかが大きく変わります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"採用と定着：人が辞めるといくらかかるか\",\"ownerHref\":\"/themes/hr-01\"},{\"question\":{\"id\":\"hr-01/q-ask\",\"prompt\":\"辞める理由を知る方法として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"辞めた人の退職面談だけで十分\"},{\"id\":\"b\",\"label\":\"理由は聞かない\"},{\"id\":\"c\",\"label\":\"求人広告の反応から想像する\"},{\"id\":\"d\",\"label\":\"今いる人に定期的に聞く\"}],\"answer\":\"d\",\"explanation\":\"退職面談では、本音が出にくいです。今いる人に定期的に聞けば、辞める前に手が打てます。\",\"reviewSection\":\"辞めない職場にする\"},\"ownerTitle\":\"採用と定着：人が辞めるといくらかかるか\",\"ownerHref\":\"/themes/hr-01\"},{\"question\":{\"id\":\"hr-01/q-dept\",\"prompt\":\"同じ会社なのに、部署によって離職率が大きく違います。まず疑いたいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"給料の計算のまちがい\"},{\"id\":\"b\",\"label\":\"上司の関わり方や任せ方の違い\"},{\"id\":\"c\",\"label\":\"求人広告の色\"},{\"id\":\"d\",\"label\":\"会社の住所\"}],\"answer\":\"b\",\"explanation\":\"同じ会社なら、給料の決まりは同じです。差の多くは、職場の上司との関係や、仕事の任され方から生まれます。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"採用と定着：人が辞めるといくらかかるか\",\"ownerHref\":\"/themes/hr-01\"},{\"question\":{\"id\":\"hr-05/q-hygiene\",\"prompt\":\"二要因理論で「衛生要因」に入るものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"仕事を任されること\"},{\"id\":\"b\",\"label\":\"新しい技術を覚えること\"},{\"id\":\"c\",\"label\":\"給料や働く環境\"},{\"id\":\"d\",\"label\":\"お客様に認められること\"}],\"answer\":\"c\",\"explanation\":\"給料や働く環境は、足りないと不満になる衛生要因です。任されること・成長・認められることは、動機づけ要因です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"二要因理論：給料だけでは、やる気は生まれない\",\"ownerHref\":\"/themes/hr-05\"},{\"question\":{\"id\":\"hr-05/q-raise-effect\",\"prompt\":\"二要因理論では、衛生要因をよくすると、どうなると考えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"不満は減るが、それだけではやる気は生まれにくい\"},{\"id\":\"b\",\"label\":\"やる気が大きく上がる\"},{\"id\":\"c\",\"label\":\"不満が増える\"},{\"id\":\"d\",\"label\":\"何も変わらないので、手を入れなくてよい\"}],\"answer\":\"a\",\"explanation\":\"衛生要因は不満を減らします。でも、やる気を生むのは、仕事そのものの面白さや責任などの動機づけ要因です。\",\"reviewSection\":\"2つの要因を分ける\"},\"ownerTitle\":\"二要因理論：給料だけでは、やる気は生まれない\",\"ownerHref\":\"/themes/hr-05\"},{\"question\":{\"id\":\"hr-05/q-shokudo\",\"prompt\":\"うみかぜ食堂で、スタッフが自分から工夫するようになったきっかけはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"時給を 50 円上げたこと\"},{\"id\":\"b\",\"label\":\"休憩室を広くしたこと\"},{\"id\":\"c\",\"label\":\"厳しい罰の決まりを作ったこと\"},{\"id\":\"d\",\"label\":\"おすすめを決めさせ、仕込みを任せ、ほめ言葉を伝えたこと\"}],\"answer\":\"d\",\"explanation\":\"時給を上げると不満の声は減りました。自分から動く人が出たのは、任せることや認めることを始めてからです。\",\"reviewSection\":\"うみかぜ食堂で考える\"},\"ownerTitle\":\"二要因理論：給料だけでは、やる気は生まれない\",\"ownerHref\":\"/themes/hr-05\"},{\"question\":{\"id\":\"hr-05/q-not-ignore\",\"prompt\":\"「やる気は仕事そのものから生まれる」と聞いた経営者の考えとして、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"給料は相場より大きく低くてもかまわない\"},{\"id\":\"b\",\"label\":\"衛生要因も手ぬきせず、そのうえで仕事を面白くする\"},{\"id\":\"c\",\"label\":\"休みは減らしてもよい\"},{\"id\":\"d\",\"label\":\"ほめれば、給料の不満はすべて消える\"}],\"answer\":\"b\",\"explanation\":\"衛生要因が大きく劣ると、不満で人は辞めます。衛生要因を整えたうえで、動機づけ要因を足します。\",\"reviewSection\":\"2つの要因を分ける\"},\"ownerTitle\":\"二要因理論：給料だけでは、やる気は生まれない\",\"ownerHref\":\"/themes/hr-05\"},{\"question\":{\"id\":\"hr-05/q-limit\",\"prompt\":\"二要因理論の注意点として、このテーマが挙げているものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ホテルの仕事だけを調べて作られた\"},{\"id\":\"b\",\"label\":\"給料の大切さを否定している\"},{\"id\":\"c\",\"label\":\"エンジニアと会計の仕事をする人への聞き取りから生まれ、どの仕事にもそのまま当てはまるとは限らない\"},{\"id\":\"d\",\"label\":\"法律で使い方が決められている\"}],\"answer\":\"c\",\"explanation\":\"もとになった聞き取りの相手は、エンジニアと会計の仕事をする人でした。「満足」と「やる気」は同じではない、という批判もあります。\",\"reviewSection\":\"気をつけること\"},\"ownerTitle\":\"二要因理論：給料だけでは、やる気は生まれない\",\"ownerHref\":\"/themes/hr-05\"},{\"question\":{\"id\":\"hr-02/q-parts\",\"prompt\":\"人事の仕組みをつくる3つの組み合わせはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"採用・研修・退職\"},{\"id\":\"b\",\"label\":\"等級・評価・報酬\"},{\"id\":\"c\",\"label\":\"給料・賞与・手当\"},{\"id\":\"d\",\"label\":\"本社・店舗・工場\"}],\"answer\":\"b\",\"explanation\":\"等級（役割の段階）、評価（働きぶりと成果を見る）、報酬（給料など）の3つです。3つをつなげると、何ができればどう上がるかが見えます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"評価と報酬：何に報いる会社か\",\"ownerHref\":\"/themes/hr-02\"},{\"question\":{\"id\":\"hr-02/q-order\",\"prompt\":\"報酬を決める順番として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"人件費の総額を先に決め、その中で配り方を決める\"},{\"id\":\"b\",\"label\":\"一人ひとりの希望を聞いて足し合わせる\"},{\"id\":\"c\",\"label\":\"競合と同じ額にする\"},{\"id\":\"d\",\"label\":\"前の年と同じにする\"}],\"answer\":\"a\",\"explanation\":\"先に、会社が払い続けられる人件費の合計を決めます。その中で、等級と評価に合わせて配ります。一人ずつ足していくと、利益で払えない額になりやすいです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"評価と報酬：何に報いる会社か\",\"ownerHref\":\"/themes/hr-02\"},{\"question\":{\"id\":\"hr-02/q-raise-calc\",\"prompt\":\"人件費が 17,000 万円の会社で、昇給によって人件費の全体が 3％ 増えます。人件費は1年でいくら増えますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"170 万円\"},{\"id\":\"b\",\"label\":\"300 万円\"},{\"id\":\"c\",\"label\":\"5,100 万円\"},{\"id\":\"d\",\"label\":\"510 万円\"}],\"answer\":\"d\",\"explanation\":\"17,000 万円 × 3％ ＝ 510 万円です。昇給は次の年からも続きます。毎年の利益で払えるかを確かめましょう。\",\"reviewSection\":\"昇給の重さを計算する\"},\"ownerTitle\":\"評価と報酬：何に報いる会社か\",\"ownerHref\":\"/themes/hr-02\"},{\"question\":{\"id\":\"hr-02/q-strategy\",\"prompt\":\"「地元の魚料理で違いを出す」戦略の会社です。評価の項目に入れたいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"出勤した日数だけ\"},{\"id\":\"b\",\"label\":\"社長と話した回数\"},{\"id\":\"c\",\"label\":\"料理の腕前と、料理のいわれをお客様に伝える接客\"},{\"id\":\"d\",\"label\":\"持っている資格の数だけ\"}],\"answer\":\"c\",\"explanation\":\"評価の項目は、戦略とそろえます。違いを生む腕前やふるまいを評価すると、働く人がそこに力を入れます。\",\"reviewSection\":\"3つの仕組み\"},\"ownerTitle\":\"評価と報酬：何に報いる会社か\",\"ownerHref\":\"/themes/hr-02\"},{\"question\":{\"id\":\"hr-02/q-bonus\",\"prompt\":\"昇給と賞与の違いとして、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"昇給は一度上げると下げにくく、賞与は業績に合わせて増減しやすい\"},{\"id\":\"b\",\"label\":\"賞与は一度上げると下げられない\"},{\"id\":\"c\",\"label\":\"昇給は人件費に入らない\"},{\"id\":\"d\",\"label\":\"どちらも同じ\"}],\"answer\":\"a\",\"explanation\":\"基本給は、毎月の生活の土台です。だから下げにくいです。賞与は、その年の業績に合わせやすいです。利益の波を受け止める役目があります。\",\"reviewSection\":\"昇給の重さを計算する\"},\"ownerTitle\":\"評価と報酬：何に報いる会社か\",\"ownerHref\":\"/themes/hr-02\"},{\"question\":{\"id\":\"hr-06/q-compare\",\"prompt\":\"公平理論で、人が不公平を感じるのはどんなときですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"給料が去年より少しでも上がらなかったとき\"},{\"id\":\"b\",\"label\":\"自分の出したものと受け取ったものの釣り合いが、ほかの人とくらべて取れていないとき\"},{\"id\":\"c\",\"label\":\"会社の売上が下がったとき\"},{\"id\":\"d\",\"label\":\"仕事が忙しいとき\"}],\"answer\":\"b\",\"explanation\":\"公平理論では、自分の釣り合いを、ほかの人の釣り合いとくらべて判断します。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"公平理論：人は「まわりとくらべて」不満を持つ\",\"ownerHref\":\"/themes/hr-06\"},{\"question\":{\"id\":\"hr-06/q-input\",\"prompt\":\"公平理論で「出したもの」に入るのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"給料\"},{\"id\":\"b\",\"label\":\"賞与\"},{\"id\":\"c\",\"label\":\"休み\"},{\"id\":\"d\",\"label\":\"経験や努力\"}],\"answer\":\"d\",\"explanation\":\"出したものは、時間・経験・腕前・努力などです。給料・賞与・休みは、受け取ったものです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"公平理論：人は「まわりとくらべて」不満を持つ\",\"ownerHref\":\"/themes/hr-06\"},{\"question\":{\"id\":\"hr-06/q-reaction\",\"prompt\":\"不公平だと感じた人がとる行動として、このテーマが挙げているものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"頑張りを減らしたり、辞めたりする\"},{\"id\":\"b\",\"label\":\"必ず社長に直接うったえる\"},{\"id\":\"c\",\"label\":\"何もしない\"},{\"id\":\"d\",\"label\":\"ほかの人の給料を下げるよう頼む\"}],\"answer\":\"a\",\"explanation\":\"釣り合いを取りもどそうとして、頑張りを減らす、仕事の質を下げる、見方を変える、辞める、などをします。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"公平理論：人は「まわりとくらべて」不満を持つ\",\"ownerHref\":\"/themes/hr-06\"},{\"question\":{\"id\":\"hr-06/q-veteran\",\"prompt\":\"新人に仕事を教えているベテランのパートが、不公平を感じています。いちばんよい手はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"教えるのをやめてもらう\"},{\"id\":\"b\",\"label\":\"新人の社員の給料を下げる\"},{\"id\":\"c\",\"label\":\"教える仕事を評価や手当で認め、待遇の差の理由も説明する\"},{\"id\":\"d\",\"label\":\"気にしないように言う\"}],\"answer\":\"c\",\"explanation\":\"出したもの（教えること）を認め、差の理由を言葉にすると、不公平感がへります。\",\"reviewSection\":\"不公平感をへらす\"},\"ownerTitle\":\"公平理論：人は「まわりとくらべて」不満を持つ\",\"ownerHref\":\"/themes/hr-06\"},{\"question\":{\"id\":\"hr-06/q-feel\",\"prompt\":\"公平理論で、とくに大切だとされているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"全員の給料を同じにすること\"},{\"id\":\"b\",\"label\":\"本人が公平だと感じるかどうか\"},{\"id\":\"c\",\"label\":\"給料をできるだけ秘密にすること\"},{\"id\":\"d\",\"label\":\"差をつけないこと\"}],\"answer\":\"b\",\"explanation\":\"本当の差より、本人の感じ方が行動を決めます。だから、差の理由を説明して、しくみを見えるようにします。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"公平理論：人は「まわりとくらべて」不満を持つ\",\"ownerHref\":\"/themes/hr-06\"},{\"question\":{\"id\":\"hr-03/q-multi\",\"prompt\":\"多能工化とは、何のことですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"1人がいくつもの仕事をできるように育てること\"},{\"id\":\"b\",\"label\":\"機械をたくさん入れること\"},{\"id\":\"c\",\"label\":\"部署ごとに人を決めて動かさないこと\"},{\"id\":\"d\",\"label\":\"派遣社員を増やすこと\"}],\"answer\":\"a\",\"explanation\":\"多能工化とは、1人ができる仕事を増やすことです。混む部署へ人を回せるようになります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"配置と育成：多能工化で現場を強くする\",\"ownerHref\":\"/themes/hr-03\"},{\"question\":{\"id\":\"hr-03/q-effect\",\"prompt\":\"朝はレストラン、夕方はフロントが混むホテルです。多能工化の効果として正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どちらの部署も、いちばん混む時間に合わせた人数が必要になる\"},{\"id\":\"b\",\"label\":\"混む時間に手伝いに回せるので、1日に必要なのべ人数が少なくなる\"},{\"id\":\"c\",\"label\":\"お客様の待ち時間が長くなる\"},{\"id\":\"d\",\"label\":\"教える必要がなくなる\"}],\"answer\":\"b\",\"explanation\":\"部署ごとに混む時間がずれていれば、両方できる人を手伝いに回せます。部署ごとに人を決めるより、少ない人数で回せます。\",\"reviewSection\":\"多能工化の効果\"},\"ownerTitle\":\"配置と育成：多能工化で現場を強くする\",\"ownerHref\":\"/themes/hr-03\"},{\"question\":{\"id\":\"hr-03/q-ojt\",\"prompt\":\"OJT の説明として、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"外の研修所で、座って講義を聞くこと\"},{\"id\":\"b\",\"label\":\"本を配って読んでもらうこと\"},{\"id\":\"c\",\"label\":\"仕事をしながら教えること\"},{\"id\":\"d\",\"label\":\"採用の面接のこと\"}],\"answer\":\"c\",\"explanation\":\"OJT（On the Job Training）は、実際の仕事の中で教えるやり方です。教える順番と、できたかの確かめ方を決めておきます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"配置と育成：多能工化で現場を強くする\",\"ownerHref\":\"/themes/hr-03\"},{\"question\":{\"id\":\"hr-03/q-first-step\",\"prompt\":\"育て方の段取りで、最初にすることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"給料を上げる\"},{\"id\":\"b\",\"label\":\"全員に全部の仕事を一度にやらせる\"},{\"id\":\"c\",\"label\":\"評価の面談をする\"},{\"id\":\"d\",\"label\":\"仕事を分けて、できたかを確かめる基準を書いた一覧を作る\"}],\"answer\":\"d\",\"explanation\":\"まず、何ができればよいかを一覧にします。次に、教える人と期間を決めます。できたら、評価で認めます。この順に進めます。\",\"reviewSection\":\"育て方の段取り\"},\"ownerTitle\":\"配置と育成：多能工化で現場を強くする\",\"ownerHref\":\"/themes/hr-03\"},{\"question\":{\"id\":\"hr-03/q-caution\",\"prompt\":\"多能工化を進めるときに気をつけることとして、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"本人の希望を聞かずに何でもやらせると、得意な仕事の質が落ちたり、辞める理由になったりする\"},{\"id\":\"b\",\"label\":\"多能工化すると必ず人件費が増える\"},{\"id\":\"c\",\"label\":\"多能工化は法律で禁止されている\"},{\"id\":\"d\",\"label\":\"教える時間は要らない\"}],\"answer\":\"a\",\"explanation\":\"多能工化は、本人の希望も聞きながら進めます。むりにやらせると、仕事の質が落ちたり、辞める人が出たりします。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"配置と育成：多能工化で現場を強くする\",\"ownerHref\":\"/themes/hr-03\"},{\"question\":{\"id\":\"hr-04/q-definition\",\"prompt\":\"心理的安全性の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"仕事の目標を低くして、だれも困らないようにすること\"},{\"id\":\"b\",\"label\":\"意見やミスを言っても責められないと、チームのみんなが思えている状態\"},{\"id\":\"c\",\"label\":\"給料が安定していて、辞めさせられる心配がないこと\"},{\"id\":\"d\",\"label\":\"上の人の言うことに、だれも反対しない状態\"}],\"answer\":\"b\",\"explanation\":\"心理的安全性は「言っても大丈夫」と思えることです。目標を下げることでも、なれ合いでもありません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"心理的安全性：ミスを言える職場は強い\",\"ownerHref\":\"/themes/hr-04\"},{\"question\":{\"id\":\"hr-04/q-researcher\",\"prompt\":\"チームの心理的安全性を研究で広めた研究者と、その研究について正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"カーネマンが、レストランの客を調べた\"},{\"id\":\"b\",\"label\":\"コッターが、銀行の支店を調べた\"},{\"id\":\"c\",\"label\":\"チャルディーニが、販売員の話し方を調べた\"},{\"id\":\"d\",\"label\":\"エドモンドソンが、工場のチームを調べた\"}],\"answer\":\"d\",\"explanation\":\"ハーバード・ビジネス・スクールのエドモンドソンが、1999 年の論文で、工場の 51 のチームを調べました。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"心理的安全性：ミスを言える職場は強い\",\"ownerHref\":\"/themes/hr-04\"},{\"question\":{\"id\":\"hr-04/q-report-count\",\"prompt\":\"小さなミスの報告が、ほかの館よりずっと少ない館があります。どう考えるのがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"言えていないだけかもしれない。上の人の反応を確かめる\"},{\"id\":\"b\",\"label\":\"ミスがない、よい館なので、そのままでよい\"},{\"id\":\"c\",\"label\":\"報告が多い館の支配人を叱る\"},{\"id\":\"d\",\"label\":\"報告の決まりをなくす\"}],\"answer\":\"a\",\"explanation\":\"報告が少ないのは、ミスをかくしているからかもしれません。かくれたミスは、やがて大きなクレームになります。\",\"reviewSection\":\"ミスが上がる職場、かくれる職場\"},\"ownerTitle\":\"心理的安全性：ミスを言える職場は強い\",\"ownerHref\":\"/themes/hr-04\"},{\"question\":{\"id\":\"hr-04/q-first-reaction\",\"prompt\":\"スタッフが「お客様の予約を入れまちがえました」と報告に来ました。上の人の最初の反応として、よいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ほかのスタッフの前で強く叱る\"},{\"id\":\"b\",\"label\":\"聞かなかったことにする\"},{\"id\":\"c\",\"label\":\"まず報告にお礼を言い、そのあとで一緒に直し方を考える\"},{\"id\":\"d\",\"label\":\"報告した人の評価を下げる\"}],\"answer\":\"c\",\"explanation\":\"最初の反応で、次も言うかどうかが決まります。まずお礼を言い、直し方はそのあとで考えます。\",\"reviewSection\":\"言いやすさをつくる3つの行動\"},\"ownerTitle\":\"心理的安全性：ミスを言える職場は強い\",\"ownerHref\":\"/themes/hr-04\"},{\"question\":{\"id\":\"hr-04/q-not-lenient\",\"prompt\":\"心理的安全性のある職場について、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"何をしても注意しない\"},{\"id\":\"b\",\"label\":\"目標を下げて、ミスが起きないようにする\"},{\"id\":\"c\",\"label\":\"悪い知らせは社長に届けない\"},{\"id\":\"d\",\"label\":\"言ったことは責めないが、決まりを何度も破る人には、はっきり注意する\"}],\"answer\":\"d\",\"explanation\":\"責めないのは「言ったこと」です。わざと手を抜くことや、決まりを何度も破ることまで許すわけではありません。\",\"reviewSection\":\"言いやすさをつくる3つの行動\"},\"ownerTitle\":\"心理的安全性：ミスを言える職場は強い\",\"ownerHref\":\"/themes/hr-04\"},{\"question\":{\"id\":\"it-dx-01/q-judge\",\"prompt\":\"IT への投資の決め方として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どの仕事が何時間減り、いくらの効果になるかで決める\"},{\"id\":\"b\",\"label\":\"最新のものかどうかで決める\"},{\"id\":\"c\",\"label\":\"ライバルの会社が入れたかどうかで決める\"},{\"id\":\"d\",\"label\":\"画面がきれいかどうかで決める\"}],\"answer\":\"a\",\"explanation\":\"投資の効果は、時間とお金で表します。そうすれば、ほかの投資と同じものさしで比べられます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"IT への投資を数字で決める\",\"ownerHref\":\"/themes/it-dx-01\"},{\"question\":{\"id\":\"it-dx-01/q-saving\",\"prompt\":\"働く時間が年 2,000 時間減り、1時間あたりの人件費が 1,500 円なら、人件費は年いくら減りますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"30 万円\"},{\"id\":\"b\",\"label\":\"150 万円\"},{\"id\":\"c\",\"label\":\"300 万円\"},{\"id\":\"d\",\"label\":\"3,000 万円\"}],\"answer\":\"c\",\"explanation\":\"2,000 時間 × 1,500 円 ＝ 300 万円です。ただし、シフトを本当に減らすか、ほかの仕事に回して、はじめてお金の効果になります。\",\"reviewSection\":\"自動チェックイン機を比べる\"},\"ownerTitle\":\"IT への投資を数字で決める\",\"ownerHref\":\"/themes/it-dx-01\"},{\"question\":{\"id\":\"it-dx-01/q-payback\",\"prompt\":\"代金 600 万円、毎年減る人件費 300 万円、毎年の保守料 60 万円です。回収期間は何年ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"2 年\"},{\"id\":\"b\",\"label\":\"2.5 年\"},{\"id\":\"c\",\"label\":\"10 年\"},{\"id\":\"d\",\"label\":\"5 年\"}],\"answer\":\"b\",\"explanation\":\"毎年の現金の効果は 300 − 60 ＝ 240 万円です。600 ÷ 240 ＝ 2.5 年です。保守料を引き忘れると、2 年とまちがえます。\",\"reviewSection\":\"自動チェックイン機を比べる\"},\"ownerTitle\":\"IT への投資を数字で決める\",\"ownerHref\":\"/themes/it-dx-01\"},{\"question\":{\"id\":\"it-dx-01/q-pl\",\"prompt\":\"上の例で、毎年の営業利益への効果はいくらですか（減価償却は 5 年で、毎年同じ額）。\",\"choices\":[{\"id\":\"a\",\"label\":\"＋300 万円\"},{\"id\":\"b\",\"label\":\"＋240 万円\"},{\"id\":\"c\",\"label\":\"−120 万円\"},{\"id\":\"d\",\"label\":\"＋120 万円\"}],\"answer\":\"d\",\"explanation\":\"人件費 −300 万円、保守料 ＋60 万円、減価償却費 ＋120 万円（600 ÷ 5）です。差し引き、営業利益は ＋120 万円です。現金の効果（240 万円）とは、減価償却費の分だけ差があります。\",\"reviewSection\":\"自動チェックイン機を比べる\"},\"ownerTitle\":\"IT への投資を数字で決める\",\"ownerHref\":\"/themes/it-dx-01\"},{\"question\":{\"id\":\"it-dx-01/q-fail\",\"prompt\":\"機械で時間が減ったのに、人件費が減りませんでした。いちばん考えられる理由はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"減価償却費が大きいから\"},{\"id\":\"b\",\"label\":\"シフトを変えず、減った時間の使い道も決めていなかったから\"},{\"id\":\"c\",\"label\":\"保守料が安いから\"},{\"id\":\"d\",\"label\":\"機械が新しすぎるから\"}],\"answer\":\"b\",\"explanation\":\"時間が減っても、同じ人数が同じ時間いれば、人件費は変わりません。シフトを減らすか、ほかの大事な仕事に回すかを決めましょう。\",\"reviewSection\":\"効果が出ないよくある例\"},\"ownerTitle\":\"IT への投資を数字で決める\",\"ownerHref\":\"/themes/it-dx-01\"},{\"question\":{\"id\":\"it-dx-02/q-purpose\",\"prompt\":\"システムをつなぐ2つの目的として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"打ちこむ手間とまちがいを減らすことと、経営の数字を早く正しく見ること\"},{\"id\":\"b\",\"label\":\"最新の機械を使うことと、広告を出すこと\"},{\"id\":\"c\",\"label\":\"従業員を減らすことと、税金を減らすこと\"},{\"id\":\"d\",\"label\":\"画面を増やすことと、紙を増やすこと\"}],\"answer\":\"a\",\"explanation\":\"つなぐ値打ちは、同じ打ちこみを2回する手間とまちがいを減らし、数字を早く正しく見られるようにすることです。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"データをつなぐ：予約・客室・レジ・会計\",\"ownerHref\":\"/themes/it-dx-02\"},{\"question\":{\"id\":\"it-dx-02/q-hours\",\"prompt\":\"毎日 60 分の手入力を 1 年（365 日）続けると、年に何時間ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"60 時間\"},{\"id\":\"b\",\"label\":\"120 時間\"},{\"id\":\"c\",\"label\":\"365 時間\"},{\"id\":\"d\",\"label\":\"3,650 時間\"}],\"answer\":\"c\",\"explanation\":\"1 時間 × 365 日 ＝ 365 時間です。1時間 1,500 円なら、年 54.75 万円になります。\",\"reviewSection\":\"手入力のコストを数える\"},\"ownerTitle\":\"データをつなぐ：予約・客室・レジ・会計\",\"ownerHref\":\"/themes/it-dx-02\"},{\"question\":{\"id\":\"it-dx-02/q-hidden\",\"prompt\":\"手入力の「数字に出にくい損」として、このテーマが挙げているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"電気代が増える\"},{\"id\":\"b\",\"label\":\"打ちまちがいによるダブルブッキングや、月末のしめの遅れ\"},{\"id\":\"c\",\"label\":\"税率が上がる\"},{\"id\":\"d\",\"label\":\"客室がせまくなる\"}],\"answer\":\"b\",\"explanation\":\"手入力にはまちがいが入ります。ダブルブッキングのように信用をなくすことや、数字のしめの遅れが起きます。\",\"reviewSection\":\"手入力のコストを数える\"},\"ownerTitle\":\"データをつなぐ：予約・客室・レジ・会計\",\"ownerHref\":\"/themes/it-dx-02\"},{\"question\":{\"id\":\"it-dx-02/q-order\",\"prompt\":\"つなぐ順番として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"全部のシステムを一度に入れかえる\"},{\"id\":\"b\",\"label\":\"いちばん安いところからつなぐ\"},{\"id\":\"c\",\"label\":\"つながずに手入力を続ける\"},{\"id\":\"d\",\"label\":\"同じ打ちこみを2回しているところを書き出し、いちばん手間の大きいところからつなぐ\"}],\"answer\":\"d\",\"explanation\":\"全部を一度に入れかえると、うまくいかなかったときの影響が大きくなります。手間の大きいところから、順に進めます。\",\"reviewSection\":\"つなぐときの順番\"},\"ownerTitle\":\"データをつなぐ：予約・客室・レジ・会計\",\"ownerHref\":\"/themes/it-dx-02\"},{\"question\":{\"id\":\"it-dx-02/q-name\",\"prompt\":\"同じお客様が別々の名前で登録されていると、何が見えなくなりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"リピート率や LTV\"},{\"id\":\"b\",\"label\":\"客室の数\"},{\"id\":\"c\",\"label\":\"法人税の税率\"},{\"id\":\"d\",\"label\":\"建物の減価償却費\"}],\"answer\":\"a\",\"explanation\":\"同じお客様を1人として数えられないと、何回来たかがわかりません。だから、リピート率や LTV を出せません。\",\"reviewSection\":\"つなぐときの順番\"},\"ownerTitle\":\"データをつなぐ：予約・客室・レジ・会計\",\"ownerHref\":\"/themes/it-dx-02\"},{\"question\":{\"id\":\"it-dx-03/q-goal\",\"prompt\":\"情報セキュリティで守りたい2つのことは、どれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"止まらないことと、漏れないこと\"},{\"id\":\"b\",\"label\":\"速いことと、安いこと\"},{\"id\":\"c\",\"label\":\"新しいことと、きれいなこと\"},{\"id\":\"d\",\"label\":\"多いことと、大きいこと\"}],\"answer\":\"a\",\"explanation\":\"予約やレジが止まらないことと、お客様の情報が漏れないことの2つを守ります。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"情報セキュリティの基本：止まらない・漏れない\",\"ownerHref\":\"/themes/it-dx-03\"},{\"question\":{\"id\":\"it-dx-03/q-ransomware\",\"prompt\":\"ランサムウェアの説明で、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"パソコンを速くするソフト\"},{\"id\":\"b\",\"label\":\"新しいお客様を集める広告\"},{\"id\":\"c\",\"label\":\"データを使えなくして、元に戻すかわりに身代金を求める攻撃\"},{\"id\":\"d\",\"label\":\"パスワードを忘れたときの機能\"}],\"answer\":\"c\",\"explanation\":\"ランサムウェアは、データにかぎをかける（暗号化する）などして使えなくし、身代金を求めます。バックアップから戻せれば、被害を小さくできます。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"情報セキュリティの基本：止まらない・漏れない\",\"ownerHref\":\"/themes/it-dx-03\"},{\"question\":{\"id\":\"it-dx-03/q-mfa\",\"prompt\":\"パスワードに加えて、スマホに届くコードなどで本人を確かめる対策はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"バックアップ\"},{\"id\":\"b\",\"label\":\"2段階の確認（多要素認証）\"},{\"id\":\"c\",\"label\":\"更新\"},{\"id\":\"d\",\"label\":\"見られる人をしぼる\"}],\"answer\":\"b\",\"explanation\":\"パスワードが盗まれても、もう1つの確認ができなければ入れません。だから、乗っ取りを防げます。\",\"reviewSection\":\"基本の5つ\"},\"ownerTitle\":\"情報セキュリティの基本：止まらない・漏れない\",\"ownerHref\":\"/themes/it-dx-03\"},{\"question\":{\"id\":\"it-dx-03/q-backup\",\"prompt\":\"バックアップについて、このテーマが特に強く言っていることはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"同じパソコンの中にだけ取ればよい\"},{\"id\":\"b\",\"label\":\"年に1回取れば十分\"},{\"id\":\"c\",\"label\":\"取るのはお金のむだ\"},{\"id\":\"d\",\"label\":\"別の場所にも取り、本当に戻せるかを試しておく\"}],\"answer\":\"d\",\"explanation\":\"同じ場所にしかないと、いっしょに使えなくなります。別の場所に取り、戻せることを確かめておくと、止まる期間を短くできます。\",\"reviewSection\":\"止まったときの損を考える\"},\"ownerTitle\":\"情報セキュリティの基本：止まらない・漏れない\",\"ownerHref\":\"/themes/it-dx-03\"},{\"question\":{\"id\":\"it-dx-03/q-leave\",\"prompt\":\"従業員が辞めたときに、すぐするべきことはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"その人のアカウントを止める\"},{\"id\":\"b\",\"label\":\"パスワードをほかの人に引きついで、そのまま使う\"},{\"id\":\"c\",\"label\":\"何もしない\"},{\"id\":\"d\",\"label\":\"その人のアカウントをみんなで使う\"}],\"answer\":\"a\",\"explanation\":\"辞めた人のアカウントが使えるままだと、外から入られる入口になります。辞める日に止めましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"情報セキュリティの基本：止まらない・漏れない\",\"ownerHref\":\"/themes/it-dx-03\"},{\"question\":{\"id\":\"it-dx-06/q-first\",\"prompt\":\"IPA の「情報セキュリティ10大脅威 2026」（組織）で 1 位はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ビジネスメール詐欺\"},{\"id\":\"b\",\"label\":\"DDoS 攻撃\"},{\"id\":\"c\",\"label\":\"ランサム攻撃による被害\"},{\"id\":\"d\",\"label\":\"内部不正による情報漏えい等\"}],\"answer\":\"c\",\"explanation\":\"1 位はランサム攻撃による被害で、2016年から 11 年続けて選ばれています。ビジネスメール詐欺は 10 位です。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"情報セキュリティ10大脅威：いま狙われていること\",\"ownerHref\":\"/themes/it-dx-06\"},{\"question\":{\"id\":\"it-dx-06/q-new\",\"prompt\":\"2026年に初めて選ばれた脅威はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"AI の利用をめぐるサイバーリスク\"},{\"id\":\"b\",\"label\":\"機密情報を狙った標的型攻撃\"},{\"id\":\"c\",\"label\":\"システムの脆弱性を悪用した攻撃\"},{\"id\":\"d\",\"label\":\"リモートワーク等の環境や仕組みを狙った攻撃\"}],\"answer\":\"a\",\"explanation\":\"3 位の「AI の利用をめぐるサイバーリスク」が、2026年に初めて選ばれました。\",\"reviewSection\":\"2026年の10大脅威（組織）\"},\"ownerTitle\":\"情報セキュリティ10大脅威：いま狙われていること\",\"ownerHref\":\"/themes/it-dx-06\"},{\"question\":{\"id\":\"it-dx-06/q-second\",\"prompt\":\"2 位の脅威はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"DDoS 攻撃\"},{\"id\":\"b\",\"label\":\"ビジネスメール詐欺\"},{\"id\":\"c\",\"label\":\"内部不正による情報漏えい等\"},{\"id\":\"d\",\"label\":\"サプライチェーンや委託先を狙った攻撃\"}],\"answer\":\"d\",\"explanation\":\"2 位は「サプライチェーンや委託先を狙った攻撃」です。予約システムなど、外の会社に任せている部分の対策も確かめましょう。\",\"reviewSection\":\"2026年の10大脅威（組織）\"},\"ownerTitle\":\"情報セキュリティ10大脅威：いま狙われていること\",\"ownerHref\":\"/themes/it-dx-06\"},{\"question\":{\"id\":\"it-dx-06/q-bec\",\"prompt\":\"取引先を名乗るメールで「振込先が変わりました」と連絡がありました。このテーマに合う備えはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"メールの指示どおりにすぐ振り込む\"},{\"id\":\"b\",\"label\":\"電話など、メールとは別の方法で取引先に確かめる\"},{\"id\":\"c\",\"label\":\"同じメールに返信して確かめる\"},{\"id\":\"d\",\"label\":\"経理の担当者 1 人の判断に任せる\"}],\"answer\":\"b\",\"explanation\":\"ビジネスメール詐欺は 10 位に入っています。振込先の変更は、メールとは別の方法で確かめましょう。\",\"reviewSection\":\"自社に当てはめる\"},\"ownerTitle\":\"情報セキュリティ10大脅威：いま狙われていること\",\"ownerHref\":\"/themes/it-dx-06\"},{\"question\":{\"id\":\"it-dx-06/q-use\",\"prompt\":\"10大脅威の使い方として、このテーマに合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"一度読めば、何年も見直さなくてよい\"},{\"id\":\"b\",\"label\":\"順位の高いものだけ対策し、ほかは考えない\"},{\"id\":\"c\",\"label\":\"毎年、自社のリスクの一覧と見比べ、影響が大きいものから備える順番を決める\"},{\"id\":\"d\",\"label\":\"大きな会社だけが使うもの\"}],\"answer\":\"c\",\"explanation\":\"10大脅威は毎年変わります。自社に当てはめて、起きたときの影響が大きいものから備えましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"情報セキュリティ10大脅威：いま狙われていること\",\"ownerHref\":\"/themes/it-dx-06\"},{\"question\":{\"id\":\"it-dx-04/q-who\",\"prompt\":\"サイバーセキュリティ経営ガイドラインは、誰に向けた手引きですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"経営者\"},{\"id\":\"b\",\"label\":\"お客様\"},{\"id\":\"c\",\"label\":\"警察\"},{\"id\":\"d\",\"label\":\"プログラマーだけ\"}],\"answer\":\"a\",\"explanation\":\"経済産業省と IPA が示す、経営者向けの手引きです。経営者が認識すべき3原則と、担当の幹部に指示すべき重要10項目でできています。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"サイバーセキュリティ経営ガイドライン：経営者の3原則と指示10項目\",\"ownerHref\":\"/themes/it-dx-04\"},{\"question\":{\"id\":\"it-dx-04/q-principle\",\"prompt\":\"経営者が認識すべき3原則に入るのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"対策は IT 担当に任せきりにする\"},{\"id\":\"b\",\"label\":\"自社のパソコンだけ守ればよい\"},{\"id\":\"c\",\"label\":\"事故は外に知らせない\"},{\"id\":\"d\",\"label\":\"自社だけでなく、取引先や委託先など、サプライチェーン全体の対策に目を配る\"}],\"answer\":\"d\",\"explanation\":\"3原則は、リーダーシップで進めること、サプライチェーン全体に目を配ること、関係者とコミュニケーションをとることです。\",\"reviewSection\":\"経営者が認識すべき3原則\"},\"ownerTitle\":\"サイバーセキュリティ経営ガイドライン：経営者の3原則と指示10項目\",\"ownerHref\":\"/themes/it-dx-04\"},{\"question\":{\"id\":\"it-dx-04/q-budget\",\"prompt\":\"「対策のための予算と人を確保する」は、重要10項目の何番目の指示ですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"指示1\"},{\"id\":\"b\",\"label\":\"指示3\"},{\"id\":\"c\",\"label\":\"指示7\"},{\"id\":\"d\",\"label\":\"指示10\"}],\"answer\":\"b\",\"explanation\":\"指示3は、サイバーセキュリティ対策のための資源（予算、人材など）の確保です。指示7は緊急対応の体制、指示10は情報の収集・共有・開示です。\",\"reviewSection\":\"指示すべき重要10項目\"},\"ownerTitle\":\"サイバーセキュリティ経営ガイドライン：経営者の3原則と指示10項目\",\"ownerHref\":\"/themes/it-dx-04\"},{\"question\":{\"id\":\"it-dx-04/q-recover\",\"prompt\":\"「事故の被害に備えて、事業を続け、元に戻す体制を整える」は、どの考えとつながりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"広告の効果測定\"},{\"id\":\"b\",\"label\":\"採用の面接\"},{\"id\":\"c\",\"label\":\"BCP（事業継続計画）\"},{\"id\":\"d\",\"label\":\"消費税の計算\"}],\"answer\":\"c\",\"explanation\":\"指示8は、インシデントによる被害に備えた事業継続・復旧の体制です。BCP の一部として準備します。\",\"reviewSection\":\"指示すべき重要10項目\"},\"ownerTitle\":\"サイバーセキュリティ経営ガイドライン：経営者の3原則と指示10項目\",\"ownerHref\":\"/themes/it-dx-04\"},{\"question\":{\"id\":\"it-dx-04/q-vendor\",\"prompt\":\"みなと館ホテルが、予約システムの会社と契約する前にすることとして、指示9に合うのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"値段だけで決める\"},{\"id\":\"b\",\"label\":\"相手の会社がどんな対策をしているかを確かめる\"},{\"id\":\"c\",\"label\":\"契約したら、相手の対策には口を出さない\"},{\"id\":\"d\",\"label\":\"相手の会社の社長の名前だけ確かめる\"}],\"answer\":\"b\",\"explanation\":\"指示9は、取引先や委託先を含めたサプライチェーン全体の状況の把握と対策です。契約の前に、相手の対策を確かめましょう。\",\"reviewSection\":\"ホテル・飲食での例\"},\"ownerTitle\":\"サイバーセキュリティ経営ガイドライン：経営者の3原則と指示10項目\",\"ownerHref\":\"/themes/it-dx-04\"},{\"question\":{\"id\":\"it-dx-05/q-new\",\"prompt\":\"NIST CSF 2.0 で新しく加わり、6つの機能の真ん中に置かれたのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"検知（DETECT）\"},{\"id\":\"b\",\"label\":\"復旧（RECOVER）\"},{\"id\":\"c\",\"label\":\"防御（PROTECT）\"},{\"id\":\"d\",\"label\":\"統治（GOVERN）\"}],\"answer\":\"d\",\"explanation\":\"2.0 で統治（GOVERN）が加わりました。ほかの5つをどう進めるかを決める働きなので、真ん中に置かれています。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"NIST CSF 2.0：セキュリティを6つの働きで整理する\",\"ownerHref\":\"/themes/it-dx-05\"},{\"question\":{\"id\":\"it-dx-05/q-who\",\"prompt\":\"NIST CSF 2.0 は、どんな組織が使うものとされていますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"アメリカの政府機関だけ\"},{\"id\":\"b\",\"label\":\"大きさや業種を問わず、すべての組織\"},{\"id\":\"c\",\"label\":\"電力や水道などの重要インフラだけ\"},{\"id\":\"d\",\"label\":\"IT の会社だけ\"}],\"answer\":\"b\",\"explanation\":\"2.0 では、重要インフラだけでなく、大きさや業種を問わずすべての組織が使えるものになりました。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"NIST CSF 2.0：セキュリティを6つの働きで整理する\",\"ownerHref\":\"/themes/it-dx-05\"},{\"question\":{\"id\":\"it-dx-05/q-function\",\"prompt\":\"予約システムが攻撃されたあと、バックアップから戻し、戻ったことを確かめるのは、どの機能に当たりますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"復旧（RECOVER）\"},{\"id\":\"b\",\"label\":\"識別（IDENTIFY）\"},{\"id\":\"c\",\"label\":\"統治（GOVERN）\"},{\"id\":\"d\",\"label\":\"検知（DETECT）\"}],\"answer\":\"a\",\"explanation\":\"復旧は、事故で影響を受けたものと業務を元に戻す働きです。CSF は、戻す前にバックアップが正しいかを確かめることも挙げています。\",\"reviewSection\":\"6つの機能\"},\"ownerTitle\":\"NIST CSF 2.0：セキュリティを6つの働きで整理する\",\"ownerHref\":\"/themes/it-dx-05\"},{\"question\":{\"id\":\"it-dx-05/q-profile\",\"prompt\":\"CSF の「プロファイル」の使い方として正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"社長の経歴を書く\"},{\"id\":\"b\",\"label\":\"攻撃してきた相手の情報を書く\"},{\"id\":\"c\",\"label\":\"今の姿とめざす姿を成果で書いて比べ、差を埋める行動計画を作る\"},{\"id\":\"d\",\"label\":\"決まった製品の一覧を書く\"}],\"answer\":\"c\",\"explanation\":\"現在のプロファイルと目標のプロファイルを比べ、差を分析して、優先順位をつけた行動計画を作ります。\",\"reviewSection\":\"今の姿とめざす姿を比べる\"},\"ownerTitle\":\"NIST CSF 2.0：セキュリティを6つの働きで整理する\",\"ownerHref\":\"/themes/it-dx-05\"},{\"question\":{\"id\":\"it-dx-05/q-tier\",\"prompt\":\"CSF のティアについて、正しいのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"すべての会社が、すぐにティア4をめざさなければならない\"},{\"id\":\"b\",\"label\":\"取り組みの深さを4段階で表す。リスクが大きいときや費用に見合うときに上の段階へ進む\"},{\"id\":\"c\",\"label\":\"会社の売上の大きさで決まる\"},{\"id\":\"d\",\"label\":\"ティアは1つしかない\"}],\"answer\":\"b\",\"explanation\":\"ティアは、部分的・リスクを踏まえた・繰り返し可能・適応的の4段階です。NIST は、リスクや求められることが大きいとき、または費用に見合うときに上へ進むことを勧めています。\",\"reviewSection\":\"今の姿とめざす姿を比べる\"},\"ownerTitle\":\"NIST CSF 2.0：セキュリティを6つの働きで整理する\",\"ownerHref\":\"/themes/it-dx-05\"},{\"question\":{\"id\":\"leadership-01/q-irreversible\",\"prompt\":\"取り消せない決定にあたるのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"4 億円で客室をすべて改装する\"},{\"id\":\"b\",\"label\":\"新メニューを 2 週間だけ出す\"},{\"id\":\"c\",\"label\":\"朝食の始まる時間を 30 分早める\"},{\"id\":\"d\",\"label\":\"店内の BGM を変える\"}],\"answer\":\"a\",\"explanation\":\"大きな改装は、一度お金を使うと元に戻せません。ほかの3つは、試してだめなら戻せます。取り消せる決定です。\",\"reviewSection\":\"2つの決定を分ける\"},\"ownerTitle\":\"決め方の型：取り消せる決定と、取り消せない決定\",\"ownerHref\":\"/themes/leadership-01\"},{\"question\":{\"id\":\"leadership-01/q-speed\",\"prompt\":\"取り消せる決定の進め方として、このテーマがすすめているのはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"経営者が必ず時間をかけて決める\"},{\"id\":\"b\",\"label\":\"全員が賛成するまで待つ\"},{\"id\":\"c\",\"label\":\"速く決めて試し、数字で確かめる\"},{\"id\":\"d\",\"label\":\"決めずに様子を見る\"}],\"answer\":\"c\",\"explanation\":\"戻せる決定は、試して確かめる方が、早く正しい答えに近づけます。現場に任せてもかまいません。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"決め方の型：取り消せる決定と、取り消せない決定\",\"ownerHref\":\"/themes/leadership-01\"},{\"question\":{\"id\":\"leadership-01/q-ev\",\"prompt\":\"うまくいく確率が 30％ で、利益は 600 万円。失敗する確率が 70％ で、損は 100 万円です。期待値はいくらですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"500 万円\"},{\"id\":\"b\",\"label\":\"110 万円\"},{\"id\":\"c\",\"label\":\"−70 万円\"},{\"id\":\"d\",\"label\":\"180 万円\"}],\"answer\":\"b\",\"explanation\":\"期待値 ＝ 0.3 × 600 − 0.7 × 100 ＝ 180 − 70 ＝ 110 万円です。180 万円は、うまくいく場合だけを見た金額です。\",\"reviewSection\":\"期待値で比べる\"},\"ownerTitle\":\"決め方の型：取り消せる決定と、取り消せない決定\",\"ownerHref\":\"/themes/leadership-01\"},{\"question\":{\"id\":\"leadership-01/q-mistake\",\"prompt\":\"このテーマが挙げている「よくある失敗」はどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"どの決定にも同じ時間をかけること\"},{\"id\":\"b\",\"label\":\"期待値を計算すること\"},{\"id\":\"c\",\"label\":\"決めた理由を残すこと\"},{\"id\":\"d\",\"label\":\"小さな取り消せる決定に時間をかけすぎ、大きな取り消せない決定を勢いで決めること\"}],\"answer\":\"d\",\"explanation\":\"大事なのは、取り消せるかどうかで、かける時間を分けることです。これが逆になると、速さも正しさもなくします。\",\"reviewSection\":\"2つの決定を分ける\"},\"ownerTitle\":\"決め方の型：取り消せる決定と、取り消せない決定\",\"ownerHref\":\"/themes/leadership-01\"},{\"question\":{\"id\":\"leadership-01/q-result\",\"prompt\":\"期待値がプラスなので実行しましたが、結果は失敗でした。どう考えるのがよいですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"判断は必ずまちがっていた\"},{\"id\":\"b\",\"label\":\"次からは期待値を使わない\"},{\"id\":\"c\",\"label\":\"結果が悪くても判断が悪かったとはかぎらない。残した理由とくらべて学ぶ\"},{\"id\":\"d\",\"label\":\"担当者を処分する\"}],\"answer\":\"c\",\"explanation\":\"確率で決めるときは、正しい判断でも外れることがあります。決めた理由と結果をくらべて、前提のどこがずれたかを学びましょう。\",\"reviewSection\":\"経営者が見るところ\"},\"ownerTitle\":\"決め方の型：取り消せる決定と、取り消せない決定\",\"ownerHref\":\"/themes/leadership-01\"},{\"question\":{\"id\":\"leadership-05/q-systems\",\"prompt\":\"カーネマンの言う「システム2」の説明として、正しいものはどれですか。\",\"choices\":[{\"id\":\"a\",\"label\":\"ぱっと、自動で決まる速い考え\"},{\"id\":\"b\",\"label\":\"会社の会計のしくみ\"},{\"id\":\"c\",\"label\":\"気持ちだけで決める考え\"},{\"id\":\"d\",\"label\":\"じっくり、筋道を立てて考える遅い考え\"}],\"answer\":\"d\",\"explanation\":\"システム1 は速い考え、システム2 は遅い考えです。大事な決定では、システム2 を使います。\",\"reviewSection\":\"要点\"},\"ownerTitle\":\"速い考えと遅い考え：直感のくせを知る\",\"ownerHref\":\"/themes/leadership-05\"},{\"question\":{\"id\":\"leadership-05/q-anchoring\",\"prompt\":\"最初に聞いた見積もりの金額が、その後の判断の基準になってしまう。このくせを何と呼びますか。\",\"choices\":[{\"id\":\"a\",\"label\":\"損をきらう
